- id: encor-3-001
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: &id009
  - ccnp
  stem: EIGRP composite metric traditionally uses?
  choices:
  - id: a
    text: Bandwidth and delay (by default K values)
  - id: b
    text: Only hop count
  - id: c
    text: Only AS path
  - id: d
    text: Only STP cost
  correct:
    answer: a
  explanation: '**Bandwidth and delay (by default K values)**: **EIGRP** is an advanced
    distance-vector protocol that uses the Diffusing Update Algorithm (DUAL) and composite
    metric components such as bandwidth and delay. This is the correct answer for
    the stem. Configuration uses `router eigrp <as>`.


    **Only hop count** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **Only AS path**: **PAT** (NAT overload) maps many inside addresses to one outside
    address using unique transport port numbers. This does not satisfy the condition
    required by the stem. Configuration uses `ip nat inside source list <acl> interface
    <if> overload`.


    **Only STP cost** is incorrect. It does not describe the intended use or behavior
    required by the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
