questions:
- id: encor-1-001
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: In a 3-tier campus, which layer typically aggregates access switches?
  choices:
  - id: a
    text: Distribution
  - id: b
    text: Core
  - id: c
    text: Access
  - id: d
    text: WAN edge
  correct:
    answer: a
  explanation: '**Distribution**: A Layer 2 **switch** forwards Ethernet frames based
    on MAC address tables within a broadcast domain or VLAN. This is the correct answer
    for the stem.


    **Core** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **Access** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **WAN edge** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-002
