- id: encor-gen-0016-4ce3ac
  type: single_choice
  topic_code: '5.1'
  difficulty: 2
  cert_tags: &id018
  - ccnp
  stem: 'Scenario 16 (5.1): Common 2.4 GHz Wi-Fi band?'
  choices:
  - id: a
    text: 2.4 GHz ISM
  - id: b
    text: 60 GHz only
  - id: c
    text: Sub-GHz only
  - id: d
    text: Visible light only
  correct:
    answer: a
  explanation: '802.11b/g/n/ax still use the 2.4 GHz ISM band (channels 1–11 in the
    US). Non-overlapping set is 1, 6, and 11.


    **60 GHz only** is not the right selection: 60 GHz is 802.11ad/ay (WiGig), not
    the common 2.4 GHz LAN band.


    **Sub-GHz only** is not the right selection: Sub-GHz is 802.11ah (HaLow) / IoT,
    not typical enterprise 2.4 GHz.


    **Visible light only** is not the right selection: Li-Fi / visible light is not
    802.11 2.4 GHz Wi-Fi.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0017-9d56c4
  type: single_choice
  topic_code: '5.2'
  difficulty: 3
  cert_tags: *id018
  stem: 'Scenario 17 (5.2): WPA3 era wireless security focus?'
  choices:
  - id: b
    text: WEP revival
  - id: c
    text: Clear-text PSK mandatory
  - id: d
    text: Disable 802.1X always
  - id: a
    text: Stronger SAE/handshake protections
  correct:
    answer: a
  explanation: 'WPA3-Personal replaces PSK 4-way handshake with **SAE** (Dragonfly),
    giving forward secrecy and resistance to offline dictionary attacks. WPA3-Enterprise
    adds extra crypto options (192-bit suite).


    **WEP revival** is not the right selection: WEP (RC4, 24-bit IV) is broken and
    removed, not revived in WPA3.


    **Clear-text PSK mandatory** is not the right selection: WPA3 does not require
    a cleartext PSK on the air. SAE never puts the passphrase in a recoverable hash
    like WPA2’s 4-way handshake.


    **Disable 802.1X always** is not the right selection: WPA3-Enterprise **uses**
    802.1X/EAP. WPA3 does not disable 802.1X.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0018-489a18
  type: multiple_choice
  topic_code: '5.3'
  difficulty: 2
  cert_tags: *id018
  stem: '[CCNP 5.3] Select ALL that correctly relate to: Typical CAPWAP termination.'
  choices:
  - id: a
    text: WLC
  - id: b
    text: DNS
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: NTP
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'In split-MAC/local mode the AP’s CAPWAP control and data tunnels terminate
    on the **Wireless LAN Controller**.


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 5.3 (REST API security).


    DNS resolves names; it does not terminate CAPWAP tunnels.


    NTP sets the clock. APs may query NTP, but CAPWAP still ends on the WLC.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.3
  provider: openboson
  license: MIT
  provenance: original
