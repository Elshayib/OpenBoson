- id: encor-gen-0225-daca92
  type: single_choice
  topic_code: '3.3'
  difficulty: 1
  cert_tags: *id010
  stem: 'Scenario 225 (3.3): OSPF router connecting two areas?'
  choices:
  - id: b
    text: ASBR
  - id: c
    text: DR
  - id: d
    text: BDR
  - id: a
    text: ABR
  correct:
    answer: a
  explanation: 'An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **ASBR** is not the right selection: An ASBR redistributes **external** routes
    (another protocol or static) into OSPF and originates Type-5 (or Type-7 in NSSA)
    LSAs. Connecting two OSPF areas is the ABR job.


    **DR** is not the right selection: The Designated Router is elected on a multiaccess
    **link**. It is not the router that joins two areas.


    **BDR** is not the right selection: The Backup DR waits on that same multiaccess
    link. Area membership is unrelated.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0250-83a3e3
  type: single_choice
  topic_code: '3.1'
  difficulty: 1
  cert_tags: *id010
  stem: 'Scenario 250 (3.1): Default AD of eBGP?'
  choices:
  - id: c
