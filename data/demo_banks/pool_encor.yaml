    **Only wireless exclusive**: Local SPAN is a **wired** switch feature (and can
    include wireless if the WLC is integrated), but it is not “wireless exclusive.”.


    **Only MPLS exclusive**: MPLS forwards on labels in a provider core, not on a
    campus access VLAN.'
