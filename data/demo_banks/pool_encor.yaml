- id: encor-v05-53-0014-db715b
  type: single_choice
  topic_code: '5.3'
  difficulty: 5
  cert_tags: &id019
  - ccnp
  stem: During troubleshooting related to 5.3, which observation is most relevant?
  choices:
  - id: c
    text: Use clear-text shared secrets as the only control for 5.3
  - id: d
    text: Skip documentation for 5.3 changes in production
  - id: a
    text: Use the standard model for 5.3 rather than a look-alike concept
  - id: b
    text: Disable logging permanently while testing 5.3
  correct:
    answer: a
  explanation: 'For objective 5.3 (REST API security), keep a baseline of the show/verify
    output that proves REST API security and a written rollback. Skipping logs or
    treating 5.3 as optional leaves you unable to prove REST API security still works.


    **Use clear-text shared secrets as the only control for 5.3**: Weak or disabled
    AAA does not implement REST API security.


    **Skip documentation for 5.3 changes in production**: REST API security still
    needs a change record and logs; skipping them removes rollback for 5.3.


    **Use the standard model for 5.3 rather than a look-alike concept**: Use the documented
    REST API security design, then verify with the show/verify output that proves
    REST API security.


    **Disable logging permanently while testing 5.3**: You need logging/monitoring
    to see whether REST API security actually converged after the window.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.3
  provider: openboson
  license: MIT
  provenance: original
