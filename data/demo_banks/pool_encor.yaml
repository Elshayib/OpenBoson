  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    **PAT/overload**: PAT / NAT overload maps many inside-local addresses onto one
    (or a few) inside-global address by translating **source ports** (`ip nat inside
    source list ... interface ... overload`).


    **Document verification steps before changes.**: Write the show/ping checks and
    rollback **before** the change window so you can prove the objective worked and
    back out if it did not.


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only**: Dynamic NAT without overload still uses a pool 1:1.
    When the pool is exhausted, new flows fail — that is not many-to-one PAT.'
