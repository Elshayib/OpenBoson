    the interface needs site/Internet reachability — not automatically on every link.


    Unique local (`fc00::/7`, typically `fd00::/8`) is optional private unicast, analogous
    to RFC 1918. Interfaces do not require it.


    **Anycast only** is not the right selection: Anycast is a unicast address assigned
    to multiple nodes so routers deliver to the nearest. It is a service pattern,
    not the required per-interface address type.'
