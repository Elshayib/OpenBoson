questions:
- id: encor-1-001
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: In a 3-tier campus, which layer typically aggregates access switches?
  choices:
  - id: a
    text: Distribution
    rationale: Distribution aggregates access and applies policy toward core.
  - id: b
    text: Core
    rationale: Not correct for this scenario.
  - id: c
    text: Access
    rationale: Not correct for this scenario.
  - id: d
    text: WAN edge
    rationale: Not correct for this scenario.
  correct:
    answer: a
  explanation: Distribution aggregates access and applies policy toward core.
  references:
  - ENCOR 1.1
- id: encor-1-002
  type: single_choice
  topic_code: '1.3'
  difficulty: 4
  cert_tags: *id001
  stem: Cisco SD-Access fabric uses which overlay identifier commonly?
  choices:
  - id: a
    text: LISP / VXLAN (VNI) concepts
    rationale: SD-Access uses LISP control and VXLAN data plane overlays.
  - id: b
    text: Only Frame Relay DLCI
    rationale: Not correct for this scenario.
  - id: c
    text: Only ATM VPI
    rationale: Not correct for this scenario.
  - id: d
    text: Only HDLC
    rationale: Not correct for this scenario.
  correct:
    answer: a
  explanation: SD-Access uses LISP control and VXLAN data plane overlays.
  references:
  - ENCOR 1.3
- id: encor-1-003
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: A spine-leaf Clos fabric primarily optimizes which traffic pattern?
  choices:
  - id: a
    text: East-west
    rationale: Leaf-spine equalizes east-west paths.
  - id: b
    text: Only north-south dialup
    rationale: Not correct for this scenario.
  - id: c
    text: Only Token Ring
    rationale: Not correct for this scenario.
  - id: d
    text: Only serial TDM
    rationale: Not correct for this scenario.
  correct:
    answer: a
  explanation: Leaf-spine equalizes east-west paths.
  references:
  - ENCOR 1.1
