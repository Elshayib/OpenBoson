- id: encor-gen-0177-9c4d5e
  type: single_choice
  topic_code: '4.6'
  difficulty: 3
  cert_tags: *id013
  stem: 'Scenario 177 (4.6): Many-to-one NAT using ports?'
  choices:
  - id: b
    text: Static NAT
  - id: c
    text: One-to-one dynamic only
  - id: d
    text: NPTv6 only
  - id: a
    text: PAT/overload
  correct:
    answer: a
  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only** is not the right selection: Dynamic NAT without overload
    still uses a pool 1:1. When the pool is exhausted, new flows fail — that is not
    many-to-one PAT.


    **NPTv6 only** is not the right selection: NPTv6 is IPv6 prefix translation (RFC
    6296). It is not IPv4 PAT.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.6
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0199-0340d4
  type: single_choice
  topic_code: '4.1'
  difficulty: 5
  cert_tags: *id013
  stem: 'Scenario 199 (4.1): DHCP client broadcast to find servers?'
  choices:
  - id: d
    text: DHCPOFFER
  - id: a
    text: DHCPDISCOVER
  - id: b
    text: DHCPACK
  - id: c
    text: Only DHCPREQUEST
  correct:
    answer: a
  explanation: 'A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68, destination
    255.255.255.255) to find servers — the first message in DORA.


    DHCPOFFER is the **server** offering an address after DISCOVER. The client does
    not send it.


    DHCPACK is the **server’s** final confirmation of the lease, not the client’s
    discovery broadcast.


    **Only DHCPREQUEST** is not the right selection: DHCPREQUEST is the client’s **third**
    DORA step (accepting an offer, or renewing). Discovery comes first.'
