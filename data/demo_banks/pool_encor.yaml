  explanation: 'For 1.1 (Enterprise network design principles), the keyed answer is
    **Verify before changes; Capture show output**. Stem: Extra multi-select 0 for
    volume gate on 1.1?.


    **Verify before changes** is correct: Verify current state before touching the
    box so you do not troubleshoot a pre-existing fault as if you caused it. This
