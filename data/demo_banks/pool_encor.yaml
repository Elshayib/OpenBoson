- id: encor-gen-0004-7f437d
  type: single_choice
  topic_code: '2.1'
  difficulty: 5
  cert_tags: &id007
  - ccnp
  stem: 'Scenario 4 (2.1): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: a
    text: PAgP
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  correct:
    answer: a
  explanation: 'Port Aggregation Protocol is Cisco-proprietary EtherChannel negotiation
    (`channel-group N mode desirable|auto`).


    LACP (IEEE 802.3ad/802.1AX) is the **standards-based** negotiator (`mode active|passive`),
    not Cisco-proprietary.


    **Static on only** is not the right selection: `channel-group N mode on` bundles
    with **no** negotiation. It is neither PAgP nor LACP.


    **PAgP+LACP hybrid mandatory** is not the right selection: PAgP and LACP cannot
    form a channel with each other. You pick one protocol (or static `on`); there
    is no hybrid mandatory mode.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0005-469924
  type: single_choice
  topic_code: '2.2'
  difficulty: 1
  cert_tags: *id007
  stem: 'Scenario 5 (2.2): VLAN carrying untagged trunk frames?'
  choices:
  - id: b
    text: VLAN 1002
  - id: c
    text: Voice VLAN
  - id: d
    text: Private VLAN always
  - id: a
    text: Native VLAN
  correct:
    answer: a
  explanation: 'The 802.1Q native VLAN (default VLAN 1) is the VLAN whose frames are
    sent **untagged** on a trunk. Mismatched natives leak traffic.


    VLAN 1002–1005 are Cisco FDDI/Token Ring defaults, not the untagged native VLAN
    on an Ethernet trunk.


    **Voice VLAN** is not the right selection: A voice VLAN (`switchport voice vlan`)
    tags IP-phone frames with a separate VLAN ID. Those frames are tagged, not native/untagged.


    **Private VLAN always** is not the right selection: Private VLANs (primary/isolated/community)
    restrict L2 among hosts. They are not ‘the untagged VLAN on a trunk’.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0006-e2a3b2
  type: multiple_choice
  topic_code: '2.3'
  difficulty: 2
  cert_tags: *id007
  stem: '[CCNP 2.3] Select ALL that correctly relate to: STP role that does not forward
    user frames.'
  choices:
  - id: a
    text: Alternate/blocking
  - id: b
    text: Designated
  - id: c
    text: Document verification steps before changes.
  - id: d
