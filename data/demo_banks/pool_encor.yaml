  correct:
    answer: a
  explanation: 'Anycast SVI provides local gateway on each leaf.


    **Unique gateway per VLAN only globally** is a different protocol, command, or
    value than **Same gateway IP on multiple leaves**. For 1.3 (On-premises and cloud
    infrastructure), the stem is solved by **Same gateway IP on multiple leaves**,
    not by Unique gateway per VLAN only globally.


    **Only HSRP v1 required** points at HSRP v1, which is not how 1.3 (On-premises
