    traffic by matching header fields and applying permit or deny actions in sequential
    order. This is the correct answer for the stem.


    **Only switching CAM**: A Layer 2 **switch** forwards Ethernet frames based on
    MAC address tables within a broadcast domain or VLAN. This does not satisfy the
    condition required by the stem.


    **Only VTP sync** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **Only LACP PDUs exclusive**: **LACP** (IEEE 802.3ad) negotiates EtherChannel
    bundles and is the standards-based alternative to PAgP. This does not satisfy
    the condition required by the stem. Configuration uses `channel-group <id> mode
    active|passive`.'
