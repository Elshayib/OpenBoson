  cert_tags: *id009
  stem: EtherChannel troubleshooting often checks?
  choices:
  - id: a
    text: Member speed/duplex/mode consistency
  - id: b
    text: Only BGP communities
  - id: c
    text: Only DNS TTL
  - id: d
    text: Only syslog facility
  correct:
    answer: a
  explanation: 'Inconsistent members suspend channels.


    **Member speed/duplex/mode consistency**: Inconsistent members suspend channels.


    **Only BGP communities**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).


    **Only DNS TTL**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on UDP/TCP
    53.


    **Only syslog facility**: Syslog exports device logs (UDP 514) with severity 0–7.'
