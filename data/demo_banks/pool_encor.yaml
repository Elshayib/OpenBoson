  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'An alternate (RSTP) / blocking (802.1D) port is a backup path to the
    root. It does **not** forward user frames; it only processes BPDUs until the root
    port fails.


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 2.3 (Network virtualization
    concepts).


    **Designated** is not the right selection: The designated port is the forwarding
    port toward a segment. It **does** forward user frames.


    **Root** is not the right selection: The root port is the forwarding uplink to
    the root bridge. It forwards user frames toward the root.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
