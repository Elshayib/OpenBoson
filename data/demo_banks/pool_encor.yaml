- id: encor-2-001
  type: single_choice
  topic_code: '2.1'
  difficulty: 3
  cert_tags: &id006
  - ccnp
  stem: Type 1 hypervisor runs where?
  choices:
  - id: a
    text: On bare metal
  - id: b
    text: Only inside a guest OS as Type 2 exclusive
  - id: c
    text: Only on printers
  - id: d
    text: Only in STP
  correct:
    answer: a
  explanation: 'Bare-metal hypervisors sit on hardware.


    **On bare metal**: Bare-metal hypervisors sit on hardware.


    **Only inside a guest OS as Type 2 exclusive**: A Type-1 (bare-metal) hypervisor
    runs on the hardware (ESXi, Hyper-V Server). Type-2 runs on a host OS (Workstation/Fusion).


    **Only on printers**: Type-1 hypervisors run on servers (and some desktops), not
    “only printers.”.


    **Only in STP**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-002
  type: single_choice
  topic_code: '2.3'
  difficulty: 4
  cert_tags: *id006
  stem: VXLAN uses which outer transport commonly?
  choices:
  - id: a
    text: UDP
  - id: b
    text: Only ICMP
  - id: c
    text: Only STP BPDUs
  - id: d
    text: Only ARP exclusive
  correct:
    answer: a
  explanation: 'VXLAN encapsulates Ethernet in UDP.


    **UDP**: VXLAN encapsulates Ethernet in UDP.


    **Only ICMP**: ICMP (IPv4) / ICMPv6 carries control messages such as echo, unreachable,
    and TTL expired — not a transport for application byte streams.


    **Only STP BPDUs**: BPDUs are STP control frames used to elect a root and assign
    port roles.


    **Only ARP exclusive**: ARP maps an IPv4 address to a MAC on the local Ethernet
    segment (broadcast request, unicast reply). IPv6 uses NDP instead.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-003
  type: single_choice
  topic_code: '2.3'
  difficulty: 2
  cert_tags: *id006
  stem: VNI in VXLAN identifies?
  choices:
  - id: a
    text: Overlay segment
  - id: b
    text: Only physical port
  - id: c
    text: Only BGP ASN
  - id: d
    text: Only CoS bit
  correct:
    answer: a
  explanation: 'VNI separates overlay networks.


    **Overlay segment**: VNI separates overlay networks.


    **Only physical port**: A VXLAN VNI is a **logical overlay segment**, independent
    of a single physical switch port.


    **Only BGP ASN**: BGP is the Internet path-vector protocol (TCP 179; eBGP AD 20,
    iBGP AD 200).


    **Only CoS bit**: 802.1Q CoS is 3 PCP bits in a VLAN tag. A VXLAN **VNI** is a
    24-bit overlay segment ID.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-004
  type: single_choice
  topic_code: '2.2'
  difficulty: 3
  cert_tags: *id006
  stem: VRF provides?
  choices:
  - id: a
    text: Separate routing/forwarding instances
  - id: b
    text: Only a single global RIB forever
  - id: c
    text: Only STP instances
  - id: d
    text: Only PoE budgets
  correct:
    answer: a
  explanation: 'VRFs isolate routing contexts.


    **Separate routing/forwarding instances**: VRFs isolate routing contexts.


    **Only a single global RIB forever**: The RIB is the routing table (`show ip route`)
    before CEF install.


    **Only STP instances**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only PoE budgets**: PoE delivers DC power on Ethernet (802.3af/at/bt).'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-005
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: *id006
  stem: Containers share which with the host?
  choices:
  - id: a
    text: Kernel
  - id: b
    text: Only entire guest kernel always
  - id: c
    text: Only BIOS
  - id: d
    text: Only ASIC TCAM exclusively
  correct:
    answer: a
  explanation: 'Containers share the host kernel.


    **Kernel**: Containers share the host kernel.


    **Only entire guest kernel always**: Containers share the **host** kernel. A full
    guest kernel is a VM, not a container.


    **Only BIOS**: Containers share the host **kernel** (namespaces/cgroups). They
    do not each boot a BIOS/firmware.


    **Only ASIC TCAM exclusively**: TCAM stores hardware ACL/QoS/FIB entries.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-006
  type: single_choice
  topic_code: '2.3'
  difficulty: 2
  cert_tags: *id006
  stem: LISP is primarily a?
  choices:
  - id: a
    text: Network virtualization / location-identity protocol
  - id: b
    text: Only a wireless cipher
  - id: c
    text: Only an FHRP
  - id: d
    text: Only a syslog facility
  correct:
    answer: a
  explanation: 'LISP maps EIDs to RLOCs.


    **Network virtualization / location-identity protocol**: LISP maps EIDs to RLOCs.


    **Only a wireless cipher**: A wireless cipher (TKIP/CCMP/GCMP) encrypts 802.11
    frames; it is not AAA or overlay.


    **Only an FHRP**: First-hop redundancy (HSRP/VRRP/GLBP) shares a default-gateway
    IP.


    **Only a syslog facility**: Syslog exports device logs (UDP 514) with severity
    0–7.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-007
  type: single_choice
  topic_code: '2.3'
  difficulty: 3
  cert_tags: *id006
  stem: A VTEP is?
  choices:
  - id: a
    text: VXLAN tunnel endpoint
  - id: b
    text: Only STP root
  - id: c
    text: Only DHCP server
  - id: d
    text: Only syslog host
  correct:
    answer: a
  explanation: 'VTEPs encapsulate/decapsulate VXLAN.


    **VXLAN tunnel endpoint**: VTEPs encapsulate/decapsulate VXLAN.


    **Only STP root**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **Only DHCP server**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA,
    UDP 67/68).


    **Only syslog host**: Syslog exports device logs (UDP 514) with severity 0–7.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-008
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: *id006
  stem: Virtual switching connects?
  choices:
  - id: a
    text: VM/vNIC traffic on a hypervisor host
  - id: b
    text: Only ISP PEs exclusive
  - id: c
    text: Only DNS roots
  - id: d
    text: Only NTP strata
  correct:
    answer: a
  explanation: 'vSwitches bridge VM interfaces.


    **VM/vNIC traffic on a hypervisor host**: vSwitches bridge VM interfaces.


    **Only ISP PEs exclusive**: A virtual switch (vSwitch/Nexus 1000v/AVS) connects
    **VM NICs** on a hypervisor, not only ISP PE routers.


    **Only DNS roots**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on
    UDP/TCP 53.


    **Only NTP strata**: NTP synchronizes clocks (UDP 123); stratum is distance from
    a reference.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-009
  type: single_choice
  topic_code: '2.2'
  difficulty: 2
  cert_tags: *id006
  stem: GRE tunneling commonly provides?
  choices:
  - id: a
    text: Point-to-point overlay encapsulation
  - id: b
    text: Only STP enhancements
  - id: c
    text: Only AAA accounting
  - id: d
    text: Only PoE negotiation
  correct:
    answer: a
  explanation: 'GRE encapsulates payloads over IP.


    **Point-to-point overlay encapsulation**: GRE encapsulates payloads over IP.


    **Only STP enhancements**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only AAA accounting**: AAA is Authentication, Authorization, and Accounting
    (RADIUS/TACACS+).


    **Only PoE negotiation**: PoE delivers DC power on Ethernet (802.3af/at/bt).'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-010
  type: single_choice
  topic_code: '2.2'
  difficulty: 3
  cert_tags: *id006
  stem: IPsec with GRE is often used to?
  choices:
  - id: a
    text: Encrypt tunneled overlays
  - id: b
    text: Only hash EtherChannels
  - id: c
    text: Only elect DR
  - id: d
    text: Only age CAM
  correct:
    answer: a
  explanation: 'IPsec protects GRE/IP overlays.


    **Encrypt tunneled overlays**: IPsec protects GRE/IP overlays.


    **Only hash EtherChannels**: “IPsec with GRE is often used to” is answered by
    Encrypt tunneled overlays. Only hash EtherChannels does not do that job.


    **Only elect DR**: “IPsec with GRE is often used to” is answered by Encrypt tunneled
    overlays. Only elect DR does not do that job.


    **Only age CAM**: “IPsec with GRE is often used to” is answered by Encrypt tunneled
    overlays. Only age CAM does not do that job.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-011
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: *id006
  stem: A virtual machine includes?
  choices:
  - id: a
    text: Guest OS + virtualized hardware abstraction
  - id: b
    text: Only a bare-metal Type 1 host exclusive
  - id: c
    text: Only a physical ASIC
  - id: d
    text: Only a copper SFP
  correct:
    answer: a
  explanation: 'VMs virtualize compute for guest systems.


    **Guest OS + virtualized hardware abstraction**: VMs virtualize compute for guest
    systems.


    **Only a bare-metal Type 1 host exclusive**: A VM includes virtual hardware plus
    a **guest OS**. Type-1 is the hypervisor placement, not the VM contents.


    **Only a physical ASIC**: An ASIC is switching silicon. A VM is software isolation
    (guest OS + virt hardware) on a hypervisor.


    **Only a copper SFP**: An SFP is a transceiver. A VM is a virtual machine (vCPU,
    vNIC, guest OS), not an optic.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-012
  type: single_choice
  topic_code: '2.3'
  difficulty: 2
  cert_tags: *id006
  stem: Flood-and-learn VXLAN relies on?
  choices:
  - id: a
    text: Data-plane learning / multicast or head-end replication
  - id: b
    text: Only static ARP forever without flooding
  - id: c
    text: Only RIP
  - id: d
    text: Only Telnet
  correct:
    answer: a
  explanation: 'Without a control plane, flooding discovers endpoints.


    **Data-plane learning / multicast or head-end replication**: Without a control
    plane, flooding discovers endpoints.


    **Only static ARP forever without flooding**: ARP maps IPv4 addresses to MACs
    on the local Ethernet; IPv6 uses NDP.


    **Only RIP**: RIP is a hop-count IGP (max 15), default AD 120, multicast 224.0.0.9
    for v2.


    **Only Telnet**: Telnet (TCP 23) is cleartext remote CLI and should not be used
    on production VTYs.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-013
  type: single_choice
  topic_code: '2.1'
  difficulty: 3
  cert_tags: *id006
  stem: Live migration of VMs requires?
  choices:
  - id: a
    text: Shared storage / network reachability design
  - id: b
    text: Only changing STP priority
  - id: c
    text: Only disabling IP
  - id: d
    text: Only removing default route
  correct:
    answer: a
  explanation: 'vMotion-style moves need connectivity design.


    **Shared storage / network reachability design**: vMotion-style moves need connectivity
    design.


    **Only changing STP priority**: Spanning Tree elects a root bridge and blocks
    redundant Ethernet paths so the LAN does not loop.


    **Only disabling IP**: Live VM migration needs shared storage and L2 adjacency
    for the vNIC. It does not disable the VM’s IP.


    **Only removing default route**: vMotion/live migration does not require deleting
    the default route. It needs consistent L2/L3 for the VM’s address.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-014
  type: single_choice
  topic_code: '2.3'
  difficulty: 4
  cert_tags: *id006
  stem: Underlay MTU for VXLAN must account for?
  choices:
  - id: a
    text: Encapsulation overhead
  - id: b
    text: Only reducing MTU below 576 always
  - id: c
    text: Only IPv4 options mandatory
  - id: d
    text: Only disabling jumbo
  correct:
    answer: a
  explanation: 'Outer headers need headroom.


    **Encapsulation overhead**: Outer headers need headroom.


    **Only reducing MTU below 576 always**: MTU is the maximum frame/packet size on
    a link; it is not an AD or overlay ID.


    **Only IPv4 options mandatory**: VXLAN adds ~50 bytes (UDP+VXLAN). Underlay MTU
    must grow or use jumbo; IPv4 options are unrelated.


    **Only disabling jumbo**: VXLAN underlay usually **enables** jumbo or raises MTU
    to absorb the VXLAN header.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-015
  type: single_choice
  topic_code: '2.2'
  difficulty: 2
  cert_tags: *id006
  stem: VRF-lite on an enterprise edge provides?
  choices:
  - id: a
    text: Device-local routing separation without MPLS requirement
  - id: b
    text: Only MPLS labels mandatory
  - id: c
    text: Only NAT
  - id: d
    text: Only QoS marking
  correct:
    answer: a
  explanation: 'VRF-lite separates RIB/FIB without requiring MPLS.


    **Device-local routing separation without MPLS requirement**: VRF-lite separates
    RIB/FIB without requiring MPLS.


    **Only MPLS labels mandatory**: MPLS forwards on labels in a provider core, not
    on a campus access VLAN.


    **Only NAT**: NAT translates IP addresses (and ports, with PAT) as packets cross
    inside/outside domains.


    **Only QoS marking**: QoS classifies, marks (DSCP/CoS), queues, and polices traffic.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-016
  type: single_choice
  topic_code: '2.1'
  difficulty: 3
  cert_tags: *id006
  stem: Hypervisor escape is a?
  choices:
  - id: a
    text: Security risk class
  - id: b
    text: Routing metric
  - id: c
    text: STP state
  - id: d
    text: QoS PHB
  correct:
    answer: a
  explanation: 'Guest breakout to host is a critical risk.


    **Security risk class**: Guest breakout to host is a critical risk.


    **Routing metric**: A hypervisor escape is a **security vulnerability** (guest
    breaks into the host). Metric is an IGP cost.


    **STP state**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **QoS PHB**: QoS classifies, marks (DSCP/CoS), queues, and polices traffic.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-2-090
  type: multiple_choice
  topic_code: '2.3'
  difficulty: 3
  cert_tags: *id006
  stem: Which two are true about VXLAN? (Choose two.)
  choices:
  - id: a
    text: Uses a 24-bit VNI
  - id: b
    text: Requires Token Ring core
  - id: c
    text: Typically rides on UDP/IP underlay
  - id: d
    text: Replaces the need for any underlay routing
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'VXLAN VNIs identify overlays carried over an IP underlay, usually
    UDP.


    **Uses a 24-bit VNI**: Large segment space.


    **Typically rides on UDP/IP underlay**: Encapsulation.


    **Requires Token Ring core**: No.


    **Replaces the need for any underlay routing**: Still needs underlay.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0004-7f437d
  type: single_choice
  topic_code: '2.1'
  difficulty: 5
  cert_tags: &id007
  - ccnp
  stem: 'Scenario 4 (2.1): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: a
    text: PAgP
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  correct:
    answer: a
  explanation: 'Port Aggregation Protocol is Cisco-proprietary EtherChannel negotiation
    (`channel-group N mode desirable|auto`).


    **PAgP**: Port Aggregation Protocol is Cisco-proprietary EtherChannel negotiation
    (`channel-group N mode desirable|auto`).


    LACP (IEEE 802.3ad/802.1AX) is the **standards-based** negotiator (`mode active|passive`),
    not Cisco-proprietary.


    **Static on only**: `channel-group N mode on` bundles with **no** negotiation.
    It is neither PAgP nor LACP.


    **PAgP+LACP hybrid mandatory**: PAgP and LACP cannot form a channel with each
    other. You pick one protocol (or static `on`); there is no hybrid mandatory mode.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
