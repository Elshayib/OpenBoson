- id: encor-5-001
  type: single_choice
  topic_code: '5.4'
  difficulty: 3
  cert_tags: &id016
  - ccnp
  stem: Cisco TrustSec uses SGTs for?
  choices:
  - id: a
    text: Group-based policy
  - id: b
    text: Only STP
  - id: c
    text: Only VTP
  - id: d
    text: Only CDP version
  correct:
    answer: a
  explanation: 'Security Group Tags.


    **Only STP** is a mismatch: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects
    a root and blocks redundant Layer 2 paths so Ethernet does not loop. The stem
    is asking about **Group-based policy**.


    **Only VTP** points at VTP, which is not how 5.4 (Wireless security features)
    solves this stem. The keyed answer is **Group-based policy**.


    **Only CDP version** points at CDP version, which is not how 5.4 (Wireless security
    features) solves this stem. The keyed answer is **Group-based policy**.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.4
  provider: openboson
  license: MIT
  provenance: original
