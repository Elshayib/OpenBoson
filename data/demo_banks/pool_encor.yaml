    Type 2, which is not how 2.1 (Device virtualization technologies) solves this
    stem. The keyed answer is **On bare metal**.


    **Only on printers** points at on printers, which is not how 2.1 (Device virtualization
    technologies) solves this stem. The keyed answer is **On bare metal**.


