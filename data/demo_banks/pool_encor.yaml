- id: encor-gen-0092-24ab1b
  type: single_choice
  topic_code: '4.2'
  difficulty: 3
  cert_tags: *id013
  stem: 'Scenario 92 (4.2): DNS record for IPv6?'
  choices:
  - id: a
    text: AAAA
  - id: b
    text: A
  - id: c
    text: MX
  - id: d
    text: PTR only
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    An **A** record maps a name to an **IPv4** address, not IPv6.


    MX records name mail exchangers. They do not carry IPv6 host addresses.


    **PTR only** is not the right selection: PTR is reverse DNS (IP → name) under
    `ip6.arpa` or `in-addr.arpa`. The forward IPv6 record is AAAA.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0093-afc031
  type: single_choice
  topic_code: '4.3'
  difficulty: 4
  cert_tags: *id013
  stem: 'Scenario 93 (4.3): Many-to-one NAT using ports?'
  choices:
  - id: b
    text: Static NAT
  - id: c
    text: One-to-one dynamic only
  - id: d
    text: NPTv6 only
  - id: a
    text: PAT/overload
  correct:
    answer: a
  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only** is not the right selection: Dynamic NAT without overload
    still uses a pool 1:1. When the pool is exhausted, new flows fail — that is not
    many-to-one PAT.


    **NPTv6 only** is not the right selection: NPTv6 is IPv6 prefix translation (RFC
    6296). It is not IPv4 PAT.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
