  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: SSO/NSF on dual supervisors primarily aims to?
  choices:
  - id: a
    text: Minimize disruption on switchover
    rationale: Stateful switchover with NSF keeps forwarding during RP failover.
  - id: b
    text: Increase STP diameter only
