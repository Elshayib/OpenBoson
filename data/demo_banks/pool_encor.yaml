- id: encor-5-001
  type: single_choice
  topic_code: '5.4'
  difficulty: 3
  cert_tags: &id016
  - ccnp
  stem: Cisco TrustSec uses SGTs for?
  choices:
  - id: a
    text: Group-based policy
  - id: b
    text: Only STP
  - id: c
    text: Only VTP
  - id: d
    text: Only CDP version
  correct:
    answer: a
  explanation: 'Security Group Tags.


    **Group-based policy**: Security Group Tags.


    **Only STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.


    **Only VTP**: VTP floods VLAN advertisements among switches using a revision number;
    it does not route, NAT, or identify an overlay.


    **Only CDP version**: CDP is Cisco’s L2 neighbor discovery (`show cdp neighbors`).'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-5-002
  type: single_choice
  topic_code: '5.4'
  difficulty: 4
  cert_tags: *id016
  stem: MACsec provides?
  choices:
  - id: a
    text: Hop-by-hop L2 encryption
  - id: b
    text: Only L3 IPsec exclusive
  - id: c
    text: Only TLS to websites
  - id: d
    text: Only WEP
  correct:
    answer: a
  explanation: '802.1AE.


    **Hop-by-hop L2 encryption**: 802.1AE.


    **Only L3 IPsec exclusive**: IPsec (AH/ESP) encrypts/authenticates IP packets
    for VPNs.


    **Only TLS to websites**: MACsec (802.1AE) is **hop-by-hop Layer-2** encryption
    on Ethernet links, not HTTPS to a web server.


    **Only WEP**: WEP is a broken RC4 WLAN cipher; WPA2/WPA3 replaced it.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-5-003
  type: single_choice
  topic_code: '5.2'
  difficulty: 2
  cert_tags: *id016
  stem: CoPP protects?
  choices:
  - id: a
    text: The control plane CPU
  - id: b
    text: Only data plane TCAM exclusive
  - id: c
    text: Only PoE
  - id: d
    text: Only fans
  correct:
    answer: a
  explanation: 'Control Plane Policing.


    **The control plane CPU**: Control Plane Policing.


    **Only data plane TCAM exclusive**: TCAM stores hardware ACL/QoS/FIB entries.


    **Only PoE**: PoE delivers DC power on Ethernet (802.3af/at/bt).


    **Only fans**: CoPP polices traffic **to the control-plane CPU**, not chassis
    fans.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-5-004
  type: single_choice
  topic_code: '5.4'
  difficulty: 3
  cert_tags: *id016
  stem: Next-generation firewalls are a component of?
  choices:
  - id: a
    text: Network security design
  - id: b
    text: Only VTP
  - id: c
    text: Only LACP
  - id: d
    text: Only MST instances
  correct:
    answer: a
  explanation: 'NGFW is part of security design components.


    **Network security design**: NGFW is part of security design components.


    **Only VTP**: VTP floods VLAN advertisements among switches using a revision number;
    it does not route, NAT, or identify an overlay.


    **Only LACP**: LACP (802.3ad/802.1AX) negotiates EtherChannel (`channel-group
    mode active|passive`).


    **Only MST instances**: MST (802.1s) maps VLANs onto a few STP instances.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
