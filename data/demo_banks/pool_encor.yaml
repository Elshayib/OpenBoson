- id: encor-3-011
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id009
  stem: EIGRP stub routers limit?
  choices:
  - id: a
    text: Query scope
  - id: b
    text: Only hello timers to zero
  - id: c
    text: Only bandwidth to 0
  - id: d
    text: Only delay infinite always
  correct:
    answer: a
  explanation: 'Stubs reduce SIA risk.


    **Query scope**: Stubs reduce SIA risk.


    **Only hello timers to zero**: EIGRP stub does not zero Hello timers. Hellos still
    flow; queries for missing prefixes are not sent to the stub.


    **Only bandwidth to 0**: An EIGRP stub still has bandwidth. Stub **limits queries
    and advertised routes** (connected/static/summary), not K-values.


    **Only delay infinite always**: EIGRP stub does not set delay to infinity. It
    suppresses query handling and limits advertised route types.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
