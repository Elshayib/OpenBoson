questions:
- id: encor-1-001
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: In a 3-tier campus, which layer typically aggregates access switches?
  choices:
  - id: a
    text: Distribution
  - id: b
    text: Core
  - id: c
    text: Access
  - id: d
    text: WAN edge
  correct:
    answer: a
  explanation: 'Distribution aggregates access and applies policy toward core.


    **Core** is a mismatch: The campus core is a high-speed backbone; it should not
    attach user VLANs. The stem is asking about **Distribution**.


    **Access** is a mismatch: The campus access layer attaches endpoints (PCs, phones,
    APs). The stem is asking about **Distribution**.


    **WAN edge** is a mismatch: The WAN edge connects the site to providers (often
    NAT, VPN, or SD-WAN). The stem is asking about **Distribution**.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
