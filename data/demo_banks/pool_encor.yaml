questions:
- id: encor-1-001
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: In a 3-tier campus, which layer typically aggregates access switches?
  choices:
  - id: a
    text: Distribution
  - id: b
    text: Core
  - id: c
    text: Access
  - id: d
    text: WAN edge
  correct:
    answer: a
  explanation: 'Distribution aggregates access and applies policy toward core.


    **Core**: The campus core is a high-speed backbone; it should not attach user
    VLANs.


    **Access**: The campus access layer attaches endpoints (PCs, phones, APs).


    **WAN edge**: The WAN edge connects the site to providers (often NAT, VPN, or
    SD-WAN).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-002
  type: single_choice
  topic_code: '1.3'
  difficulty: 4
  cert_tags: *id001
  stem: Cisco SD-Access fabric uses which overlay identifier commonly?
  choices:
  - id: a
    text: LISP / VXLAN (VNI) concepts
  - id: b
    text: Only Frame Relay DLCI
  - id: c
    text: Only ATM VPI
  - id: d
    text: Only HDLC
  correct:
    answer: a
  explanation: 'SD-Access uses LISP control and VXLAN data plane overlays.


    **LISP / VXLAN (VNI) concepts**: SD-Access uses LISP control and VXLAN data plane
    overlays.


    **Only Frame Relay DLCI**: Frame Relay identifies virtual circuits with DLCIs
    on an NBMA WAN, not an SD-Access or VXLAN overlay ID.


    **Only ATM VPI**: ATM uses VPI/VCI labels on a cell WAN; it is not a campus fabric
    ID.


    **Only HDLC**: HDLC is a bit-oriented serial encapsulation, not an overlay identifier.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-003
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: A spine-leaf Clos fabric primarily optimizes which traffic pattern?
  choices:
  - id: a
    text: East-west
  - id: b
    text: Only north-south dialup
  - id: c
    text: Only Token Ring
  - id: d
    text: Only serial TDM
  correct:
    answer: a
  explanation: 'Leaf-spine equalizes east-west paths.


    **East-west**: Leaf-spine equalizes east-west paths.


    **Only north-south dialup**: Dial-up/modem north-south access is not east-west
    spine-leaf traffic.


    **Only Token Ring**: Token Ring is a legacy LAN (IEEE 802.5), not modern campus
    Ethernet.


    **Only serial TDM**: TDM serial (T1/E1) is a legacy WAN multiplexing method, not
    Clos fabric.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-004
  type: single_choice
  topic_code: '1.2'
  difficulty: 3
  cert_tags: *id001
  stem: Cisco Catalyst SD-WAN vManage is primarily responsible for?
  choices:
  - id: a
    text: Centralized management/orchestration
  - id: b
    text: Only BFD sessions
  - id: c
    text: Only OSPF DR election
  - id: d
    text: Only PoE budgeting
  correct:
    answer: a
  explanation: 'vManage manages SD-WAN fabric policies and devices.


    **Centralized management/orchestration**: vManage manages SD-WAN fabric policies
    and devices.


    **Only BFD sessions**: BFD detects forwarding-path failures in milliseconds.


    **Only OSPF DR election**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).


    **Only PoE budgeting**: PoE delivers DC power on Ethernet (802.3af/at/bt).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-005
  type: single_choice
  topic_code: '1.3'
  difficulty: 4
  cert_tags: *id001
  stem: Which design separates underlay reachability from overlay services?
  choices:
  - id: a
    text: Fabric overlay/underlay
  - id: b
    text: Only flat L2 everywhere
  - id: c
    text: Only hub-spoke Frame Relay
  - id: d
    text: Only static default only
  correct:
    answer: a
  explanation: 'Underlay provides IP reachability; overlay carries endpoints/services.


    **Fabric overlay/underlay**: Underlay provides IP reachability; overlay carries
    endpoints/services.


    **Only flat L2 everywhere**: A fabric **separates** underlay IP from overlay (VXLAN/LISP).
    Flat L2 everywhere is the design it replaces.


    **Only hub-spoke Frame Relay**: Frame Relay identifies virtual circuits with DLCIs
    on an NBMA WAN, not an SD-Access or VXLAN overlay ID.


    **Only static default only**: A collapsed core still runs IGP/BGP as designed.
    It is not “static default only.”.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-006
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: SSO/NSF on dual supervisors primarily aims to?
  choices:
  - id: a
    text: Minimize disruption on switchover
  - id: b
    text: Increase STP diameter only
  - id: c
    text: Disable CEF
  - id: d
    text: Force process switching
  correct:
    answer: a
  explanation: 'Stateful switchover with NSF keeps forwarding during RP failover.


    **Minimize disruption on switchover**: Stateful switchover with NSF keeps forwarding
    during RP failover.


    **Increase STP diameter only**: Spanning Tree elects a root bridge and blocks
    redundant Ethernet paths so the LAN does not loop.


    **Disable CEF**: CEF is IOS forwarding from the FIB, not process switching.


    **Force process switching**: SSO/NSF keeps CEF forwarding during RP failover.
    Process switching would slow the box; NSF does the opposite.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-007
  type: single_choice
  topic_code: '1.3'
  difficulty: 3
  cert_tags: *id001
  stem: An anycast gateway in fabric means?
  choices:
  - id: a
    text: Same gateway IP on multiple leaves
  - id: b
    text: Unique gateway per VLAN only globally
  - id: c
    text: Only HSRP v1 required
  - id: d
    text: Only GLBP
  correct:
    answer: a
  explanation: 'Anycast SVI provides local gateway on each leaf.


    **Same gateway IP on multiple leaves**: Anycast SVI provides local gateway on
    each leaf.


    **Unique gateway per VLAN only globally**: “An anycast gateway in fabric means”
    is answered by Same gateway IP on multiple leaves. Unique gateway per VLAN only
    globally does not do that job.


    **Only HSRP v1 required**: “An anycast gateway in fabric means” is answered by
    Same gateway IP on multiple leaves. Only HSRP v1 required does not do that job.


    **Only GLBP**: “An anycast gateway in fabric means” is answered by Same gateway
    IP on multiple leaves. Only GLBP does not do that job.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-008
  type: single_choice
  topic_code: '1.1'
  difficulty: 4
  cert_tags: *id001
  stem: A collapsed core design merges which layers?
  choices:
  - id: a
    text: Core and distribution
  - id: b
    text: Only access and WAN
  - id: c
    text: Only wireless and firewall
  - id: d
    text: Only DNS and DHCP
  correct:
    answer: a
  explanation: 'Collapsed core combines core+distribution functions.


    **Core and distribution**: Collapsed core combines core+distribution functions.


    **Only access and WAN**: Collapsed core merges **core + distribution**. Access
    and WAN stay separate layers.


    **Only wireless and firewall**: Collapsed core merges campus core and distribution,
    not WLC + firewall.


    **Only DNS and DHCP**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA,
    UDP 67/68).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-009
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: ECMP in underlay typically requires?
  choices:
  - id: a
    text: Equal-cost paths installed
  - id: b
    text: Only single best path always
  - id: c
    text: Only policy routing
  - id: d
    text: Only spanning tree
  correct:
    answer: a
  explanation: 'Equal-cost multipath load-shares across equal metrics.


    **Equal-cost paths installed**: Equal-cost multipath load-shares across equal
    metrics.


    **Only single best path always**: BGP can install ECMP with `maximum-paths`. “Single
    best path always” is the default, not a hard law.


    **Only policy routing**: PBR is one tool. NAT/PAT on the edge translates addresses;
    it is not PBR.


    **Only spanning tree**: STP prevents L2 loops. It is not a substitute for the
    feature the stem names.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-010
  type: single_choice
  topic_code: '1.3'
  difficulty: 3
  cert_tags: *id001
  stem: LISP EID vs RLOC roles?
  choices:
  - id: a
    text: Endpoint IDs vs routing locators
  - id: b
    text: Only VLAN vs VXLAN
  - id: c
    text: Only AS vs community
  - id: d
    text: Only DSCP vs CoS
  correct:
    answer: a
  explanation: 'LISP separates identity (EID) from location (RLOC).


    **Endpoint IDs vs routing locators**: LISP separates identity (EID) from location
    (RLOC).


    **Only VLAN vs VXLAN**: VXLAN encapsulates Ethernet in UDP 4789 with a 24-bit
    VNI.


    **Only AS vs community**: A community cloud is shared by several organizations.
    Private cloud is single-tenant for one org.


    **Only DSCP vs CoS**: DSCP is the 6-bit IP marking (EF=46 for voice).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-011
  type: single_choice
  topic_code: '1.1'
  difficulty: 4
  cert_tags: *id001
  stem: ToR switch in leaf-spine is typically a?
  choices:
  - id: a
    text: Leaf
  - id: b
    text: Spine only
  - id: c
    text: Route reflector only
  - id: d
    text: WAN edge only
  correct:
    answer: a
  explanation: 'Top-of-rack leaves connect servers to spines.


    **Leaf**: Top-of-rack leaves connect servers to spines.


    **Spine only**: A leaf-spine fabric uses **both** roles: leaves attach endpoints,
    spines are the backbone. “Spine only” is not a Clos.


    **Route reflector only**: A route reflector is an iBGP scaling tool. The stem’s
    feature is a different plane (underlay/overlay/campus layer).


    **WAN edge only**: The WAN edge connects the site to providers (often NAT, VPN,
    or SD-WAN).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-012
  type: single_choice
  topic_code: '1.4'
  difficulty: 2
  cert_tags: *id001
  stem: Campus QoS trust boundary is often at?
  choices:
  - id: a
    text: Access edge / IP phone
  - id: b
    text: Only ISP core
  - id: c
    text: Only DNS root
  - id: d
    text: Only BGP RR
  correct:
    answer: a
  explanation: 'Trust and classify near the edge.


    **Access edge / IP phone**: Trust and classify near the edge.


    **Only ISP core**: A collapsed core merges campus **core + distribution**. It
    is not an ISP backbone.


    **Only DNS root**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on UDP/TCP
    53.


    **Only BGP RR**: BGP is the Internet path-vector protocol (TCP 179; eBGP AD 20,
    iBGP AD 200).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-013
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: *id001
  stem: Cisco StackWise / StackWise Virtual primarily provides?
  choices:
  - id: a
    text: Control-plane and forwarding abstraction across members
  - id: b
    text: Only wireless mesh
  - id: c
    text: Only MPLS TE
  - id: d
    text: Only NetFlow export
  correct:
    answer: a
  explanation: 'Stacking presents multiple chassis as one logical switch.


    **Control-plane and forwarding abstraction across members**: Stacking presents
    multiple chassis as one logical switch.


    **Only wireless mesh**: A 3-tier campus is wired access/distribution/core. Mesh
    is an AP backhaul option.


    **Only MPLS TE**: MPLS forwards on labels in a provider core, not on a campus
    access VLAN.


    **Only NetFlow export**: NetFlow exports traffic caches for accounting and anomaly
    detection.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-014
  type: single_choice
  topic_code: '1.1'
  difficulty: 4
  cert_tags: *id001
  stem: FHRP in campus design primarily provides?
  choices:
  - id: a
    text: First-hop gateway redundancy
  - id: b
    text: Only underlay multicast RP
  - id: c
    text: Only VXLAN VNI allocation
  - id: d
    text: Only CoPP class-maps
  correct:
    answer: a
  explanation: 'HSRP/VRRP keep default gateway available.


    **First-hop gateway redundancy**: HSRP/VRRP keep default gateway available.


    **Only underlay multicast RP**: VXLAN/EVPN often uses ingress replication or multicast
    in the underlay. The VNI still identifies the overlay, not the RP address.


    **Only VXLAN VNI allocation**: VXLAN encapsulates Ethernet in UDP 4789 with a
    24-bit VNI.


    **Only CoPP class-maps**: Control Plane Policing rate-limits traffic to the route
    processor.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-015
  type: single_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: *id001
  stem: SD-WAN control plane elements typically include?
  choices:
  - id: a
    text: vSmart / orchestration components
  - id: b
    text: Only access switches as RR mandatory
  - id: c
    text: Only STP root
  - id: d
    text: Only PoE PSE
  correct:
    answer: a
  explanation: 'SD-WAN separates control/management from data plane edges.


    **vSmart / orchestration components**: SD-WAN separates control/management from
    data plane edges.


    **Only access switches as RR mandatory**: BGP route reflectors sit in the iBGP
    core (often spines/PEs). Access switches are not mandatory RRs.


    **Only STP root**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **Only PoE PSE**: PoE delivers DC power on Ethernet (802.3af/at/bt).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-016
  type: single_choice
  topic_code: '1.3'
  difficulty: 3
  cert_tags: *id001
  stem: Traditional campus interoperating with SD-Access often needs?
  choices:
  - id: a
    text: Border/fusion design considerations
  - id: b
    text: Only disabling all routing
  - id: c
    text: Only removing VLANs forever
  - id: d
    text: Only Token Ring bridges
  correct:
    answer: a
  explanation: 'Borders connect fabric to non-fabric domains.


    **Border/fusion design considerations**: Borders connect fabric to non-fabric
    domains.


    **Only disabling all routing**: “Traditional campus interoperating with SD-Access
    often needs” is answered by Border/fusion design considerations. Only disabling
    all routing does not do that job.


    **Only removing VLANs forever**: “Traditional campus interoperating with SD-Access
    often needs” is answered by Border/fusion design considerations. Only removing
    VLANs forever does not do that job.


    **Only Token Ring bridges**: “Traditional campus interoperating with SD-Access
    often needs” is answered by Border/fusion design considerations. Only Token Ring
    bridges does not do that job.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-017
  type: single_choice
  topic_code: '1.4'
  difficulty: 4
  cert_tags: *id001
  stem: Interpreting a policy-map with police statements relates to?
  choices:
  - id: a
    text: QoS configuration
  - id: b
    text: Only VTP pruning
  - id: c
    text: Only CDP timers
  - id: d
    text: Only DHCP pools
  correct:
    answer: a
  explanation: 'QoS policies classify/mark/police/shape traffic.


    **QoS configuration**: QoS policies classify/mark/police/shape traffic.


    **Only VTP pruning**: VTP floods VLAN advertisements among switches using a revision
    number; it does not route, NAT, or identify an overlay.


    **Only CDP timers**: CDP is Cisco’s L2 neighbor discovery (`show cdp neighbors`).


    **Only DHCP pools**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA,
    UDP 67/68).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-018
  type: single_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: *id001
  stem: A benefit of Catalyst SD-WAN is often?
  choices:
  - id: a
    text: Centralized policy with transport independence
  - id: b
    text: Mandatory single underlay protocol only forever
  - id: c
    text: Removal of encryption options
  - id: d
    text: Only L2 loops required
  correct:
    answer: a
  explanation: 'SD-WAN centralizes policy across transports.


    **Centralized policy with transport independence**: SD-WAN centralizes policy
    across transports.


    **Mandatory single underlay protocol only forever**: An underlay can run OSPF,
    IS-IS, or BGP. VXLAN/SD-Access does not freeze you to one protocol forever.


    **Removal of encryption options**: SD-WAN adds IPsec on overlays; it does not
    remove encryption options.


    **Only L2 loops required**: SD-WAN’s benefit is centralized policy, app-aware
    routing, and encryption — not requiring Layer-2 loops.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-019
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: *id001
  stem: Cloud / fabric capacity planning in enterprise design addresses?
  choices:
  - id: a
    text: Scale and resiliency of tiers/fabrics
  - id: b
    text: Only cable color standards
  - id: c
    text: Only console baud rates
  - id: d
    text: Only banner motd text
  correct:
    answer: a
  explanation: 'Design principles include capacity and HA for fabrics/cloud.


    **Scale and resiliency of tiers/fabrics**: Design principles include capacity
    and HA for fabrics/cloud.


    **Only cable color standards**: TIA color codes are cabling craft. Capacity planning
    is bandwidth and scale.


    **Only console baud rates**: 9600/115200 baud is serial CLI. Capacity planning
    is traffic engineering.


    **Only banner motd text**: Capacity planning sizes uplinks, oversubscription,
    and cloud regions — not the MOTD string.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-020
  type: single_choice
  topic_code: '1.4'
  difficulty: 4
  cert_tags: *id001
  stem: DSCP markings in QoS configs primarily influence?
  choices:
  - id: a
    text: Per-hop behavior treatment
  - id: b
    text: Only STP root priority
  - id: c
    text: Only VTP domain
  - id: d
    text: Only RADIUS ports
  correct:
    answer: a
  explanation: 'Markings drive classification and PHB along the path.


    **Per-hop behavior treatment**: Markings drive classification and PHB along the
    path.


    **Only STP root priority**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only VTP domain**: VTP floods VLAN advertisements among switches using a revision
