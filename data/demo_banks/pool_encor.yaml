- id: encor-5-006
  type: single_choice
  topic_code: '5.4'
  difficulty: 2
  cert_tags: *id016
  stem: CTS environment data includes?
  choices:
  - id: a
    text: SGT mappings / policy
  - id: b
    text: Only OSPF costs
  - id: c
    text: Only EIGRP K
  - id: d
    text: Only BGP MED
  correct:
    answer: a
  explanation: '**SGT mappings / policy** is correct. It is the selection that meets
    the requirement stated in the stem.


    **Only OSPF costs**: **OSPF** is a link-state IGP that builds a topology database
    and calculates loop-free paths with cost based primarily on interface bandwidth.
    This does not satisfy the condition required by the stem. Configuration uses `router
    ospf <process>`.


    **Only EIGRP K**: **EIGRP** is an advanced distance-vector protocol that uses
    the Diffusing Update Algorithm (DUAL) and composite metric components such as
    bandwidth and delay. This does not satisfy the condition required by the stem.
    Configuration uses `router eigrp <as>`.


    **Only BGP MED**: **BGP** exchanges reachability among autonomous systems and
    selects paths using an ordered attribute policy (weight, local preference, AS-path,
    MED, and others). This does not satisfy the condition required by the stem. Configuration
    uses `router bgp <asn>`.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.4
  provider: openboson
  license: MIT
  provenance: original
