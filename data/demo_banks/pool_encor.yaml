- id: encor-gen-0001-10c48f
  type: single_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 1 (1.2): IPv6 address type on every link?'
  choices:
  - id: b
    text: Global unicast
  - id: c
    text: Unique local
  - id: d
    text: Anycast only
  - id: a
    text: Link-local
  correct:
    answer: a
  explanation: '**Link-local** IPv6 addresses (`fe80::/10`) are required on every
    IPv6-enabled interface and are not routed beyond the local link. This is the correct
    answer for the stem.


