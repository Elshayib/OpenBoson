  explanation: 'The **native VLAN** carries untagged frames on an 802.1Q trunk. Tagged
    frames belong to other VLANs carried on the same trunk. This is the correct answer
    for the stem. Configuration uses `switchport trunk native vlan <id>`.


    **VLAN 1002** is incorrect. It describes a different behavior and does not meet
