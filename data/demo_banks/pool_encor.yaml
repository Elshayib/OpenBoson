- id: encor-v05-53-0014-db715b
  type: single_choice
  topic_code: '5.3'
  difficulty: 5
  cert_tags: &id019
  - ccnp
  stem: During troubleshooting related to 5.3, which observation is most relevant?
  choices:
  - id: c
    text: Use clear-text shared secrets as the only control for 5.3
  - id: d
    text: Skip documentation for 5.3 changes in production
  - id: a
    text: Use the standard model for 5.3 rather than a look-alike concept
  - id: b
    text: Disable logging permanently while testing 5.3
  correct:
    answer: a
  explanation: 'For 5.3 (REST API security), the keyed answer is **Use the standard
    model for 5.3 rather than a look-alike concept**. Stem: During troubleshooting
    related to 5.3, which observation is most relevant?.


    **Use the standard model for 5.3 rather than a look-alike concept** is correct:
    Stay with the standard model for this objective instead of a look-alike protocol
    that shares a buzzword but not the behavior. This matters for 5.3 (REST API security).


    **Use clear-text shared secrets as the only control for 5.3** is not the right
    selection: Clear-text shared secrets (type 7, Telnet, open SNMP) are not an acceptable
    sole control. Use SSH, type 8/9 secrets, and SNMPv3. This matters for 5.3 (REST
    API security).


    **Skip documentation for 5.3 changes in production** is not the right selection:
    Skipping documentation leaves no rollback and no audit trail. Production changes
    for this objective still need a written record. This matters for 5.3 (REST API
    security).


    **Disable logging permanently while testing 5.3** is not the right selection:
    Disabling logging permanently hides faults and is a finding on any security review.
    Keep syslog/buffered logging enabled. This matters for 5.3 (REST API security).'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.3
  provider: openboson
  license: MIT
  provenance: original
