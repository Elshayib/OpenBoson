- id: encor-2-002
  type: single_choice
  topic_code: '2.3'
  difficulty: 4
  cert_tags: *id006
  stem: VXLAN uses which outer transport commonly?
  choices:
  - id: a
    text: UDP
  - id: b
    text: Only ICMP
  - id: c
    text: Only STP BPDUs
  - id: d
    text: Only ARP exclusive
  correct:
    answer: a
  explanation: 'VXLAN encapsulates Ethernet in UDP.


    **Only ICMP** is a mismatch: ICMP (IPv4) / ICMPv6 carries control messages such
    as echo, unreachable, and TTL expired — not a transport for application byte streams.
    The stem is asking about **UDP**.


    **Only STP BPDUs** points at STP BPDUs, which is not how 2.3 (Network virtualization
    concepts) solves this stem. The keyed answer is **UDP**.


    **Only ARP exclusive** is a mismatch: ARP maps an IPv4 address to a MAC on the
    local Ethernet segment (broadcast request, unicast reply). IPv6 uses NDP instead.
    The stem is asking about **UDP**.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
