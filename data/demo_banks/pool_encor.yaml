    text: /25
  - id: d
    text: /30
  - id: a
    text: /26
  correct:
    answer: a
  explanation: '`255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus
    192 = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable
    hosts 62.


    **/26**: `255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus 192
    = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable hosts
    62.


    **/24**: `255.255.255.0` is /24 (256-address block), not 255.255.255.192.


    **/25**: `255.255.255.128` is /25 (128-address block).


    **/30**: `255.255.255.252` is /30 (4-address block) used on point-to-point links.'
  references:
