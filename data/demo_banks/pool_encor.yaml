- id: encor-1-003
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: A spine-leaf Clos fabric primarily optimizes which traffic pattern?
  choices:
  - id: a
    text: East-west
  - id: b
    text: Only north-south dialup
  - id: c
    text: Only Token Ring
  - id: d
    text: Only serial TDM
  correct:
    answer: a
  explanation: '**East-west**: **PAT** (NAT overload) maps many inside addresses to
    one outside address using unique transport port numbers. This is the correct answer
    for the stem. Configuration uses `ip nat inside source list <acl> interface <if>
    overload`.


    **Only north-south dialup** is incorrect. It does not describe the intended use
    or behavior required by the stem.


    **Only Token Ring** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **Only serial TDM** is incorrect. It does not describe the intended use or behavior
    required by the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-004
  type: single_choice
  topic_code: '1.2'
  difficulty: 3
  cert_tags: *id001
  stem: Cisco Catalyst SD-WAN vManage is primarily responsible for?
  choices:
  - id: a
    text: Centralized management/orchestration
  - id: b
    text: Only BFD sessions
  - id: c
    text: Only OSPF DR election
  - id: d
    text: Only PoE budgeting
  correct:
    answer: a
  explanation: '**Centralized management/orchestration** is correct. It is the selection
    that meets the requirement stated in the stem.


    **Only BFD sessions** is incorrect. It describes a different behavior and does
    not meet the requirement stated in the stem.


    **Only OSPF DR election**: **OSPF** is a link-state IGP that builds a topology
    database and calculates loop-free paths with cost based primarily on interface
    bandwidth. This does not satisfy the condition required by the stem. Configuration
    uses `router ospf <process>`.


    **Only PoE budgeting** is incorrect. It describes a different behavior and does
    not meet the requirement stated in the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
