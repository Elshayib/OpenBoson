  - id: c
    text: DR
  - id: d
    text: BDR
  - id: a
    text: ABR
  correct:
    answer: a
  explanation: 'An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **ABR**: An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **ASBR**: An ASBR redistributes **external** routes (another protocol or static)
    into OSPF and originates Type-5 (or Type-7 in NSSA) LSAs. Connecting two OSPF
    areas is the ABR job.


    **DR**: The Designated Router is elected on a multiaccess **link**. It is not
    the router that joins two areas.


    **BDR**: The Backup DR waits on that same multiaccess link. Area membership is
    unrelated.'
