- id: encor-nsc-0004
  type: multiple_choice
  topic_code: '2.1'
  difficulty: 3
  cert_tags: &id008
  - ccnp
  stem: 'Multiple-select check for 2.1: which items are operationally sound?'
  choices:
  - id: a
    text: Verify before change windows
  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For objective 2.1 (Device virtualization technologies), keep a baseline
    of `show vlan brief` and a written rollback. Skipping logs or treating 2.1 as
    optional leaves you unable to prove Device virtualization technologies still works.


    **Verify before change windows**: Confirm Device virtualization technologies with
    `show vlan brief` before you rely on the new config.


    **Skip documentation**: Device virtualization technologies still needs a change
    record and logs; skipping them removes rollback for 2.1.


    **Capture show/verify outputs**: Confirm Device virtualization technologies with
    `show vlan brief` before you rely on the new config.


    **Disable logging permanently**: You need logging/monitoring to see whether Device
    virtualization technologies actually converged after the window.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
