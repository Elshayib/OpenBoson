  - id: a
    text: HTTP/HTTPS APIs
  - id: b
    text: Only CDP TLVs
  - id: c
    text: Only BPDU guards
  - id: d
    text: Only HSRP hellos
  correct:
    answer: a
  explanation: '**HTTP/HTTPS APIs** is correct. It is the selection that meets the
    requirement stated in the stem.


    **Only CDP TLVs**: **CDP** is Cisco’s Layer 2 neighbor discovery protocol used
    for topology visibility and some provisioning features. This does not satisfy
    the condition required by the stem. Configuration uses `cdp run` / `show cdp neighbors`.


    **Only BPDU guards**: **BPDU guard** err-disables a PortFast-enabled port that
    receives a BPDU, protecting the edge from an accidental switch attachment that
    could create a loop. This does not satisfy the condition required by the stem.
    Configuration uses `spanning-tree bpduguard enable`.


    **Only HSRP hellos** is incorrect. It describes a different behavior and does
    not meet the requirement stated in the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.6
  provider: openboson
  license: MIT
  provenance: original
