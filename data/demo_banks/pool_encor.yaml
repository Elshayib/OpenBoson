    answer: a
  explanation: 'Every IPv6-enabled interface must have a link-local address in `fe80::/10`
    (often auto-derived from EUI-64 or stable privacy). NDP, RS/RA, and routing hellos
    use it; it is never forwarded off-link.


    **Link-local**: Every IPv6-enabled interface must have a link-local address in
    `fe80::/10` (often auto-derived from EUI-64 or stable privacy). NDP, RS/RA, and
    routing hellos use it; it is never forwarded off-link.


    Global unicast (`2000::/3`) is the routable public address, assigned only when
    the interface needs site/Internet reachability — not automatically on every link.


    Unique local (`fc00::/7`, typically `fd00::/8`) is optional private unicast, analogous
    to RFC 1918. Interfaces do not require it.


    **Anycast only**: Anycast is a unicast address assigned to multiple nodes so routers
    deliver to the nearest. It is a service pattern, not the required per-interface
    address type.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
