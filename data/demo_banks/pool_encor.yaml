- id: encor-1-007
  type: single_choice
  topic_code: '1.3'
  difficulty: 3
  cert_tags: *id001
  stem: An anycast gateway in fabric means?
  choices:
  - id: a
    text: Same gateway IP on multiple leaves
  - id: b
    text: Unique gateway per VLAN only globally
  - id: c
    text: Only HSRP v1 required
  - id: d
    text: Only GLBP
  correct:
    answer: a
  explanation: '**Same gateway IP on multiple leaves**: **Anycast** assigns the same
    address to multiple nodes; routers forward to the topologically nearest member.
    IPv6 does not use broadcast. This is the correct answer for the stem.


    **Unique gateway per VLAN only globally** is incorrect. It does not describe the
    intended use or behavior required by the stem.


    **Only HSRP v1 required** is incorrect. It does not describe the intended use
    or behavior required by the stem.


    **Only GLBP** is incorrect. It does not describe the intended use or behavior
    required by the stem.'
