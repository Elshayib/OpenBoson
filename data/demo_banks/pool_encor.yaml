- id: encor-5-005
  type: single_choice
  topic_code: '5.1'
  difficulty: 4
  cert_tags: *id016
  stem: AAA on network devices provides?
  choices:
  - id: a
    text: Authentication and authorization services
  - id: b
    text: Only routing metrics
  - id: c
    text: Only switching ASICs
  - id: d
    text: Only optics
  correct:
    answer: a
  explanation: '**Authentication and authorization services** is correct. It is the
    selection that meets the requirement stated in the stem.


    **Only routing metrics** is incorrect. It describes a different behavior and does
    not meet the requirement stated in the stem.


    **Only switching ASICs**: A Layer 2 **switch** forwards Ethernet frames based
    on MAC address tables within a broadcast domain or VLAN. This does not satisfy
    the condition required by the stem.


    **Only optics** is incorrect. It describes a different behavior and does not meet
    the requirement stated in the stem.'
  references:
