- id: encor-gen-0004-7f437d
  type: single_choice
  topic_code: '2.1'
  difficulty: 5
  cert_tags: &id007
  - ccnp
  stem: 'Scenario 4 (2.1): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: a
    text: PAgP
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  correct:
    answer: a
  explanation: '**PAgP** is Cisco’s proprietary EtherChannel negotiation protocol
    used to form Port-Channels between capable peers. This is the correct answer for
    the stem. Configuration uses `channel-group <id> mode desirable|auto`.


    **LACP** (IEEE 802.3ad) negotiates EtherChannel bundles and is the standards-based
    alternative to PAgP. This does not satisfy the condition required by the stem.
    Configuration uses `channel-group <id> mode active|passive`.


    **Static on only** is incorrect. It describes a different behavior and does not
    meet the requirement stated in the stem.


    **PAgP+LACP hybrid mandatory**: **PAgP** is Cisco’s proprietary EtherChannel negotiation
    protocol used to form Port-Channels between capable peers. This does not satisfy
    the condition required by the stem. Configuration uses `channel-group <id> mode
    desirable|auto`.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
  - ENCOR exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0005-469924
  type: single_choice
  topic_code: '2.2'
  difficulty: 1
  cert_tags: *id007
  stem: 'Scenario 5 (2.2): VLAN carrying untagged trunk frames?'
  choices:
