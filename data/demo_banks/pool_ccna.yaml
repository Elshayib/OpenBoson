- id: ccna-4-007
  type: single_choice
  topic_code: '4.2'
  difficulty: 3
  cert_tags: *id014
  stem: Stratum 0 in NTP refers to?
  choices:
  - id: a
    text: Reference clocks (not network NTP servers themselves)
  - id: b
    text: Only leaf clients
  - id: c
    text: Only stratum 16 sync success
  - id: d
    text: Only GPS denied sources
  correct:
    answer: a
  explanation: 'NTP **stratum** is distance from a reference clock. **Stratum 0**
    devices are the clocks themselves (GPS, atomic) — they are **not** NTP servers
    on the network. A GPS-synced router is typically **stratum 1** (one hop from stratum
    0).


    **Reference clocks (not network NTP servers themselves)** is the definition of
    stratum 0.


    **Only leaf clients** are high-stratum hosts (often 3–4) that query servers; they
    are not stratum 0.


    **Only stratum 16 sync success** is inverted: stratum **16** means **unsynchronized**
    on Cisco IOS (`show ntp status`).


    **Only GPS denied sources** would be a clock that cannot see GPS — that is not
    what stratum 0 means. Stratum 0 **is** the GPS/atomic reference, when it is working.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
