  explanation: '**TCP 22**: **TCP** provides reliable, ordered, connection-oriented
    delivery using sequence and acknowledgment numbers, among other mechanisms. This
    is the correct answer for the stem.


    **UDP 161**: **UDP** provides connectionless datagram delivery without TCP’s reliability
    or ordering guarantees. This does not satisfy the condition required by the stem.


    **UDP 69**: **UDP** provides connectionless datagram delivery without TCP’s reliability
    or ordering guarantees. This does not satisfy the condition required by the stem.


    **TCP 23**: **TCP** provides reliable, ordered, connection-oriented delivery using
    sequence and acknowledgment numbers, among other mechanisms. This does not satisfy
    the condition required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
