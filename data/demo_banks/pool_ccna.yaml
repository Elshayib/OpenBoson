  - id: b
    text: Leaves connect only to other leaves
  - id: c
    text: Spines connect servers directly
  - id: d
    text: It requires Token Ring
  correct:
    answer: a
  explanation: 'Leaf switches attach to all spines; east-west via spine.


    **Every leaf connects to every spine**: Leaf switches attach to all spines; east-west
    via spine.


    **Leaves connect only to other leaves**: Every leaf connects to every spine is
    the matching value or command; Leaves connect only to other leaves is not.


    **Spines connect servers directly**: Every leaf connects to every spine is the
    matching value or command; Spines connect servers directly is not.


    **It requires Token Ring**: Token Ring is a legacy LAN (IEEE 802.5), not modern
    campus Ethernet.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
