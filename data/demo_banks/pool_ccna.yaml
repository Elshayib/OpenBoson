- id: ccna-6-001
  type: single_choice
  topic_code: '6.5'
  difficulty: 3
  cert_tags: &id020
  - ccna
  stem: REST-based APIs commonly use which HTTP methods for CRUD?
  choices:
  - id: a
    text: GET/POST/PUT/PATCH/DELETE
  - id: b
    text: Only HELLO/DBD
  - id: c
    text: Only INVITE/BYE
  - id: d
    text: Only SYN/ACK
  correct:
    answer: a
  explanation: 'REST maps CRUD to HTTP: **GET** (read), **POST** (create), **PUT/PATCH**
    (update), **DELETE** (delete). Network controllers (DNA Center, vManage, RESTCONF)
    expose those verbs on URIs.


    **GET/POST/PUT/PATCH/DELETE** is that REST/CRUD mapping.


    **Only HELLO/DBD** are **OSPF** packet types (Hello, Database Description), not
    HTTP methods.


    **Only INVITE/BYE** are **SIP** methods for voice call setup/teardown.


    **Only SYN/ACK** are **TCP** handshake flags, the transport under HTTP, not the
    REST verbs themselves.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-002
  type: single_choice
  topic_code: '6.6'
  difficulty: 2
  cert_tags: *id020
  stem: Ansible is best described as?
  choices:
  - id: a
    text: Agentless automation using SSH/APIs and YAML playbooks
  - id: b
    text: A link-state routing protocol
  - id: c
    text: A Layer 2 loop prevention protocol
  - id: d
    text: A wireless encryption cipher
  correct:
    answer: a
  explanation: 'Ansible automates configuration with playbooks, often without agents.


    **Agentless automation using SSH/APIs and YAML playbooks**: Ansible.


    **A link-state routing protocol**: OSPF/IS-IS.


    **A Layer 2 loop prevention protocol**: STP.


    **A wireless encryption cipher**: CCMP etc.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-003
  type: single_choice
  topic_code: '6.7'
  difficulty: 3
  cert_tags: *id020
  stem: JSON data structures primarily use which pair of container types?
  choices:
  - id: a
    text: Objects and arrays
  - id: b
    text: Only XML tags
  - id: c
    text: Only YANG identities
  - id: d
    text: Only TLV binary
  correct:
    answer: a
  explanation: 'JSON has two containers: **objects** `{ "key": value }` and **arrays**
    `[ ... ]`. Values are string, number, object, array, boolean, or null. RESTCONF/YANG
    payloads and most controller APIs use this pair.


    **Objects and arrays** are those two JSON containers.


    **Only XML tags** describe **XML** (`<rpc>`) used by NETCONF. JSON does not use
    angle-bracket tags.


    **Only YANG identities** are YANG language statements for typed enumerations.
    YANG **models** data; JSON **encodes** an instance.


    **Only TLV binary** is how many routing protocols (LLDP, BGP attributes) encode
    on the wire. JSON is text, not TLV.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.7
  provider: openboson
  license: MIT
  provenance: original
