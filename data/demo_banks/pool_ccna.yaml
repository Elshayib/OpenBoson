- id: ccna-5-018
  type: single_choice
  topic_code: '5.6'
  difficulty: 2
  cert_tags: *id017
  stem: ACL implicit final rule is?
  choices:
  - id: a
    text: deny any
  - id: b
    text: permit any
  - id: c
    text: permit icmp
  - id: d
    text: deny tcp only
  correct:
    answer: a
  explanation: '**deny any**: An **ACL** filters traffic by matching header fields
    and applying permit or deny actions in sequential order. This is the correct answer
    for the stem.


    **permit any** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **permit icmp** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **deny tcp only**: **TCP** provides reliable, ordered, connection-oriented delivery
    using sequence and acknowledgment numbers, among other mechanisms. This does not
    satisfy the condition required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.6
