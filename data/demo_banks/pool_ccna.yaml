- id: ccna-gen-0339-2e1c9f
  type: single_choice
  topic_code: '2.9'
  difficulty: 5
  cert_tags: *id009
  stem: 'Scenario 339 (2.9): STP role that does not forward user frames?'
  choices:
  - id: d
    text: Edge forwarding
  - id: a
    text: Alternate/blocking
  - id: b
    text: Designated
  - id: c
    text: Root
  correct:
    answer: a
  explanation: 'An alternate (RSTP) / blocking (802.1D) port is a backup path to the
    root. It does **not** forward user frames; it only processes BPDUs until the root
    port fails.


    **Edge forwarding** is not the right selection: An edge/PortFast port is already
    forwarding to a host. That is the opposite of a blocked backup port.


    **Designated** is not the right selection: The designated port is the forwarding
    port toward a segment. It **does** forward user frames.


    **Root** is not the right selection: The root port is the forwarding uplink to
    the root bridge. It forwards user frames toward the root.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.9
  provider: openboson
  license: MIT
  provenance: original
