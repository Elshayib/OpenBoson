    policy between zones; it is not the classic LAN MAC forwarder. The stem is asking
    about **A method that takes advantage of a vulnerability**.


    **Only a syslog facility** is a mismatch: Syslog exports device logs (UDP 514
    by default) with severity 0–7. The stem is asking about **A method that takes
    advantage of a vulnerability**.


    **Only a VLAN** points at a VLAN, which is not how 5.1 (Key security concepts)
    solves this stem. The keyed answer is **A method that takes advantage of a vulnerability**.'
