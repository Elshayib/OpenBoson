- id: ccna-6-001
  type: single_choice
  topic_code: '6.5'
  difficulty: 3
  cert_tags: &id020
  - ccna
  stem: REST-based APIs commonly use which HTTP methods for CRUD?
  choices:
  - id: a
    text: GET/POST/PUT/PATCH/DELETE
  - id: b
    text: Only HELLO/DBD
  - id: c
    text: Only INVITE/BYE
  - id: d
    text: Only SYN/ACK
  correct:
    answer: a
  explanation: '**GET/POST/PUT/PATCH/DELETE**: **PAT** (NAT overload) maps many inside
    addresses to one outside address using unique transport port numbers. This is
    the correct answer for the stem. Configuration uses `ip nat inside source list
    <acl> interface <if> overload`.


    **Only HELLO/DBD** is incorrect. It describes a different behavior and does not
    meet the requirement stated in the stem.


    **Only INVITE/BYE** is incorrect. It describes a different behavior and does not
    meet the requirement stated in the stem.


    **Only SYN/ACK** is incorrect. It describes a different behavior and does not
    meet the requirement stated in the stem.'
