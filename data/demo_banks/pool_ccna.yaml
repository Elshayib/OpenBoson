  - id: b
    text: Cisco-only proprietary CDP replacement mandatory
  - id: c
    text: A routing protocol
  - id: d
    text: A wireless encryption cipher
  correct:
    answer: a
  explanation: '**IEEE neighbor discovery protocol**: **LLDP** is the standards-based
