    text: TCP
  - id: b
    text: UDP
  - id: c
    text: ICMP
  - id: d
    text: ARP
  correct:
    answer: a
  explanation: 'TCP establishes a connection before data transfer.


    **UDP** is a mismatch: UDP is the connectionless Layer 4 datagram protocol (8-byte
    header, no handshake or retransmission). The stem is asking about **TCP**.


    **ICMP** is a mismatch: ICMP (IPv4) / ICMPv6 carries control messages such as
    echo, unreachable, and TTL expired — not a transport for application byte streams.
    The stem is asking about **TCP**.


    **ARP** is a mismatch: ARP maps an IPv4 address to a MAC on the local Ethernet
    segment (broadcast request, unicast reply). IPv6 uses NDP instead. The stem is
    asking about **TCP**.'
