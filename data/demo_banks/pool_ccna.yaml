  provenance: original
- id: ccna-1-020
  type: single_choice
  topic_code: '1.1'
  difficulty: 4
  cert_tags: *id001
  stem: PoE delivers power over which pairs historically for 802.3af Mode A?
  choices:
  - id: a
    text: Data pairs (1-2 and 3-6)
  - id: b
    text: Only fiber strands
  - id: c
    text: USB only
  - id: d
    text: Coax center conductor
  correct:
    answer: a
