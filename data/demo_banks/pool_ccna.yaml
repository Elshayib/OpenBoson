    For 5.7 (Layer 2 security features), the stem is solved by **Port security**,
    not by UplinkFast.


    **VTP pruning** is a different protocol, command, or value than **Port security**.
    For 5.7 (Layer 2 security features), the stem is solved by **Port security**,
    not by VTP pruning.


    **CDP** is a mismatch: CDP is Cisco’s Layer 2 neighbor discovery protocol (`show
    cdp neighbors`). The stem is asking about **Port security**.'
