    **Always AD only**: Always AD is not **10.1.1.0/28 over 10.1.0.0/16**.


    **Always metric only**: Always metric is not **10.1.1.0/28 over 10.1.0.0/16**.


    **Random ECMP only**: ECMP installs multiple equal-cost next hops (OSPF `maximum-paths`).'
