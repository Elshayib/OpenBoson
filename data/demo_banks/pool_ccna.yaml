    - a
    - c
    partial_credit: false
  explanation: '**UDP** provides connectionless datagram delivery without TCP’s reliability
    or ordering guarantees. This is the correct answer for the stem.


    **Lower overhead than TCP**: **TCP** provides reliable, ordered, connection-oriented
    delivery using sequence and acknowledgment numbers, among other mechanisms. This
    is the correct answer for the stem.


    **Guaranteed delivery** is incorrect. It does not describe the intended use or
    behavior required by the stem.


    **Always encrypts payloads** is incorrect. It does not describe the intended use
