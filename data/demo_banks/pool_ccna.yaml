- id: ccna-1-019
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: How many /30s fit inside a /24?
  choices:
  - id: a
    text: '64'
  - id: b
    text: '32'
  - id: c
    text: '16'
  - id: d
    text: '4'
  correct:
    answer: a
  explanation: 'Each /30 is 4 addresses; 256/4 = 64.


    **32** is a mismatch: 32 is the total addresses in a /27. The stem is asking about
