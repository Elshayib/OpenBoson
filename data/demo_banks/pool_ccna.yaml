  explanation: 'One side full / other half-duplex leads to collisions and errors.


    **Late collisions / poor performance**: One side full / other half-duplex leads
    to collisions and errors.


    **Instant OSPF adjacency**: OSPF is a link-state IGP (RID, areas, LSAs, cost,
    default AD 110, multicast 224.0.0.5/6).


    **Automatic trunking**: Late collisions / poor performance is the matching value
    or command; Automatic trunking is not.


    **Mandatory encryption**: Late collisions / poor performance is the matching value
    or command; Mandatory encryption is not.'
