- id: ccna-gen-0022-e8faf6
  type: single_choice
  topic_code: '3.1'
  difficulty: 3
  cert_tags: &id013
  - ccna
  stem: 'Scenario 22 (3.1): Default AD of eBGP?'
  choices:
  - id: c
    text: '110'
  - id: d
    text: '120'
  - id: a
    text: '20'
  - id: b
    text: '90'
  correct:
    answer: a
  explanation: 'Cisco default administrative distance for **eBGP** is **20**, which
    is why an eBGP prefix beats OSPF (110) or iBGP (200) for the same length.


    110 is **OSPF**, not eBGP.


    120 is **RIP**, not eBGP.


    90 is internal **EIGRP**, not eBGP.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0023-e963dc
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id013
  stem: 'Scenario 23 (3.2): Equal-cost OSPF paths behavior?'
  choices:
  - id: d
    text: Drop randomly
  - id: a
    text: Install both (ECMP)
  - id: b
    text: Prefer higher RID
  - id: c
    text: Prefer older LSA
  correct:
    answer: a
  explanation: 'If two OSPF paths to the same prefix have equal cost, IOS installs
    both (ECMP, default maximum-paths 4) and load-shares.


    **Drop randomly** is not the right selection: OSPF does not randomly drop equal-cost
    routes. They are installed and hashed across.


    **Prefer higher RID** is not the right selection: RID breaks OSPF **adjacency/DR**
    ties, not equal-cost forwarding. Equal costs are used together, not ranked by
    RID.


    **Prefer older LSA** is not the right selection: LSA age is for flooding/refresh
    (3600 s), not for picking one of two equal-cost next hops.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0024-77f412
  type: multiple_choice
  topic_code: '3.3'
  difficulty: 2
  cert_tags: *id013
  stem: '[CCNA 3.3] Select ALL that correctly relate to: OSPF router connecting two
    areas.'
  choices:
  - id: a
    text: ABR
  - id: b
    text: ASBR
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: DR
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 3.3 (IPv4 and IPv6 static
    routing).


    **ASBR** is not the right selection: An ASBR redistributes **external** routes
    (another protocol or static) into OSPF and originates Type-5 (or Type-7 in NSSA)
    LSAs. Connecting two OSPF areas is the ABR job.


    **DR** is not the right selection: The Designated Router is elected on a multiaccess
    **link**. It is not the router that joins two areas.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
