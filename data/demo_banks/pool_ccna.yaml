- id: ccna-v05-61-0115-043e85
  type: multiple_choice
  topic_code: '6.1'
  difficulty: 3
  cert_tags: &id023
  - ccna
  stem: '[CCNA 6.1] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
    text: Verify expected state for 6.1 with show/ping evidence
  - id: b
    text: Skip change control because 6.1 is low risk
  - id: c
    text: Document the 6.1 design intent and rollback plan
  - id: d
    text: Disable all monitoring related to 6.1
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '6.1 (Automation impact on network management) is implemented by verifying
    with show/ping evidence and keeping a rollback plan. Use show/ping evidence to
    confirm the objective actually converged — not just that the command was typed.
    Document design intent and the rollback commands. The next engineer (or you at
    03:00) needs that, not tribal memory.


    **Verify expected state for 6.1 with show/ping evidence**: Use show/ping evidence
    to confirm the objective actually converged — not just that the command was typed.


    **Document the 6.1 design intent and rollback plan**: Document design intent and
    the rollback commands. The next engineer (or you at 03:00) needs that, not tribal
    memory.


    **Skip change control because 6.1 is low risk**: Skipping change control because
    a topic ‘looks low risk’ is how untracked outages happen. This objective still
    goes through the window.


    **Disable all monitoring related to 6.1**: Disabling monitoring removes the only
    proof the objective still works after you leave. Leave SNMP/telemetry/syslog up.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-v05-61-0116-512f3e
  type: single_choice
  topic_code: '6.1'
  difficulty: 2
  cert_tags: *id023
  stem: During troubleshooting related to 6.1, which observation is most relevant?
  choices:
  - id: a
    text: Apply the verified behavior required by objective 6.1
  - id: b
    text: Disable logging permanently while testing 6.1
  - id: c
    text: Use clear-text shared secrets as the only control for 6.1
  - id: d
    text: Skip documentation for 6.1 changes in production
  correct:
    answer: a
  explanation: '6.1 (Automation impact on network management) is implemented by verifying
    with show/ping evidence and keeping a rollback plan. Apply the verified behavior
    the exam topic actually names, then confirm it with show/ping — not a neighboring
    feature.


    **Apply the verified behavior required by objective 6.1**: Apply the verified
    behavior the exam topic actually names, then confirm it with show/ping — not a
    neighboring feature.


    **Disable logging permanently while testing 6.1**: Disabling logging permanently
    hides faults and is a finding on any security review. Keep syslog/buffered logging
    enabled.


    **Use clear-text shared secrets as the only control for 6.1**: Clear-text shared
    secrets (type 7, Telnet, open SNMP) are not an acceptable sole control. Use SSH,
    type 8/9 secrets, and SNMPv3.


    **Skip documentation for 6.1 changes in production**: Skipping documentation leaves
    no rollback and no audit trail. Production changes for this objective still need
    a written record.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
