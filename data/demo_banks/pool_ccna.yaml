    touching the box so you do not troubleshoot a pre-existing fault as if you caused
    it. Archive show output with the change record. Without it you cannot prove what
    the device looked like.


    **Verify before changes**: Verify current state before touching the box so you
    do not troubleshoot a pre-existing fault as if you caused it.


    **Capture show output**: Archive show output with the change record. Without it
    you cannot prove what the device looked like.


    **Skip all logs**: Skipping logs blinds you to the failure you are about to cause.
    Leave logging on and raise the buffer/trap level during the window.


    **Disable AAA forever**: Disabling AAA forever drops the box back to local/none
    auth and is not an implementation of the objective.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
