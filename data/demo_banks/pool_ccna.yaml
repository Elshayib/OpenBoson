- id: ccna-nsc-extra-00
  type: multiple_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: &id005
  - ccna
  stem: Extra multi-select 0 for volume gate on 1.1?
  choices:
  - id: a
    text: Verify before changes
  - id: b
    text: Skip all logs
  - id: c
    text: Capture show output
  - id: d
    text: Disable AAA forever
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For 1.1 (Role and function of network components), the keyed answer
    is **Verify before changes; Capture show output**. Stem: Extra multi-select 0
    for volume gate on 1.1?.


    **Verify before changes** is correct: Verify current state before touching the
    box so you do not troubleshoot a pre-existing fault as if you caused it. This
    matters for 1.1 (Role and function of network components).


    **Capture show output** is correct: Archive show output with the change record.
    Without it you cannot prove what the device looked like. This matters for 1.1
    (Role and function of network components).


    **Skip all logs** is not the right selection: Skipping logs blinds you to the
    failure you are about to cause. Leave logging on and raise the buffer/trap level
    during the window. This matters for 1.1 (Role and function of network components).


    **Disable AAA forever** is not the right selection: Disabling AAA forever drops
    the box back to local/none auth and is not an implementation of the objective.
    This matters for 1.1 (Role and function of network components).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
