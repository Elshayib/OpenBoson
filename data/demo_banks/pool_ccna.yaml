- id: ccna-v05-35-0052-b3e2cb
  type: single_choice
  topic_code: '3.5'
  difficulty: 3
  cert_tags:
  - ccna
  stem: Select the correct association for exam topic 3.5.
  choices:
  - id: a
    text: Apply the verified behavior required by objective 3.5
  - id: b
    text: Skip documentation for 3.5 changes in production
  - id: c
    text: Treat 3.5 as optional when the blueprint lists it
  - id: d
    text: Ignore verification and assume 3.5 always works
  correct:
    answer: a
  explanation: 'For 3.5 (First hop redundancy protocol), the keyed answer is **Apply
    the verified behavior required by objective 3.5**. Stem: Select the correct association
    for exam topic 3.5..


    **Apply the verified behavior required by objective 3.5** is correct: Apply the
    verified behavior the exam topic actually names, then confirm it with show/ping
    — not a neighboring feature. This matters for 3.5 (First hop redundancy protocol).


    **Skip documentation for 3.5 changes in production** is not the right selection:
    Skipping documentation leaves no rollback and no audit trail. Production changes
    for this objective still need a written record. This matters for 3.5 (First hop
    redundancy protocol).


    **Treat 3.5 as optional when the blueprint lists it** is not the right selection:
    Blueprint-listed objectives are not optional in production just because a lab
    skipped them. Implement and verify this topic. This matters for 3.5 (First hop
    redundancy protocol).


    **Ignore verification and assume 3.5 always works** is not the right selection:
    Assuming it ‘always works’ without verification is how silent misconfigurations
    ship. Show/ping the result. This matters for 3.5 (First hop redundancy protocol).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-017
  type: single_choice
  topic_code: '4.3'
  difficulty: 4
  cert_tags: &id014
  - ccna
  stem: DNS primarily maps which of the following?
  choices:
  - id: a
    text: Names to IP addresses
  - id: b
    text: MAC to VLAN
  - id: c
    text: AS numbers to communities
  - id: d
    text: SPIDs to DLCI
  correct:
    answer: a
  explanation: 'DNS resolves names to addresses (and reverse lookups).


    **MAC to VLAN** is a different protocol, command, or value than **Names to IP
    addresses**. For 4.3 (DHCP and DNS roles), the stem is solved by **Names to IP
    addresses**, not by MAC to VLAN.


    **AS numbers to communities** is a different protocol, command, or value than
    **Names to IP addresses**. For 4.3 (DHCP and DNS roles), the stem is solved by
    **Names to IP addresses**, not by AS numbers to communities.


    **SPIDs to DLCI** is a different protocol, command, or value than **Names to IP
    addresses**. For 4.3 (DHCP and DNS roles), the stem is solved by **Names to IP
    addresses**, not by SPIDs to DLCI.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
