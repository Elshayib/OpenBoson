- id: ccna-v05-51-0078-03211a
  type: single_choice
  topic_code: '5.1'
  difficulty: 4
  cert_tags: &id019
  - ccna
  stem: For CCNA objective 5.1, which statement best matches production best practice?
  choices:
  - id: c
    text: Confuse 5.1 with an unrelated Layer mismatch
  - id: d
    text: Disable logging permanently while testing 5.1
  - id: a
    text: Use the standard model for 5.1 rather than a look-alike concept
  - id: b
    text: Ignore verification and assume 5.1 always works
  correct:
    answer: a
  explanation: 'For 5.1 (Key security concepts), the keyed answer is **Use the standard
    model for 5.1 rather than a look-alike concept**. Stem: For CCNA objective 5.1,
    which statement best matches production best practice?.


    **Use the standard model for 5.1 rather than a look-alike concept** is correct:
    Stay with the standard model for this objective instead of a look-alike protocol
    that shares a buzzword but not the behavior. This matters for 5.1 (Key security
    concepts).


    **Confuse 5.1 with an unrelated Layer mismatch** is not the right selection: Confusing
    this objective with an unrelated OSI layer is how you apply the wrong feature
    (for example STP for a routing problem). This matters for 5.1 (Key security concepts).


    **Disable logging permanently while testing 5.1** is not the right selection:
    Disabling logging permanently hides faults and is a finding on any security review.
    Keep syslog/buffered logging enabled. This matters for 5.1 (Key security concepts).


    **Ignore verification and assume 5.1 always works** is not the right selection:
    Assuming it ‘always works’ without verification is how silent misconfigurations
    ship. Show/ping the result. This matters for 5.1 (Key security concepts).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.1
  provider: openboson
  license: MIT
  provenance: original
