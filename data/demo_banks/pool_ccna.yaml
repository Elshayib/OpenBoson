- id: ccna-1-013
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id001
  stem: Which wireless standard introduced OFDMA in Wi-Fi 6?
  choices:
  - id: a
    text: 802.11ax
  - id: b
    text: 802.11ac
  - id: c
    text: 802.11n
  - id: d
    text: 802.11g
  correct:
    answer: a
  explanation: '802.11ax (Wi-Fi 6) added OFDMA and other efficiency features.


    **802.11ac** is a mismatch: 802.11ac (Wi-Fi 5) is 5 GHz OFDM/MU-MIMO; it did not
    introduce OFDMA. The stem is asking about **802.11ax**.


    **802.11n** is a mismatch: 802.11n (Wi-Fi 4) added MIMO/HT; not OFDMA. The stem
    is asking about **802.11ax**.


    **802.11g** is a mismatch: 802.11g is 2.4 GHz OFDM up to 54 Mbps, no OFDMA. The
    stem is asking about **802.11ax**.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.11
