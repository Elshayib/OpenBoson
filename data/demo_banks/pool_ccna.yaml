    - a
    - c
    partial_credit: false
  explanation: 'For 4.2 (Configure and verify NTP), the keyed answer is **Verify expected
    state for 4.2 with show/ping evidence; Document the 4.2 design intent and rollback
    plan**. Stem: [CCNA 4.2] Select ALL actions that support a correct implementation
    or verification for this objective..


    **Verify expected state for 4.2 with show/ping evidence** is correct: Use show/ping
    evidence to confirm the objective actually converged — not just that the command
    was typed. This matters for 4.2 (Configure and verify NTP).


    **Document the 4.2 design intent and rollback plan** is correct: Document design
    intent and the rollback commands. The next engineer (or you at 03:00) needs that,
    not tribal memory. This matters for 4.2 (Configure and verify NTP).


    **Skip change control because 4.2 is low risk** is not the right selection: Skipping
    change control because a topic ‘looks low risk’ is how untracked outages happen.
    This objective still goes through the window. This matters for 4.2 (Configure
    and verify NTP).


    **Disable all monitoring related to 4.2** is not the right selection: Disabling
    monitoring removes the only proof the objective still works after you leave. Leave
    SNMP/telemetry/syslog up. This matters for 4.2 (Configure and verify NTP).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
