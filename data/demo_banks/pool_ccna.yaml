- id: ccna-nsc-0000
  type: multiple_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id004
  - ccna
  stem: 'Multiple-select check for 1.1: which items are operationally sound?'
  choices:
  - id: a
    text: Verify before change windows
  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For 1.1 (Role and function of network components), the keyed answer
    is **Verify before change windows; Capture show/verify outputs**. Stem: Multiple-select
    check for 1.1: which items are operationally sound?.


    **Verify before change windows** is correct: Capture a known-good baseline (`show`,
    ping, traceroute) before the window so you can compare after the change. This
    matters for 1.1 (Role and function of network components).


    **Capture show/verify outputs** is correct: Save `show running-config`, `show
    ip route`, `show vlan`, and similar evidence with the ticket — that is how you
    prove the objective. This matters for 1.1 (Role and function of network components).


    **Skip documentation** is not the right selection: Skipping documentation leaves
    no rollback and no audit trail. Production changes for this objective still need
    a written record. This matters for 1.1 (Role and function of network components).


    **Disable logging permanently** is not the right selection: Disabling logging
    permanently hides faults and is a finding on any security review. Keep syslog/buffered
    logging enabled. This matters for 1.1 (Role and function of network components).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
