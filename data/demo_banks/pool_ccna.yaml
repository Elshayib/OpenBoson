- id: ccna-1-006
  type: single_choice
  topic_code: '1.9'
  difficulty: 2
  cert_tags: *id001
  stem: Which IPv6 address type is typically used for one-to-nearest routing within
    a group?
  choices:
  - id: a
    text: Anycast
  - id: b
    text: Multicast
  - id: c
    text: Broadcast
  - id: d
    text: Link-local only
  correct:
    answer: a
  explanation: '**Anycast** assigns the same address to multiple nodes; routers forward
    to the topologically nearest member. IPv6 does not use broadcast. This is the
    correct answer for the stem.


    **Multicast** is incorrect. It describes a different behavior and does not meet
    the requirement stated in the stem.


    **Broadcast** is incorrect. It describes a different behavior and does not meet
    the requirement stated in the stem.


    **Link-local only**: **Link-local** IPv6 addresses (`fe80::/10`) are required
    on every IPv6-enabled interface and are not routed beyond the local link. This
    does not satisfy the condition required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.9
  provider: openboson
  license: MIT
  provenance: original
