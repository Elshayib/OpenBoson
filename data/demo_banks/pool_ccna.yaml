  explanation: 'DHCP assigns addresses, mask, gateway, DNS, and related options.


    **Dynamically assign IP addressing parameters**: DHCP.


    **Encrypt all trunks**: No.


    **Elect OSPF DR**: OSPF.


    **Hash EtherChannels**: L2.'
