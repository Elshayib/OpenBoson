- id: ccna-2-001
  type: multiple_choice
  topic_code: '2.2'
  difficulty: 3
  cert_tags: &id007
  - ccna
  stem: Which two statements about 802.1Q trunks are correct? (Choose two.)
  choices:
  - id: a
    text: A trunk can carry multiple VLANs with tags
  - id: b
    text: VLAN 1 can never be native
  - id: c
    text: Native VLAN frames are untagged
  - id: d
    text: ISL is required on modern Catalyst
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '**802.1Q** inserts a 4-byte tag (TPID `0x8100` + PCP/DEI + VLAN ID)
    so one trunk can carry many VLANs. Frames of the **native VLAN** are sent **untagged**
    on that trunk.


    **A trunk can carry multiple VLANs with tags** is the definition of an 802.1Q
    trunk (`switchport mode trunk`).


    **Native VLAN frames are untagged** is required by 802.1Q; mismatched native VLANs
    on two ends cause a VLAN leak.


    **VLAN 1 can never be native** is false. VLAN 1 is the **default** native VLAN
    on Cisco trunks (operators often change it, but it is allowed).


    **ISL is required on modern Catalyst** is false. ISL is a legacy Cisco proprietary
    trunk encapsulation; current Catalyst switching uses 802.1Q.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-002
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id007
  stem: Which Rapid PVST+ port role forwards traffic toward the root?
  choices:
  - id: a
    text: Root port
  - id: b
    text: Designated port on a blocked segment
  - id: c
    text: Alternate port
  - id: d
    text: Disabled
  correct:
    answer: a
  explanation: 'In Rapid PVST+ each non-root switch picks **one Root Port**: the port
    with the best (lowest) cost path toward the root bridge. That port **forwards**
    toward the root.


    **Root port** is that unique per-VLAN uplink to the root.


    **Designated port on a blocked segment** is contradictory: a designated port **forwards
    onto** its segment. A blocked/alternate port is the one that does **not** forward
    user frames.


    **Alternate port** is Rapid STP’s backup to the root port. It stays in **discarding**
    unless the root port fails.


    **Disabled** is administratively down (`shutdown`). It forwards nothing and does
    not participate in the STP election.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-003
  type: single_choice
  topic_code: '2.4'
  difficulty: 2
  cert_tags: *id007
  stem: EtherChannel bundles multiple physical links into what logical interface type
    on Cisco IOS?
  choices:
  - id: a
    text: Port-channel
  - id: b
    text: Loopback
  - id: c
    text: Tunnel
  - id: d
    text: Null0
  correct:
    answer: a
  explanation: 'Port-channel (Po) is the logical EtherChannel interface.


    **Port-channel**: Logical Po interface.


    **Loopback**: Virtual IP interface.


    **Tunnel**: Overlay.


    **Null0**: Bit bucket.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-004
  type: single_choice
  topic_code: '2.6'
  difficulty: 3
  cert_tags: *id007
  stem: In CAPWAP, which tunnel carries client data between AP and WLC in a centralized
    design?
  choices:
  - id: a
    text: CAPWAP data tunnel
  - id: b
    text: Only GRE without CAPWAP
  - id: c
    text: IPsec VTI only
  - id: d
    text: PPPoE
  correct:
    answer: a
  explanation: 'Lightweight APs use CAPWAP control and data tunnels to the WLC.


    **CAPWAP data tunnel**: Encrypted/optional DTLS data path.


    **Only GRE without CAPWAP**: CAPWAP is the Cisco LWAPP successor.


    **IPsec VTI only**: Not the standard AP-WLC control plane.


    **PPPoE**: WAN access method.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-005
  type: drag_match
  topic_code: '2.1'
  difficulty: 2
  cert_tags: *id007
  stem: Match VLAN concepts.
  drag_pairs: &id008
  - left: Access port
    right: Carries a single untagged VLAN for end hosts
  - left: Trunk port
    right: Carries multiple VLANs with 802.1Q tags
  - left: Native VLAN
    right: Untagged on an 802.1Q trunk
  - left: Voice VLAN
    right: Auxiliary VLAN for IP phones
  correct:
    pairs: *id008
