- id: ccna-1-005
  type: single_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: In TCP, which field helps ensure ordered delivery of segments?
  choices:
  - id: a
    text: Sequence number
  - id: b
    text: Window size alone
  - id: c
    text: TTL
  - id: d
    text: TOS/DSCP
  correct:
    answer: a
  explanation: '**Sequence number**: **TCP** provides reliable, ordered, connection-oriented
    delivery using sequence and acknowledgment numbers, among other mechanisms. This
    is the correct answer for the stem.


    **Window size alone** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **TTL** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **TOS/DSCP** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
