  explanation: 'Leaf switches attach to all spines; east-west via spine.


    **Leaves connect only to other leaves** is a different protocol, command, or value
    than **Every leaf connects to every spine**. For 1.2 (Network topology architectures),
    the stem is solved by **Every leaf connects to every spine**, not by Leaves connect
    only to other leaves.


    **Spines connect servers directly** is a different protocol, command, or value
    than **Every leaf connects to every spine**. For 1.2 (Network topology architectures),
    the stem is solved by **Every leaf connects to every spine**, not by Spines connect
    servers directly.


    **It requires Token Ring** is a different protocol, command, or value than **Every
    leaf connects to every spine**. For 1.2 (Network topology architectures), the
    stem is solved by **Every leaf connects to every spine**, not by It requires Token
    Ring.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.2
