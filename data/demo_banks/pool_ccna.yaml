  cert_tags: *id001
  stem: Which two characteristics apply to UDP? (Choose two.)
  choices:
  - id: a
    text: Connectionless
  - id: b
    text: Guaranteed delivery
  - id: c
    text: Lower overhead than TCP
  - id: d
    text: Always encrypts payloads
  correct:
