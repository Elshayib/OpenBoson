    **ff00::/8** is a mismatch: ff00::/8 is the IPv6 multicast range. The stem is
    asking about **fe80::/10**.


    **fc00::/7** is a mismatch: fc00::/7 is the IPv6 unique-local range. The stem
    is asking about **fe80::/10**.'
  references:
