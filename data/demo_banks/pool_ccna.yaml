- id: ccna-gen-0207-a78f70
  type: single_choice
  topic_code: '6.3'
  difficulty: 3
  cert_tags: *id022
  stem: 'Scenario 207 (6.3): Cisco LAN discovery protocol?'
  choices:
  - id: d
    text: SMTP
  - id: a
    text: CDP
  - id: b
    text: FTP
  - id: c
    text: TFTP
  correct:
    answer: a
  explanation: 'Cisco Discovery Protocol is Cisco’s Layer 2 neighbor protocol (`cdp
    run`, `show cdp neighbors`). It advertises device ID, platform, and native VLAN.


    SMTP delivers email. Unrelated to LAN topology discovery.


    FTP (TCP 21) transfers files. It is not a LAN discovery protocol.


    TFTP (UDP 69) transfers images/configs. It does not discover neighbors.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.3
  provider: openboson
  license: MIT
  provenance: original
