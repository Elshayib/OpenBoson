- id: ccna-5-015
  type: single_choice
  topic_code: '5.8'
  difficulty: 2
  cert_tags: *id017
  stem: RADIUS typically uses which ports?
  choices:
  - id: a
    text: UDP 1812/1813 (or legacy 1645/1646)
  - id: b
    text: TCP 22
  - id: c
    text: UDP 53
  - id: d
    text: TCP 443 only
  correct:
    answer: a
