- id: ccna-5-001
  type: single_choice
  topic_code: '5.1'
  difficulty: 2
  cert_tags: *id017
  stem: A vulnerability is best defined as?
  choices:
  - id: a
    text: A weakness that can be exploited
  - id: b
    text: The attack itself
  - id: c
    text: Only a firewall rule
  - id: d
    text: Only an ACL line
  correct:
    answer: a
  explanation: 'Threats exploit vulnerabilities; mitigations reduce risk.


    **A weakness that can be exploited** is correct: Vulnerability.


    **The attack itself** is not the right selection: Exploit/threat action.


