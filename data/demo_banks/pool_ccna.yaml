- id: ccna-v05-35-0052-b3e2cb
  type: single_choice
  topic_code: '3.5'
  difficulty: 3
  cert_tags:
  - ccna
  stem: Select the correct association for exam topic 3.5.
  choices:
  - id: a
    text: Apply the verified behavior required by objective 3.5
  - id: b
    text: Skip documentation for 3.5 changes in production
  - id: c
    text: Treat 3.5 as optional when the blueprint lists it
  - id: d
    text: Ignore verification and assume 3.5 always works
  correct:
    answer: a
  explanation: '3.5 (First hop redundancy protocol) is implemented by verifying with
    show/ping evidence and keeping a rollback plan. Apply the verified behavior the
    exam topic actually names, then confirm it with show/ping — not a neighboring
    feature.


    **Apply the verified behavior required by objective 3.5**: Apply the verified
    behavior the exam topic actually names, then confirm it with show/ping — not a
    neighboring feature.


    **Skip documentation for 3.5 changes in production**: Skipping documentation leaves
    no rollback and no audit trail. Production changes for this objective still need
    a written record.


    **Treat 3.5 as optional when the blueprint lists it**: Blueprint-listed objectives
    are not optional in production just because a lab skipped them. Implement and
    verify this topic.


    **Ignore verification and assume 3.5 always works**: Assuming it ‘always works’
    without verification is how silent misconfigurations ship. Show/ping the result.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-017
  type: single_choice
  topic_code: '4.3'
  difficulty: 4
  cert_tags: &id014
  - ccna
  stem: DNS primarily maps which of the following?
  choices:
  - id: a
    text: Names to IP addresses
  - id: b
    text: MAC to VLAN
  - id: c
    text: AS numbers to communities
  - id: d
    text: SPIDs to DLCI
  correct:
    answer: a
  explanation: 'DNS resolves names to addresses (and reverse lookups).


    **Names to IP addresses**: DNS resolves names to addresses (and reverse lookups).


    **MAC to VLAN**: A VLAN is an 802.1Q broadcast domain (IDs 1–4094).


    **AS numbers to communities**: Names to IP addresses is the matching value or
    command; AS numbers to communities is not.


    **SPIDs to DLCI**: Names to IP addresses is the matching value or command; SPIDs
    to DLCI is not.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-001
  type: single_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: *id014
  stem: Inside source NAT typically translates which addresses?
  choices:
  - id: a
    text: Internal private sources to public/global
  - id: b
    text: Only destination ports
  - id: c
    text: Only MAC addresses
  - id: d
    text: Only VLAN tags
  correct:
    answer: a
  explanation: '**Inside source NAT** (`ip nat inside source`) rewrites the **source**
    of packets that arrive on an inside interface and leave toward the outside — typically
    RFC 1918 hosts becoming a public/inside-global address (static) or a pool/overload
    PAT.


    **Internal private sources to public/global** is that inside-source behavior.


    **Only destination ports** would be destination NAT / port forwarding (`ip nat
    inside destination` or static outside-to-inside). Inside source NAT is about the
    **source** IP (and source port with PAT).


    **Only MAC addresses** are rewritten by switches (CAM) or by proxy ARP, not by
    NAT. NAT is an IP (Layer 3/4) translation.


    **Only VLAN tags** are 802.1Q operations on trunks. NAT does not insert or strip
    VLAN IDs.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-002
  type: single_choice
  topic_code: '4.2'
  difficulty: 2
  cert_tags: *id014
  stem: An NTP client synchronizes its clock to?
  choices:
  - id: a
    text: An NTP server / higher stratum source
  - id: b
    text: Only STP root
  - id: c
    text: Only DHCP option 150 exclusive
  - id: d
    text: Only RADIUS
  correct:
    answer: a
  explanation: 'NTP clients sync to configured servers.


    **An NTP server / higher stratum source**: Client mode.


    **Only STP root**: L2.


    **Only DHCP option 150 exclusive**: TFTP for phones.


    **Only RADIUS**: AAA.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-003
  type: single_choice
  topic_code: '4.3'
  difficulty: 2
  cert_tags: *id014
  stem: DHCP's primary role in a network is to?
  choices:
  - id: a
    text: Dynamically assign IP addressing parameters
  - id: b
    text: Encrypt all trunks
  - id: c
    text: Elect OSPF DR
  - id: d
    text: Hash EtherChannels
