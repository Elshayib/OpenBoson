- id: ccna-v05-110-0001-7fed52
  type: single_choice
  topic_code: '1.10'
  difficulty: 2
  cert_tags: *id006
  stem: Regarding CCNA topic 1.10. Which reply is accurate?
  choices:
  - id: b
    text: Confuse 1.10 with an unrelated Layer mismatch
  - id: c
    text: Disable logging permanently while testing 1.10
  - id: d
    text: Use clear-text shared secrets as the only control for 1.10
  - id: a
    text: Validate with show/verify steps before relying on 1.10 changes
  correct:
    answer: a
  explanation: 'For 1.10 (Verify IP parameters for Client OS), the keyed answer is
    **Validate with show/verify steps before relying on 1.10 changes**. Stem: Regarding
    CCNA topic 1.10. Which reply is accurate?.


    **Validate with show/verify steps before relying on 1.10 changes** is correct:
    Validate with show/verify (and ping where relevant) before you trust the change
    in production. This matters for 1.10 (Verify IP parameters for Client OS).


    **Confuse 1.10 with an unrelated Layer mismatch** is not the right selection:
    Confusing this objective with an unrelated OSI layer is how you apply the wrong
    feature (for example STP for a routing problem). This matters for 1.10 (Verify
    IP parameters for Client OS).


    **Disable logging permanently while testing 1.10** is not the right selection:
    Disabling logging permanently hides faults and is a finding on any security review.
    Keep syslog/buffered logging enabled. This matters for 1.10 (Verify IP parameters
    for Client OS).


    **Use clear-text shared secrets as the only control for 1.10** is not the right
    selection: Clear-text shared secrets (type 7, Telnet, open SNMP) are not an acceptable
    sole control. Use SSH, type 8/9 secrets, and SNMPv3. This matters for 1.10 (Verify
    IP parameters for Client OS).'
  references:
