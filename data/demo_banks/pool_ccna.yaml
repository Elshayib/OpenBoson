- id: ccna-v05-41-0053-43e63e
  type: single_choice
  topic_code: '4.1'
  difficulty: 4
  cert_tags: &id016
  - ccna
  stem: Which option correctly describes a key idea under 4.1?
  choices:
  - id: b
    text: Treat 4.1 as optional when the blueprint lists it
  - id: c
    text: Ignore verification and assume 4.1 always works
  - id: d
    text: Confuse 4.1 with an unrelated Layer mismatch
  - id: a
    text: Validate with show/verify steps before relying on 4.1 changes
  correct:
    answer: a
  explanation: '4.1 (Configure and verify NAT) is implemented by verifying with show/ping
    evidence and keeping a rollback plan. Validate with show/verify (and ping where
    relevant) before you trust the change in production.


    **Validate with show/verify steps before relying on 4.1 changes**: Validate with
    show/verify (and ping where relevant) before you trust the change in production.


    **Treat 4.1 as optional when the blueprint lists it**: Blueprint-listed objectives
    are not optional in production just because a lab skipped them. Implement and
    verify this topic.


    **Ignore verification and assume 4.1 always works**: Assuming it ‘always works’
    without verification is how silent misconfigurations ship. Show/ping the result.


    **Confuse 4.1 with an unrelated Layer mismatch**: Confusing this objective with
    an unrelated OSI layer is how you apply the wrong feature (for example STP for
    a routing problem).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-v05-41-0054-3c83f0
  type: single_choice
  topic_code: '4.1'
  difficulty: 5
  cert_tags: *id016
  stem: For CCNA objective 4.1, which statement best matches production best practice?
  choices:
  - id: c
    text: Confuse 4.1 with an unrelated Layer mismatch
  - id: d
    text: Disable logging permanently while testing 4.1
  - id: a
    text: Use the standard model for 4.1 rather than a look-alike concept
  - id: b
    text: Ignore verification and assume 4.1 always works
  correct:
    answer: a
  explanation: '4.1 (Configure and verify NAT) is implemented by verifying with show/ping
    evidence and keeping a rollback plan. Stay with the standard model for this objective
    instead of a look-alike protocol that shares a buzzword but not the behavior.


    **Use the standard model for 4.1 rather than a look-alike concept**: Stay with
    the standard model for this objective instead of a look-alike protocol that shares
    a buzzword but not the behavior.


    **Confuse 4.1 with an unrelated Layer mismatch**: Confusing this objective with
    an unrelated OSI layer is how you apply the wrong feature (for example STP for
    a routing problem).


    **Disable logging permanently while testing 4.1**: Disabling logging permanently
    hides faults and is a finding on any security review. Keep syslog/buffered logging
    enabled.


    **Ignore verification and assume 4.1 always works**: Assuming it ‘always works’
    without verification is how silent misconfigurations ship. Show/ping the result.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-v05-42-0055-02c4e6
  type: multiple_choice
  topic_code: '4.2'
  difficulty: 3
  cert_tags: *id016
  stem: '[CCNA 4.2] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
    text: Verify expected state for 4.2 with show/ping evidence
  - id: b
    text: Skip change control because 4.2 is low risk
  - id: c
    text: Document the 4.2 design intent and rollback plan
  - id: d
    text: Disable all monitoring related to 4.2
  correct:
