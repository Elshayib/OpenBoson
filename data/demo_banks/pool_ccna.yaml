  license: MIT
  provenance: original
- id: ccna-5-007
  type: single_choice
  topic_code: '5.8'
  difficulty: 3
  cert_tags: *id017
  stem: AAA stands for?
  choices:
  - id: a
    text: Authentication, Authorization, Accounting
  - id: b
    text: Anycast, ACL, ARP
  - id: c
    text: AS, Area, ABR
  - id: d
    text: AES, AH, ESP only
  correct:
    answer: a
  explanation: '**AAA** is Authentication (who you are), Authorization (what you may
    do), and Accounting (what you did). On IOS: `aaa new-model` with RADIUS or TACACS+
    groups for login, exec, and command authorization.


    **Authentication, Authorization, Accounting** is the expansion.


    **Anycast, ACL, ARP** are unrelated networking terms forced into the same letters
    — not AAA.


    **AS, Area, ABR** are **BGP/OSPF** terms (autonomous system, OSPF area, area border
    router), not the access-control triad.


    **AES, AH, ESP only** are **IPsec** algorithms/headers (encryption, Authentication
    Header, Encapsulating Security Payload), not AAA.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.8
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-008
  type: single_choice
  topic_code: '5.2'
  difficulty: 4
  cert_tags: *id017
  stem: User awareness training is an example of?
  choices:
  - id: a
    text: Security program element
  - id: b
    text: Only OSPF tuning
  - id: c
    text: Only EtherChannel
  - id: d
    text: Only SPAN
  correct:
    answer: a
  explanation: 'Awareness/training are security program elements.


    **Security program element**: Awareness/training are security program elements.


    **Only OSPF tuning**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).


    **Only EtherChannel**: EtherChannel bundles physical links into one logical interface;
    members must match speed, duplex, and mode.


    **Only SPAN**: SPAN/RSPAN/ERSPAN copies frames to a sniffer or GRE destination.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-009
  type: single_choice
  topic_code: '5.4'
  difficulty: 2
  cert_tags: *id017
  stem: Multifactor authentication is a password policy alternative that adds?
  choices:
  - id: a
    text: Additional factors beyond a password
  - id: b
    text: Only longer Telnet banners
  - id: c
    text: Only VTY ACL deny any
  - id: d
    text: Only disabling SSH
  correct:
    answer: a
  explanation: 'MFA combines something you know/have/are.


    **Additional factors beyond a password**: MFA combines something you know/have/are.


    **Only longer Telnet banners**: Telnet (TCP 23) is cleartext remote CLI.


    **Only VTY ACL deny any**: VTY ACL deny any is not **Additional factors beyond
    a password**.


    **Only disabling SSH**: SSH (TCP 22) is encrypted remote CLI.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-010
  type: single_choice
  topic_code: '5.6'
  difficulty: 3
  cert_tags: *id017
  stem: Named ACLs on IOS are configured under which mode?
  choices:
  - id: a
    text: ip access-list standard/extended NAME
  - id: b
    text: Only interface vlan exclusively
  - id: c
    text: Only line vty without ACL
  - id: d
    text: Only spanning-tree mode
  correct:
    answer: a
  explanation: 'Named ACLs use ip access-list configuration mode.


    **ip access-list standard/extended NAME**: Named ACLs use ip access-list configuration
    mode.


    **Only interface vlan exclusively**: A VLAN is an 802.1Q broadcast domain (IDs
    1–4094).


    **Only line vty without ACL**: line vty without ACL is not **ip access-list standard/extended
    NAME**.


    **Only spanning-tree mode**: spanning-tree mode is not **ip access-list standard/extended
    NAME**.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-011
  type: single_choice
  topic_code: '5.7'
  difficulty: 4
  cert_tags: *id017
  stem: DHCP snooping builds a binding table of?
  choices:
  - id: a
    text: IP–MAC–port–VLAN mappings
  - id: b
    text: Only OSPF neighbors
  - id: c
    text: Only BGP paths
  - id: d
    text: Only STP roots
  correct:
    answer: a
  explanation: '`ip dhcp snooping` builds a **binding table** of **IP address, MAC,
    switch port, VLAN, and lease time** from DHCP ACKs seen on trusted ports. DAI,
    IP Source Guard, and some 802.1X features consume that table (`show ip dhcp snooping
    binding`).


    **IP–MAC–port–VLAN mappings** is exactly that binding.


    **Only OSPF neighbors** live in `show ip ospf neighbor` (RID, state, dead timer).
    DHCP snooping does not parse Hellos.


    **Only BGP paths** live in the BGP table (`show ip bgp`). Unrelated to DHCP leases.


    **Only STP roots** are the root bridge per VLAN (`show spanning-tree`). Snooping
    does not elect STP roots.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.7
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-012
  type: single_choice
  topic_code: '5.10'
  difficulty: 2
  cert_tags: *id017
  stem: Configuring WLAN WPA2-PSK in a GUI primarily sets?
  choices:
  - id: a
    text: Wireless security for client SSIDs
  - id: b
    text: Only underlay ECMP
  - id: c
    text: Only CoPP
  - id: d
    text: Only NetFlow exporters
  correct:
    answer: a
  explanation: 'GUI WLAN workflows apply WPA2-PSK to SSIDs.


    **Wireless security for client SSIDs**: GUI WLAN workflows apply WPA2-PSK to SSIDs.


    **Only underlay ECMP**: ECMP installs multiple equal-cost next hops (OSPF `maximum-paths`).


    **Only CoPP**: Control Plane Policing rate-limits traffic to the route processor.


    **Only NetFlow exporters**: NetFlow exports traffic caches for accounting and
    anomaly detection.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-013
  type: single_choice
  topic_code: '5.1'
  difficulty: 3
  cert_tags: *id017
  stem: An exploit is?
  choices:
  - id: a
