    for the stem. Configuration uses `lldp run` / `show lldp neighbors`.


    **Cisco-only proprietary CDP replacement mandatory**: **CDP** is Cisco’s Layer
    2 neighbor discovery protocol used for topology visibility and some provisioning
    features. This does not satisfy the condition required by the stem. Configuration
    uses `cdp run` / `show cdp neighbors`.


    **A routing protocol** is incorrect. It does not describe the intended use or
    behavior required by the stem.


