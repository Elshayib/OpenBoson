    - c
    partial_credit: false
  explanation: '**A trunk can carry multiple VLANs with tags**: **802.1Q** trunks
    tag frames so a single physical link can carry multiple VLANs. The native VLAN
    remains untagged by default. This is the correct answer for the stem.


    **Native VLAN frames are untagged**: The **native VLAN** carries untagged frames
    on an 802.1Q trunk. Tagged frames belong to other VLANs carried on the same trunk.
