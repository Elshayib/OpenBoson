  - id: b
    text: All trunks always
  - id: c
    text: Routed ports only
  - id: d
    text: Blocked alternate only
  correct:
    answer: a
  explanation: '**PortFast** (`spanning-tree portfast` or `spanning-tree portfast
    edge`) moves an **edge** access port from blocking/listening/learning straight
    to **forwarding** so a PC/phone gets DHCP immediately. It is for **host** ports,
    not for links that might form a loop.


    **Edge ports to end hosts** is the intended use (often with BPDU Guard).


    **All trunks always** is dangerous: a trunk to another switch can loop. Cisco
    even warns against PortFast on non-edge trunks.


    **Routed ports only** (`no switchport`) have no STP state machine to skip; PortFast
    is a **switching** edge feature.


    **Blocked alternate only** are the ports STP is already holding down. PortFast
    would not apply there — those are redundant switch-to-switch paths, not host edges.'
