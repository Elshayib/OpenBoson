- id: ccna-2-015
  type: single_choice
  topic_code: '5.7'
  difficulty: 2
  cert_tags: &id017
  - ccna
  stem: Which feature prevents a switchport from learning more than N MACs?
  choices:
  - id: a
    text: Port security
  - id: b
    text: UplinkFast
  - id: c
    text: VTP pruning
  - id: d
    text: CDP
  correct:
    answer: a
  explanation: '**Port security**: A Layer 2 **switch** forwards Ethernet frames based
    on MAC address tables within a broadcast domain or VLAN. This is the correct answer
    for the stem.


    **UplinkFast** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **VTP pruning** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **CDP** is Cisco’s Layer 2 neighbor discovery protocol used for topology visibility
    and some provisioning features. This does not satisfy the condition required by
    the stem. Configuration uses `cdp run` / `show cdp neighbors`.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.7
  provider: openboson
  license: MIT
  provenance: original
