questions:
- id: ccna-1-001
  type: single_choice
  topic_code: '1.6'
  difficulty: 2
  cert_tags: &id001
  - ccna
  stem: How many usable host addresses does 192.168.10.0/26 provide?
  choices:
  - id: a
    text: '62'
  - id: b
    text: '64'
  - id: c
    text: '30'
  - id: d
    text: '126'
  correct:
    answer: a
  explanation: 'A **/26** prefix provides 64 addresses; subtracting network and broadcast
    leaves **62** usable host addresses. This is the correct answer for the stem.


    **64** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **30** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **126** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-002
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: Which device operates primarily at OSI Layer 2 and forwards based on MAC addresses?
  choices:
  - id: a
    text: Router
  - id: b
    text: Switch
  - id: c
    text: Firewall
  - id: d
    text: Wireless controller
  correct:
    answer: b
  explanation: 'A Layer 2 **switch** forwards Ethernet frames based on MAC address
    tables within a broadcast domain or VLAN. This is the correct answer for the stem.


    A **router** forwards IP packets between networks using the routing table and
    operates primarily at Layer 3. This does not satisfy the condition required by
    the stem.


    **Firewall** is incorrect. It describes a different behavior and does not meet
    the requirement stated in the stem.


    **Wireless controller** is incorrect. It describes a different behavior and does
    not meet the requirement stated in the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-003
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: What is the binary equivalent of dotted decimal 10.1.1.0 with a /30 mask's
    host portion size?
  choices:
  - id: a
    text: 2 usable hosts
  - id: b
    text: 6 usable hosts
  - id: c
    text: 14 usable hosts
  - id: d
    text: 30 usable hosts
  correct:
    answer: a
  explanation: '**2 usable hosts**: A **/30** prefix provides four addresses and **two**
    usable hosts, commonly used on point-to-point links. This is the correct answer
    for the stem.


    **6 usable hosts** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **14 usable hosts** is incorrect. It does not describe the intended use or behavior
    required by the stem.


    **30 usable hosts** is incorrect. It does not describe the intended use or behavior
    required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
