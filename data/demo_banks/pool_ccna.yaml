- id: ccna-gen-0140-8657eb
  type: single_choice
  topic_code: '4.8'
  difficulty: 1
  cert_tags: *id015
  stem: 'Scenario 140 (4.8): DNS record for IPv6?'
  choices:
  - id: a
    text: AAAA
  - id: b
    text: A
  - id: c
    text: MX
  - id: d
    text: PTR only
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    An **A** record maps a name to an **IPv4** address, not IPv6.


    MX records name mail exchangers. They do not carry IPv6 host addresses.


    **PTR only** is not the right selection: PTR is reverse DNS (IP → name) under
    `ip6.arpa` or `in-addr.arpa`. The forward IPv6 record is AAAA.'
  references:
