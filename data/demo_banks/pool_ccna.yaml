- id: ccna-gen-0036-2b7b18
  type: multiple_choice
  topic_code: '5.1'
  difficulty: 2
  cert_tags: &id018
  - ccna
  stem: '[CCNA 5.1] Select ALL that correctly relate to: Typical CAPWAP termination.'
  choices:
  - id: a
    text: WLC
  - id: b
    text: DNS
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: NTP
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'In split-MAC/local mode the AP’s CAPWAP control and data tunnels terminate
    on the **Wireless LAN Controller**.


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 5.1 (Key security concepts).


    DNS resolves names; it does not terminate CAPWAP tunnels.


    NTP sets the clock. APs may query NTP, but CAPWAP still ends on the WLC.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.1
  provider: openboson
