questions:
- id: ccna-1-001
  type: single_choice
  topic_code: '1.6'
  difficulty: 2
  cert_tags: &id001
  - ccna
  stem: How many usable host addresses does 192.168.10.0/26 provide?
  choices:
  - id: a
    text: '62'
    rationale: /26 = 64 addresses − 2 = 62 usable.
  - id: b
    text: '64'
    rationale: 64 is the total size including network/broadcast.
  - id: c
    text: '30'
    rationale: That is /27.
  - id: d
    text: '126'
    rationale: That is /25.
  correct:
    answer: a
  explanation: A /26 prefix has 2^(32−26)=64 addresses; subtract network and broadcast.
  references:
  - CCNA 1.6 — IPv4 addressing and subnetting
- id: ccna-1-002
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: Which device operates primarily at OSI Layer 2 and forwards based on MAC addresses?
  choices:
  - id: a
    text: Router
    rationale: Routers make Layer 3 forwarding decisions.
  - id: b
    text: Switch
    rationale: LAN switches forward frames using MAC tables.
  - id: c
    text: Firewall
    rationale: Firewalls typically inspect Layer 3/4+.
  - id: d
    text: Wireless controller
    rationale: Manages APs; not the classic L2 forwarder.
  correct:
    answer: b
  explanation: Ethernet switches learn MAC addresses and forward frames within a VLAN/broadcast
    domain.
  references:
  - CCNA 1.1 — network components
- id: ccna-1-003
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: What is the binary equivalent of dotted decimal 10.1.1.0 with a /30 mask's
    host portion size?
  choices:
  - id: a
    text: 2 usable hosts
    rationale: /30 leaves 2 host bits → 4 addresses − 2 = 2 hosts.
  - id: b
    text: 6 usable hosts
    rationale: That is /29.
  - id: c
    text: 14 usable hosts
    rationale: That is /28.
  - id: d
    text: 30 usable hosts
    rationale: That is /27.
  correct:
    answer: a
  explanation: /30 point-to-point links commonly use 2 usable hosts.
  references:
  - CCNA 1.6 — IPv4 subnetting
- id: ccna-1-004
  type: single_choice
  topic_code: '1.3'
  difficulty: 2
  cert_tags: *id001
  stem: Which cable type is typically used between a switch access port and a PC NIC?
  choices:
  - id: a
    text: Straight-through UTP
    rationale: Like devices historically needed crossover; PC↔switch uses straight-through.
  - id: b
    text: Crossover UTP
    rationale: Used between like devices (switch↔switch) without Auto-MDIX.
  - id: c
    text: Rollover console
    rationale: Used for console access to a router/switch.
  - id: d
    text: Coaxial RG-59
    rationale: Not used for modern Ethernet access.
  correct:
    answer: a
  explanation: Modern Auto-MDIX often corrects cabling, but the classic answer is
    straight-through.
  references:
  - CCNA 1.3 — cabling
- id: ccna-1-005
  type: single_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: In TCP, which field helps ensure ordered delivery of segments?
  choices:
  - id: a
    text: Sequence number
    rationale: Sequence numbers order byte streams.
  - id: b
    text: Window size alone
    rationale: Controls flow, not ordering by itself.
  - id: c
    text: TTL
    rationale: IP hop limit, not TCP ordering.
  - id: d
    text: TOS/DSCP
    rationale: Marks QoS, not segment order.
  correct:
    answer: a
  explanation: TCP sequence and acknowledgment numbers provide reliable ordered delivery.
  references:
  - CCNA 1.5 — TCP vs UDP
- id: ccna-1-006
  type: single_choice
  topic_code: '1.9'
  difficulty: 2
  cert_tags: *id001
  stem: Which IPv6 address type is typically used for one-to-nearest routing within
    a group?
  choices:
  - id: a
    text: Anycast
    rationale: Anycast is one-to-nearest of a group.
  - id: b
    text: Multicast
    rationale: One-to-many.
  - id: c
    text: Broadcast
    rationale: IPv6 has no broadcast.
  - id: d
    text: Link-local only
    rationale: Link-local is a scope, not anycast semantics.
  correct:
    answer: a
  explanation: IPv6 anycast shares an address among nodes; routers deliver to the
    nearest.
  references:
  - CCNA 1.9 — IPv6 address types
- id: ccna-1-007
  type: single_choice
  topic_code: '1.13'
  difficulty: 3
  cert_tags: *id001
  stem: What does ARP resolve?
  choices:
  - id: a
    text: IPv4 address to MAC address
    rationale: ARP maps L3→L2 on Ethernet.
  - id: b
    text: MAC to IPv6
    rationale: That is not ARP (NDP does neighbor discovery).
  - id: c
    text: URL to IP
    rationale: DNS.
  - id: d
    text: Port to process
    rationale: Sockets/OS, not ARP.
  correct:
    answer: a
  explanation: ARP requests broadcast who-has; replies provide the MAC for an IPv4
    address.
  references:
  - CCNA 1.13 — switching concepts / ARP
- id: ccna-1-008
  type: multiple_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: Which two characteristics apply to UDP? (Choose two.)
  choices:
  - id: a
    text: Connectionless
    rationale: No handshake.
  - id: b
    text: Guaranteed delivery
    rationale: TCP provides reliability, not UDP.
  - id: c
    text: Lower overhead than TCP
    rationale: No sequencing/acks by default.
  - id: d
    text: Always encrypts payloads
    rationale: Encryption is application/TLS, not UDP itself.
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: UDP is connectionless and lightweight; reliability is left to the application.
  references:
  - CCNA 1.5 — TCP vs UDP
- id: ccna-1-009
  type: drag_match
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: Match each OSI layer with a primary PDU name.
  drag_pairs: &id002
  - left: Layer 2
    right: Frame
  - left: Layer 3
    right: Packet
  - left: Layer 4
    right: Segment (TCP) / Datagram (UDP)
  - left: Layer 1
    right: Bits
  correct:
    pairs: *id002
  explanation: 'Common teaching shorthand: bits, frames, packets, segments.'
  references:
  - CCNA 1.1 — network components / OSI
- id: ccna-1-010
  type: ordered_list
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: Order the steps to design a VLSM plan for a site.
  ordered_items:
  - Assign largest subnets first
  - List required host counts
  - Document remaining address space
  - Sort requirements descending
  correct:
    order:
    - List required host counts
    - Sort requirements descending
    - Assign largest subnets first
    - Document remaining address space
  explanation: VLSM works best allocating big blocks first to avoid fragmentation
    of free space.
  references:
  - CCNA 1.6 — subnetting / VLSM
