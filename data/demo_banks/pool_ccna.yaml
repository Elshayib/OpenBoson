  type: single_choice
  topic_code: '5.6'
  difficulty: 3
  cert_tags: *id017
  stem: Named ACLs on IOS are configured under which mode?
  choices:
  - id: a
    text: ip access-list standard/extended NAME
  - id: b
    text: Only interface vlan exclusively
  - id: c
    text: Only line vty without ACL
  - id: d
    text: Only spanning-tree mode
  correct:
    answer: a
  explanation: 'Named ACLs use ip access-list configuration mode.


    **Only interface vlan exclusively** names interface vlan, which is a different
    feature: `interface vlan` enters that interface (or SVI) context. It does not
    perform the action named in the stem. The stem wants **ip access-list standard/extended
    NAME**.


    **Only line vty without ACL** points at line vty without ACL, which is not how
    5.6 (Access control lists) solves this stem. The keyed answer is **ip access-list
    standard/extended NAME**.


    **Only spanning-tree mode** points at spanning-tree mode, which is not how 5.6
    (Access control lists) solves this stem. The keyed answer is **ip access-list
    standard/extended NAME**.'
