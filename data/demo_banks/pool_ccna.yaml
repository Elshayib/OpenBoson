- id: ccna-1-011
  type: single_choice
  topic_code: '1.2'
  difficulty: 4
  cert_tags: *id001
  stem: Which cloud deployment model keeps infrastructure exclusively for one organization?
  choices:
  - id: a
    text: Private cloud
  - id: b
    text: Public cloud
  - id: c
    text: Community only
  - id: d
    text: Hybrid CDN
  correct:
    answer: a
  explanation: 'Private cloud is single-tenant for one organization.


    **Public cloud** is a mismatch: Public cloud is multi-tenant infrastructure offered
    by a provider (AWS/Azure/GCP). The stem is asking about **Private cloud**.


    **Community only** points at Community, which is not how 1.2 (Network topology
    architectures) solves this stem. The keyed answer is **Private cloud**.


    **Hybrid CDN** is a different protocol, command, or value than **Private cloud**.
    For 1.2 (Network topology architectures), the stem is solved by **Private cloud**,
    not by Hybrid CDN.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.2
