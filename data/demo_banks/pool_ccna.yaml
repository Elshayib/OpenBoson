- id: ccna-1-016
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: What happens when a switch has no MAC entry for a frame's destination?
  choices:
  - id: a
    text: Floods the frame out other ports in the VLAN
    rationale: Unknown unicast flood.
  - id: b
    text: Drops silently always
    rationale: Not for unknown unicasts.
  - id: c
    text: Sends ICMP redirect
    rationale: Router behavior.
  - id: d
    text: ARPs for the MAC
    rationale: Hosts/routers use ARP; switches flood.
  correct:
    answer: a
  explanation: Unknown unicast frames are flooded within the VLAN.
  references:
  - CCNA 1.6
- id: ccna-1-017
  type: single_choice
  topic_code: '1.7'
  difficulty: 4
  cert_tags: *id001
  stem: DNS primarily maps which of the following?
