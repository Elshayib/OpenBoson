  - id: b
    text: '90'
  - id: c
    text: '120'
  - id: d
    text: '1'
  correct:
    answer: a
  explanation: 'Default AD: connected 0, static 1, eBGP 20, EIGRP 90, OSPF 110, RIP
    120, iBGP 200.


    **110**: OSPF AD.


    **90**: EIGRP internal.


    **120**: RIP.


