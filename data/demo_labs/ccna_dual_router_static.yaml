title: Dual-Router Static Route
lab_id: ccna_dual_router_static
topic_code: "3.1"
difficulty: 3
description: Add a specific static route between two routers and verify reachability.
objectives:
  - static route to remote LAN
  - ping via next-hop
topology:
  devices:
    - name: R1
      type: router
      interfaces:
        - name: GigabitEthernet0/0
          ip: 10.0.0.1/24
        - name: GigabitEthernet0/1
          ip: 172.16.0.1/30
      base_config: |
        interface GigabitEthernet0/0
         ip address 10.0.0.1 255.255.255.0
         no shutdown
        interface GigabitEthernet0/1
         ip address 172.16.0.1 255.255.255.252
         no shutdown
    - name: R2
      type: router
      interfaces:
        - name: GigabitEthernet0/0
          ip: 172.16.0.2/30
        - name: GigabitEthernet0/1
          ip: 192.168.2.1/24
      base_config: |
        interface GigabitEthernet0/0
         ip address 172.16.0.2 255.255.255.252
         no shutdown
        interface GigabitEthernet0/1
         ip address 192.168.2.1 255.255.255.0
         no shutdown
  links:
    - a: R1/GigabitEthernet0/1
      b: R2/GigabitEthernet0/0
tasks:
  - id: t1
    instructions: |
      On R1, add a static route to **192.168.2.0/24** via **172.16.0.2**.
      Verify R1 can ping **192.168.2.1**.
    grading_rules:
      device: R1
      require:
        - ip route 192.168.2.0 255.255.255.0 172.16.0.2
    verify:
      ping:
        - source: R1
          destination: "192.168.2.1"
          should_succeed: true
solution_config: |
  ip route 192.168.2.0 255.255.255.0 172.16.0.2
schema_version: 1
cert_tags:
  - ccna
pass_threshold: 1.0
