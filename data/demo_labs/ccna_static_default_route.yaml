title: Static Default Route
lab_id: ccna_static_default_route
topic_code: '3.1'
difficulty: 2
description: Add a default static route on R1.
objectives:
- ip route 0.0.0.0 0.0.0.0 next-hop
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.0.0.1/24
    - name: GigabitEthernet0/1
      ip: 172.16.0.1/30
    base_config: "interface GigabitEthernet0/0\n ip address 10.0.0.1 255.255.255.0\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n ip address 172.16.0.1 255.255.255.252\n\
      \ no shutdown\n"
  links: []
tasks:
- id: t1
  instructions: Configure a default route via 172.16.0.2.
  grading_rules:
    device: R1
    require:
    - ip route 0.0.0.0 0.0.0.0 172.16.0.2
solution_config: 'ip route 0.0.0.0 0.0.0.0 172.16.0.2

  '
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
