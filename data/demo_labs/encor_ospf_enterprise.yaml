title: ENCOR OSPF Enterprise Edge
lab_id: encor_ospf_enterprise
topic_code: '3.1'
difficulty: 4
cert_tags:
- ccnp
description: ENCOR-style OSPF single-area reachability between site routers.
objectives:
- OSPF process
- network statements
- ping remote LAN
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.0.0.1/30
    - name: GigabitEthernet0/1
      ip: 10.1.1.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.0.0.1 255.255.255.252\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n ip address 10.1.1.1 255.255.255.0\n\
      \ no shutdown\n"
  - name: R2
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.0.0.2/30
    - name: GigabitEthernet0/1
      ip: 10.2.2.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.0.0.2 255.255.255.252\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n ip address 10.2.2.1 255.255.255.0\n\
      \ no shutdown\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.2.2.10/24
    base_config: 'ip address 10.2.2.10 255.255.255.0

      '
  links:
  - a: R1/GigabitEthernet0/0
    b: R2/GigabitEthernet0/0
  - a: R2/GigabitEthernet0/1
    b: PC1/eth0
tasks:
- id: t1
  instructions: Enable OSPF 1 on both routers; advertise transit and LAN networks
    in area 0.
  grading_rules:
    require:
    - router ospf 1
    - network 10.0.0.0 0.0.0.3 area 0
    - network 10.1.1.0 0.0.0.255 area 0
    - network 10.2.2.0 0.0.0.255 area 0
- id: t2
  instructions: Verify R1 can ping R2 LAN **10.2.2.1**.
  grading_rules:
    require:
    - router ospf 1
  verify:
    ping:
    - source: R1
      destination: 10.2.2.1
      should_succeed: true
- id: t3
  instructions: Verify R1 can ping **PC1** at **10.2.2.10**.
  grading_rules:
    require:
    - network 10.2.2.0 0.0.0.255 area 0
  verify:
    ping:
    - source: R1
      destination: 10.2.2.10
      should_succeed: true
solution_config: "! --- R1 ---\nrouter ospf 1\n network 10.0.0.0 0.0.0.3 area 0\n\
  \ network 10.1.1.0 0.0.0.255 area 0\n! --- R2 ---\nrouter ospf 1\n network 10.0.0.0\
  \ 0.0.0.3 area 0\n network 10.2.2.0 0.0.0.255 area 0\n"
schema_version: 1
pass_threshold: 1.0
lab_tier: gold
