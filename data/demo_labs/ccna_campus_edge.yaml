title: Campus Edge Gateway
lab_id: ccna_campus_edge
topic_code: '2.1'
difficulty: 3
description: Combine gateway addressing, VLAN, and trunk for a campus edge.
objectives:
- Gateway IP
- VLAN + trunk
- PC ping gateway
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: On R1 set Gi0/0 to **10.20.20.1/24** and no shut.
  grading_rules:
    device: R1
    require:
    - ip address 10.20.20.1 255.255.255.0
    - no shutdown
- id: t2
  instructions: On SW1 create VLAN 20, trunk Gi0/1, access Gi0/2 in VLAN 20.
  grading_rules:
    device: SW1
    require:
    - vlan 20
    - switchport mode trunk
    - switchport access vlan 20
- id: t3
  instructions: Address PC1 **10.20.20.10/24** and ping the gateway.
  grading_rules:
    require:
    - ip address 10.20.20.10 255.255.255.0
  verify:
    ping:
    - source: PC1
      destination: 10.20.20.1
      should_succeed: true
solution_config: "interface GigabitEthernet0/0\n ip address 10.20.20.1 255.255.255.0\n\
  \ no shutdown\nvlan 20\ninterface GigabitEthernet0/1\n switchport mode trunk\ninterface\
  \ GigabitEthernet0/2\n switchport mode access\n switchport access vlan 20\nip address\
  \ 10.20.20.10 255.255.255.0\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
