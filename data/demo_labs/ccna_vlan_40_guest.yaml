title: VLAN 40 Access (GUEST)
lab_id: ccna_vlan_40_guest
topic_code: '2.1'
difficulty: 2
description: Create VLAN 40 (GUEST) and assign two access ports.
objectives:
- Create VLAN 40
- Assign access ports
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/3
  links: []
tasks:
- id: t1
  instructions: On **SW1**, create **VLAN 40** named **GUEST**.
  grading_rules:
    device: SW1
    require:
    - vlan 40
    - name GUEST
- id: t2
  instructions: Put GigabitEthernet0/1 and GigabitEthernet0/3 into VLAN 40 as access
    ports.
  grading_rules:
    device: SW1
    require:
    - switchport mode access
    - switchport access vlan 40
solution_config: "vlan 40\n name GUEST\ninterface GigabitEthernet0/1\n switchport\
  \ mode access\n switchport access vlan 40\ninterface GigabitEthernet0/3\n switchport\
  \ mode access\n switchport access vlan 40\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
