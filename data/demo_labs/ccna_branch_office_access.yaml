title: Branch Office Access
lab_id: ccna_branch_office_access
topic_code: "2.1"
difficulty: 3
description: >
  Configure a small branch site so two user PCs on a switch can reach each
  other and their default gateway on the router. Objectives only — no command
  walkthroughs.
objectives:
  - Place R1's LAN interface into service with the correct address.
  - Build the user VLAN and trunk the switch uplink toward the router.
  - Address both PCs on the user subnet and prove reachability.
topology:
  devices:
    - name: R1
      type: router
      interfaces:
        - name: GigabitEthernet0/0
          connected_to: SW1/GigabitEthernet0/1
        - name: GigabitEthernet0/1
    - name: SW1
      type: switch
      interfaces:
        - name: GigabitEthernet0/1
          connected_to: R1/GigabitEthernet0/0
        - name: GigabitEthernet0/2
          connected_to: PC1/eth0
        - name: GigabitEthernet0/3
          connected_to: PC2/eth0
    - name: PC1
      type: pc
      interfaces:
        - name: eth0
          connected_to: SW1/GigabitEthernet0/2
    - name: PC2
      type: pc
      interfaces:
        - name: eth0
          connected_to: SW1/GigabitEthernet0/3
  links:
    - a: R1/GigabitEthernet0/0
      b: SW1/GigabitEthernet0/1
    - a: SW1/GigabitEthernet0/2
      b: PC1/eth0
    - a: SW1/GigabitEthernet0/3
      b: PC2/eth0
tasks:
  - id: t1
    instructions: |
      **R1 — LAN gateway**

      R1's GigabitEthernet0/0 must be **10.10.10.1/24** and operational
      so it can serve as the default gateway for the user subnet.
    expected_config: |
      hostname R1
      interface GigabitEthernet0/0
       ip address 10.10.10.1 255.255.255.0
       no shutdown
    grading_rules:
      device: R1
      require:
        - "ip address 10.10.10.1 255.255.255.0"
        - "no shutdown"
  - id: t2
    instructions: |
      **SW1 — user VLAN and uplink**

      Create **VLAN 10** named **USERS**. The link toward R1 must carry
      that traffic as a trunk. Access ports toward the PCs belong in VLAN 10.
    expected_config: |
      vlan 10
       name USERS
      interface GigabitEthernet0/1
       switchport mode trunk
      interface GigabitEthernet0/2
       switchport mode access
       switchport access vlan 10
      interface GigabitEthernet0/3
       switchport mode access
       switchport access vlan 10
    grading_rules:
      device: SW1
      require:
        - "vlan 10"
        - "name USERS"
        - "switchport mode trunk"
        - "switchport access vlan 10"
  - id: t3
    instructions: |
      **PC1 and PC2 — host addressing**

      PC1 must be **10.10.10.10/24**. PC2 must be **10.10.10.20/24**.
      Both hosts share gateway **10.10.10.1**.
    expected_config: |
      ! --- PC1 ---
      ip address 10.10.10.10 255.255.255.0
      ! --- PC2 ---
      ip address 10.10.10.20 255.255.255.0
    grading_rules:
      require:
        - "ip address 10.10.10.10 255.255.255.0"
        - "ip address 10.10.10.20 255.255.255.0"
  - id: t4
    instructions: |
      **Verification — end-to-end**

      From **PC1**, the gateway **10.10.10.1** and **PC2** (**10.10.10.20**)
      must be reachable. Prior task configs must remain correct.
    expected_config: |
      ip address 10.10.10.1 255.255.255.0
      vlan 10
      ip address 10.10.10.10 255.255.255.0
      ip address 10.10.10.20 255.255.255.0
    grading_rules:
      require:
        - "ip address 10.10.10.1 255.255.255.0"
        - "vlan 10"
        - "ip address 10.10.10.10 255.255.255.0"
        - "ip address 10.10.10.20 255.255.255.0"
    verify:
      ping:
        - source: PC1
          destination: "10.10.10.1"
          should_succeed: true
        - source: PC1
          destination: "10.10.10.20"
          should_succeed: true
solution_config: |
  ! --- R1 ---
  hostname R1
  interface GigabitEthernet0/0
   ip address 10.10.10.1 255.255.255.0
   no shutdown
  ! --- SW1 ---
  hostname SW1
  vlan 10
   name USERS
  interface GigabitEthernet0/1
   switchport mode trunk
  interface GigabitEthernet0/2
   switchport mode access
   switchport access vlan 10
  interface GigabitEthernet0/3
   switchport mode access
   switchport access vlan 10
  ! --- PC1 ---
  ip address 10.10.10.10 255.255.255.0
  ! --- PC2 ---
  ip address 10.10.10.20 255.255.255.0
