title: NAT PAT Edge
lab_id: ccna_nat_pat_edge
topic_code: '4.1'
description: PC1 on the inside LAN cannot reach the ISP until R1 overloads PAT out
  the WAN interface.
objectives:
- Mark inside and outside on the NAT border
- ACL 1 plus PAT overload
- PC1 ping of the ISP host
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 192.168.1.1/24
    - name: GigabitEthernet0/1
      ip: 203.0.113.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 192.168.1.1 255.255.255.0\n\
      \ ip nat inside\n no shutdown\ninterface GigabitEthernet0/1\n ip address 203.0.113.1\
      \ 255.255.255.0\n ip nat outside\n no shutdown\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 192.168.1.10/24
    base_config: 'ip address 192.168.1.10 255.255.255.0

      '
  - name: ISP
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 203.0.113.2/24
    base_config: "interface GigabitEthernet0/0\n ip address 203.0.113.2 255.255.255.0\n\
      \ no shutdown\n"
  links:
  - a: R1/GigabitEthernet0/0
    b: PC1/eth0
  - a: R1/GigabitEthernet0/1
    b: ISP/GigabitEthernet0/0
tasks:
- id: t1
  instructions: '**R1 — NAT border**


    PC1 sits on Gi0/0 (192.168.1.0/24). The ISP is on Gi0/1 (203.0.113.0/24). Mark
    **Gi0/0** `ip nat inside` and **Gi0/1** `ip nat outside`. Until PAT exists, PC1
    cannot reach the ISP.'
  grading_rules:
    device: R1
    require:
    - ip nat inside
    - ip nat outside
- id: t2
  instructions: '**R1 — PAT overload**


    Create **ACL 1** that permits any, then `ip nat inside source list 1 interface
    GigabitEthernet0/1 overload`.'
  grading_rules:
    device: R1
    require:
    - access-list 1 permit any
    - ip nat inside source list 1 interface GigabitEthernet0/1 overload
  verify:
    show:
    - device: R1
      contains:
      - ip nat inside source
- id: t3
  instructions: '**PC1 — prove PAT**


    PC1 (192.168.1.10) cannot reach the ISP at **203.0.113.2** until PAT is in place.
    From **PC1**, that ISP address must reply.'
  verify:
    ping:
    - source: PC1
      destination: 203.0.113.2
      should_succeed: true
solution_config: "interface GigabitEthernet0/0\n ip nat inside\ninterface GigabitEthernet0/1\n\
  \ ip nat outside\naccess-list 1 permit any\nip nat inside source list 1 interface\
  \ GigabitEthernet0/1 overload\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
