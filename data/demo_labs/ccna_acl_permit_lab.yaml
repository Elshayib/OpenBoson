title: ACL Permit After Block
lab_id: ccna_acl_permit_lab
topic_code: '5.1'
difficulty: 3
description: Replace a blocking ACL with a permit-any policy and restore ping.
objectives:
- Permit ACL
- Apply access-group
- Ping succeeds
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.10.10.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.10.10.1 255.255.255.0\n\
      \ no shutdown\n"
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
    base_config: "vlan 10\ninterface GigabitEthernet0/1\n switchport mode trunk\n\
      interface GigabitEthernet0/2\n switchport mode access\n switchport access vlan\
      \ 10\ninterface GigabitEthernet0/3\n switchport mode access\n switchport access\
      \ vlan 10\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.20/24
    base_config: 'ip address 10.10.10.20 255.255.255.0

      '
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
  - a: SW1/GigabitEthernet0/3
    b: PC2/eth0
tasks:
- id: t1
  instructions: On **R1**, create ACL **100** that permits IP any any.
  grading_rules:
    device: R1
    require:
    - access-list 100 permit ip any any
- id: t2
  instructions: Apply ACL 100 inbound on **Gi0/0**.
  grading_rules:
    device: R1
    require:
    - ip access-group 100 in
  verify:
    show:
    - device: R1
      contains:
      - access-list 100 permit ip any any
- id: t3
  instructions: Verify **PC1** can ping **PC2** at **10.10.10.20**.
  grading_rules:
    require:
    - access-list 100 permit ip any any
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.20
      should_succeed: true
solution_config: "access-list 100 permit ip any any\ninterface GigabitEthernet0/0\n\
  \ ip access-group 100 in\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
