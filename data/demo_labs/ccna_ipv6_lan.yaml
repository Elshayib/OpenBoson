title: IPv6 LAN Addressing
lab_id: ccna_ipv6_lan
topic_code: '1.9'
description: Enable IPv6 unicast-routing and address a LAN interface.
objectives:
- ipv6 unicast-routing
- ipv6 address
- verify.show
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: Enable **ipv6 unicast-routing** on R1.
  grading_rules:
    device: R1
    require:
    - ipv6 unicast-routing
- id: t2
  instructions: Set Gi0/0 to **2001:db8:1::1/64** and no shutdown.
  grading_rules:
    device: R1
    require:
    - ipv6 address 2001:db8:1::1/64
    - no shutdown
  verify:
    show:
    - device: R1
      contains:
      - ipv6 address 2001:db8:1::1/64
- id: t3
  instructions: Set hostname **V6-R1**.
  grading_rules:
    device: R1
    require:
    - hostname V6-R1
  verify:
    show:
    - device: R1
      contains:
      - hostname V6-R1
solution_config: "hostname V6-R1\nipv6 unicast-routing\ninterface GigabitEthernet0/0\n\
  \ ipv6 address 2001:db8:1::1/64\n no shutdown\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
