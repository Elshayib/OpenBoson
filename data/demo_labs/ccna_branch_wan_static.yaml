title: Branch WAN Static
lab_id: ccna_branch_wan_static
topic_code: '3.1'
description: Connect HQ and branch LANs over a WAN with mutual static routes.
objectives:
- HQ static route
- Branch static route
- Ping branch PC
topology:
  devices:
  - name: HQ
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.1.1.1/24
    - name: GigabitEthernet0/1
      ip: 172.16.0.1/30
    base_config: "interface GigabitEthernet0/0\n ip address 10.1.1.1 255.255.255.0\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n ip address 172.16.0.1 255.255.255.252\n\
      \ no shutdown\n"
  - name: BR
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.2.2.1/24
    - name: GigabitEthernet0/1
      ip: 172.16.0.2/30
    base_config: "interface GigabitEthernet0/0\n ip address 10.2.2.1 255.255.255.0\n\
      \ no shutdown\ninterface GigabitEthernet0/1\n ip address 172.16.0.2 255.255.255.252\n\
      \ no shutdown\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.2.2.10/24
    base_config: 'ip address 10.2.2.10 255.255.255.0

      '
  links:
  - a: HQ/GigabitEthernet0/1
    b: BR/GigabitEthernet0/1
  - a: BR/GigabitEthernet0/0
    b: PC1/eth0
tasks:
- id: t1
  instructions: On **HQ**, route **10.2.2.0/24** via **172.16.0.2**.
  grading_rules:
    device: HQ
    require:
    - ip route 10.2.2.0 255.255.255.0 172.16.0.2
- id: t2
  instructions: On **BR**, route **10.1.1.0/24** via **172.16.0.1**.
  grading_rules:
    device: BR
    require:
    - ip route 10.1.1.0 255.255.255.0 172.16.0.1
- id: t3
  instructions: Verify HQ can ping branch PC **10.2.2.10**.
  grading_rules:
    device: HQ
    require:
    - ip route 10.2.2.0 255.255.255.0 172.16.0.2
  verify:
    ping:
    - source: HQ
      destination: 10.2.2.10
      should_succeed: true
solution_config: 'ip route 10.2.2.0 255.255.255.0 172.16.0.2

  ip route 10.1.1.0 255.255.255.0 172.16.0.1

  '
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
