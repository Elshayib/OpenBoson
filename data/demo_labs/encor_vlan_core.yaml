title: ENCOR Core VLAN Fabric
lab_id: encor_vlan_core
topic_code: '2.1'
difficulty: 3
cert_tags:
- ccnp
description: Build a core VLAN and trunk fabric for campus distribution.
objectives:
- VLAN create
- Trunk core
- Access edge
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: SW2
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.50.50.10/24
    base_config: 'ip address 10.50.50.10 255.255.255.0

      '
  links:
  - a: SW1/GigabitEthernet0/1
    b: SW2/GigabitEthernet0/1
  - a: SW2/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: Create **VLAN 50** named **CORE** on both switches.
  grading_rules:
    require:
    - vlan 50
    - name CORE
- id: t2
  instructions: Trunk Gi0/1 on SW1 and SW2.
  grading_rules:
    require:
    - switchport mode trunk
  verify:
    show:
    - device: SW1
      contains:
      - switchport mode trunk
- id: t3
  instructions: Put SW2 Gi0/2 in VLAN 50 as access.
  grading_rules:
    device: SW2
    require:
    - switchport access vlan 50
solution_config: "vlan 50\n name CORE\ninterface GigabitEthernet0/1\n switchport mode\
  \ trunk\ninterface GigabitEthernet0/2\n switchport mode access\n switchport access\
  \ vlan 50\n"
schema_version: 1
pass_threshold: 1.0
lab_tier: gold
