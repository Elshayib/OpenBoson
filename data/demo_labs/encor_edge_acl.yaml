title: ENCOR Edge ACL Filter
lab_id: encor_edge_acl
topic_code: '1.1'
difficulty: 4
cert_tags:
- ccnp
description: Apply an edge ACL that blocks ICMP to a protected host.
objectives:
- Extended ACL
- access-group
- verify blocked ping
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.10.10.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.10.10.1 255.255.255.0\n\
      \ no shutdown\n"
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
    base_config: "vlan 10\ninterface GigabitEthernet0/1\n switchport mode trunk\n\
      interface GigabitEthernet0/2\n switchport mode access\n switchport access vlan\
      \ 10\ninterface GigabitEthernet0/3\n switchport mode access\n switchport access\
      \ vlan 10\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.50/24
    base_config: 'ip address 10.10.10.50 255.255.255.0

      '
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
  - a: SW1/GigabitEthernet0/3
    b: PC2/eth0
tasks:
- id: t1
  instructions: 'Create ACL 100: deny ICMP any host **10.10.10.50**, then permit ip
    any any.'
  grading_rules:
    device: R1
    require:
    - access-list 100 deny icmp any host 10.10.10.50
    - access-list 100 permit ip any any
- id: t2
  instructions: Apply `ip access-group 100 in` on Gi0/0.
  grading_rules:
    device: R1
    require:
    - ip access-group 100 in
  verify:
    show:
    - device: R1
      contains:
      - ip access-group 100 in
- id: t3
  instructions: Verify PC1 cannot ping the protected host **10.10.10.50**.
  grading_rules:
    require:
    - access-list 100 deny icmp any host 10.10.10.50
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.50
      should_succeed: false
solution_config: "access-list 100 deny icmp any host 10.10.10.50\naccess-list 100\
  \ permit ip any any\ninterface GigabitEthernet0/0\n ip access-group 100 in\n"
schema_version: 1
pass_threshold: 1.0
lab_tier: gold
