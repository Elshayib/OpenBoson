title: VLAN 30 Access (ENG)
lab_id: ccna_vlan_30_eng
topic_code: '2.1'
difficulty: 2
description: Create VLAN 30 (ENG) and assign two access ports.
objectives:
- Create VLAN 30
- Assign access ports
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  links: []
tasks:
- id: t1
  instructions: On **SW1**, create **VLAN 30** named **ENG**.
  grading_rules:
    device: SW1
    require:
    - vlan 30
    - name ENG
- id: t2
  instructions: Put GigabitEthernet0/1 and GigabitEthernet0/2 into VLAN 30 as access
    ports.
  grading_rules:
    device: SW1
    require:
    - switchport mode access
    - switchport access vlan 30
solution_config: "vlan 30\n name ENG\ninterface GigabitEthernet0/1\n switchport mode\
  \ access\n switchport access vlan 30\ninterface GigabitEthernet0/2\n switchport\
  \ mode access\n switchport access vlan 30\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
