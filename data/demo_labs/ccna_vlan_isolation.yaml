title: Access VLAN Isolation Check
lab_id: ccna_vlan_isolation
topic_code: '2.1'
description: Place PCs in different VLANs and verify they cannot reach each other.
objectives:
- Different access VLANs
- L2 isolation via ping
- Name the VLANs
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.20/24
    base_config: 'ip address 10.10.10.20 255.255.255.0

      '
  links:
  - a: PC1/eth0
    b: SW1/GigabitEthernet0/1
  - a: PC2/eth0
    b: SW1/GigabitEthernet0/2
tasks:
- id: t1
  instructions: Put **Gi0/1** in VLAN 10 and **Gi0/2** in VLAN 20 as access ports.
    PC1 and PC2 share the same IP subnet but must **not** reach each other.
  grading_rules:
    device: SW1
    require:
    - switchport access vlan 10
    - switchport access vlan 20
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.20
      should_succeed: false
- id: t2
  instructions: Create **VLAN 10** named **USERS** and **VLAN 20** named **GUEST**.
  grading_rules:
    device: SW1
    require:
    - vlan 10
    - name USERS
    - vlan 20
    - name GUEST
- id: t3
  instructions: Set the switch hostname to **ISO-SW1**.
  grading_rules:
    device: SW1
    require:
    - hostname ISO-SW1
  verify:
    show:
    - device: SW1
      contains:
      - hostname ISO-SW1
solution_config: "hostname ISO-SW1\nvlan 10\n name USERS\nvlan 20\n name GUEST\ninterface\
  \ GigabitEthernet0/1\n switchport mode access\n switchport access vlan 10\ninterface\
  \ GigabitEthernet0/2\n switchport mode access\n switchport access vlan 20\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
