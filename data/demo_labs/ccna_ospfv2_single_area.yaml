title: OSPFv2 Single Area
lab_id: ccna_ospfv2_single_area
topic_code: '3.2'
difficulty: 3
description: Enable OSPF process 1 in area 0 on R1.
objectives:
- router ospf 1
- network statement
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.1.1.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.1.1.1 255.255.255.0\n\
      \ no shutdown\n"
  links: []
tasks:
- id: t1
  instructions: Start OSPF process 1 and advertise 10.1.1.0/24 in area 0.
  grading_rules:
    device: R1
    require:
    - router ospf 1
    - network 10.1.1.0 0.0.0.255 area 0
solution_config: "router ospf 1\n network 10.1.1.0 0.0.0.255 area 0\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
