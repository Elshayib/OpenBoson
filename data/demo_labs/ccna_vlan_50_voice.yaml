title: VLAN 50 Access (VOICE)
lab_id: ccna_vlan_50_voice
topic_code: '2.1'
difficulty: 3
description: Create VLAN 50 (VOICE) and assign two access ports.
objectives:
- Create VLAN 50
- Assign access ports
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
  links: []
tasks:
- id: t1
  instructions: On **SW1**, create **VLAN 50** named **VOICE**.
  grading_rules:
    device: SW1
    require:
    - vlan 50
    - name VOICE
- id: t2
  instructions: Put GigabitEthernet0/2 and GigabitEthernet0/3 into VLAN 50 as access
    ports.
  grading_rules:
    device: SW1
    require:
    - switchport mode access
    - switchport access vlan 50
solution_config: "vlan 50\n name VOICE\ninterface GigabitEthernet0/2\n switchport\
  \ mode access\n switchport access vlan 50\ninterface GigabitEthernet0/3\n switchport\
  \ mode access\n switchport access vlan 50\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
