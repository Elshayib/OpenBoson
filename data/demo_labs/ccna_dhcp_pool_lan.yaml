title: DHCP Pool on LAN Gateway
lab_id: ccna_dhcp_pool_lan
topic_code: '4.3'
description: PC1 has no address. It cannot ping the LAN gateway until R1 leases an
  address from pool LAN and the PC renews.
objectives:
- Address the LAN gateway
- DHCP pool with network and default-router
- Renew on PC1 and ping the gateway
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: '**R1 — LAN gateway**


    PC1 has no IP of its own. On **R1**, set Gi0/0 to **192.168.10.1/24** and no shutdown
    so it can serve the LAN.'
  grading_rules:
    device: R1
    require:
    - ip address 192.168.10.1 255.255.255.0
    - no shutdown
- id: t2
  instructions: '**R1 — DHCP pool**


    Create pool **LAN** with `ip dhcp pool LAN`, `network 192.168.10.0 255.255.255.0`,
    and `default-router 192.168.10.1`.'
  grading_rules:
    device: R1
    require:
    - ip dhcp pool LAN
    - network 192.168.10.0 255.255.255.0
    - default-router 192.168.10.1
  verify:
    show:
    - device: R1
      contains:
      - ip dhcp pool LAN
- id: t3
  instructions: '**SW1 and PC1 — adjacent lease**


    On **SW1**, create VLAN 10, trunk Gi0/1 toward R1, and put Gi0/2 in VLAN 10 as
    access with **spanning-tree portfast** so the PC is L2-adjacent. On **PC1** run
    `ipconfig /renew`. From PC1 the gateway **192.168.10.1** must reply.'
  grading_rules:
    device: SW1
    require:
    - vlan 10
    - switchport mode trunk
    - switchport access vlan 10
    - spanning-tree portfast
  verify:
    ping:
    - source: PC1
      destination: 192.168.10.1
      should_succeed: true
solution_config: "! --- R1 ---\ninterface GigabitEthernet0/0\n ip address 192.168.10.1\
  \ 255.255.255.0\n no shutdown\nip dhcp pool LAN\n network 192.168.10.0 255.255.255.0\n\
  \ default-router 192.168.10.1\n! --- SW1 ---\nvlan 10\ninterface GigabitEthernet0/1\n\
  \ switchport mode trunk\ninterface GigabitEthernet0/2\n switchport mode access\n\
  \ switchport access vlan 10\n spanning-tree portfast\n! --- PC1 ---\nipconfig /renew\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
