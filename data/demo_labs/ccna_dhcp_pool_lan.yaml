title: DHCP Pool on LAN Gateway
lab_id: ccna_dhcp_pool_lan
topic_code: '4.3'
description: Configure an IOS DHCP pool on R1 for a switched LAN.
objectives:
- Address Gi0/0
- ip dhcp pool
- verify.show
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: On **R1**, set Gi0/0 to **192.168.10.1/24** and no shutdown.
  grading_rules:
    device: R1
    require:
    - ip address 192.168.10.1 255.255.255.0
    - no shutdown
- id: t2
  instructions: Create DHCP pool **LAN** (`ip dhcp pool LAN`).
  grading_rules:
    device: R1
    require:
    - ip dhcp pool LAN
  verify:
    show:
    - device: R1
      contains:
      - ip dhcp pool LAN
- id: t3
  instructions: On **SW1**, trunk Gi0/1 and put Gi0/2 in VLAN 10.
  grading_rules:
    device: SW1
    require:
    - switchport mode trunk
    - switchport access vlan 10
solution_config: "! --- R1 ---\ninterface GigabitEthernet0/0\n ip address 192.168.10.1\
  \ 255.255.255.0\n no shutdown\nip dhcp pool LAN\n! --- SW1 ---\nvlan 10\ninterface\
  \ GigabitEthernet0/1\n switchport mode trunk\ninterface GigabitEthernet0/2\n switchport\
  \ mode access\n switchport access vlan 10\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
