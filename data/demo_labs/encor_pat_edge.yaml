title: ENCOR PAT Edge Translation
lab_id: encor_pat_edge
topic_code: '3.2'
difficulty: 4
cert_tags:
- ccnp
description: A campus host on 10.8.8.0/24 cannot reach the outside peer until the
  edge router overloads PAT on the WAN interface.
objectives:
- Mark inside and outside
- ACL plus PAT overload
- Inside PC ping of the outside peer
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 10.8.8.1/24
    - name: GigabitEthernet0/1
      ip: 198.51.100.1/24
    base_config: "interface GigabitEthernet0/0\n ip address 10.8.8.1 255.255.255.0\n\
      \ ip nat inside\n no shutdown\ninterface GigabitEthernet0/1\n ip address 198.51.100.1\
      \ 255.255.255.0\n ip nat outside\n no shutdown\n"
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.8.8.10/24
    base_config: 'ip address 10.8.8.10 255.255.255.0

      '
  - name: ISP
    type: router
    interfaces:
    - name: GigabitEthernet0/0
      ip: 198.51.100.2/24
    base_config: "interface GigabitEthernet0/0\n ip address 198.51.100.2 255.255.255.0\n\
      \ no shutdown\n"
  links:
  - a: R1/GigabitEthernet0/0
    b: PC1/eth0
  - a: R1/GigabitEthernet0/1
    b: ISP/GigabitEthernet0/0
tasks:
- id: t1
  instructions: '**R1 — translation border**


    Gi0/0 faces the campus LAN; Gi0/1 faces the provider. Mark **Gi0/0** `ip nat inside`
    and **Gi0/1** `ip nat outside`. PC1 cannot reach 198.51.100.2 until PAT exists.'
  grading_rules:
    device: R1
    require:
    - ip nat inside
    - ip nat outside
- id: t2
  instructions: '**R1 — overload**


    Create **ACL 1** that permits any, then `ip nat inside source list 1 interface
    GigabitEthernet0/1 overload`.'
  grading_rules:
    device: R1
    require:
    - access-list 1 permit any
    - ip nat inside source list 1 interface GigabitEthernet0/1 overload
  verify:
    show:
    - device: R1
      contains:
      - ip nat inside source
- id: t3
  instructions: '**PC1 — outside reachability**


    From **PC1**, the outside peer **198.51.100.2** must reply. That path stays dark
    until PAT overload is in place.'
  verify:
    ping:
    - source: PC1
      destination: 198.51.100.2
      should_succeed: true
solution_config: "interface GigabitEthernet0/0\n ip nat inside\ninterface GigabitEthernet0/1\n\
  \ ip nat outside\naccess-list 1 permit any\nip nat inside source list 1 interface\
  \ GigabitEthernet0/1 overload\n"
schema_version: 1
pass_threshold: 1.0
lab_tier: gold
