title: STP PortFast Edge Ports
lab_id: ccna_stp_portfast_edge
topic_code: '2.5'
description: Two PCs in VLAN 10 cannot reach each other until both access ports have
  PortFast and start forwarding.
objectives:
- VLAN 10 access ports
- PortFast on both edge ports
- PC1 ping of PC2
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.20/24
    base_config: 'ip address 10.10.10.20 255.255.255.0

      '
  links:
  - a: SW1/GigabitEthernet0/1
    b: PC1/eth0
  - a: SW1/GigabitEthernet0/2
    b: PC2/eth0
tasks:
- id: t1
  instructions: '**SW1 — user VLAN**


    Create **VLAN 10** and put Gi0/1 and Gi0/2 in it as access ports. PC1 still cannot
    reach PC2 — those edge ports are not forwarding yet.'
  grading_rules:
    device: SW1
    require:
    - vlan 10
    - switchport access vlan 10
- id: t2
  instructions: '**SW1 — PortFast**


    Enable **spanning-tree portfast** on Gi0/1 and Gi0/2 so both access ports start
    forwarding toward the PCs.'
  grading_rules:
    device: SW1
    require:
    - spanning-tree portfast
  verify:
    show:
    - device: SW1
      contains:
      - spanning-tree portfast
- id: t3
  instructions: '**PC1 — prove the edge**


    From **PC1**, **PC2** at **10.10.10.20** must reply. That ping fails until PortFast
    is on both access ports.'
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.20
      should_succeed: true
solution_config: "vlan 10\ninterface GigabitEthernet0/1\n switchport mode access\n\
  \ switchport access vlan 10\n spanning-tree portfast\ninterface GigabitEthernet0/2\n\
  \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
