title: STP PortFast Edge Ports
lab_id: ccna_stp_portfast_edge
topic_code: '2.5'
description: Enable PortFast on access ports facing two PCs.
objectives:
- Access VLANs
- spanning-tree portfast
- verify.show
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.20/24
    base_config: 'ip address 10.10.10.20 255.255.255.0

      '
  links:
  - a: SW1/GigabitEthernet0/1
    b: PC1/eth0
  - a: SW1/GigabitEthernet0/2
    b: PC2/eth0
tasks:
- id: t1
  instructions: Create **VLAN 10** and put both access ports into it.
  grading_rules:
    device: SW1
    require:
    - vlan 10
    - switchport access vlan 10
- id: t2
  instructions: Enable **spanning-tree portfast** on Gi0/1 and Gi0/2.
  grading_rules:
    device: SW1
    require:
    - spanning-tree portfast
  verify:
    show:
    - device: SW1
      contains:
      - spanning-tree portfast
- id: t3
  instructions: Confirm same-VLAN ping from PC1 to PC2 still works.
  grading_rules:
    require:
    - switchport access vlan 10
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.20
      should_succeed: true
solution_config: "vlan 10\ninterface GigabitEthernet0/1\n switchport mode access\n\
  \ switchport access vlan 10\n spanning-tree portfast\ninterface GigabitEthernet0/2\n\
  \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
