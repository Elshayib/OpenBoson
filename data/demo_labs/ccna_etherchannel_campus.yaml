title: EtherChannel Campus Bundle
lab_id: ccna_etherchannel_campus
topic_code: '2.4'
description: Two switches share dual links. Shutting the forwarding unbundled member
  isolates the PCs unless those links are one EtherChannel.
objectives:
- VLAN 10 access with PortFast
- channel-group 1 mode on both members
- PC ping survives shutting one member
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
  - name: SW2
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  - name: PC2
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.20/24
    base_config: 'ip address 10.10.10.20 255.255.255.0

      '
  links:
  - a: SW1/GigabitEthernet0/1
    b: SW2/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: SW2/GigabitEthernet0/2
  - a: SW1/GigabitEthernet0/3
    b: PC1/eth0
  - a: SW2/GigabitEthernet0/3
    b: PC2/eth0
tasks:
- id: t1
  instructions: '**Access VLAN and inter-switch trunks**


    Create **VLAN 10** on both switches. Put each PC-facing Gi0/3 in VLAN 10 as access
    with **spanning-tree portfast**. Trunk Gi0/1 and Gi0/2 toward the peer. Unbundled,
    only the lowest interface name forwards — a second parallel link is not a backup
    yet.'
  grading_rules:
    require:
    - vlan 10
    - switchport mode trunk
    - switchport access vlan 10
    - spanning-tree portfast
- id: t2
  instructions: '**Bundle the dual links**


    On **SW1** and **SW2**, place Gi0/1 and Gi0/2 into **channel-group 1 mode on**
    so the two links become one logical path.'
  grading_rules:
    require:
    - channel-group 1 mode on
  verify:
    show:
    - device: SW1
      contains:
      - channel-group 1
- id: t3
  instructions: '**Prove the bundle**


    Shut **SW1 GigabitEthernet0/1** (the forwarding unbundled member). From **PC1**,
    **PC2** at **10.10.10.20** must still reply — that survives only if the remaining
    member is in the same channel-group.'
  grading_rules:
    device: SW1
    require:
    - shutdown
    - channel-group 1 mode on
  verify:
    ping:
    - source: PC1
      destination: 10.10.10.20
      should_succeed: true
    show:
    - device: SW1
      contains:
      - channel-group 1
solution_config: "! --- SW1 ---\nvlan 10\ninterface GigabitEthernet0/1\n switchport\
  \ mode trunk\n channel-group 1 mode on\n shutdown\ninterface GigabitEthernet0/2\n\
  \ switchport mode trunk\n channel-group 1 mode on\ninterface GigabitEthernet0/3\n\
  \ switchport mode access\n switchport access vlan 10\n spanning-tree portfast\n\
  ! --- SW2 ---\nvlan 10\ninterface GigabitEthernet0/1\n switchport mode trunk\n channel-group\
  \ 1 mode on\ninterface GigabitEthernet0/2\n switchport mode trunk\n channel-group\
  \ 1 mode on\ninterface GigabitEthernet0/3\n switchport mode access\n switchport\
  \ access vlan 10\n spanning-tree portfast\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
