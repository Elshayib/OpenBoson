title: EtherChannel Campus Bundle
lab_id: ccna_etherchannel_campus
topic_code: '2.4'
description: Bundle two links between switches and attach a PC.
objectives:
- channel-group mode on
- Access VLAN for PC
- verify.show
topology:
  devices:
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
  - name: SW2
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
    - name: GigabitEthernet0/3
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
      ip: 10.10.10.10/24
    base_config: 'ip address 10.10.10.10 255.255.255.0

      '
  links:
  - a: SW1/GigabitEthernet0/1
    b: SW2/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: SW2/GigabitEthernet0/2
  - a: SW2/GigabitEthernet0/3
    b: PC1/eth0
tasks:
- id: t1
  instructions: On **SW1**, place Gi0/1 and Gi0/2 into **channel-group 1 mode on**.
  grading_rules:
    device: SW1
    require:
    - channel-group 1 mode on
  verify:
    show:
    - device: SW1
      contains:
      - channel-group 1 mode on
- id: t2
  instructions: On **SW2**, place Gi0/1 and Gi0/2 into **channel-group 1 mode on**.
  grading_rules:
    device: SW2
    require:
    - channel-group 1 mode on
  verify:
    show:
    - device: SW2
      contains:
      - channel-group
- id: t3
  instructions: Create VLAN 10 on SW2 and put Gi0/3 in VLAN 10 as access.
  grading_rules:
    device: SW2
    require:
    - vlan 10
    - switchport access vlan 10
solution_config: "! --- SW1 ---\ninterface GigabitEthernet0/1\n channel-group 1 mode\
  \ on\ninterface GigabitEthernet0/2\n channel-group 1 mode on\n! --- SW2 ---\nvlan\
  \ 10\ninterface GigabitEthernet0/1\n channel-group 1 mode on\ninterface GigabitEthernet0/2\n\
  \ channel-group 1 mode on\ninterface GigabitEthernet0/3\n switchport mode access\n\
  \ switchport access vlan 10\n"
schema_version: 1
cert_tags:
- ccna
pass_threshold: 1.0
lab_tier: gold
difficulty: 3
