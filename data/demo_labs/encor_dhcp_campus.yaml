title: ENCOR DHCP Campus Lease
lab_id: encor_dhcp_campus
topic_code: '3.2'
difficulty: 4
cert_tags:
- ccnp
description: A campus PC has no IPv4 address. It cannot ping the distribution gateway
  until it renews a lease from the local pool.
objectives:
- Address the distribution gateway
- DHCP pool with network and default-router
- Renew on PC1 and ping the gateway
topology:
  devices:
  - name: R1
    type: router
    interfaces:
    - name: GigabitEthernet0/0
  - name: SW1
    type: switch
    interfaces:
    - name: GigabitEthernet0/1
    - name: GigabitEthernet0/2
  - name: PC1
    type: pc
    interfaces:
    - name: eth0
  links:
  - a: R1/GigabitEthernet0/0
    b: SW1/GigabitEthernet0/1
  - a: SW1/GigabitEthernet0/2
    b: PC1/eth0
tasks:
- id: t1
  instructions: '**R1 — distribution gateway**


    PC1 has no address. On **R1**, set Gi0/0 to **10.30.30.1/24** and no shutdown.'
  grading_rules:
    device: R1
    require:
    - ip address 10.30.30.1 255.255.255.0
    - no shutdown
- id: t2
  instructions: '**R1 — campus pool**


    Create pool **CAMPUS** with `ip dhcp pool CAMPUS`, `network 10.30.30.0 255.255.255.0`,
    and `default-router 10.30.30.1`.'
  grading_rules:
    device: R1
    require:
    - ip dhcp pool CAMPUS
    - network 10.30.30.0 255.255.255.0
    - default-router 10.30.30.1
  verify:
    show:
    - device: R1
      contains:
      - ip dhcp pool CAMPUS
- id: t3
  instructions: '**SW1 and PC1 — lease then ping**


    On **SW1**, create VLAN 30, trunk Gi0/1, and put Gi0/2 in VLAN 30 as access with
    **spanning-tree portfast**. On **PC1** run `ipconfig /renew`. From PC1 the gateway
    **10.30.30.1** must reply.'
  grading_rules:
    device: SW1
    require:
    - vlan 30
    - switchport mode trunk
    - switchport access vlan 30
    - spanning-tree portfast
  verify:
    ping:
    - source: PC1
      destination: 10.30.30.1
      should_succeed: true
solution_config: "! --- R1 ---\ninterface GigabitEthernet0/0\n ip address 10.30.30.1\
  \ 255.255.255.0\n no shutdown\nip dhcp pool CAMPUS\n network 10.30.30.0 255.255.255.0\n\
  \ default-router 10.30.30.1\n! --- SW1 ---\nvlan 30\ninterface GigabitEthernet0/1\n\
  \ switchport mode trunk\ninterface GigabitEthernet0/2\n switchport mode access\n\
  \ switchport access vlan 30\n spanning-tree portfast\n! --- PC1 ---\nipconfig /renew\n"
schema_version: 1
pass_threshold: 1.0
lab_tier: gold
