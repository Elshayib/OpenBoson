title: Configure Basic Router & Switch (Demo Lab)
lab_id: ccna_basic_rtr_sw
topic_code: "2.1"
difficulty: 2
description: >
  Use the real OpenIOS device consoles to configure hostname, addressing,
  VLAN, and trunking on a two-device topology. Click a device to open its CLI.
objectives:
  - Open the R1 console and configure hostname + Gi0/0 addressing.
  - Open the SW1 console and create VLAN 10 + trunk toward R1.
  - Verify with show commands and Check Task.
topology:
  devices:
    - name: R1
      type: router
      interfaces:
        - name: GigabitEthernet0/0
          connected_to: SW1/GigabitEthernet0/1
        - name: GigabitEthernet0/1
    - name: SW1
      type: switch
      interfaces:
        - name: GigabitEthernet0/1
          connected_to: R1/GigabitEthernet0/0
        - name: GigabitEthernet0/2
  links:
    - a: R1/GigabitEthernet0/0
      b: SW1/GigabitEthernet0/1
tasks:
  - id: t1
    instructions: |
      **Device: R1** (click R1 on the topology or open the R1 console tab)

      1. `enable`
      2. `configure terminal`
      3. `hostname R1`
      4. `interface GigabitEthernet0/0` (or `int g0/0`)
      5. `ip address 10.10.10.1 255.255.255.0`
      6. `no shutdown`
      7. `end`
      8. Verify: `show ip interface brief`
      9. Click **Check Task**
    expected_config: |
      hostname R1
      interface GigabitEthernet0/0
       ip address 10.10.10.1 255.255.255.0
       no shutdown
    grading_rules:
      require:
        - "hostname R1"
        - "interface GigabitEthernet0/0"
        - "ip address 10.10.10.1 255.255.255.0"
        - "no shutdown"
  - id: t2
    instructions: |
      **Device: SW1**

      1. `enable` → `configure terminal`
      2. `hostname SW1`
      3. `vlan 10` then `name USERS` then `exit`
      4. `interface GigabitEthernet0/1`
      5. `switchport mode trunk`
      6. `end`
      7. Verify: `show vlan brief` / `show running-config`
      8. Click **Check Task**
    expected_config: |
      hostname SW1
      vlan 10
       name USERS
      interface GigabitEthernet0/1
       switchport mode trunk
    grading_rules:
      require:
        - "hostname SW1"
        - "vlan 10"
        - "interface GigabitEthernet0/1"
        - "switchport mode trunk"
solution_config: |
  ! --- R1 ---
  hostname R1
  interface GigabitEthernet0/0
   ip address 10.10.10.1 255.255.255.0
   no shutdown
  ! --- SW1 ---
  hostname SW1
  vlan 10
   name USERS
  interface GigabitEthernet0/1
   switchport mode trunk
