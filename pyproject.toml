[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openboson"
version = "0.4.1"
description = "Open-source local ExSim + NetSim practice platform for CCNA."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "OpenBoson contributors" }]
dependencies = [
    "pyside6>=6.6",
    "pydantic>=2",
    "pyyaml",
    "click",
    "sqlalchemy>=2",
    "pyqtgraph",
]

[project.urls]
Repository = "https://github.com/Elshayib/OpenBoson"
Issues = "https://github.com/Elshayib/OpenBoson/issues"

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "httpx"]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "ruff",
    "mypy",
]
packaging = [
    "pyinstaller>=6.3,<7",
]
all = ["openboson[server,dev,packaging]"]

[project.scripts]
openboson = "openboson.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openboson = ["gui/*.qss", "gui/resources/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "UP042",  # intentional str Enum for YAML/JSON serialization
]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_demo_labs.py" = ["E501"]
"scripts/bootstrap_content_shards.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["openboson"]
branch = true
