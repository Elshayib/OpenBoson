questions:
  - id: q1
    type: single_choice
    topic_code: "1.1"
    difficulty: 2
    cert_tags: [ccna]
    stem: >
      You have the network 192.168.10.0/26. How many usable host addresses
      does this subnet provide?
    choices:
      - id: a
        text: "62"
        rationale: "/26 yields 62 usable hosts."
      - id: b
        text: "64"
        rationale: "64 includes network and broadcast."
      - id: c
        text: "30"
        rationale: "That is a /27."
      - id: d
        text: "126"
        rationale: "That is a /25."
    correct:
      answer: a
    explanation: >
      A /26 prefix gives 2^(32-26) - 2 = 64 - 2 = 62 usable hosts.
    references:
      - "CCNA v1.1 blueprint 1.1.a — IPv4 subnetting"

  - id: q2
    type: multiple_choice
    topic_code: "2.1"
    difficulty: 3
    cert_tags: [ccna]
    stem: >
      Which two statements about VLAN trunks are correct? (Choose two.)
    choices:
      - id: a
        text: "A trunk carries traffic for multiple VLANs using 802.1Q tagging."
        rationale: "Correct — trunks carry tagged VLANs."
      - id: b
        text: "VLAN 1 cannot be used as a native VLAN."
        rationale: "VLAN 1 can be native (though discouraged)."
      - id: c
        text: "The native VLAN is sent untagged on an 802.1Q trunk."
        rationale: "Correct — native VLAN is untagged."
      - id: d
        text: "Trunks require ISL encapsulation on modern Cisco switches."
        rationale: "ISL is legacy."
    correct:
      answers: [a, c]
      partial_credit: false
    explanation: >
      802.1Q trunks carry multiple VLANs with a 4-byte tag; the native VLAN
      is sent untagged.
    references:
      - "CCNA v1.1 blueprint 2.1.a — VLANs and trunking"

  - id: q3
    type: ordered_list
    topic_code: "3.1"
    difficulty: 3
    cert_tags: [ccna]
    stem: >
      Place the OSPF adjacency states in the correct order from initiation
      to full adjacency.
    ordered_items: ["ExStart", "Init", "Down", "Full", "2-Way", "Loading", "Exchange"]
    correct:
      order: ["Down", "Init", "2-Way", "ExStart", "Exchange", "Loading", "Full"]
    explanation: >
      OSPF adjacency states in order: Down, Init, 2-Way, ExStart, Exchange,
      Loading, Full.
    references:
      - "CCNA v1.1 blueprint 3.1.c — OSPF adjacency states"

  - id: q4
    type: drag_match
    topic_code: "4.1"
    difficulty: 2
    cert_tags: [ccna]
    stem: >
      Match each DHCP message with the direction in which it is sent.
    drag_pairs:
      - left: "DISCOVER"
        right: "Client -> Server (broadcast)"
      - left: "OFFER"
        right: "Server -> Client (unicast or broadcast)"
      - left: "REQUEST"
        right: "Client -> Server (broadcast)"
      - left: "ACK"
        right: "Server -> Client (unicast)"
    correct:
      pairs:
        - left: "DISCOVER"
          right: "Client -> Server (broadcast)"
        - left: "OFFER"
          right: "Server -> Client (unicast or broadcast)"
        - left: "REQUEST"
          right: "Client -> Server (broadcast)"
        - left: "ACK"
          right: "Server -> Client (unicast)"
    explanation: >
      DHCP uses DORA: Discover, Offer, Request, Ack.
    references:
      - "CCNA v1.1 blueprint 4.1.a — DHCP operation"

  - id: q5
    type: sim
    topic_code: "5.1"
    difficulty: 4
    cert_tags: [ccna]
    stem: >
      Configure an ACL that permits outbound ICMP echo from the LAN.
    sim:
      instructions: >
        Configure an extended ACL 100 on R1.
      topology_ref: "r1_lan_to_internet"
    correct:
      expected_commands:
        - "access-list 100 permit icmp 10.10.10.0 0.0.0.255 any echo"
        - "access-list 100 deny icmp any any"
        - "ip access-group 100 out"
    explanation: >
      Permit echo, deny other ICMP, apply outbound.
    references:
      - "CCNA v1.1 blueprint 5.1.b — ACLs"

  - id: q6
    type: single_choice
    topic_code: "6.1"
    difficulty: 3
    cert_tags: [ccna]
    stem: >
      Which transport protocol and default port does NETCONF use?
    choices:
      - id: a
        text: "TCP/830 (SSH-based NETCONF)"
        rationale: "Correct — NETCONF/SSH on 830."
      - id: b
        text: "TCP/80 (HTTP)"
        rationale: "HTTP is not the common NETCONF transport."
      - id: c
        text: "UDP/161 (SNMP)"
        rationale: "SNMP, not NETCONF."
      - id: d
        text: "TCP/443 (HTTPS REST)"
        rationale: "RESTCONF often uses HTTPS."
    correct:
      answer: a
    explanation: >
      NETCONF over SSH runs on TCP port 830 by default.
    references:
      - "CCNA v1.1 blueprint 6.1.b — NETCONF/YANG"
