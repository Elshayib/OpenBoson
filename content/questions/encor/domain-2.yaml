  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'Operationally sound work on Device virtualization technologies still
    means verify, then document.


    Device virtualization is VMs, containers, and VRFs on one box. A VRF is a RIB/FIB
    instance — not an STP instance.


    **Verify before change windows** is the evidence habit that matches that check.
    **Capture show/verify outputs** is the evidence habit that matches that check.
    **Skip documentation** hides the very output you would use for the check in the
    previous sentence. **Disable logging permanently** blinds you to the failure the
    show command would have caught.'
  references:
  - ENCOR 350-401 Official Cert Guide — Virtualization
