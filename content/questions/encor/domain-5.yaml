    **Use the standard model for 5.3 rather than a look-alike concept**: Stay with
    the standard model for this objective instead of a look-alike protocol that shares
    a buzzword but not the behavior.


    **Use clear-text shared secrets as the only control for 5.3**: Clear-text shared
    secrets (type 7, Telnet, open SNMP) are not an acceptable sole control. Use SSH,
    type 8/9 secrets, and SNMPv3.


    **Skip documentation for 5.3 changes in production**: Skipping documentation leaves
    no rollback and no audit trail. Production changes for this objective still need
    a written record.


    **Disable logging permanently while testing 5.3**: Disabling logging permanently
    hides faults and is a finding on any security review. Keep syslog/buffered logging
    enabled.'
