    text: Disable 802.1X always
  correct:
    answer: a
  explanation: 'WPA3-Personal replaces PSK 4-way handshake with **SAE** (Dragonfly),
    giving forward secrecy and resistance to offline dictionary attacks. WPA3-Enterprise
    adds extra crypto options (192-bit suite).


    **WEP revival** is not the right selection: WEP (RC4, 24-bit IV) is broken and
    removed, not revived in WPA3.


    **Clear-text PSK mandatory** is not the right selection: WPA3 does not require
    a cleartext PSK on the air. SAE never puts the passphrase in a recoverable hash
    like WPA2’s 4-way handshake.


    **Disable 802.1X always** is not the right selection: WPA3-Enterprise **uses**
    802.1X/EAP. WPA3 does not disable 802.1X.'
  references:
