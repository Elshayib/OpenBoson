  - id: c
    text: Only VTP
  - id: d
    text: Only CDP version
  correct:
    answer: a
  explanation: 'Security Group Tags.


    **Group-based policy**: Security Group Tags.


    **Only STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.


    **Only VTP**: VTP floods VLAN advertisements among switches using a revision number;
    it does not route, NAT, or identify an overlay.


    **Only CDP version**: CDP is Cisco’s L2 neighbor discovery (`show cdp neighbors`).'
