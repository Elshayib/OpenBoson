- id: encor-5-008
  type: single_choice
  topic_code: '5.2'
  difficulty: 4
  cert_tags: *id001
  stem: Infrastructure ACLs on a router are?
  choices:
  - id: a
    text: ACLs protecting the device/control plane path
  - id: b
    text: Only user web ACL unrelated
  - id: c
    text: Only NAT pool
  - id: d
    text: Only PBR set exclusive
  correct:
    answer: a
  explanation: '**ACLs protecting the device/control plane path**: **PAT** (NAT overload) maps many inside
    addresses to one outside address using unique transport port numbers. This is the correct answer for
    the stem. Configuration uses `ip nat inside source list <acl> interface <if> overload`.


    **Only user web ACL unrelated**: An **ACL** filters traffic by matching header fields and applying
    permit or deny actions in sequential order. This does not satisfy the condition required by the stem.


    **Only NAT pool** is incorrect. It does not describe the intended use or behavior required by the
    stem.


    **Only PBR set exclusive** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Security
  - ENCOR exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
