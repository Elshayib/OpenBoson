    **Only STP tuning** points at STP tuning, which is not how 5.3 (REST API security)
    solves this stem. The keyed answer is **REST API security practice**.


    **Only multicast RPF** is a mismatch: Multicast is one-to-many (IPv4 224/4, IPv6
    ff00::/8). IPv6 replaces broadcast with multicast. The stem is asking about **REST
    API security practice**.


    **Only HSRP preempt** points at HSRP preempt, which is not how 5.3 (REST API security)
    solves this stem. The keyed answer is **REST API security practice**.'
  references:
