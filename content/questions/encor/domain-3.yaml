- id: encor-3-028
  type: single_choice
  topic_code: '3.3'
  difficulty: 3
  cert_tags: *id001
  stem: RPF check in multicast prevents?
  choices:
  - id: a
    text: Accepting multicast on the wrong reverse path
  - id: b
    text: Only TCP SYN floods exclusive
  - id: c
    text: Only VLAN hopping exclusive
  - id: d
    text: Only DNS amplification exclusive
  correct:
    answer: a
  explanation: 'Multicast **RPF** (Reverse Path Forwarding) accepts a (S,G) packet
    only on the interface the unicast RIB would use **toward S**. A packet arriving
    on the wrong interface is dropped. That stops loops and some spoofed sources.


    **Accepting multicast on the wrong reverse path** is what RPF prevents.


    **Only TCP SYN floods exclusive** are a unicast DoS (CoPP, SYN cookies). RPF is
    a multicast forwarding check, not a SYN-flood mitigator.


    **Only VLAN hopping exclusive** is an L2 attack (double-tag / native VLAN). RPF
    does not inspect 802.1Q.


    **Only DNS amplification exclusive** is a reflection DDoS on UDP 53. Multicast
    RPF is specifically the (S,G) reverse-path check.

    '
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
