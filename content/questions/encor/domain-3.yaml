    110 is **OSPF**, not eBGP.


    120 is **RIP**, not eBGP.


    90 is internal **EIGRP**, not eBGP.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.1
  provider: openboson
