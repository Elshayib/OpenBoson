questions:
- id: encor-3-001
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: EIGRP composite metric traditionally uses?
  choices:
  - id: a
    text: Bandwidth and delay (by default K values)
  - id: b
    text: Only hop count
  - id: c
    text: Only AS path
  - id: d
    text: Only STP cost
  correct:
    answer: a
  explanation: 'Classic EIGRP metric.


    **Bandwidth and delay (by default K values)**: Classic EIGRP metric.


    **Only hop count**: Hop count is RIP’s metric (max 15). OSPF uses cost; BGP uses
    path attributes.


    **Only AS path**: EIGRP’s classic composite uses bandwidth and delay (plus load/reliability
    if Ks enable them). AS-path is BGP.


    **Only STP cost**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-002
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id001
  stem: OSPFv3 primarily routes?
  choices:
  - id: a
    text: IPv6 (address-family designs)
  - id: b
    text: Only IPv4 classful
  - id: c
    text: Only IPX
  - id: d
    text: Only AppleTalk
  correct:
    answer: a
  explanation: 'OSPFv3 (RFC 5340) was designed to route **IPv6**. On IOS-XE it also
    supports address-families (`router ospfv3` / `address-family ipv6` or `ipv4`),
    but it is the IPv6-era OSPF, not a classful IPv4, IPX, or AppleTalk protocol.


    **IPv6 (address-family designs)** is what OSPFv3 carries (IPv6 LSAs, optional
    IPv4 AF on modern images).


    **Only IPv4 classful** is RIPv1/IGRP behavior (Class A/B/C masks). OSPF has been
    classless since OSPFv2; OSPFv3 is not classful IPv4.


    **Only IPX** is Novell NetWare’s IPX/SPX stack. Cisco removed IPX routing; OSPFv3
    does not encapsulate or advertise IPX.


    **Only AppleTalk** is Apple’s legacy Phase-2 network (RTMP / EIGRP for AppleTalk).
    It was never carried in OSPFv3 LSAs.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-003
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: BGP path selection prefers higher?
  choices:
  - id: a
    text: Local Preference (among early steps)
  - id: b
    text: Always lowest MED first exclusively
  - id: c
    text: Always random
  - id: d
    text: Always IGP metric only
  correct:
    answer: a
  explanation: 'LOC_PREF is a key enterprise knob.


    **Local Preference (among early steps)**: LOC_PREF is a key enterprise knob.


    **Always lowest MED first exclusively**: MED is a BGP attribute to influence inbound
    traffic from a neighbor AS.


    **Always random**: BGP best-path is deterministic (weight, local pref, AS-path,
    origin, MED, …). It does not pick a path at random.


    **Always IGP metric only**: IGP metric (OSPF cost, EIGRP FD) is a later BGP step
    and is not “higher Local Preference,” which is compared much earlier.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-004
  type: single_choice
  topic_code: '3.1'
  difficulty: 3
  cert_tags: *id001
  stem: Dynamic 802.1Q trunking issues often involve?
  choices:
  - id: a
    text: DTP/native VLAN mismatches
  - id: b
    text: Only OSPF RID
  - id: c
    text: Only BGP AS path
  - id: d
    text: Only NTP stratum
  correct:
    answer: a
  explanation: 'Trunk troubleshooting focuses on tagging/DTP/native VLAN.


    **DTP/native VLAN mismatches**: Trunk troubleshooting focuses on tagging/DTP/native
    VLAN.


    **Only OSPF RID**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default AD
    110, multicast 224.0.0.5/6).


    **Only BGP AS path**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).


    **Only NTP stratum**: NTP synchronizes clocks (UDP 123); stratum is distance from
    a reference.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-005
  type: single_choice
  topic_code: '3.3'
  difficulty: 4
  cert_tags: *id001
  stem: PIM Sparse Mode uses?
  choices:
  - id: a
    text: RP for shared trees
  - id: b
    text: Only dense flood always
  - id: c
    text: Only STP
  - id: d
    text: Only HSRP
  correct:
    answer: a
  explanation: 'ASM with Rendezvous Point.


    **RP for shared trees**: ASM with Rendezvous Point.


    **Only dense flood always**: PIM Sparse Mode uses an **RP** and builds shared/source
    trees on demand. Dense mode floods-and-prunes.


    **Only STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.


    **Only HSRP**: HSRP is Cisco’s FHRP: a virtual IP and virtual MAC (`0000.0c07.acXX`
    v1) with active/standby routers.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-006
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: EIGRP Feasible Distance is?
  choices:
  - id: a
    text: Best metric to destination
  - id: b
    text: Only AD
  - id: c
    text: Only hop count
  - id: d
    text: Only MTU
  correct:
    answer: a
  explanation: 'FD is best known metric.


    **Best metric to destination**: FD is best known metric.


    **Only AD**: EIGRP Feasible Distance is the **reported distance + local metric**
    to a prefix, not administrative distance (which is 90/170).


    **Only hop count**: Hop count is RIP’s metric (max 15). OSPF uses cost; BGP uses
    path attributes.


    **Only MTU**: MTU is the maximum frame/packet size on a link; it is not an AD
    or overlay ID.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-007
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: OSPFv2 network type point-to-point skips?
  choices:
  - id: a
    text: DR/BDR election
  - id: b
    text: All Hellos
  - id: c
    text: All LSAs
  - id: d
    text: Authentication always
  correct:
    answer: a
  explanation: 'No DR on p2p.


    **DR/BDR election**: No DR on p2p.


    **All Hellos**: OSPF still sends Hellos on point-to-point links (default 10/40
    s). P2P skips DR/BDR election, not Hellos.


    **All LSAs**: P2P neighbors still exchange the LSDB. Network type point-to-point
    skips the DR/BDR election, not LSA flooding.


    **Authentication always**: OSPF authentication is optional (null/MD5/SHA key-chain).
    Setting network type point-to-point does not enable it.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-008
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id001
  stem: eBGP between directly connected neighbors focuses on?
  choices:
  - id: a
    text: Neighbor relationships and best-path selection
  - id: b
    text: Only STP root guard
  - id: c
    text: Only VTP pruning
  - id: d
    text: Only PoE
  correct:
    answer: a
  explanation: 'ENCOR emphasizes eBGP peering and best path.


    **Neighbor relationships and best-path selection**: ENCOR emphasizes eBGP peering
    and best path.


    **Only STP root guard**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only VTP pruning**: VTP floods VLAN advertisements among switches using a revision
    number; it does not route, NAT, or identify an overlay.


    **Only PoE**: PoE delivers DC power on Ethernet (802.3af/at/bt).'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-009
  type: single_choice
  topic_code: '3.1'
  difficulty: 2
  cert_tags: *id001
  stem: EtherChannel troubleshooting often checks?
  choices:
  - id: a
    text: Member speed/duplex/mode consistency
  - id: b
    text: Only BGP communities
  - id: c
    text: Only DNS TTL
  - id: d
    text: Only syslog facility
  correct:
    answer: a
  explanation: 'Inconsistent members suspend channels.


    **Member speed/duplex/mode consistency**: Inconsistent members suspend channels.


    **Only BGP communities**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).


    **Only DNS TTL**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on UDP/TCP
    53.


    **Only syslog facility**: Syslog exports device logs (UDP 514) with severity 0–7.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-010
  type: single_choice
  topic_code: '3.3'
  difficulty: 3
  cert_tags: *id001
  stem: IGMP snooping constrains?
  choices:
  - id: a
    text: Multicast flooding on L2
  - id: b
    text: Unicast ARP
  - id: c
    text: STP
  - id: d
    text: NTP
  correct:
    answer: a
  explanation: 'Switch learns multicast receivers.


    **Multicast flooding on L2**: Switch learns multicast receivers.


    **Unicast ARP**: ARP maps IPv4 addresses to MACs on the local Ethernet; IPv6 uses
    NDP.


    **STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.


    NTP synchronizes clocks (UDP 123). Stratum is distance from a reference clock.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-011
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id001
  stem: EIGRP stub routers limit?
  choices:
  - id: a
    text: Query scope
  - id: b
    text: Only hello timers to zero
  - id: c
    text: Only bandwidth to 0
  - id: d
    text: Only delay infinite always
  correct:
    answer: a
  explanation: 'Stubs reduce SIA risk.


    **Query scope**: Stubs reduce SIA risk.


    **Only hello timers to zero**: EIGRP stub does not zero Hello timers. Hellos still
    flow; queries for missing prefixes are not sent to the stub.


    **Only bandwidth to 0**: An EIGRP stub still has bandwidth. Stub **limits queries
    and advertised routes** (connected/static/summary), not K-values.


    **Only delay infinite always**: EIGRP stub does not set delay to infinity. It
    suppresses query handling and limits advertised route types.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-012
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: NSSA in OSPF allows?
  choices:
  - id: a
    text: Limited external injection into stub-like area
  - id: b
    text: Only Type 5 flood everywhere
  - id: c
    text: Only disabling ABR
  - id: d
    text: Only RIP
  correct:
    answer: a
  explanation: 'NSSA Type 7.


    **Limited external injection into stub-like area**: NSSA Type 7.


    **Only Type 5 flood everywhere**: OSPF Type-5 external LSAs are originated by
    an ASBR.


    **Only disabling ABR**: An ABR sits in area 0 plus another area and originates
    Type-3 LSAs.


    **Only RIP**: RIP is a hop-count IGP (max 15), default AD 120, multicast 224.0.0.9
    for v2.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-013
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: Policy-based routing is used to?
  choices:
  - id: a
    text: Override destination-based forwarding with policy
  - id: b
    text: Only elect HSRP active
  - id: c
    text: Only age MAC tables
  - id: d
    text: Only negotiate LACP
  correct:
    answer: a
  explanation: 'PBR steers traffic by match criteria.


    **Override destination-based forwarding with policy**: PBR steers traffic by match
    criteria.


    **Only elect HSRP active**: HSRP is Cisco’s FHRP with a virtual IP/MAC and active/standby
    routers.


    **Only age MAC tables**: PBR (`ip policy route-map`) overrides the RIB per-packet.
    It does not age CAM.


    **Only negotiate LACP**: LACP (802.3ad/802.1AX) negotiates EtherChannel with active/passive
    modes.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-014
  type: single_choice
  topic_code: '3.1'
  difficulty: 4
  cert_tags: *id001
  stem: RSTP/MST enhancements include?
  choices:
  - id: a
    text: Root guard and BPDU guard
  - id: b
    text: Only NAT pools
  - id: c
    text: Only NetFlow keys
  - id: d
    text: Only EEM applets
  correct:
    answer: a
  explanation: 'STP enhancements protect topology stability.


    **Root guard and BPDU guard**: STP enhancements protect topology stability.


    **Only NAT pools**: NAT/PAT rewrites IP addresses (and ports with overload) across
    inside/outside.


    **Only NetFlow keys**: NetFlow exports traffic caches for accounting and anomaly
    detection.


    **Only EEM applets**: EEM applets react to IOS events with CLI actions.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-015
  type: single_choice
  topic_code: '3.3'
  difficulty: 2
  cert_tags: *id001
  stem: MSDP interconnects?
  choices:
  - id: a
    text: PIM domains’ RPs
  - id: b
    text: Only VLANs
  - id: c
    text: Only AAA servers
  - id: d
    text: Only syslog
  correct:
    answer: a
  explanation: 'MSDP (Multicast Source Discovery Protocol) peers **Rendezvous Points
    in different PIM-SM domains** and exchanges Source-Active messages (typically
    TCP 639) so each RP learns remote (S,G) sources — often with anycast RP.


    **PIM domains’ RPs** are exactly what MSDP interconnects.


    **Only VLANs** are 802.1Q Layer-2 broadcast domains. MSDP does not create, trunk,
    or prune VLANs; it is an RP-to-RP multicast protocol.


    **Only AAA servers** (RADIUS/TACACS+) authenticate operators or 802.1X users.
    MSDP SA messages are not login traffic.


    **Only syslog** exports device logs (UDP 514). An MSDP SA is a multicast source
    advertisement, not a log message.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-016
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: Named EIGRP mode configures?
  choices:
  - id: a
    text: Address-families under eigrp NAME
  - id: b
    text: Only process numbers forever
  - id: c
    text: Only RIP
  - id: d
    text: Only static
  correct:
    answer: a
  explanation: 'Named mode AF.


    **Address-families under eigrp NAME**: Named mode AF.


    **Only process numbers forever**: Named EIGRP (`router eigrp NAME` / address-family)
    still has an AS number; it is not “process IDs forever” like OSPF’s locally significant
    process ID.


    **Only RIP**: RIP is a hop-count IGP (max 15), default AD 120, multicast 224.0.0.9
    for v2.


    **Only static**: Named EIGRP configures EIGRP (AS, AF, topology). Static routes
    are `ip route`.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-017
  type: single_choice
  topic_code: '3.2'
  difficulty: 4
  cert_tags: *id001
  stem: OSPFv3 instance ID distinguishes?
  choices:
  - id: a
    text: Multiple instances on a link
  - id: b
    text: Only VLAN IDs
  - id: c
    text: Only DSCP
  - id: d
    text: Only ASN
  correct:
    answer: a
  explanation: 'OSPFv3 Hello includes an **Instance ID**. Routers on the same link
    form an adjacency only if Instance IDs match. That lets **multiple OSPFv3 instances**
    share a physical or VLAN interface (for example one instance per VRF or address-family)
    without merging LSDBs.


    **Multiple instances on a link** is what Instance ID distinguishes.


    **Only VLAN IDs** are 802.1Q tags. You can run OSPFv3 on an SVI, but the Instance
    ID is **not** the VLAN ID — two instances can share one VLAN.


    **Only DSCP** marks IP for QoS. DSCP does not select an OSPFv3 instance.


    **Only ASN** is BGP. OSPFv3 uses a process/instance ID here, not an AS number.

    '
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-018
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: MED is typically compared when?
  choices:
  - id: a
    text: From same neighboring AS (default)
  - id: b
    text: Always across all AS freely without knob
  - id: c
    text: Only for OSPF
  - id: d
    text: Only for EIGRP
  correct:
    answer: a
  explanation: 'MED multi-exit discriminator.


    **From same neighboring AS (default)**: MED multi-exit discriminator.


    **Always across all AS freely without knob**: MED is typically compared only for
    paths from the **same neighboring AS** unless `bgp always-compare-med` is set.


    **Only for OSPF**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default AD
    110, multicast 224.0.0.5/6).


    **Only for EIGRP**: EIGRP is Cisco’s DUAL IGP (default AD 90 internal / 170 external).'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-019
  type: single_choice
  topic_code: '3.3'
  difficulty: 3
  cert_tags: *id001
  stem: Configure NAT/PAT on an edge router primarily to?
  choices:
  - id: a
    text: Translate inside addresses for outside reachability
  - id: b
    text: Only hash EtherChannels
  - id: c
    text: Only elect DR
  - id: d
    text: Only set STP priority
  correct:
    answer: a
  explanation: 'On an edge router, NAT/PAT (`ip nat inside source list ... overload`)
    translates inside-local addresses so private hosts can reach outside/public networks.


    **Translate inside addresses for outside reachability** is that NAT/PAT job (and
    PAT multiplexes via source ports).


    **Only hash EtherChannels** (`port-channel load-balance src-dst-ip`) picks a member
    link inside a bundle. Hashing does not translate IPs.


    **Only elect DR** is OSPF on a multiaccess link (`ip ospf priority`). NAT does
    not run a DR/BDR election.


    **Only set STP priority** (`spanning-tree vlan N priority`) elects a Layer-2 root
    bridge. That is switching, not address translation.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-020
  type: single_choice
  topic_code: '3.3'
  difficulty: 4
  cert_tags: *id001
  stem: Anycast RP (MSDP) provides?
  choices:
  - id: a
    text: RP redundancy
  - id: b
    text: Only unique RP mandatory single
  - id: c
    text: Only disables multicast
  - id: d
    text: Only L2 flooding
  correct:
    answer: a
  explanation: 'Anycast RP.


    **RP redundancy**: Anycast RP.


    **Only unique RP mandatory single**: Anycast RP **shares** one RP address across
    several routers. A single unique RP is a single point of failure.


    **Only disables multicast**: Anycast RP keeps multicast **up** with multiple RPs
    sharing source info via MSDP.


    **Only L2 flooding**: Anycast RP with MSDP shares multicast source information
    among RPs. It is not plain L2 flooding.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-021
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: EIGRP wide metrics support?
  choices:
  - id: a
    text: Higher interface speeds accurately
  - id: b
    text: Only 10 Mbps max
  - id: c
    text: Only Token Ring
  - id: d
    text: Only ISDN
  correct:
    answer: a
  explanation: 'Wide metrics.


    **Higher interface speeds accurately**: Wide metrics.


    **Only 10 Mbps max**: Classic EIGRP scaled to 10 Gbps-ish with default K values;
    **wide metrics** (named mode) support much higher bandwidth, not a 10 Mbps cap.


    **Only Token Ring**: Token Ring is a legacy LAN (IEEE 802.5), not modern campus
    Ethernet.


    **Only ISDN**: ISDN is a legacy switched digital WAN.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-022
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: Graceful Restart for OSPF aims to?
  choices:
  - id: a
    text: Preserve forwarding during restart
  - id: b
    text: Flush all routes immediately always
  - id: c
    text: Disable BFD
  - id: d
    text: Clear ARP
  correct:
    answer: a
  explanation: 'NSF/GR.


    **Preserve forwarding during restart**: NSF/GR.


    **Flush all routes immediately always**: OSPF Graceful Restart (RFC 3623) keeps
    **forwarding** during a control-plane restart so neighbors do not flush routes
    immediately.


    **Disable BFD**: BFD detects forwarding-path failures in milliseconds.


    **Clear ARP**: ARP maps IPv4 addresses to MACs on the local Ethernet; IPv6 uses
    NDP.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-3-023
  type: single_choice
  topic_code: '3.3'
  difficulty: 4
  cert_tags: *id001
  stem: HSRP/VRRP on distribution switches provide?
  choices:
  - id: a
    text: First-hop gateway redundancy
  - id: b
    text: Only VXLAN VNIs
  - id: c
    text: Only NETCONF datastores
  - id: d
    text: Only gRPC dial-out
  correct:
    answer: a
  explanation: 'FHRPs keep default gateways available.


    **First-hop gateway redundancy**: FHRPs keep default gateways available.


    **Only VXLAN VNIs**: VXLAN encapsulates Ethernet in UDP 4789 with a 24-bit VNI.


    **Only NETCONF datastores**: NETCONF is XML/SSH datastore configuration (RFC 6241).


    **Only gRPC dial-out**: gRPC is an HTTP/2 RPC transport used for dial-out telemetry.'
  references:
