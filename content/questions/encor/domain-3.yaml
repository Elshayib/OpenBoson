  difficulty: 3
  cert_tags: *id001
  stem: OSPFv2 network type point-to-point skips?
  choices:
  - id: a
    text: DR/BDR election
  - id: b
    text: All Hellos
  - id: c
    text: All LSAs
  - id: d
    text: Authentication always
  correct:
    answer: a
  explanation: 'No DR on p2p.


    **All Hellos** is a mismatch: OSPF still sends Hellos on point-to-point links
    (default 10/40 s). P2P skips DR/BDR election, not Hellos. The stem is asking about
    **DR/BDR election**.


    **All LSAs** is a mismatch: P2P neighbors still exchange the LSDB. Network type
    point-to-point skips the DR/BDR election, not LSA flooding. The stem is asking
    about **DR/BDR election**.


    **Authentication always** is a mismatch: OSPF authentication is optional (null/MD5/SHA
    key-chain). Setting network type point-to-point does not enable it. The stem is
    asking about **DR/BDR election**.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
