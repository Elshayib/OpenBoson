- id: encor-gen-0007-05f812
  type: single_choice
  topic_code: '3.1'
  difficulty: 3
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 7 (3.1): Default AD of eBGP?'
  choices:
  - id: d
    text: '120'
  - id: a
    text: '20'
  - id: b
    text: '90'
  - id: c
    text: '110'
  correct:
    answer: a
  explanation: 'Cisco default administrative distance for **eBGP** is **20**, which
    is why an eBGP prefix beats OSPF (110) or iBGP (200) for the same length.


    120 is **RIP**, not eBGP.


    90 is internal **EIGRP**, not eBGP.


    110 is **OSPF**, not eBGP.'
  references:
