    text: Install both (ECMP)
  - id: b
    text: Prefer higher RID
  - id: c
    text: Prefer older LSA
  - id: d
    text: Drop randomly
  correct:
    answer: a
  explanation: 'If two OSPF paths to the same prefix have equal cost, IOS installs
    both (ECMP, default maximum-paths 4) and load-shares.


    **Install both (ECMP)**: If two OSPF paths to the same prefix have equal cost,
    IOS installs both (ECMP, default maximum-paths 4) and load-shares.


    **Prefer higher RID**: RID breaks OSPF **adjacency/DR** ties, not equal-cost forwarding.
    Equal costs are used together, not ranked by RID.


    **Prefer older LSA**: LSA age is for flooding/refresh (3600 s), not for picking
    one of two equal-cost next hops.


    **Drop randomly**: OSPF does not randomly drop equal-cost routes. They are installed
    and hashed across.'
