  - id: b
    text: Transitive across the AS always
  - id: c
    text: Only an OSPF metric
  - id: d
    text: Only a VLAN ID
  correct:
    answer: a
  explanation: 'Cisco **weight** is a 16-bit attribute **local to this router** (default
    32768 for originated, 0 for learned). Highest weight wins **first** in the BGP
    best-path list. It is never advertised in UPDATE messages.


    **Local to the router and highest preferred first** is weight.


    **Transitive across the AS always** describes attributes like **AS_PATH** or optional-transitive
    communities. Weight is non-transitive — neighbors never see it.


    **Only an OSPF metric** is cost (reference-bw/bandwidth) inside OSPF. BGP weight
    is not OSPF cost.


    **Only a VLAN ID** is 1–4094 on a trunk. Unrelated to BGP best-path.

