- id: encor-gen-0251-61efde
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 251 (3.2): Equal-cost OSPF paths behavior?'
  choices:
  - id: d
    text: Drop randomly
  - id: a
    text: Install both (ECMP)
  - id: b
    text: Prefer higher RID
  - id: c
    text: Prefer older LSA
  correct:
    answer: a
  explanation: 'If two OSPF paths to the same prefix have equal cost, IOS installs
    both (ECMP, default maximum-paths 4) and load-shares.


    **Install both (ECMP)**: If two OSPF paths to the same prefix have equal cost,
    IOS installs both (ECMP, default maximum-paths 4) and load-shares.


    **Drop randomly**: OSPF does not randomly drop equal-cost routes. They are installed
    and hashed across.


    **Prefer higher RID**: RID breaks OSPF **adjacency/DR** ties, not equal-cost forwarding.
    Equal costs are used together, not ranked by RID.


    **Prefer older LSA**: LSA age is for flooding/refresh (3600 s), not for picking
    one of two equal-cost next hops.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0252-8b38d6
  type: multiple_choice
  topic_code: '3.3'
  difficulty: 2
  cert_tags: *id002
  stem: '[CCNP 3.3] Select ALL that correctly relate to: OSPF router connecting two
    areas.'
  choices:
  - id: a
    text: ABR
  - id: b
    text: ASBR
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: DR
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **ABR**: An Area Border Router has interfaces in area 0 plus at least one other
    area. It originates Type-3 summary LSAs between areas.


    **Document verification steps before changes.**: Write the show/ping checks and
    rollback **before** the change window so you can prove the objective worked and
    back out if it did not.


    **ASBR**: An ASBR redistributes **external** routes (another protocol or static)
    into OSPF and originates Type-5 (or Type-7 in NSSA) LSAs. Connecting two OSPF
    areas is the ABR job.


    **DR**: The Designated Router is elected on a multiaccess **link**. It is not
    the router that joins two areas.'
  references:
  - ENCOR 350-401 Official Cert Guide — Infrastructure
  - ENCOR exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
