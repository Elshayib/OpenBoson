- id: encor-gen-0010-085e53
  type: single_choice
  topic_code: '4.1'
  difficulty: 1
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 10 (4.1): DHCP client broadcast to find servers?'
  choices:
  - id: c
    text: Only DHCPREQUEST
  - id: d
    text: DHCPOFFER
  - id: a
    text: DHCPDISCOVER
  - id: b
    text: DHCPACK
  correct:
    answer: a
  explanation: 'A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68, destination
    255.255.255.255) to find servers — the first message in DORA.


    **Only DHCPREQUEST** is not the right selection: DHCPREQUEST is the client’s **third**
    DORA step (accepting an offer, or renewing). Discovery comes first.


    DHCPOFFER is the **server** offering an address after DISCOVER. The client does
    not send it.


    DHCPACK is the **server’s** final confirmation of the lease, not the client’s
    discovery broadcast.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0011-ade4af
  type: single_choice
  topic_code: '4.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 11 (4.2): DNS record for IPv6?'
  choices:
  - id: d
    text: PTR only
  - id: a
    text: AAAA
  - id: b
    text: A
  - id: c
    text: MX
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    **PTR only** is not the right selection: PTR is reverse DNS (IP → name) under
    `ip6.arpa` or `in-addr.arpa`. The forward IPv6 record is AAAA.


    An **A** record maps a name to an **IPv4** address, not IPv6.


    MX records name mail exchangers. They do not carry IPv6 host addresses.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0012-269c44
  type: multiple_choice
  topic_code: '4.3'
  difficulty: 2
  cert_tags: *id002
  stem: '[CCNP 4.3] Select ALL that correctly relate to: Many-to-one NAT using ports.'
  choices:
  - id: a
    text: PAT/overload
  - id: b
    text: Static NAT
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: One-to-one dynamic only
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 4.3 (SPAN / RSPAN / ERSPAN).


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only** is not the right selection: Dynamic NAT without overload
    still uses a pool 1:1. When the pool is exhausted, new flows fail — that is not
    many-to-one PAT.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
