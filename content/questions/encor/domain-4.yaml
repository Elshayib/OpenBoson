  difficulty: 1
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 10 (4.1): DHCP client broadcast to find servers?'
  choices:
  - id: c
    text: Only DHCPREQUEST
  - id: d
    text: DHCPOFFER
  - id: a
    text: DHCPDISCOVER
  - id: b
    text: DHCPACK
  correct:
    answer: a
  explanation: 'A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68, destination
    255.255.255.255) to find servers — the first message in DORA.


    **DHCPDISCOVER**: A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68,
    destination 255.255.255.255) to find servers — the first message in DORA.


    **Only DHCPREQUEST**: DHCPREQUEST is the client’s **third** DORA step (accepting
    an offer, or renewing). Discovery comes first.


    DHCPOFFER is the **server** offering an address after DISCOVER. The client does
    not send it.


    DHCPACK is the **server’s** final confirmation of the lease, not the client’s
    discovery broadcast.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
