  - id: d
    text: Only TCP 179
  correct:
    answer: a
  explanation: '**SSH (TCP 830)**: **TCP** provides reliable, ordered, connection-oriented delivery using
    sequence and acknowledgment numbers, among other mechanisms. This is the correct answer for the stem.


    **Only Telnet 23** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **Only UDP 161**: **UDP** provides connectionless datagram delivery without TCP’s reliability or ordering
    guarantees. This does not satisfy the condition required by the stem.


    **Only TCP 179**: **TCP** provides reliable, ordered, connection-oriented delivery using sequence
    and acknowledgment numbers, among other mechanisms. This does not satisfy the condition required by
    the stem.'
