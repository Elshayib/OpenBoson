- id: encor-4-014
  type: single_choice
  topic_code: '4.5'
  difficulty: 4
  cert_tags: *id001
  stem: AI-powered workflows in Catalyst Center can assist with?
  choices:
  - id: a
    text: Assurance insights and guided operations
  - id: b
    text: Only manually cabling racks
  - id: c
    text: Only disabling telemetry
  - id: d
    text: Only removing SNMP
  correct:
    answer: a
  explanation: 'v1.2 calls out AI-powered Catalyst Center workflows.


    **Assurance insights and guided operations**: v1.2 calls out AI-powered Catalyst
    Center workflows.


    **Only manually cabling racks**: Catalyst Center assurance uses telemetry/AI for
    insights. It does not replace the need for structured cabling, and that is not
    its workflow.


    **Only disabling telemetry**: Model-driven telemetry streams YANG counters; disabling
    it removes visibility, it does not implement the feature in the objective.


    **Only removing SNMP**: SNMP reads/writes MIB objects (UDP 161) and sends traps
    (162).'
  references:
