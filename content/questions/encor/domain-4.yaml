  - id: c
    text: Only elect MST root
  - id: d
    text: Only create SGTs
  correct:
    answer: a
  explanation: 'Classic diagnostic tools.


    **Diagnose reachability and path issues**: Classic diagnostic tools.


    **Only configure VRFs**: Ping/traceroute test **reachability and path**. Configuring
    VRFs is unrelated to those diagnostic tools.


    **Only elect MST root**: MST (802.1s) maps VLANs onto a few STP instances.


    **Only create SGTs**: Ping/traceroute do not create TrustSec tags. They test IP
    reachability.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
