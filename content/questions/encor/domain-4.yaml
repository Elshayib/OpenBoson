  explanation: 'RESTCONF maps YANG to HTTP.


    **HTTP/HTTPS APIs**: RESTCONF maps YANG to HTTP.


    **Only CDP TLVs**: CDP is Cisco’s L2 neighbor discovery (`show cdp neighbors`).


    **Only BPDU guards**: BPDUs are STP control frames used to elect a root and assign
    port roles.


    **Only HSRP hellos**: HSRP is Cisco’s FHRP with a virtual IP/MAC and active/standby
    routers.'
