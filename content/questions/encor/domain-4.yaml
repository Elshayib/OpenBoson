  stem: SNMP and syslog in troubleshooting provide?
  choices:
  - id: a
    text: Device/event visibility
  - id: b
    text: Only underlay ECMP hashing
  - id: c
    text: Only VXLAN VNIs
  - id: d
    text: Only LACP priorities
  correct:
    answer: a
  explanation: 'Operational telemetry via SNMP/syslog.


    **Device/event visibility**: Operational telemetry via SNMP/syslog.


    **Only underlay ECMP hashing**: ECMP installs multiple equal-cost next hops (OSPF
    `maximum-paths`).


    **Only VXLAN VNIs**: VXLAN encapsulates Ethernet in UDP 4789 with a 24-bit VNI.


    **Only LACP priorities**: LACP (802.3ad/802.1AX) negotiates EtherChannel with
    active/passive modes.'
