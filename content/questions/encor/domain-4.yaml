- id: encor-4-002
  type: single_choice
  topic_code: '4.3'
  difficulty: 4
  cert_tags: *id001
  stem: SPAN mirrors traffic to?
  choices:
  - id: a
    text: A destination analyzer port
  - id: b
    text: Only Null0
  - id: c
    text: Only DHCP pool
  - id: d
    text: Only NTP
  correct:
    answer: a
  explanation: 'Switched Port Analyzer.


    **A destination analyzer port**: Switched Port Analyzer.


    **Only Null0**: Null0 is a discard next-hop used for aggregates and loop prevention.


    **Only DHCP pool**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA, UDP
    67/68).


    **Only NTP**: NTP synchronizes clocks (UDP 123). Stratum is distance from a reference
    clock.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-003
  type: single_choice
  topic_code: '4.5'
  difficulty: 2
  cert_tags: *id001
  stem: Cisco Catalyst Center (formerly DNA Center) is used to?
  choices:
  - id: a
    text: Apply configuration, monitoring, and management workflows
  - id: b
    text: Only replace underlay routing forever
  - id: c
    text: Only terminate PPPoE
  - id: d
    text: Only hash EtherChannels
  correct:
    answer: a
  explanation: 'Catalyst Center provides traditional and AI-powered workflows.


    **Apply configuration, monitoring, and management workflows**: Catalyst Center
    provides traditional and AI-powered workflows.


    **Only replace underlay routing forever**: Catalyst Center **manages and assures**
    the fabric; it does not delete OSPF/IS-IS from the underlay.


    **Only terminate PPPoE**: PPPoE is a broadband access encapsulation, not CAPWAP.


    **Only hash EtherChannels**: EtherChannel bundles physical links into one logical
    interface; members must match speed, duplex, and mode.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.5
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-004
  type: single_choice
  topic_code: '4.3'
  difficulty: 3
  cert_tags: *id001
  stem: ERSPAN carries mirrored traffic over?
  choices:
  - id: a
    text: IP/GRE-like encapsulation
  - id: b
    text: Only L1 copper always
  - id: c
    text: Only console
  - id: d
    text: Only USB
  correct:
    answer: a
  explanation: 'Encapsulated RSPAN.


    **IP/GRE-like encapsulation**: Encapsulated RSPAN.


    **Only L1 copper always**: ERSPAN encapsulates mirrored frames in **GRE** and
    routes them. It is not limited to a copper cable on the same switch.


    **Only console**: ERSPAN is GRE-encapsulated SPAN that **routes** to a remote
    analyzer, not a console cable.


    **Only USB**: USB is a host peripheral bus, not an Ethernet access medium.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-005
  type: single_choice
  topic_code: '4.4'
  difficulty: 4
  cert_tags: *id001
  stem: IP SLA can measure?
  choices:
  - id: a
    text: Latency/jitter/loss probes
  - id: b
    text: Only CPU temperature exclusive
  - id: c
    text: Only PoE draw exclusive
  - id: d
    text: Only fan RPM exclusive
  correct:
    answer: a
  explanation: 'Synthetic probes.


    **Latency/jitter/loss probes**: Synthetic probes.


    **Only CPU temperature exclusive**: IP SLA probes latency, jitter, and loss (icmp-echo,
    udp-jitter). CPU temperature is environmental SNMP, not IP SLA.


    **Only PoE draw exclusive**: PoE delivers DC power on Ethernet (802.3af/at/bt).


    **Only fan RPM exclusive**: Fan RPM is chassis environmental. IP SLA measures
    network SLA (delay/jitter/loss).'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-006
  type: single_choice
  topic_code: '4.2'
  difficulty: 2
  cert_tags: *id001
  stem: Flexible NetFlow adds?
  choices:
  - id: a
    text: User-defined flow keys/fields
  - id: b
    text: Only fixed v5 forever
  - id: c
    text: Only disables export
  - id: d
    text: Only STP
  correct:
    answer: a
  explanation: 'FNF customization.


    **User-defined flow keys/fields**: FNF customization.


    **Only fixed v5 forever**: Flexible NetFlow replaced original NetFlow v5’s fixed
    5-tuple with user-defined keys.


    **Only disables export**: Flexible NetFlow lets you define **keys and non-key
    fields**. It does not mean “turn export off.”.


    **Only STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-007
  type: single_choice
  topic_code: '4.3'
  difficulty: 3
  cert_tags: *id001
  stem: RSPAN uses?
  choices:
  - id: a
    text: A special VLAN to carry mirrored frames
  - id: b
    text: Only ERSPAN mandatory
  - id: c
    text: Only NetFlow
  - id: d
    text: Only gRPC
  correct:
    answer: a
  explanation: 'Remote SPAN VLAN.


    **A special VLAN to carry mirrored frames**: Remote SPAN VLAN.


    **Only ERSPAN mandatory**: ERSPAN encapsulates mirrored frames in GRE to a remote
    analyzer.


    **Only NetFlow**: NetFlow exports traffic caches for accounting and anomaly detection.


    **Only gRPC**: gRPC is an HTTP/2 RPC transport used for dial-out telemetry.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-008
  type: single_choice
  topic_code: '4.1'
  difficulty: 4
  cert_tags: *id001
  stem: Conditional debugs help by?
  choices:
  - id: a
    text: Limiting debug output to matching traffic
  - id: b
    text: Disabling all logging forever
  - id: c
    text: Clearing the RIB
  - id: d
    text: Negotiating LACP
  correct:
    answer: a
  explanation: 'Conditional debugs reduce noise while diagnosing.


    **Limiting debug output to matching traffic**: Conditional debugs reduce noise
    while diagnosing.


    **Disabling all logging forever**: Conditional debugs (`debug condition`) **narrow**
    what is printed. They do not disable logging.


    **Clearing the RIB**: The RIB is the routing table (`show ip route`) before CEF
    install.


    **Negotiating LACP**: LACP (802.3ad/802.1AX) negotiates EtherChannel with active/passive
    modes.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-009
  type: single_choice
  topic_code: '4.4'
  difficulty: 2
  cert_tags: *id001
  stem: IP SLA jitter tests help?
  choices:
  - id: a
    text: Voice/video path quality assessment
  - id: b
    text: Only VLAN creation
  - id: c
    text: Only ACL lines
  - id: d
    text: Only VTP password
  correct:
    answer: a
  explanation: |
    **IP SLA jitter** (`udp-jitter`) measures delay, jitter, and loss toward a responder — the numbers used to judge **voice/video** path quality (and to feed tracking/PfR).

    **Voice/video path quality assessment** is the use case.

    **Only VLAN creation** is `vlan N`. SLA probes do not create VLANs.

    **Only ACL lines** are `permit`/`deny` entries. SLA is `ip sla N` / `udp-jitter`.

    **Only VTP password** authenticates VTP. Unrelated to jitter probes.
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-4-010
  type: single_choice
  topic_code: '4.6'
  difficulty: 3
  cert_tags: *id001
  stem: NETCONF commonly uses which transport on IOS-XE?
  choices:
  - id: a
    text: SSH (TCP 830)
  - id: b
    text: Only Telnet 23
  - id: c
    text: Only UDP 161
  - id: d
    text: Only TCP 179
  correct:
    answer: a
  explanation: 'NETCONF over SSH is typical.


    **SSH (TCP 830)**: NETCONF over SSH is typical.


    **Only Telnet 23**: Telnet (TCP 23) is cleartext remote CLI.


    **Only UDP 161**: UDP 161 is SNMP. NETCONF default transport is SSH TCP 830.


    **Only TCP 179**: TCP 179 is BGP. NETCONF on IOS-XE uses SSH (TCP 830) by default.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.6
  provider: openboson
  license: MIT
  provenance: original
