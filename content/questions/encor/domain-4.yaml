questions:
- id: encor-4-001
  type: single_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: NetFlow/IPFIX primarily exports?
  choices:
  - id: a
    text: Traffic flow records
  - id: b
    text: Only STP topology
  - id: c
    text: Only VTP
  - id: d
    text: Only CDP
  correct:
    answer: a
  explanation: 'Flow telemetry.


    **Traffic flow records**: Flow telemetry.


    **Only STP topology**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only VTP**: VTP floods VLAN advertisements among switches using a revision number;
    it does not route, NAT, or identify an overlay.


    **Only CDP**: CDP is Cisco’s Layer 2 neighbor discovery protocol (`show cdp neighbors`).'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
  license: MIT
