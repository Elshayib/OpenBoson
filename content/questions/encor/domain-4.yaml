  topic_code: '4.2'
  difficulty: 4
  cert_tags: *id002
  stem: 'Scenario 38 (4.2): DNS record for IPv6?'
  choices:
  - id: c
    text: MX
  - id: d
    text: PTR only
  - id: a
    text: AAAA
  - id: b
    text: A
  correct:
    answer: a
  explanation: 'An **AAAA** DNS record maps a hostname to an IPv6 address, analogous to an A record for
    IPv4. This is the correct answer for the stem.


    **A** is incorrect. It describes a different behavior and does not meet the requirement stated in
    the stem.


    **MX** is incorrect. It describes a different behavior and does not meet the requirement stated in
    the stem.


    **PTR only** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0039-06195b
  type: single_choice
  topic_code: '4.3'
  difficulty: 5
  cert_tags: *id002
  stem: 'Scenario 39 (4.3): Many-to-one NAT using ports?'
  choices:
  - id: d
    text: NPTv6 only
  - id: a
    text: PAT/overload
  - id: b
    text: Static NAT
  - id: c
    text: One-to-one dynamic only
  correct:
    answer: a
  explanation: '**PAT/overload**: **PAT** (NAT overload) maps many inside addresses to one outside address
    using unique transport port numbers. This is the correct answer for the stem. Configuration uses `ip
    nat inside source list <acl> interface <if> overload`.


    **Static NAT** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.


    **One-to-one dynamic only** is incorrect. It describes a different behavior and does not meet the
    requirement stated in the stem.


    **NPTv6 only** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
