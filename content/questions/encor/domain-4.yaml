  stem: '[ENCOR 4.4] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
    text: Verify expected state for 4.4 with show/ping evidence
  - id: b
    text: Skip change control because 4.4 is low risk
  - id: c
    text: Document the 4.4 design intent and rollback plan
  - id: d
    text: Disable all monitoring related to 4.4
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '4.4 (IP SLA) is implemented by verifying with show/ping evidence and
    keeping a rollback plan. Use show/ping evidence to confirm the objective actually
    converged — not just that the command was typed. Document design intent and the
    rollback commands. The next engineer (or you at 03:00) needs that, not tribal
    memory.


    **Verify expected state for 4.4 with show/ping evidence**: Use show/ping evidence
    to confirm the objective actually converged — not just that the command was typed.


    **Document the 4.4 design intent and rollback plan**: Document design intent and
    the rollback commands. The next engineer (or you at 03:00) needs that, not tribal
    memory.


    **Skip change control because 4.4 is low risk**: Skipping change control because
    a topic ‘looks low risk’ is how untracked outages happen. This objective still
    goes through the window.


    **Disable all monitoring related to 4.4**: Disabling monitoring removes the only
    proof the objective still works after you leave. Leave SNMP/telemetry/syslog up.'
