- id: encor-nsc-0010
  type: multiple_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: &id003
  - ccnp
  stem: 'Multiple-select check for 4.1: which items are operationally sound?'
  choices:
  - id: a
    text: Verify before change windows
  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For objective 4.1 (Diagnose network problems using tools), keep a
    baseline of `show ip nat translations` and a written rollback. Skipping logs or
    treating 4.1 as optional leaves you unable to prove Diagnose network problems
    using tools still works.


    **Verify before change windows**: Confirm Diagnose network problems using tools
    with `show ip nat translations` before you rely on the new config.


    **Skip documentation**: Diagnose network problems using tools still needs a change
    record and logs; skipping them removes rollback for 4.1.


    **Capture show/verify outputs**: Confirm Diagnose network problems using tools
    with `show ip nat translations` before you rely on the new config.


    **Disable logging permanently**: You need logging/monitoring to see whether Diagnose
    network problems using tools actually converged after the window.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
