- id: encor-4-016
  type: single_choice
  topic_code: '4.3'
  difficulty: 3
  cert_tags: *id001
  stem: Local SPAN limitation includes?
  choices:
  - id: a
    text: Same switch typically
  - id: b
    text: Only cross-continent mandatory
  - id: c
    text: Only wireless exclusive
  - id: d
    text: Only MPLS exclusive
  correct:
    answer: a
  explanation: 'Classic SPAN locality.


    **Same switch typically**: Classic SPAN locality.


    **Only cross-continent mandatory**: Local SPAN source and destination are on the
    **same switch**. It is not a cross-continent requirement.


    **Only wireless exclusive**: Local SPAN is a **wired** switch feature (and can
    include wireless if the WLC is integrated), but it is not “wireless exclusive.”.


    **Only MPLS exclusive**: MPLS forwards on labels in a provider core, not on a
    campus access VLAN.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0010-085e53
  type: single_choice
  topic_code: '4.1'
  difficulty: 1
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 10 (4.1): DHCP client broadcast to find servers?'
  choices:
  - id: c
    text: Only DHCPREQUEST
  - id: d
    text: DHCPOFFER
  - id: a
    text: DHCPDISCOVER
  - id: b
    text: DHCPACK
  correct:
    answer: a
  explanation: 'A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68, destination
    255.255.255.255) to find servers — the first message in DORA.


    **DHCPDISCOVER**: A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68,
    destination 255.255.255.255) to find servers — the first message in DORA.


    **Only DHCPREQUEST**: DHCPREQUEST is the client’s **third** DORA step (accepting
    an offer, or renewing). Discovery comes first.


    DHCPOFFER is the **server** offering an address after DISCOVER. The client does
    not send it.


    DHCPACK is the **server’s** final confirmation of the lease, not the client’s
    discovery broadcast.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0011-ade4af
  type: single_choice
  topic_code: '4.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 11 (4.2): DNS record for IPv6?'
  choices:
  - id: d
    text: PTR only
  - id: a
    text: AAAA
  - id: b
    text: A
  - id: c
    text: MX
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    **AAAA**: An **AAAA** record maps a name to an IPv6 address (four A’s = 128 bits
    vs A = 32 bits).


    **PTR only**: PTR is reverse DNS (IP → name) under `ip6.arpa` or `in-addr.arpa`.
    The forward IPv6 record is AAAA.


    An **A** record maps a name to an **IPv4** address, not IPv6.


    MX records name mail exchangers. They do not carry IPv6 host addresses.'
  references:
  - ENCOR 350-401 Official Cert Guide — Network Assurance
  - ENCOR exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
