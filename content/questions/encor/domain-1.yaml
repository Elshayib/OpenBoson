    **/25**: `255.255.255.128` is /25 (128-address block).


    **/30**: `255.255.255.252` is /30 (4-address block) used on point-to-point links.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0246-5008d6
  type: multiple_choice
  topic_code: '1.4'
  difficulty: 2
  cert_tags: *id002
  stem: '[CCNP 1.4] Select ALL that correctly relate to: OSI layer for end-to-end
    reliable delivery.'
  choices:
  - id: a
    text: Transport
  - id: b
    text: Network
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: Data link
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Transport**: OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Document verification steps before changes.**: Write the show/ping checks and
    rollback **before** the change window so you can prove the objective worked and
    back out if it did not.


    **Network**: Layer 3 (IP) forwards packets hop-by-hop using the routing table.
    It does not guarantee ordered or reliable end-to-end delivery.


    **Data link**: Layer 2 delivers frames on a single link or VLAN using MAC addresses
    (Ethernet/PPP). Reliability and sessions are not its job.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
- id: encor-nsc-0000
  type: multiple_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id003
  - ccnp
  stem: 'Multiple-select check for 1.1: which items are operationally sound?'
  choices:
  - id: a
    text: Verify before change windows
  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '1.1 (Enterprise network design principles) is implemented by verifying
    with show/ping evidence and keeping a rollback plan. Capture a known-good baseline
    (`show`, ping, traceroute) before the window so you can compare after the change.
    Save `show running-config`, `show ip route`, `show vlan`, and similar evidence
    with the ticket — that is how you prove the objective.


    **Verify before change windows**: Capture a known-good baseline (`show`, ping,
    traceroute) before the window so you can compare after the change.


    **Capture show/verify outputs**: Save `show running-config`, `show ip route`,
    `show vlan`, and similar evidence with the ticket — that is how you prove the
    objective.


    **Skip documentation**: Skipping documentation leaves no rollback and no audit
    trail. Production changes for this objective still need a written record.


    **Disable logging permanently**: Disabling logging permanently hides faults and
    is a finding on any security review. Keep syslog/buffered logging enabled.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
