- id: encor-gen-0001-10c48f
  type: single_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 1 (1.2): IPv6 address type on every link?'
  choices:
  - id: b
    text: Global unicast
  - id: c
    text: Unique local
  - id: d
    text: Anycast only
  - id: a
    text: Link-local
  correct:
    answer: a
  explanation: 'Every IPv6-enabled interface must have a link-local address in `fe80::/10`
    (often auto-derived from EUI-64 or stable privacy). NDP, RS/RA, and routing hellos
    use it; it is never forwarded off-link.


    Global unicast (`2000::/3`) is the routable public address, assigned only when
    the interface needs site/Internet reachability — not automatically on every link.


    Unique local (`fc00::/7`, typically `fd00::/8`) is optional private unicast, analogous
    to RFC 1918. Interfaces do not require it.


    **Anycast only** is not the right selection: Anycast is a unicast address assigned
    to multiple nodes so routers deliver to the nearest. It is a service pattern,
    not the required per-interface address type.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0002-8e4b0e
  type: single_choice
  topic_code: '1.3'
  difficulty: 3
  cert_tags: *id002
  stem: 'Scenario 2 (1.3): Prefix length for mask 255.255.255.192?'
  choices:
  - id: c
    text: /25
  - id: d
    text: /30
  - id: a
    text: /26
  - id: b
    text: /24
  correct:
    answer: a
  explanation: '`255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus
    192 = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable
    hosts 62.


    **/25** is not the right selection: `255.255.255.128` is /25 (128-address block).


    **/30** is not the right selection: `255.255.255.252` is /30 (4-address block)
    used on point-to-point links.


    **/24** is not the right selection: `255.255.255.0` is /24 (256-address block),
    not 255.255.255.192.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0003-8bd870
  type: single_choice
  topic_code: '1.4'
  difficulty: 4
  cert_tags: *id002
  stem: 'Scenario 3 (1.4): OSI layer for end-to-end reliable delivery?'
  choices:
  - id: d
    text: Physical
  - id: a
    text: Transport
  - id: b
    text: Network
  - id: c
    text: Data link
  correct:
    answer: a
  explanation: 'OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Physical** is not the right selection: Layer 1 is bits on the medium (voltage,
    light, RF). There is no end-to-end session or retransmission at this layer.


    **Network** is not the right selection: Layer 3 (IP) forwards packets hop-by-hop
    using the routing table. It does not guarantee ordered or reliable end-to-end
    delivery.


    **Data link** is not the right selection: Layer 2 delivers frames on a single
    link or VLAN using MAC addresses (Ethernet/PPP). Reliability and sessions are
    not its job.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
