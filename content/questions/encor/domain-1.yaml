questions:
- id: encor-1-001
  type: single_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id001
  - ccnp
  stem: In a 3-tier campus, which layer typically aggregates access switches?
  choices:
  - id: a
    text: Distribution
  - id: b
    text: Core
  - id: c
    text: Access
  - id: d
    text: WAN edge
  correct:
    answer: a
  explanation: 'Distribution aggregates access and applies policy toward core.


    **Core**: The campus core is a high-speed backbone; it should not attach user
    VLANs.


    **Access**: The campus access layer attaches endpoints (PCs, phones, APs).


    **WAN edge**: The WAN edge connects the site to providers (often NAT, VPN, or
    SD-WAN).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-002
  type: single_choice
  topic_code: '1.3'
  difficulty: 4
  cert_tags: *id001
  stem: Cisco SD-Access fabric uses which overlay identifier commonly?
  choices:
  - id: a
    text: LISP / VXLAN (VNI) concepts
  - id: b
    text: Only Frame Relay DLCI
  - id: c
    text: Only ATM VPI
  - id: d
    text: Only HDLC
  correct:
    answer: a
  explanation: 'SD-Access uses LISP control and VXLAN data plane overlays.


    **LISP / VXLAN (VNI) concepts**: SD-Access uses LISP control and VXLAN data plane
    overlays.


    **Only Frame Relay DLCI**: Frame Relay identifies virtual circuits with DLCIs
    on an NBMA WAN, not an SD-Access or VXLAN overlay ID.


    **Only ATM VPI**: ATM uses VPI/VCI labels on a cell WAN; it is not a campus fabric
    ID.


    **Only HDLC**: HDLC is a bit-oriented serial encapsulation, not an overlay identifier.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-003
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: A spine-leaf Clos fabric primarily optimizes which traffic pattern?
  choices:
  - id: a
    text: East-west
  - id: b
    text: Only north-south dialup
  - id: c
    text: Only Token Ring
  - id: d
    text: Only serial TDM
  correct:
    answer: a
  explanation: 'Leaf-spine equalizes east-west paths.


    **East-west**: Leaf-spine equalizes east-west paths.


    **Only north-south dialup**: Dial-up/modem north-south access is not east-west
    spine-leaf traffic.


    **Only Token Ring**: Token Ring is a legacy LAN (IEEE 802.5), not modern campus
    Ethernet.


    **Only serial TDM**: TDM serial (T1/E1) is a legacy WAN multiplexing method, not
    Clos fabric.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-1-004
