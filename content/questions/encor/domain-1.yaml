- id: encor-v05-12-0000-34b325
  type: multiple_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: &id005
  - ccnp
  stem: '[ENCOR 1.2] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
    text: Verify expected state for 1.2 with show/ping evidence
  - id: b
    text: Skip change control because 1.2 is low risk
  - id: c
    text: Document the 1.2 design intent and rollback plan
  - id: d
    text: Disable all monitoring related to 1.2
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '1.2 (WLAN deployment design principles) is implemented by verifying
    with show/ping evidence and keeping a rollback plan. Use show/ping evidence to
    confirm the objective actually converged — not just that the command was typed.
    Document design intent and the rollback commands. The next engineer (or you at
    03:00) needs that, not tribal memory.


    **Verify expected state for 1.2 with show/ping evidence**: Use show/ping evidence
    to confirm the objective actually converged — not just that the command was typed.


    **Document the 1.2 design intent and rollback plan**: Document design intent and
    the rollback commands. The next engineer (or you at 03:00) needs that, not tribal
    memory.


    **Skip change control because 1.2 is low risk**: Skipping change control because
    a topic ‘looks low risk’ is how untracked outages happen. This objective still
    goes through the window.


    **Disable all monitoring related to 1.2**: Disabling monitoring removes the only
    proof the objective still works after you leave. Leave SNMP/telemetry/syslog up.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-v05-14-0001-d2b89c
  type: single_choice
  topic_code: '1.4'
  difficulty: 2
  cert_tags: *id005
  stem: Regarding ENCOR topic 1.4. Which reply is accurate?
  choices:
  - id: b
    text: Confuse 1.4 with an unrelated Layer mismatch
  - id: c
    text: Disable logging permanently while testing 1.4
  - id: d
    text: Use clear-text shared secrets as the only control for 1.4
  - id: a
    text: Validate with show/verify steps before relying on 1.4 changes
  correct:
    answer: a
  explanation: '1.4 (SD-WAN and SD-Access solutions) is implemented by verifying with
    show/ping evidence and keeping a rollback plan. Validate with show/verify (and
    ping where relevant) before you trust the change in production.


    **Validate with show/verify steps before relying on 1.4 changes**: Validate with
    show/verify (and ping where relevant) before you trust the change in production.


    **Confuse 1.4 with an unrelated Layer mismatch**: Confusing this objective with
    an unrelated OSI layer is how you apply the wrong feature (for example STP for
    a routing problem).


    **Disable logging permanently while testing 1.4**: Disabling logging permanently
    hides faults and is a finding on any security review. Keep syslog/buffered logging
    enabled.


    **Use clear-text shared secrets as the only control for 1.4**: Clear-text shared
    secrets (type 7, Telnet, open SNMP) are not an acceptable sole control. Use SSH,
    type 8/9 secrets, and SNMPv3.'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
