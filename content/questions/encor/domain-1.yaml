- id: encor-v05-12-0000-34b325
  type: multiple_choice
  topic_code: '1.2'
  difficulty: 2
  cert_tags: &id005
  - ccnp
  stem: '[ENCOR 1.2] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
    text: Verify expected state for 1.2 with show/ping evidence
  - id: b
    text: Skip change control because 1.2 is low risk
  - id: c
    text: Document the 1.2 design intent and rollback plan
  - id: d
    text: Disable all monitoring related to 1.2
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For 1.2 (WLAN deployment design principles), the keyed answer is **Verify
    expected state for 1.2 with show/ping evidence; Document the 1.2 design intent
    and rollback plan**. Stem: [ENCOR 1.2] Select ALL actions that support a correct
    implementation or verification for this objective..


    **Verify expected state for 1.2 with show/ping evidence** is correct: Use show/ping
    evidence to confirm the objective actually converged — not just that the command
    was typed. This matters for 1.2 (WLAN deployment design principles).


    **Document the 1.2 design intent and rollback plan** is correct: Document design
    intent and the rollback commands. The next engineer (or you at 03:00) needs that,
    not tribal memory. This matters for 1.2 (WLAN deployment design principles).


    **Skip change control because 1.2 is low risk** is not the right selection: Skipping
    change control because a topic ‘looks low risk’ is how untracked outages happen.
    This objective still goes through the window. This matters for 1.2 (WLAN deployment
    design principles).


    **Disable all monitoring related to 1.2** is not the right selection: Disabling
    monitoring removes the only proof the objective still works after you leave. Leave
    SNMP/telemetry/syslog up. This matters for 1.2 (WLAN deployment design principles).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: encor-v05-14-0001-d2b89c
  type: single_choice
  topic_code: '1.4'
  difficulty: 2
  cert_tags: *id005
  stem: Regarding ENCOR topic 1.4. Which reply is accurate?
  choices:
  - id: b
    text: Confuse 1.4 with an unrelated Layer mismatch
  - id: c
    text: Disable logging permanently while testing 1.4
  - id: d
    text: Use clear-text shared secrets as the only control for 1.4
  - id: a
    text: Validate with show/verify steps before relying on 1.4 changes
  correct:
    answer: a
  explanation: 'For 1.4 (SD-WAN and SD-Access solutions), the keyed answer is **Validate
    with show/verify steps before relying on 1.4 changes**. Stem: Regarding ENCOR
    topic 1.4. Which reply is accurate?.


    **Validate with show/verify steps before relying on 1.4 changes** is correct:
    Validate with show/verify (and ping where relevant) before you trust the change
    in production. This matters for 1.4 (SD-WAN and SD-Access solutions).


    **Confuse 1.4 with an unrelated Layer mismatch** is not the right selection: Confusing
    this objective with an unrelated OSI layer is how you apply the wrong feature
    (for example STP for a routing problem). This matters for 1.4 (SD-WAN and SD-Access
    solutions).


    **Disable logging permanently while testing 1.4** is not the right selection:
    Disabling logging permanently hides faults and is a finding on any security review.
    Keep syslog/buffered logging enabled. This matters for 1.4 (SD-WAN and SD-Access
    solutions).


    **Use clear-text shared secrets as the only control for 1.4** is not the right
    selection: Clear-text shared secrets (type 7, Telnet, open SNMP) are not an acceptable
    sole control. Use SSH, type 8/9 secrets, and SNMPv3. This matters for 1.4 (SD-WAN
    and SD-Access solutions).'
  references:
  - ENCOR 350-401 Official Cert Guide — Architecture
  - ENCOR exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
