  - id: c
    text: Only MPLS TE
  - id: d
    text: Only NetFlow export
  correct:
    answer: a
  explanation: 'Stacking presents multiple chassis as one logical switch.


    **Control-plane and forwarding abstraction across members**: Stacking presents
    multiple chassis as one logical switch.


    **Only wireless mesh**: A 3-tier campus is wired access/distribution/core. Mesh
    is an AP backhaul option.


    **Only MPLS TE**: MPLS forwards on labels in a provider core, not on a campus
    access VLAN.


    **Only NetFlow export**: NetFlow exports traffic caches for accounting and anomaly
