- id: encor-gen-0020-087e7c
  type: single_choice
  topic_code: '6.1'
  difficulty: 1
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 20 (6.1): ACL on vty lines purpose?'
  choices:
  - id: a
    text: Restrict management access
  - id: b
    text: Encrypt OSPF
  - id: c
    text: Form Port-Channels
  - id: d
    text: Assign VLANs
  correct:
    answer: a
  explanation: '`access-class N in` on `line vty 0 4` filters **who can open an SSH/Telnet
    session**. It is a management-plane ACL, not a data-plane VLAN or EtherChannel
    tool.


    **Encrypt OSPF** is not the right selection: OSPF authentication is `ip ospf authentication
    message-digest` / key chains. A VTY ACL does not encrypt Hellos.


    **Form Port-Channels** is not the right selection: EtherChannel is `channel-group`.
    A VTY ACL does not bundle ports.


    **Assign VLANs** is not the right selection: Access VLAN is `switchport access
    vlan`. A VTY ACL does not assign VLANs.'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
  - ENCOR exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0021-30dd80
  type: single_choice
  topic_code: '6.2'
  difficulty: 2
  cert_tags: *id002
  stem: 'Scenario 21 (6.2): Cisco LAN discovery protocol?'
  choices:
  - id: b
    text: FTP
  - id: c
    text: TFTP
  - id: d
    text: SMTP
  - id: a
    text: CDP
  correct:
    answer: a
  explanation: 'Cisco Discovery Protocol is Cisco’s Layer 2 neighbor protocol (`cdp
    run`, `show cdp neighbors`). It advertises device ID, platform, and native VLAN.


    FTP (TCP 21) transfers files. It is not a LAN discovery protocol.


    TFTP (UDP 69) transfers images/configs. It does not discover neighbors.


    SMTP delivers email. Unrelated to LAN topology discovery.'
  references:
