  cert_tags: *id002
  stem: 'Scenario 241 (6.6): Better password storage in configs?'
  choices:
  - id: b
    text: Banner plaintext
  - id: c
    text: Disable AAA
  - id: d
    text: Telnet only
  - id: a
    text: Type 8/9 secrets
  correct:
    answer: a
  explanation: 'Modern IOS `enable algorithm-type scrypt secret` / type **8** (PBKDF2)
    and type **9** (scrypt) store password hashes that are far harder to crack than
    type 5 MD5 or type 7 reversible Vigenère.


    **Type 8/9 secrets**: Modern IOS `enable algorithm-type scrypt secret` / type
    **8** (PBKDF2) and type **9** (scrypt) store password hashes that are far harder
    to crack than type 5 MD5 or type 7 reversible Vigenère.


    **Banner plaintext**: Banners (`banner motd`) are plaintext legal notices, not
    password storage.


    **Disable AAA**: Disabling AAA removes centralized auth; it does not hash local
    secrets better.


    **Telnet only**: Telnet sends credentials in cleartext. It is worse storage/transport,
    not better.'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
  - ENCOR exam topic 6.6
  provider: openboson
  license: MIT
  provenance: original
- id: encor-gen-0242-220572
  type: single_choice
  topic_code: '6.7'
  difficulty: 3
  cert_tags: *id002
  stem: 'Scenario 242 (6.7): ACL on vty lines purpose?'
  choices:
  - id: c
    text: Form Port-Channels
  - id: d
    text: Assign VLANs
  - id: a
    text: Restrict management access
  - id: b
    text: Encrypt OSPF
  correct:
    answer: a
  explanation: '`access-class N in` on `line vty 0 4` filters **who can open an SSH/Telnet
    session**. It is a management-plane ACL, not a data-plane VLAN or EtherChannel
    tool.


    **Restrict management access**: `access-class N in` on `line vty 0 4` filters
    **who can open an SSH/Telnet session**. It is a management-plane ACL, not a data-plane
    VLAN or EtherChannel tool.


    **Form Port-Channels**: EtherChannel is `channel-group`. A VTY ACL does not bundle
    ports.


    **Assign VLANs**: Access VLAN is `switchport access vlan`. A VTY ACL does not
    assign VLANs.


    **Encrypt OSPF**: OSPF authentication is `ip ospf authentication message-digest`
    / key chains. A VTY ACL does not encrypt Hellos.'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
  - ENCOR exam topic 6.7
  provider: openboson
  license: MIT
  provenance: original
