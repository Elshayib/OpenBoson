- id: encor-v05-61-0016-9439d3
  type: single_choice
  topic_code: '6.1'
  difficulty: 2
  cert_tags: &id003
  - ccnp
  stem: Select the correct association for exam topic 6.1.
  choices:
  - id: a
    text: Apply the verified behavior required by objective 6.1
  - id: b
    text: Skip documentation for 6.1 changes in production
  - id: c
    text: Treat 6.1 as optional when the blueprint lists it
  - id: d
    text: Ignore verification and assume 6.1 always works
  correct:
    answer: a
  explanation: 'For 6.1 (Python components and scripts), the keyed answer is **Apply
    the verified behavior required by objective 6.1**. Stem: Select the correct association
    for exam topic 6.1..


    **Apply the verified behavior required by objective 6.1** is correct: Apply the
    verified behavior the exam topic actually names, then confirm it with show/ping
    — not a neighboring feature. This matters for 6.1 (Python components and scripts).


    **Skip documentation for 6.1 changes in production** is not the right selection:
    Skipping documentation leaves no rollback and no audit trail. Production changes
    for this objective still need a written record. This matters for 6.1 (Python components
    and scripts).


    **Treat 6.1 as optional when the blueprint lists it** is not the right selection:
    Blueprint-listed objectives are not optional in production just because a lab
    skipped them. Implement and verify this topic. This matters for 6.1 (Python components
    and scripts).


    **Ignore verification and assume 6.1 always works** is not the right selection:
    Assuming it ‘always works’ without verification is how silent misconfigurations
    ship. Show/ping the result. This matters for 6.1 (Python components and scripts).'
