- id: encor-gen-0020-087e7c
  type: single_choice
  topic_code: '6.1'
  difficulty: 1
  cert_tags: &id002
  - ccnp
  stem: 'Scenario 20 (6.1): ACL on vty lines purpose?'
  choices:
  - id: a
    text: Restrict management access
  - id: b
    text: Encrypt OSPF
  - id: c
    text: Form Port-Channels
  - id: d
    text: Assign VLANs
  correct:
    answer: a
  explanation: '**Restrict management access**: An **ACL** filters traffic by matching header fields and
    applying permit or deny actions in sequential order. This is the correct answer for the stem.


    **Encrypt OSPF**: **OSPF** is a link-state IGP that builds a topology database and calculates loop-free
    paths with cost based primarily on interface bandwidth. This does not satisfy the condition required
    by the stem. Configuration uses `router ospf <process>`.


    **Form Port-Channels** is incorrect. It does not describe the intended use or behavior required by
    the stem.


    **Assign VLANs** is incorrect. It does not describe the intended use or behavior required by the stem.'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
