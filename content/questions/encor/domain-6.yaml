    - c
    partial_credit: false
  explanation: 'For 6.3 (Data modeling language principles), the keyed answer is **Verify
    expected state for 6.3 with show/ping evidence; Document the 6.3 design intent
    and rollback plan**. Stem: [ENCOR 6.3] Select ALL actions that support a correct
    implementation or verification for this objective..


    **Verify expected state for 6.3 with show/ping evidence** is correct: Use show/ping
    evidence to confirm the objective actually converged — not just that the command
    was typed. This matters for 6.3 (Data modeling language principles).


    **Document the 6.3 design intent and rollback plan** is correct: Document design
    intent and the rollback commands. The next engineer (or you at 03:00) needs that,
    not tribal memory. This matters for 6.3 (Data modeling language principles).


    **Skip change control because 6.3 is low risk** is not the right selection: Skipping
    change control because a topic ‘looks low risk’ is how untracked outages happen.
    This objective still goes through the window. This matters for 6.3 (Data modeling
    language principles).


    **Disable all monitoring related to 6.3** is not the right selection: Disabling
    monitoring removes the only proof the objective still works after you leave. Leave
    SNMP/telemetry/syslog up. This matters for 6.3 (Data modeling language principles).'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
  - ENCOR exam topic 6.3
