  type: single_choice
  topic_code: '6.4'
  difficulty: 1
  cert_tags: *id002
  stem: 'Scenario 185 (6.4): ACL on vty lines purpose?'
  choices:
  - id: b
    text: Encrypt OSPF
  - id: c
    text: Form Port-Channels
  - id: d
    text: Assign VLANs
  - id: a
    text: Restrict management access
  correct:
    answer: a
  explanation: '`access-class N in` on `line vty 0 4` filters **who can open an SSH/Telnet
    session**. It is a management-plane ACL, not a data-plane VLAN or EtherChannel
    tool.


    **Encrypt OSPF** is not the right selection: OSPF authentication is `ip ospf authentication
    message-digest` / key chains. A VTY ACL does not encrypt Hellos.


    **Form Port-Channels** is not the right selection: EtherChannel is `channel-group`.
    A VTY ACL does not bundle ports.


    **Assign VLANs** is not the right selection: Access VLAN is `switchport access
    vlan`. A VTY ACL does not assign VLANs.'
  references:
  - ENCOR 350-401 Official Cert Guide — Automation
  - ENCOR exam topic 6.4
