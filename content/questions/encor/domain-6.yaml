- id: encor-gen-0022-074ae0
  type: single_choice
  topic_code: '6.3'
  difficulty: 3
  cert_tags: *id002
  stem: 'Scenario 22 (6.3): Better password storage in configs?'
  choices:
  - id: c
    text: Disable AAA
  - id: d
    text: Telnet only
  - id: a
    text: Type 8/9 secrets
  - id: b
    text: Banner plaintext
  correct:
    answer: a
  explanation: 'Modern IOS `enable algorithm-type scrypt secret` / type **8** (PBKDF2)
    and type **9** (scrypt) store password hashes that are far harder to crack than
    type 5 MD5 or type 7 reversible Vigenère.


    **Disable AAA** is not the right selection: Disabling AAA removes centralized
    auth; it does not hash local secrets better.


    **Telnet only** is not the right selection: Telnet sends credentials in cleartext.
    It is worse storage/transport, not better.


    **Banner plaintext** is not the right selection: Banners (`banner motd`) are plaintext
    legal notices, not password storage.'
  references:
