  type: single_choice
  topic_code: '6.4'
  difficulty: 2
  cert_tags: *id001
  stem: Generative AI in network operations is best characterized as?
  choices:
  - id: a
    text: Models that create content/suggestions from learned patterns
  - id: b
    text: Only OSPF SPF calculation
  - id: c
    text: Only CAM aging
  - id: d
    text: Only PoE budgeting
  correct:
    answer: a
  explanation: '**Models that create content/suggestions from learned patterns**: **PAT** (NAT overload)
    maps many inside addresses to one outside address using unique transport port numbers. This is the
    correct answer for the stem. Configuration uses `ip nat inside source list <acl> interface <if> overload`.


    **Only OSPF SPF calculation**: **OSPF** is a link-state IGP that builds a topology database and calculates
    loop-free paths with cost based primarily on interface bandwidth. This does not satisfy the condition
    required by the stem. Configuration uses `router ospf <process>`.


    **Only CAM aging** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **Only PoE budgeting** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.4
