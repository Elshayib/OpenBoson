  type: single_choice
  topic_code: '6.7'
  difficulty: 3
  cert_tags: *id001
  stem: JSON data structures primarily use which pair of container types?
  choices:
  - id: a
    text: Objects and arrays
    rationale: '{} and [].'
  - id: b
    text: Only XML tags
    rationale: XML.
  - id: c
    text: Only YANG identities
    rationale: Modeling.
  - id: d
    text: Only TLV binary
    rationale: Other encodings.
  correct:
    answer: a
  explanation: JSON objects and arrays are the core structures for API payloads.
  references:
  - CCNA 6.7 — JSON
- id: ccna-6-004
  type: single_choice
  topic_code: '6.4'
  difficulty: 2
  cert_tags: *id001
  stem: Generative AI in network operations is best characterized as?
  choices:
  - id: a
    text: Models that create content/suggestions from learned patterns
    rationale: Generative AI.
  - id: b
    text: Only OSPF SPF calculation
    rationale: Routing.
  - id: c
