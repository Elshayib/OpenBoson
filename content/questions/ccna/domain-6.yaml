  - id: c
    text: A Layer 2 loop prevention protocol
  - id: d
    text: A wireless encryption cipher
  correct:
    answer: a
  explanation: 'Ansible automates configuration with playbooks, often without agents.


    **Agentless automation using SSH/APIs and YAML playbooks** is correct: Ansible.


    **A link-state routing protocol** is not the right selection: OSPF/IS-IS.


    **A Layer 2 loop prevention protocol** is not the right selection: STP.


    **A wireless encryption cipher** is not the right selection: CCMP etc.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-003
  type: single_choice
  topic_code: '6.7'
  difficulty: 3
  cert_tags: *id001
  stem: JSON data structures primarily use which pair of container types?
  choices:
  - id: a
    text: Objects and arrays
  - id: b
    text: Only XML tags
  - id: c
    text: Only YANG identities
  - id: d
    text: Only TLV binary
  correct:
    answer: a
  explanation: 'JSON has two containers: **objects** `{ "key": value }` and **arrays**
    `[ ... ]`. Values are string, number, object, array, boolean, or null. RESTCONF/YANG
    payloads and most controller APIs use this pair.


    **Objects and arrays** are those two JSON containers.


    **Only XML tags** describe **XML** (`<rpc>`) used by NETCONF. JSON does not use
    angle-bracket tags.


    **Only YANG identities** are YANG language statements for typed enumerations.
    YANG **models** data; JSON **encodes** an instance.


    **Only TLV binary** is how many routing protocols (LLDP, BGP attributes) encode
    on the wire. JSON is text, not TLV.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.7
  provider: openboson
  license: MIT
  provenance: original
