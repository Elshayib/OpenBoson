- id: ccna-6-006
  type: single_choice
  topic_code: '6.1'
  difficulty: 2
  cert_tags: *id001
  stem: Automation impacts network management primarily by?
  choices:
  - id: a
    text: Reducing manual repetitive changes / increasing consistency
  - id: b
    text: Eliminating all need for routing protocols
  - id: c
    text: Removing switching entirely
  - id: d
    text: Forcing Telnet only
  correct:
    answer: a
  explanation: 'Automation improves consistency and speed of changes.


    **Reducing manual repetitive changes / increasing consistency**: Automation improves
    consistency and speed of changes.


    **Eliminating all need for routing protocols**: Automation configures and verifies
    IGPs/BGP; it does not replace the need for a routing protocol in the underlay.


    **Removing switching entirely**: Automation does not replace Ethernet switching.
    Access switches still switch.


    **Forcing Telnet only**: Telnet (TCP 23) is cleartext remote CLI.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-007
  type: single_choice
  topic_code: '6.2'
  difficulty: 3
  cert_tags: *id001
  stem: Controller-based networking differs from traditional by?
  choices:
  - id: a
    text: Centralizing control-plane decisions via a controller
  - id: b
    text: Removing all data planes
  - id: c
    text: Using only hubs
  - id: d
    text: Disabling APIs
  correct:
    answer: a
  explanation: 'Controllers centralize policy/control while devices forward.


    **Centralizing control-plane decisions via a controller**: Controllers centralize
    policy/control while devices forward.


    **Removing all data planes**: A controller programs data planes; it does not delete
    them. Packets still forward on the devices.


    **Using only hubs**: Hubs are a single collision domain. Controller-based networking
    still uses switches; it centralizes **control**, not the media.


    **Disabling APIs**: Controller-based fabrics expose northbound/southbound APIs;
    disabling them returns you to hop-by-hop CLI, the opposite of SDN.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-008
  type: single_choice
  topic_code: '6.5'
  difficulty: 4
  cert_tags: *id001
  stem: HTTP status 401 typically means?
  choices:
  - id: a
    text: Unauthorized
  - id: b
    text: OK
  - id: c
    text: Not Found
  - id: d
    text: Server Error
  correct:
    answer: a
  explanation: 'HTTP **401 Unauthorized** means the request lacked valid **authentication**
    (missing/bad token, basic auth, or session). The client should authenticate and
    retry. REST APIs on IOS-XE/controllers return 401 when the JWT or credentials
    are wrong.


    **Unauthorized** is status 401.


    **OK** is **200** — success with a body.


    **Not Found** is **404** — URI does not exist.


    **Server Error** is **5xx** (typically **500** Internal Server Error), a server-side
    failure, not an auth failure.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-009
  type: single_choice
  topic_code: '6.7'
  difficulty: 2
  cert_tags: *id001
  stem: In JSON, a boolean true is written how?
  choices:
  - id: a
    text: true (lowercase)
  - id: b
    text: True (Python style only)
  - id: c
    text: 'TRUE'
  - id: d
    text: 1 as only legal form
  correct:
    answer: a
  explanation: 'JSON boolean literals are lowercase true/false.


    **true (lowercase)**: JSON boolean literals are lowercase true/false.


    **True (Python style only)**: Python `True` is not valid JSON. JSON requires lowercase
    `true`.


    **TRUE**: JSON booleans are lowercase `true`. `TRUE` is a YAML/Python-ish token,
    invalid JSON.


    **1 as only legal form**: JSON numbers may be `1`, but a boolean must be lowercase
    `true`, not the integer 1.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.7
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-010
  type: single_choice
  topic_code: '6.6'
  difficulty: 3
  cert_tags: *id001
  stem: Terraform is commonly associated with?
  choices:
  - id: a
    text: Declarative infrastructure as code
  - id: b
    text: Only STP tuning
  - id: c
    text: Only EtherChannel hashing
  - id: d
    text: Only syslog facilities
  correct:
    answer: a
  explanation: 'Terraform declares desired infrastructure state.


    **Declarative infrastructure as code**: Terraform declares desired infrastructure
    state.


    **Only STP tuning**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **Only EtherChannel hashing**: EtherChannel bundles physical links into one logical
    interface; members must match speed, duplex, and mode.


    **Only syslog facilities**: Syslog exports device logs (UDP 514) with severity
    0–7.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-011
  type: single_choice
  topic_code: '6.5'
  difficulty: 4
  cert_tags: *id001
  stem: CRUD stands for?
  choices:
  - id: a
    text: Create, Read, Update, Delete
  - id: b
    text: CPU, RAM, Uplink, Disk
  - id: c
    text: Cisco Routing Update Daemon
  - id: d
    text: Classful Routing Under Demand
  correct:
    answer: a
  explanation: '**CRUD** is **Create, Read, Update, Delete** — the four persistent-storage
    operations REST maps onto HTTP POST/GET/PUT/DELETE.


    **Create, Read, Update, Delete** is the expansion.


    **CPU, RAM, Uplink, Disk** is a hardware mnemonic, not CRUD.


    **Cisco Routing Update Daemon** is a made-up protocol name; Cisco routing uses
    OSPF/EIGRP/BGP processes, not a ‘CRUD daemon’.


    **Classful Routing Under Demand** is invented. Classful routing is legacy RIPv1/IGRP
    behavior, unrelated to CRUD.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-012
  type: single_choice
  topic_code: '6.3'
  difficulty: 2
  cert_tags: *id001
  stem: Separation of control and data planes enables?
  choices:
  - id: a
    text: Central policy with distributed forwarding
  - id: b
    text: Only single-process routers forever
  - id: c
    text: Only disabling CEF
  - id: d
    text: Only removing FIBs
  correct:
    answer: a
  explanation: 'SDN/controller designs split control from forwarding.


    **Central policy with distributed forwarding**: SDN/controller designs split control
    from forwarding.


    **Only single-process routers forever**: Control/data-plane split (SDN or modular
    IOS) is the opposite of “one process forever.”.


    **Only disabling CEF**: CEF is IOS forwarding from the FIB, not process switching.


    **Only removing FIBs**: Control/data-plane separation lets a controller program
    forwarding. It does not mean “delete the FIB.”.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-013
  type: single_choice
  topic_code: '6.4'
  difficulty: 3
  cert_tags: *id001
  stem: Machine learning in network ops often helps with?
  choices:
  - id: a
    text: Anomaly detection / predictive insights
  - id: b
    text: Only manually typing ACLs faster without models
  - id: c
    text: Only increasing STP diameter
  - id: d
    text: Only disabling telemetry
  correct:
    answer: a
  explanation: 'ML supports predictive/anomaly use cases in operations.


    **Anomaly detection / predictive insights**: ML supports predictive/anomaly use
    cases in operations.


    **Only manually typing ACLs faster without models**: ML in ops is anomaly detection
    and prediction from telemetry, not “type ACLs faster.”.


    **Only increasing STP diameter**: Spanning Tree elects a root bridge and blocks
    redundant Ethernet paths so the LAN does not loop.


    **Only disabling telemetry**: Model-driven telemetry streams YANG counters; disabling
    it removes visibility, it does not implement the feature in the objective.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-014
  type: single_choice
  topic_code: '6.1'
  difficulty: 4
  cert_tags: *id001
  stem: A key benefit of network automation is?
  choices:
  - id: a
    text: Repeatable, auditable changes
  - id: b
    text: Guaranteed zero outages forever
  - id: c
    text: Removal of all security
  - id: d
    text: Mandatory cleartext protocols
  correct:
    answer: a
  explanation: 'Automation improves repeatability and auditability.


    **Repeatable, auditable changes**: Automation improves repeatability and auditability.


    **Guaranteed zero outages forever**: Automation makes changes repeatable and auditable.
    It does not promise zero outages.


    **Removal of all security**: Automation should **enforce** security (SSH, AAA,
    consistent ACLs), not remove it.


    **Mandatory cleartext protocols**: Automation should push SSH, TLS, and type 8/9
    secrets — not mandate Telnet or cleartext.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-015
  type: single_choice
  topic_code: '6.2'
  difficulty: 2
  cert_tags: *id001
  stem: Southbound APIs connect a controller to?
  choices:
  - id: a
    text: Network devices
  - id: b
    text: Only business apps exclusive
  - id: c
    text: Only DNS roots
  - id: d
    text: Only end-user browsers exclusive
  correct:
    answer: a
  explanation: 'Southbound interfaces program the network devices.


    **Network devices**: Southbound interfaces program the network devices.


    **Only business apps exclusive**: Southbound APIs (NETCONF, gNMI, CLI) talk to
    **network devices**, not only business applications (those are northbound).


    **Only DNS roots**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on
    UDP/TCP 53.


    **Only end-user browsers exclusive**: Southbound APIs target **network elements**,
    not only browsers (browsers consume northbound REST).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-016
  type: single_choice
  topic_code: '6.6'
  difficulty: 3
  cert_tags: *id001
  stem: Ansible inventory defines?
  choices:
  - id: a
    text: Hosts/groups and variables
  - id: b
    text: Only TCAM
  - id: c
    text: Only FIB
  - id: d
    text: Only RIB
  correct:
    answer: a
  explanation: 'Inventory lists managed hosts and group vars.


    **Hosts/groups and variables**: Inventory lists managed hosts and group vars.


    **Only TCAM**: TCAM stores hardware ACL/QoS/FIB entries.


    **Only FIB**: The FIB is the forwarding table CEF programs from the RIB.


    **Only RIB**: The RIB is the routing table (`show ip route`) before CEF install.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-017
  type: single_choice
  topic_code: '6.7'
  difficulty: 4
  cert_tags: *id001
  stem: A JSON object is delimited by?
  choices:
  - id: a
    text: Curly braces {}
  - id: b
    text: Only angle brackets
  - id: c
    text: Only parentheses
  - id: d
    text: Only spaces
  correct:
    answer: a
  explanation: 'Objects use {}; arrays use [].


    **Curly braces {}**: Objects use {}; arrays use [].


    **Only angle brackets**: Angle brackets are XML tags. JSON uses `{}` / `[]`, not
    `<tag>`.


    **Only parentheses**: Parentheses group expressions. JSON arrays use `[ ]`; objects
    use `{ }`.


    **Only spaces**: JSON allows insignificant whitespace. Arrays still need `[` `]`
    and commas between elements.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.7
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-018
  type: single_choice
  topic_code: '6.5'
  difficulty: 2
  cert_tags: *id001
  stem: Which header often carries a REST API token?
  choices:
  - id: a
    text: Authorization
  - id: b
    text: Only X-STP-Root
  - id: c
    text: Only Via OSPF
  - id: d
    text: 'Only Server: nginx required'
  correct:
    answer: a
  explanation: 'Bearer tokens commonly travel in Authorization.


    **Authorization**: Bearer tokens commonly travel in Authorization.


    **Only X-STP-Root**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **Only Via OSPF**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default AD
    110, multicast 224.0.0.5/6).


    **Only Server: nginx required**: HTTP 200/201 success does not require an `Server:
    nginx` header. That header is optional product identity.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-6-019
  type: single_choice
  topic_code: '6.3'
  difficulty: 3
  cert_tags: *id001
  stem: A fabric in SDN terminology typically includes?
  choices:
  - id: a
    text: Overlay services on an underlay
  - id: b
    text: Only serial TDM
  - id: c
    text: Only Token Ring
  - id: d
    text: Only analog modems
  correct:
    answer: a
  explanation: 'Fabrics combine underlay reachability with overlay services.


    **Overlay services on an underlay**: Fabrics combine underlay reachability with
    overlay services.


    **Only serial TDM**: TDM serial (T1/E1) is a legacy WAN multiplexing method, not
    Clos fabric.


    **Only Token Ring**: Token Ring is a legacy LAN (IEEE 802.5), not modern campus
    Ethernet.


    **Only analog modems**: Spine-leaf is 10/25/40/100G Ethernet, not analog dial-up
    modems.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0046-ec29bb
  type: single_choice
  topic_code: '6.1'
  difficulty: 2
  cert_tags: &id003
  - ccna
  stem: 'Scenario 46 (6.1): Better password storage in configs?'
  choices:
  - id: c
    text: Disable AAA
  - id: d
    text: Telnet only
  - id: a
    text: Type 8/9 secrets
  - id: b
    text: Banner plaintext
  correct:
    answer: a
  explanation: 'Modern IOS `enable algorithm-type scrypt secret` / type **8** (PBKDF2)
    and type **9** (scrypt) store password hashes that are far harder to crack than
    type 5 MD5 or type 7 reversible Vigenère.


    **Type 8/9 secrets**: Modern IOS `enable algorithm-type scrypt secret` / type
    **8** (PBKDF2) and type **9** (scrypt) store password hashes that are far harder
    to crack than type 5 MD5 or type 7 reversible Vigenère.


    **Disable AAA**: Disabling AAA removes centralized auth; it does not hash local
    secrets better.


    **Telnet only**: Telnet sends credentials in cleartext. It is worse storage/transport,
    not better.


    **Banner plaintext**: Banners (`banner motd`) are plaintext legal notices, not
    password storage.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0047-67a8c2
  type: single_choice
  topic_code: '6.2'
  difficulty: 3
  cert_tags: *id003
  stem: 'Scenario 47 (6.2): ACL on vty lines purpose?'
  choices:
  - id: d
    text: Assign VLANs
  - id: a
    text: Restrict management access
  - id: b
    text: Encrypt OSPF
  - id: c
    text: Form Port-Channels
  correct:
    answer: a
  explanation: '`access-class N in` on `line vty 0 4` filters **who can open an SSH/Telnet
    session**. It is a management-plane ACL, not a data-plane VLAN or EtherChannel
    tool.


    **Restrict management access**: `access-class N in` on `line vty 0 4` filters
    **who can open an SSH/Telnet session**. It is a management-plane ACL, not a data-plane
    VLAN or EtherChannel tool.


    **Assign VLANs**: Access VLAN is `switchport access vlan`. A VTY ACL does not
    assign VLANs.


    **Encrypt OSPF**: OSPF authentication is `ip ospf authentication message-digest`
    / key chains. A VTY ACL does not encrypt Hellos.


    **Form Port-Channels**: EtherChannel is `channel-group`. A VTY ACL does not bundle
    ports.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.2
  provider: openboson
  license: MIT
  provenance: original
