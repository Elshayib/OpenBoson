  difficulty: 5
  cert_tags: *id004
  stem: Which option correctly describes a key idea under 6.2?
  choices:
  - id: d
    text: Confuse 6.2 with an unrelated Layer mismatch
  - id: a
    text: Prefer the documented 6.2 approach used in enterprise designs
  - id: b
    text: Treat 6.2 as optional when the blueprint lists it
  - id: c
    text: Ignore verification and assume 6.2 always works
  correct:
    answer: a
  explanation: 'The idea behind 6.2 is Traditional vs controller-based networking,
    not a look-alike feature.


    A controller centralizes policy; traditional boxes each run their own control
    plane. Southbound still programs the data plane — it does not delete it.


    **Prefer the documented 6.2 approach used in enterprise designs** records what
    you meant to configure so the next change is not guesswork. **Confuse 6.2 with
    an unrelated Layer mismatch** applies a different OSI layer than the fact describes.
    **Treat 6.2 as optional when the blueprint lists it** is wrong: this exam topic
    is on the blueprint.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.2
