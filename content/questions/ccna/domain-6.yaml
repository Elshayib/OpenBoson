  explanation: 'Ansible automates configuration with playbooks, often without agents.


    **Agentless automation using SSH/APIs and YAML playbooks**: Ansible.


    **A link-state routing protocol**: OSPF/IS-IS.


    **A Layer 2 loop prevention protocol**: STP.


    **A wireless encryption cipher**: CCMP etc.'
  references:
