- id: ccna-gen-0046-ec29bb
  type: single_choice
  topic_code: '6.1'
  difficulty: 2
  cert_tags: &id003
  - ccna
  stem: 'Scenario 46 (6.1): Better password storage in configs?'
  choices:
  - id: c
    text: Disable AAA
  - id: d
    text: Telnet only
  - id: a
    text: Type 8/9 secrets
  - id: b
    text: Banner plaintext
  correct:
    answer: a
  explanation: 'Modern IOS `enable algorithm-type scrypt secret` / type **8** (PBKDF2)
    and type **9** (scrypt) store password hashes that are far harder to crack than
    type 5 MD5 or type 7 reversible Vigenère.


    **Disable AAA** is not the right selection: Disabling AAA removes centralized
    auth; it does not hash local secrets better.


    **Telnet only** is not the right selection: Telnet sends credentials in cleartext.
    It is worse storage/transport, not better.


    **Banner plaintext** is not the right selection: Banners (`banner motd`) are plaintext
    legal notices, not password storage.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0047-67a8c2
  type: single_choice
  topic_code: '6.2'
  difficulty: 3
  cert_tags: *id003
  stem: 'Scenario 47 (6.2): ACL on vty lines purpose?'
  choices:
  - id: d
    text: Assign VLANs
  - id: a
    text: Restrict management access
  - id: b
    text: Encrypt OSPF
  - id: c
    text: Form Port-Channels
  correct:
    answer: a
  explanation: '`access-class N in` on `line vty 0 4` filters **who can open an SSH/Telnet
    session**. It is a management-plane ACL, not a data-plane VLAN or EtherChannel
    tool.


    **Assign VLANs** is not the right selection: Access VLAN is `switchport access
    vlan`. A VTY ACL does not assign VLANs.


    **Encrypt OSPF** is not the right selection: OSPF authentication is `ip ospf authentication
    message-digest` / key chains. A VTY ACL does not encrypt Hellos.


    **Form Port-Channels** is not the right selection: EtherChannel is `channel-group`.
    A VTY ACL does not bundle ports.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.2
  provider: openboson
  license: MIT
  provenance: original
