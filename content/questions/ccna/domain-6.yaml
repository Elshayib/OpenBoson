questions:
- id: ccna-6-001
  type: single_choice
  topic_code: '6.5'
  difficulty: 3
  cert_tags: &id001
  - ccna
  stem: REST-based APIs commonly use which HTTP methods for CRUD?
  choices:
  - id: a
    text: GET/POST/PUT/PATCH/DELETE
  - id: b
    text: Only HELLO/DBD
  - id: c
    text: Only INVITE/BYE
  - id: d
    text: Only SYN/ACK
  correct:
    answer: a
  explanation: 'REST maps CRUD to HTTP: **GET** (read), **POST** (create), **PUT/PATCH**
    (update), **DELETE** (delete). Network controllers (DNA Center, vManage, RESTCONF)
    expose those verbs on URIs.


    **GET/POST/PUT/PATCH/DELETE** is that REST/CRUD mapping.


    **Only HELLO/DBD** are **OSPF** packet types (Hello, Database Description), not
    HTTP methods.


    **Only INVITE/BYE** are **SIP** methods for voice call setup/teardown.


    **Only SYN/ACK** are **TCP** handshake flags, the transport under HTTP, not the
    REST verbs themselves.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
