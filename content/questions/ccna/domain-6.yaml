- id: ccna-6-008
  type: single_choice
  topic_code: '6.5'
  difficulty: 4
  cert_tags: *id001
  stem: HTTP status 401 typically means?
  choices:
  - id: a
    text: Unauthorized
  - id: b
    text: OK
  - id: c
    text: Not Found
  - id: d
    text: Server Error
  correct:
    answer: a
  explanation: 'HTTP **401 Unauthorized** means the request lacked valid **authentication**
    (missing/bad token, basic auth, or session). The client should authenticate and
    retry. REST APIs on IOS-XE/controllers return 401 when the JWT or credentials
    are wrong.


    **Unauthorized** is status 401.


    **OK** is **200** — success with a body.


    **Not Found** is **404** — URI does not exist.


    **Server Error** is **5xx** (typically **500** Internal Server Error), a server-side
    failure, not an auth failure.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Automation and Programmability
  - CCNA exam topic 6.5
  provider: openboson
  license: MIT
  provenance: original
