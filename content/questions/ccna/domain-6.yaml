- id: ccna-6-001
  type: single_choice
  topic_code: '6.5'
  difficulty: 3
  cert_tags: &id001
  - ccna
  stem: REST-based APIs commonly use which HTTP methods for CRUD?
  choices:
  - id: a
    text: GET/POST/PUT/PATCH/DELETE
    rationale: CRUD via HTTP.
  - id: b
    text: Only HELLO/DBD
    rationale: OSPF.
  - id: c
    text: Only INVITE/BYE
    rationale: SIP.
  - id: d
    text: Only SYN/ACK
    rationale: TCP.
  correct:
    answer: a
  explanation: REST maps create/read/update/delete to HTTP verbs.
  references:
  - CCNA 6.5 — REST APIs
- id: ccna-6-002
  type: single_choice
  topic_code: '6.6'
  difficulty: 2
  cert_tags: *id001
  stem: Ansible is best described as?
  choices:
  - id: a
    text: Agentless automation using SSH/APIs and YAML playbooks
    rationale: Ansible.
  - id: b
    text: A link-state routing protocol
    rationale: OSPF/IS-IS.
  - id: c
    text: A Layer 2 loop prevention protocol
    rationale: STP.
  - id: d
    text: A wireless encryption cipher
    rationale: CCMP etc.
  correct:
    answer: a
  explanation: Ansible automates configuration with playbooks, often without agents.
  references:
  - CCNA 6.6 — Ansible/Terraform
