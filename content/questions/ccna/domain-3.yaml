  stem: Place OSPF adjacency states in order from Down to Full.
  ordered_items:
  - ExStart
  - Init
  - Down
  - Full
  - 2-Way
  - Loading
  - Exchange
  correct:
    order:
    - Down
    - Init
    - 2-Way
    - ExStart
    - Exchange
    - Loading
    - Full
  explanation: OSPF neighbors move **Down → Init → 2-Way → ExStart → Exchange → Loading
    → Full**. Down is no Hellos. Init is a Hello heard. 2-Way is bidirectional (DR
    election can finish here on a LAN). ExStart/Exchange/Loading master the DD and
    flood LSAs. Full means the LSDBs match.
  references:
