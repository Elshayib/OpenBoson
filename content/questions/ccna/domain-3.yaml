- id: ccna-3-007
  type: single_choice
  topic_code: '3.4'
  difficulty: 3
  cert_tags: *id001
  stem: OSPF Hello packets on Ethernet use which multicast?
  choices:
  - id: a
    text: 224.0.0.5
  - id: b
    text: 224.0.0.9
  - id: c
    text: 224.0.0.10
  - id: d
    text: 255.255.255.255
  correct:
    answer: a
  explanation: 'On broadcast multiaccess networks OSPF Hellos (and LSUs to AllSPFRouters)
    go to multicast **224.0.0.5**. AllDRRouters **224.0.0.6** is used by DROthers
    to talk to the DR/BDR.


    **224.0.0.5** is AllSPFRouters — every OSPF router on the link listens.


    **224.0.0.9** is **RIPv2**. Seeing it does not mean OSPF is up.


    **224.0.0.10** is **EIGRP**. Different IGP, different multicast.


    **255.255.255.255** is limited broadcast. OSPF on Ethernet uses multicast (or
    unicast on NBMA), not 255.255.255.255 Hellos.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-008
  type: single_choice
  topic_code: '3.4'
  difficulty: 4
  cert_tags: *id001
  stem: Which OSPF network type elects DR/BDR on multiaccess?
  choices:
  - id: a
    text: Broadcast
  - id: b
    text: Point-to-point
  - id: c
    text: Loopback
  - id: d
    text: Nonbroadcast always without DR
  correct:
    answer: a
  explanation: 'OSPF **broadcast** network type (default on Ethernet) elects a **DR
    and BDR** so the LAN does not become an N^2 adjacency mesh. Point-to-point does
    **not** elect a DR.


    **Broadcast** is the multiaccess type that elects DR/BDR (Hello 10 s / dead 40
    s by default).


    **Point-to-point** (serial, or `ip ospf network point-to-point` on Ethernet) has
    a single neighbor and **no DR/BDR**.


    **Loopback** is advertised as a /32; there is no neighbor and no election.


    **Nonbroadcast always without DR** is wrong on two counts: NBMA (Frame Relay-style)
    **does** elect a DR, and neighbors are unicast rather than multicast. ‘Always
    without DR’ describes point-to-point, not NBMA.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-009
  type: single_choice
  topic_code: '3.2'
  difficulty: 2
  cert_tags: *id001
  stem: Longest prefix match prefers which route to 10.1.1.5?
  choices:
  - id: a
    text: 10.1.1.0/28 over 10.1.0.0/16
  - id: b
    text: Always AD only
  - id: c
    text: Always metric only
  - id: d
    text: Random ECMP only
  correct:
    answer: a
  explanation: 'Cisco IOS does **longest prefix match** first. `10.1.1.5` matches
    both `10.1.1.0/28` (28 bits) and `10.1.0.0/16` (16 bits); the /28 is installed
    even if the /16 has a better administrative distance or metric.


    **10.1.1.0/28 over 10.1.0.0/16** wins because 28 matching bits beat 16.


    **Always AD only** is consulted only among routes to the **same prefix** from
    different sources (for example OSPF AD 110 vs EIGRP AD 90). AD does not override
    a longer match.


    **Always metric only** (OSPF cost, EIGRP composite) ranks paths **inside one protocol**
    after the prefix length is already chosen. A /16 with cost 1 still loses to a
    /28 with cost 100.


    **Random ECMP only** appears when prefix length, AD, and metric are all equal
    (`maximum-paths`). It never beats a longer prefix.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-010
  type: single_choice
  topic_code: '3.1'
  difficulty: 3
  cert_tags: *id001
  stem: What does a routing table 'S*' typically indicate on Cisco?
  choices:
  - id: a
    text: Candidate default static
  - id: b
    text: OSPF summary
  - id: c
    text: BGP aggregate
  - id: d
    text: Connected
  correct:
    answer: a
  explanation: 'Cisco `show ip route` codes: **C** connected, **L** local, **S** static,
    **S*** candidate default static (gateway of last resort), **O** OSPF, **B** BGP,
    **D** EIGRP, **R** RIP.


    **Candidate default static** is **S*** — typically `ip route 0.0.0.0 0.0.0.0 nh`
    marked as the gateway of last resort.


    **OSPF summary** shows as **O IA** (inter-area Type-3) or **O** for an intra-area
    prefix, never S*.


    **BGP aggregate** lives in the BGP table (`aggregate-address`) and installs as
    **B** or **B***>, not S*.


    **Connected** is code **C** — a prefix on an up/up interface. It is a directly
    attached network, not a static default.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-011
  type: single_choice
  topic_code: '3.3'
  difficulty: 4
  cert_tags: *id001
  stem: Floating static routes use what technique?
  choices:
  - id: a
    text: Higher AD than primary
  - id: b
    text: Lower AD than connected
  - id: c
    text: Only PBR
  - id: d
    text: Only NAT
  correct:
    answer: a
  explanation: 'A **floating static** is a backup route with a **higher administrative
    distance** than the primary (often 1 for a normal static, 110 for OSPF, so a floating
    static uses AD 210 or similar: `ip route 0.0.0.0 0.0.0.0 Nh 210`). It sits unused
    until the better AD route disappears.


    **Higher AD than primary** is the technique (worse preference = backup).


    **Lower AD than connected** is impossible as a backup: connected is AD 0, the
    best possible. A static cannot outrank a connected prefix on the same router in
    the way this option implies, and it would not ‘float’.


    **Only PBR** (`ip policy route-map`) overrides forwarding per-packet independent
    of the RIB AD. It is not a floating static.


    **Only NAT** translates addresses; it does not install a backup prefix in the
    routing table.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-012
  type: single_choice
  topic_code: '3.4'
  difficulty: 2
  cert_tags: *id001
  stem: OSPF areas exist primarily to?
  choices:
  - id: a
    text: Limit LSA flooding scope
  - id: b
    text: Replace IP addresses
  - id: c
    text: Encrypt all payloads
  - id: d
    text: Terminate VLANs
  correct:
    answer: a
  explanation: |
    OSPF **areas** hierarchicalize the domain so Type-1/2 LSAs stay inside an area. ABRs originate Type-3 summaries instead of flooding every intra-area LSA everywhere. That **limits LSA flooding** and shrinks LSDBs/SPF.

    **Limit LSA flooding scope** is why areas exist.

    **Replace IP addresses** is NAT (or an addressing redesign). Areas do not translate prefixes.

    **Encrypt all payloads** is IPsec/TLS. OSPF can authenticate Hellos (`ip ospf authentication`), but an area is not an encryption boundary.

    **Terminate VLANs** is an SVI / ROAS / L3-switch job. Area 0 vs area 1 is an OSPF LSDB boundary, not a VLAN terminator.
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-013
  type: single_choice
  topic_code: '3.5'
  difficulty: 3
  cert_tags: *id001
  stem: 'First Hop Redundancy: HSRP uses which virtual concept?'
  choices:
  - id: a
    text: Virtual IP and virtual MAC
  - id: b
    text: Only anycast DNS
  - id: c
    text: Only VRRP exclusive
  - id: d
    text: Only GLBP without VIP
  correct:
    answer: a
  explanation: 'HSRP presents a virtual IP/MAC to hosts.


    **Virtual IP and virtual MAC**: HSRP presents a virtual IP/MAC to hosts.


    **Only anycast DNS**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on
    UDP/TCP 53.


    **Only VRRP exclusive**: VRRP (RFC 5798) is the standards-based FHRP with a virtual
    IP/MAC and a master router.


    **Only GLBP without VIP**: GLBP load-shares first-hop gateways using AVG/AVF virtual
    MACs.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-014
  type: single_choice
  topic_code: '3.5'
  difficulty: 4
  cert_tags: *id001
  stem: VRRP is best described as?
  choices:
  - id: a
    text: Standards-based FHRP
  - id: b
    text: Cisco-only proprietary
  - id: c
    text: A link-state IGP
  - id: d
    text: A wireless roaming protocol
  correct:
    answer: a
  explanation: 'VRRP (RFC 5798) is the **IETF standards-based** first-hop redundancy
    protocol: hosts use a virtual IP, and one router is master (default priority 100)
    owning the virtual MAC `0000.5e00.01xx`.


    **Standards-based FHRP** is VRRP — vendors including Cisco implement the open
    spec (`vrrp N ip A.B.C.D`).


    **Cisco-only proprietary** is **HSRP** (or GLBP). Those are Cisco protocols; VRRP
    is the multi-vendor standard, so a Juniper or Arista peer can share the same VIP.


    **A link-state IGP** is OSPF or IS-IS exchanging LSAs and running SPF. VRRP does
    not advertise prefixes or compute a topology; it only elects who owns the default-gateway
    IP/MAC on a LAN.


    **A wireless roaming protocol** (802.11r/k/v or CAPWAP mobility) moves clients
    between APs. VRRP is a wired first-hop gateway election, not RF roaming.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-015
  type: single_choice
  topic_code: '3.4'
  difficulty: 2
  cert_tags: *id001
  stem: Which LSA type describes a router’s own links in an area?
  choices:
  - id: a
    text: Type 1 Router LSA
  - id: b
    text: Type 5 External
  - id: c
    text: Type 4 ASBR summary
  - id: d
    text: Type 3 Network summary only
  correct:
    answer: a
  explanation: 'Type 1 LSAs describe a router''s links.


    **Type 1 Router LSA**: Type 1 LSAs describe a router''s links.


    **Type 5 External**: OSPF Type-5 external LSAs are originated by an ASBR.


    **Type 4 ASBR summary**: An ASBR redistributes external routes into OSPF (Type-5/7
    LSAs).


    **Type 3 Network summary only**: OSPF Type-3 summary LSAs are originated by an
    ABR for inter-area prefixes — not the OSI Network layer as a concept.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-016
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: Equal-cost multipath requires routes with equal what?
  choices:
  - id: a
    text: Metric (and eligible for install)
  - id: b
    text: Only interface bandwidth randomly
  - id: c
    text: Only AD different
  - id: d
    text: Only AS path length for OSPF
  correct:
    answer: a
  explanation: 'ECMP installs equal-metric paths.


    **Metric (and eligible for install)**: ECMP installs equal-metric paths.


    **Only interface bandwidth randomly**: ECMP needs **equal** metrics, not random
    bandwidth values.


    **Only AD different**: ECMP requires **equal metric** (and same prefix/AD). Different
    ADs mean only the better AD is installed.


    **Only AS path length for OSPF**: OSPF is a link-state IGP (RID, areas, LSAs,
    cost, default AD 110, multicast 224.0.0.5/6).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-017
  type: single_choice
  topic_code: '3.1'
  difficulty: 4
  cert_tags: *id001
  stem: Which command displays the IPv4 routing table?
  choices:
  - id: a
    text: show ip route
  - id: b
    text: show vlan brief
  - id: c
    text: show cdp neighbors
  - id: d
    text: show spanning-tree
  correct:
    answer: a
  explanation: '`show ip route` displays the IPv4 routing table (RIB): route codes,
    prefixes, AD/metric, next hops, and the gateway of last resort.


    **show ip route** is the command that prints that IPv4 RIB.


    **show vlan brief** lists VLAN IDs, names, and access ports on a switch. It has
    no IPv4 prefixes or next hops.


    **show cdp neighbors** lists Cisco Layer-2 neighbors (device ID, local and remote
    interfaces). It is topology discovery, not the routing table.


    **show spanning-tree** shows STP root, port roles, and states per VLAN. It does
    not list IP routes.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-018
  type: single_choice
  topic_code: '3.4'
  difficulty: 2
  cert_tags: *id001
  stem: An ABR sits on the border of?
  choices:
  - id: a
    text: Area 0 and non-backbone areas (typically)
  - id: b
    text: Only two autonomous systems
  - id: c
    text: Only VLANs
  - id: d
    text: Only wireless controllers
  correct:
    answer: a
  explanation: |
    An **ABR** has at least one link in **area 0** and one link in a **non-backbone area**. It originates Type-3 summary LSAs between those areas (`show ip ospf border-routers`).

    **Area 0 and non-backbone areas (typically)** is that ABR placement.

    **Only two autonomous systems** describes an **ASBR** (or eBGP) connecting OSPF to another routing domain, not two OSPF areas.

    **Only VLANs** are L2 broadcast domains. An ABR is an OSPF router role, not a VLAN.

    **Only wireless controllers** terminate CAPWAP. They are not OSPF area borders.
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-019
  type: single_choice
  topic_code: '3.4'
  difficulty: 3
  cert_tags: *id001
  stem: OSPF cost on Cisco is often derived from?
  choices:
  - id: a
    text: Reference bandwidth / interface bandwidth
  - id: b
    text: Hop count only
  - id: c
    text: Delay by default like IGRP classic
  - id: d
    text: Administrative distance
  correct:
    answer: a
  explanation: 'Cisco OSPF cost uses reference BW / interface BW.


    **Reference bandwidth / interface bandwidth**: Cisco OSPF cost uses reference
    BW / interface BW.


    **Hop count only**: Hop count is RIP’s metric (max 15). OSPF uses cost; BGP uses
    path attributes.


    **Delay by default like IGRP classic**: Classic IGRP/EIGRP used bandwidth and
    delay in a composite metric. Cisco OSPF cost defaults to reference-bandwidth /
    interface bandwidth.


    **Administrative distance**: AD prefers one routing source over another (e.g.
    EIGRP 90 vs OSPF 110). OSPF cost is interface bandwidth (reference-bw / bw), not
    AD.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-020
  type: single_choice
  topic_code: '3.1'
  difficulty: 4
  cert_tags: *id001
  stem: Connected routes appear with which code?
  choices:
  - id: a
    text: C
  - id: b
    text: S
  - id: c
    text: O
  - id: d
    text: R
  correct:
    answer: a
  explanation: 'Connected routes use code C.


    **S**: Code **S** is a static route. Connected is **C**. S* specifically marks
    a candidate default.


    **O**: Code **O** is intra-area OSPF. A connected prefix is **C**.


    **R**: Code **R** is RIP. Connected is **C**.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-021
  type: single_choice
  topic_code: '3.5'
  difficulty: 2
  cert_tags: *id001
  stem: GLBP provides what additional capability vs classic HSRP?
  choices:
  - id: a
    text: Per-host load balancing across gateways
  - id: b
    text: Only active/standby with no sharing
  - id: c
    text: Only IPv6 RA exclusive
  - id: d
    text: Only STP root election
  correct:
    answer: a
  explanation: 'GLBP can load-share first-hop traffic.


    **Per-host load balancing across gateways**: GLBP can load-share first-hop traffic.


    **Only active/standby with no sharing**: That is classic HSRP/VRRP. **GLBP** elects
    an AVG and multiple AVFs so hosts share different virtual MACs (per-host load-share).


    **Only IPv6 RA exclusive**: IPv6 RA (NDP) auths a link gateway. GLBP is an IPv4/IPv6
    FHRP that **load-shares** via AVG/AVF virtual MACs, unlike HSRP’s single active
    forwarder.


    **Only STP root election**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-022
  type: single_choice
  topic_code: '3.3'
  difficulty: 3
  cert_tags: *id001
  stem: A recursive static route resolves the next hop via?
  choices:
  - id: a
    text: Another route in the RIB
  - id: b
    text: Only ARP without routing
  - id: c
    text: Only CDP
  - id: d
    text: Only VTP
  correct:
    answer: a
  explanation: 'Recursive lookup finds how to reach the next hop.


    **Another route in the RIB**: Recursive lookup finds how to reach the next hop.


    **Only ARP without routing**: ARP maps IPv4 addresses to MACs on the local Ethernet;
    IPv6 uses NDP.


    **Only CDP**: CDP is Cisco’s Layer 2 neighbor discovery protocol (`show cdp neighbors`).


    **Only VTP**: VTP floods VLAN advertisements among switches using a revision number;
    it does not route, NAT, or identify an overlay.'
