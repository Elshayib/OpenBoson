  type: ordered_list
  topic_code: '3.4'
  difficulty: 3
  cert_tags: &id001
  - ccna
  stem: Place OSPF adjacency states in order from Down to Full.
  ordered_items:
  - ExStart
  - Init
  - Down
  - Full
  - 2-Way
  - Loading
  - Exchange
  correct:
    order:
    - Down
    - Init
    - 2-Way
    - ExStart
    - Exchange
    - Loading
    - Full
  explanation: OSPF progresses Down → Init → 2-Way → ExStart → Exchange → Loading
    → Full.
  references:
  - CCNA 3.4 — OSPF
