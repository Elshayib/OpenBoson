- id: ccna-3-004
  type: single_choice
  topic_code: '3.4'
  difficulty: 3
  cert_tags: *id001
  stem: In OSPF, what identifies a router uniquely in the domain?
  choices:
  - id: a
    text: Router ID
  - id: b
    text: Process ID alone
  - id: c
    text: ASN
  - id: d
    text: VLAN ID
  correct:
    answer: a
  explanation: 'OSPF identifies a router in the LSDB by a 32-bit **Router ID**, written
    like an IPv4 address. IOS picks RID from `router-id`, else the highest loopback,
    else the highest up/up interface IPv4 address. Neighbors list that RID in Hellos
    and LSAs.


    **Router ID** is that unique OSPF identity.


    **Process ID alone** (`router ospf 1`) is **locally significant**. Two routers
    can use process 1 and still be different OSPF routers; mismatched process IDs
    still form an adjacency on Cisco IOS.


    **ASN** is a **BGP** autonomous system number, not an OSPF identifier.


    **VLAN ID** is an 802.1Q tag (1–4094). OSPF runs as a Layer 3 protocol and does
    not use VLAN IDs as router identity.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
