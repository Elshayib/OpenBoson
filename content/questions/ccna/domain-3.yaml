  cert_tags: *id001
  stem: 'First Hop Redundancy: HSRP uses which virtual concept?'
  choices:
  - id: a
    text: Virtual IP and virtual MAC
  - id: b
    text: Only anycast DNS
  - id: c
    text: Only VRRP exclusive
  - id: d
    text: Only GLBP without VIP
  correct:
    answer: a
  explanation: 'HSRP presents a virtual IP/MAC to hosts.


    **Only anycast DNS** is a mismatch: Anycast assigns the same unicast address to
    many nodes; routers deliver to the nearest. The stem is asking about **Virtual
    IP and virtual MAC**.


    **Only VRRP exclusive** is a mismatch: VRRP (RFC 5798) is the standards-based
    FHRP with a virtual IP/MAC and a master router. The stem is asking about **Virtual
    IP and virtual MAC**.


    **Only GLBP without VIP** points at GLBP without VIP, which is not how 3.5 (First
    hop redundancy protocol) solves this stem. The keyed answer is **Virtual IP and
    virtual MAC**.'
