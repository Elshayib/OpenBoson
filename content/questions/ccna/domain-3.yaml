- id: ccna-3-023
  type: single_choice
  topic_code: '3.4'
  difficulty: 4
  cert_tags: *id001
  stem: Passive interface in OSPF means?
  choices:
  - id: a
    text: Suppress Hellos / no adjacency on that interface
  - id: b
    text: Disable the interface IP
  - id: c
    text: Force DR forever
  - id: d
    text: Clear the RID
  correct:
    answer: a
  explanation: 'Passive interfaces advertise the network without forming neighbors.


    **Suppress Hellos / no adjacency on that interface**: Passive interfaces advertise
    the network without forming neighbors.


    **Disable the interface IP**: Passive-interface does not remove the interface
    address. The subnet is still advertised; neighbors simply never form.


    **Force DR forever**: Passive-interface prevents an adjacency, so there is no
    DR election on that link. It does not pin a DR.


    **Clear the RID**: Clearing the OSPF router ID is `clear ip ospf process` after
    `router-id`. `ip ospf passive-interface` only stops Hellos; it keeps the RID.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-024
  type: single_choice
  topic_code: '3.4'
  difficulty: 2
  cert_tags: *id001
  stem: Which packet starts OSPF neighbor formation?
  choices:
  - id: a
    text: Hello
  - id: b
    text: LSA Type 5 only
  - id: c
    text: BGP OPEN
  - id: d
    text: DHCP Discover
  correct:
    answer: a
  explanation: 'OSPF Hellos discover and maintain neighbors.


    **Hello**: OSPF Hellos discover and maintain neighbors.


    **LSA Type 5 only**: OSPF Type-5 external LSAs are originated by an ASBR.


    **BGP OPEN**: BGP is the Internet path-vector protocol (TCP 179; eBGP AD 20, iBGP
    AD 200).


    **DHCP Discover**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA, UDP
    67/68).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-025
  type: single_choice
  topic_code: '3.2'
  difficulty: 3
  cert_tags: *id001
  stem: Policy-based routing primarily uses what to override normal RIB choice?
  choices:
  - id: a
    text: Route maps / match criteria
  - id: b
    text: Only longest prefix always alone
  - id: c
    text: Only STP cost
  - id: d
    text: Only VTP revision
  correct:
    answer: a
  explanation: 'PBR can override destination-based forwarding.


    **Route maps / match criteria**: PBR can override destination-based forwarding.


    **Only longest prefix always alone**: PBR can override longest-match with a route-map
    (`set ip next-hop`). Longest match is the default RIB behavior PBR bypasses.


    **Only STP cost**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **Only VTP revision**: VTP floods VLAN advertisements among switches using a revision
    number; it does not route, NAT, or identify an overlay.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-026
  type: single_choice
  topic_code: '3.5'
  difficulty: 4
  cert_tags: *id001
  stem: HSRP version 2 expands which capability notably?
  choices:
  - id: a
    text: IPv6 and larger group ID space
  - id: b
    text: Only removes virtual MAC
  - id: c
    text: Only disables preempt
  - id: d
    text: Only forces VRRP
  correct:
    answer: a
  explanation: 'HSRPv2 adds IPv6 support and broader group ranges.


    **IPv6 and larger group ID space**: HSRPv2 adds IPv6 support and broader group
    ranges.


    **Only removes virtual MAC**: HSRPv2 changes the virtual MAC format and group
    range; it does not simply delete the virtual MAC.


    **Only disables preempt**: HSRPv2 adds a 256-group space and a new virtual MAC
    (`0000.0C9F.Fxxx`). It does not disable preempt (that is a separate command).


    **Only forces VRRP**: VRRP is the standards-based FHRP (virtual IP, one master).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-3-027
  type: single_choice
  topic_code: '3.3'
  difficulty: 2
  cert_tags: *id001
  stem: Null0 is often used with static routes for?
  choices:
  - id: a
    text: Discard / blackhole aggregation safety
  - id: b
    text: Preferred transit path always
  - id: c
    text: Only NAT pools
  - id: d
    text: Only AAA
  correct:
    answer: a
  explanation: 'Null0 statics discard unmatched traffic for summaries.


    **Discard / blackhole aggregation safety**: Null0 statics discard unmatched traffic
    for summaries.


    **Preferred transit path always**: A Null0 static on an aggregate **discards**
    unmatched more-specifics (loop prevention). It is not a preferred transit path.


    **Only NAT pools**: NAT/PAT rewrites IP addresses (and ports with overload) across
    inside/outside.


    **Only AAA**: AAA is Authentication, Authorization, and Accounting (RADIUS/TACACS+).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Connectivity / Routing
  - CCNA exam topic 3.3
