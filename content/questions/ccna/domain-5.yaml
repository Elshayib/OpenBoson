  explanation: 'MFA combines something you know/have/are.


    **Additional factors beyond a password**: MFA combines something you know/have/are.


    **Only longer Telnet banners**: Telnet (TCP 23) is cleartext remote CLI.


    **Only VTY ACL deny any**: MFA adds a second factor (token/push). A VTY `deny
