- id: ccna-5-006
  type: single_choice
  topic_code: '5.3'
  difficulty: 2
  cert_tags: *id001
  stem: Local device access control commonly uses?
  choices:
  - id: a
    text: Line/console/VTY passwords or local usernames
  - id: b
    text: Only BGP communities
  - id: c
    text: Only STP priority
  - id: d
    text: Only VTP password as sole AAA
  correct:
    answer: a
  explanation: 'Local passwords protect device management access.


    **Line/console/VTY passwords or local usernames**: Local passwords protect device
    management access.


    **Only BGP communities**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).


    **Only STP priority**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only VTP password as sole AAA**: VTP floods VLAN advertisements among switches
    using a revision number; it does not route, NAT, or identify an overlay.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.3
