  stem: Which feature prevents a switchport from learning more than N MACs?
  choices:
  - id: a
    text: Port security
  - id: b
    text: UplinkFast
  - id: c
    text: VTP pruning
  - id: d
    text: CDP
  correct:
    answer: a
  explanation: 'Port security limits learned MAC addresses per port.


    UplinkFast (classic PVST) speeds uplink recovery. **Port security** limits how
    many MACs a port may learn.


    **VTP pruning**: VTP floods VLAN advertisements among switches using a revision
    number; it does not route, NAT, or identify an overlay.


    CDP is Cisco’s Layer 2 neighbor discovery protocol (`show cdp neighbors`).'
