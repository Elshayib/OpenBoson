  explanation: 'Threats exploit vulnerabilities; mitigations reduce risk.


    **A weakness that can be exploited**: Vulnerability.


    **The attack itself**: Exploit/threat action.


    **Only a firewall rule**: Control.


    **Only an ACL line**: Control.'
