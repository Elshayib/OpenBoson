- id: ccna-5-022
  type: single_choice
  topic_code: '5.9'
  difficulty: 3
  cert_tags: *id001
  stem: WPA2 personal mode commonly uses?
  choices:
  - id: a
    text: PSK
  - id: b
    text: Only open auth mandatory
  - id: c
    text: Only WEP-40
  - id: d
    text: Only TKIP exclusive forever
  correct:
    answer: a
  explanation: 'WPA2-PSK is personal/pre-shared key mode.


    **PSK**: WPA2-PSK is personal/pre-shared key mode.


    **Only open auth mandatory**: Open authentication is no crypto. WPA2-Personal
    uses a **PSK** with CCMP/AES.


    **Only WEP-40**: WEP is a broken RC4 WLAN cipher; WPA2/WPA3 replaced it.


    **Only TKIP exclusive forever**: WPA2-Personal uses **CCMP/AES** (802.11i). TKIP
    was a WPA/WEP-era crutch, not the WPA2 mandate.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.9
