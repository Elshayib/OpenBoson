- id: ccna-gen-0037-6c3877
  type: single_choice
  topic_code: '5.10'
  difficulty: 3
  cert_tags: *id002
  stem: 'Scenario 37 (5.10): Common 2.4 GHz Wi-Fi band?'
  choices:
  - id: b
    text: 60 GHz only
  - id: c
    text: Sub-GHz only
  - id: d
    text: Visible light only
  - id: a
    text: 2.4 GHz ISM
  correct:
    answer: a
  explanation: '802.11b/g/n/ax still use the 2.4 GHz ISM band (channels 1–11 in the
    US). Non-overlapping set is 1, 6, and 11.


    **2.4 GHz ISM**: 802.11b/g/n/ax still use the 2.4 GHz ISM band (channels 1–11
    in the US). Non-overlapping set is 1, 6, and 11.


    **60 GHz only**: 60 GHz is 802.11ad/ay (WiGig), not the common 2.4 GHz LAN band.


    **Sub-GHz only**: Sub-GHz is 802.11ah (HaLow) / IoT, not typical enterprise 2.4
    GHz.


    **Visible light only**: Li-Fi / visible light is not 802.11 2.4 GHz Wi-Fi.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0038-4cdf93
  type: single_choice
  topic_code: '5.2'
  difficulty: 4
  cert_tags: *id002
  stem: 'Scenario 38 (5.2): WPA3 era wireless security focus?'
  choices:
  - id: c
    text: Clear-text PSK mandatory
  - id: d
    text: Disable 802.1X always
  - id: a
    text: Stronger SAE/handshake protections
  - id: b
    text: WEP revival
  correct:
    answer: a
  explanation: 'WPA3-Personal replaces PSK 4-way handshake with **SAE** (Dragonfly),
    giving forward secrecy and resistance to offline dictionary attacks. WPA3-Enterprise
    adds extra crypto options (192-bit suite).


    **Stronger SAE/handshake protections**: WPA3-Personal replaces PSK 4-way handshake
    with **SAE** (Dragonfly), giving forward secrecy and resistance to offline dictionary
    attacks. WPA3-Enterprise adds extra crypto options (192-bit suite).


    **Clear-text PSK mandatory**: WPA3 does not require a cleartext PSK on the air.
    SAE never puts the passphrase in a recoverable hash like WPA2’s 4-way handshake.


    **Disable 802.1X always**: WPA3-Enterprise **uses** 802.1X/EAP. WPA3 does not
    disable 802.1X.


    **WEP revival**: WEP (RC4, 24-bit IV) is broken and removed, not revived in WPA3.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
