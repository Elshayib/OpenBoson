  - id: c
    text: Only CoPP
  - id: d
    text: Only NetFlow exporters
  correct:
    answer: a
  explanation: 'GUI WLAN workflows apply WPA2-PSK to SSIDs.


    **Wireless security for client SSIDs**: GUI WLAN workflows apply WPA2-PSK to SSIDs.


    **Only underlay ECMP**: ECMP installs multiple equal-cost next hops (OSPF `maximum-paths`).


    **Only CoPP**: Control Plane Policing rate-limits traffic to the route processor.


    **Only NetFlow exporters**: NetFlow exports traffic caches for accounting and
    anomaly detection.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-013
  type: single_choice
  topic_code: '5.1'
  difficulty: 3
  cert_tags: *id001
  stem: An exploit is?
  choices:
  - id: a
    text: A method that takes advantage of a vulnerability
  - id: b
    text: Only a firewall
  - id: c
    text: Only a syslog facility
  - id: d
    text: Only a VLAN
  correct:
    answer: a
  explanation: 'A **vulnerability** is a weakness. An **exploit** is a method or tool
    that **takes advantage** of that weakness to violate CIA. A **threat** is the
    actor who might use it.


    **A method that takes advantage of a vulnerability** is the definition of an exploit.


    **Only a firewall** is a control that can *block* exploits; it is not itself an
    exploit.


    **Only a syslog facility** is a log channel (`local0`…`local7`). Logging may *record*
    an exploit; it is not one.


    **Only a VLAN** is an L2 broadcast domain. Segmentation can reduce blast radius;
    a VLAN is not an exploit.

    '
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-014
  type: single_choice
  topic_code: '5.5'
  difficulty: 4
  cert_tags: *id001
  stem: IPsec ESP provides?
  choices:
  - id: a
    text: Confidentiality and optionally integrity/auth
  - id: b
    text: Only routing updates
  - id: c
    text: Only STP
  - id: d
    text: Only DNSSEC
  correct:
    answer: a
  explanation: 'ESP encrypts (and may authenticate) payloads.


    **Confidentiality and optionally integrity/auth**: ESP encrypts (and may authenticate)
    payloads.


    **Only routing updates**: IPsec ESP encrypts (and may authenticate) **user packets**.
    Routing updates may ride inside, but ESP is not “routing-only.”.


    **Only STP**: Spanning Tree (802.1D / PVST+ / Rapid PVST+) elects a root and blocks
    redundant Layer 2 paths so Ethernet does not loop.


    **Only DNSSEC**: DNSSEC signs DNS records. IPsec **ESP** encrypts (and optionally
    authenticates) IP payloads.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-015
  type: single_choice
  topic_code: '5.8'
  difficulty: 2
  cert_tags: *id001
  stem: RADIUS typically uses which ports?
  choices:
  - id: a
    text: UDP 1812/1813 (or legacy 1645/1646)
  - id: b
    text: TCP 22
  - id: c
    text: UDP 53
  - id: d
    text: TCP 443 only
  correct:
    answer: a
  explanation: 'RADIUS auth/accounting use UDP 1812/1813.


    **UDP 1812/1813 (or legacy 1645/1646)**: RADIUS auth/accounting use UDP 1812/1813.


    TCP 22 is SSH. RADIUS is UDP 1812 (auth) and 1813 (accounting), or 1645/1646 legacy.


    UDP 53 is DNS. RADIUS uses UDP 1812/1813.


    **TCP 443 only**: TCP 443 is HTTPS. RADIUS is UDP 1812/1813, not 443.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.8
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-016
  type: single_choice
  topic_code: '5.3'
  difficulty: 3
  cert_tags: *id001
  stem: enable secret stores passwords using what by default historically?
  choices:
  - id: a
    text: Hashed (MD5/type 5 or stronger modern types)
  - id: b
    text: Cleartext always
  - id: c
    text: Only ROT13
  - id: d
    text: Only Base64
  correct:
    answer: a
  explanation: 'enable secret uses a hash; enable password was weaker/clearer.


    **Hashed (MD5/type 5 or stronger modern types)**: enable secret uses a hash; enable
    password was weaker/clearer.


    **Cleartext always**: Classic `enable secret` stores an MD5 (type 5) hash, not
    a cleartext password (that was `enable password`).


    **Only ROT13**: ROT13 is a Caesar cipher, not a password hash. `enable secret`
    used MD5 (type 5).


    **Only Base64**: Base64 is an encoding, not a password hash. Classic `enable secret`
    is MD5 (type 5), later type 8/9.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-017
  type: single_choice
  topic_code: '5.8'
  difficulty: 4
  cert_tags: *id001
  stem: In 802.1X, the authenticator is typically?
  choices:
  - id: a
    text: The switch/AP
  - id: b
    text: The end-user laptop alone
  - id: c
    text: Only the root DNS
  - id: d
    text: Only the STP root
  correct:
    answer: a
  explanation: 'The authenticator enforces port access pending AAA.


    **The switch/AP**: The authenticator enforces port access pending AAA.


    **The end-user laptop alone**: In 802.1X the **supplicant** is the laptop. The
    **authenticator** is the switch (or AP) that relays EAPoL to the RADIUS server.


    **Only the root DNS**: DNS maps names to addresses (A/AAAA) and reverse (PTR)
    on UDP/TCP 53.


    **Only the STP root**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.8
  provider: openboson
