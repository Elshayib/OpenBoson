- id: ccna-5-002
  type: single_choice
  topic_code: '5.6'
  difficulty: 3
  cert_tags: *id001
  stem: A standard ACL typically filters based on?
  choices:
  - id: a
    text: Source IP address
  - id: b
    text: Only destination port
  - id: c
    text: Only DSCP
  - id: d
    text: Only MAC OUI
  correct:
    answer: a
  explanation: 'A **standard** numbered ACL (`access-list 1–99` or `1300–1999`, or
    `ip access-list standard NAME`) matches **source IPv4 address only**. It cannot
    match destination IP, protocol, or L4 ports. Place it as close to the **destination**
    as practical because it is blunt.


    **Source IP address** is the only IPv4 criterion in a standard ACL.


    **Only destination port** requires an **extended** ACL (`access-list 100–199`
    / `ip access-list extended`) matching `tcp/udp ... eq port`.


    **Only DSCP** is a QoS match (`match dscp`) or an extended ACL `dscp` keyword
    — not a standard ACL.


    **Only MAC OUI** is a MAC ACL / port ACL at Layer 2 (`mac access-list extended`),
    not an IPv4 standard ACL.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-003
  type: single_choice
  topic_code: '5.7'
  difficulty: 3
  cert_tags: *id001
  stem: Dynamic ARP Inspection validates ARP using?
  choices:
  - id: a
    text: DHCP snooping bindings (typically)
  - id: b
    text: Only OSPF LSDB
  - id: c
    text: Only CDP
  - id: d
    text: Only NetFlow
  correct:
    answer: a
  explanation: '**Dynamic ARP Inspection** intercepts ARP on untrusted ports and checks
    each binding against the **DHCP snooping** table (IP–MAC–port–VLAN). Invalid ARPs
    are dropped, which stops ARP poisoning.


    **DHCP snooping bindings (typically)** is the DAI validation source (`ip arp inspection
    vlan N` plus snooping).


    **Only OSPF LSDB** is the OSPF topology database. It has router LSAs, not host
    ARP bindings, and is not consulted by DAI.


    **Only CDP** is Cisco’s L2 neighbor protocol (`show cdp neighbors`). It does not
    validate ARP.


    **Only NetFlow** exports traffic caches for accounting. It does not build an ARP
    allow-list.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.7
  provider: openboson
  license: MIT
  provenance: original
