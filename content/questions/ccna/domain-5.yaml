- id: ccna-5-007
  type: single_choice
  topic_code: '5.8'
  difficulty: 3
  cert_tags: *id001
  stem: AAA stands for?
  choices:
  - id: a
    text: Authentication, Authorization, Accounting
  - id: b
    text: Anycast, ACL, ARP
  - id: c
    text: AS, Area, ABR
  - id: d
    text: AES, AH, ESP only
  correct:
    answer: a
  explanation: '**AAA** is Authentication (who you are), Authorization (what you may
    do), and Accounting (what you did). On IOS: `aaa new-model` with RADIUS or TACACS+
    groups for login, exec, and command authorization.


    **Authentication, Authorization, Accounting** is the expansion.


    **Anycast, ACL, ARP** are unrelated networking terms forced into the same letters
    — not AAA.


    **AS, Area, ABR** are **BGP/OSPF** terms (autonomous system, OSPF area, area border
    router), not the access-control triad.


    **AES, AH, ESP only** are **IPsec** algorithms/headers (encryption, Authentication
    Header, Encapsulating Security Payload), not AAA.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.8
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-008
  type: single_choice
  topic_code: '5.2'
  difficulty: 4
  cert_tags: *id001
  stem: User awareness training is an example of?
  choices:
  - id: a
    text: Security program element
  - id: b
    text: Only OSPF tuning
  - id: c
    text: Only EtherChannel
  - id: d
    text: Only SPAN
  correct:
    answer: a
  explanation: 'Awareness/training are security program elements.


    **Security program element**: Awareness/training are security program elements.


    **Only OSPF tuning**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).


    **Only EtherChannel**: EtherChannel bundles physical links into one logical interface;
    members must match speed, duplex, and mode.


    **Only SPAN**: SPAN/RSPAN/ERSPAN copies frames to a sniffer or GRE destination.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-009
  type: single_choice
  topic_code: '5.4'
  difficulty: 2
  cert_tags: *id001
  stem: Multifactor authentication is a password policy alternative that adds?
  choices:
  - id: a
    text: Additional factors beyond a password
  - id: b
