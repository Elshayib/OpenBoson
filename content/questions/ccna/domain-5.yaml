    **Only identical passwords forever**: Complexity forbids reuse/sameness. Policies
    require rotation and mixed character classes.


    **Only blank enable**: Complexity policies require length, classes of characters,
    and aging — not a blank enable secret.


    **Only Telnet without AAA**: Telnet (TCP 23) is cleartext remote CLI.'
