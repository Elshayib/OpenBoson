- id: ccna-5-018
  type: single_choice
  topic_code: '5.6'
  difficulty: 2
  cert_tags: *id001
  stem: ACL implicit final rule is?
  choices:
  - id: a
    text: deny any
  - id: b
    text: permit any
  - id: c
    text: permit icmp
  - id: d
    text: deny tcp only
  correct:
    answer: a
  explanation: 'ACLs end with an implicit deny any.


    **deny any**: ACLs end with an implicit deny any.


    **permit any**: There is no implicit permit at the end of an IOS ACL. Unmatched
    traffic hits **deny any**.


    **permit icmp**: ICMP/ICMPv6 carries echo, unreachable, and TTL-expired messages.


    **deny tcp only**: The implicit ACL tail is **deny any** (all protocols), not
    “deny TCP only.”.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-019
  type: single_choice
  topic_code: '5.7'
  difficulty: 3
  cert_tags: *id001
  stem: IP Source Guard uses bindings to prevent?
  choices:
  - id: a
    text: IP spoofing on a port
  - id: b
    text: STP loops
  - id: c
    text: WLAN roaming
  - id: d
    text: BGP hijacks alone
  correct:
    answer: a
  explanation: 'IPSG drops traffic not matching bindings.


    **IP spoofing on a port**: IPSG drops traffic not matching bindings.


    **STP loops**: Spanning Tree elects a root bridge and blocks redundant Ethernet
    paths so the LAN does not loop.


    **WLAN roaming**: IP Source Guard drops IP packets whose src IP/MAC is not in
    the DHCP snooping binding. Roaming is a wireless mobility feature.


    **BGP hijacks alone**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.7
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-020
  type: single_choice
  topic_code: '5.4'
  difficulty: 4
  cert_tags: *id001
  stem: Password complexity policies typically require?
  choices:
  - id: a
