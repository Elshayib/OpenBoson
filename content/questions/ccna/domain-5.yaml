- id: ccna-5-010
  type: single_choice
  topic_code: '5.6'
  difficulty: 3
  cert_tags: *id001
  stem: Named ACLs on IOS are configured under which mode?
  choices:
  - id: a
    text: ip access-list standard/extended NAME
  - id: b
    text: Only interface vlan exclusively
  - id: c
    text: Only line vty without ACL
  - id: d
    text: Only spanning-tree mode
  correct:
    answer: a
  explanation: |
    Named ACLs are built in **`ip access-list standard NAME`** or **`ip access-list extended NAME`** mode, then `permit`/`deny` lines, then `ip access-group NAME in/out` on an interface.

    **ip access-list standard/extended NAME** is that configuration mode.

    **Only interface vlan exclusively** is SVI config (`interface vlan 10`). You may *apply* an ACL there, but you do not *create* a named ACL under the SVI.

    **Only line vty without ACL** is `line vty 0 4`. VTY uses `access-class`, and you still define the ACL with `ip access-list` first.

    **Only spanning-tree mode** is `spanning-tree mode rapid-pvst`. It has nothing to do with ACL syntax.
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-5-011
  type: single_choice
  topic_code: '5.7'
  difficulty: 4
  cert_tags: *id001
  stem: DHCP snooping builds a binding table of?
  choices:
  - id: a
    text: IP–MAC–port–VLAN mappings
  - id: b
    text: Only OSPF neighbors
  - id: c
    text: Only BGP paths
  - id: d
    text: Only STP roots
  correct:
    answer: a
  explanation: '`ip dhcp snooping` builds a **binding table** of **IP address, MAC,
    switch port, VLAN, and lease time** from DHCP ACKs seen on trusted ports. DAI,
    IP Source Guard, and some 802.1X features consume that table (`show ip dhcp snooping
    binding`).


    **IP–MAC–port–VLAN mappings** is exactly that binding.


    **Only OSPF neighbors** live in `show ip ospf neighbor` (RID, state, dead timer).
    DHCP snooping does not parse Hellos.


    **Only BGP paths** live in the BGP table (`show ip bgp`). Unrelated to DHCP leases.


    **Only STP roots** are the root bridge per VLAN (`show spanning-tree`). Snooping
    does not elect STP roots.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.7
  provider: openboson
  license: MIT
  provenance: original
