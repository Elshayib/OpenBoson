- id: ccna-5-018
  type: single_choice
  topic_code: '5.6'
  difficulty: 2
  cert_tags: *id001
  stem: ACL implicit final rule is?
  choices:
  - id: a
    text: deny any
  - id: b
    text: permit any
  - id: c
    text: permit icmp
  - id: d
    text: deny tcp only
  correct:
    answer: a
  explanation: 'ACLs end with an implicit deny any.


    **deny any**: ACLs end with an implicit deny any.


    **permit any**: There is no implicit permit at the end of an IOS ACL. Unmatched
    traffic hits **deny any**.


    **permit icmp**: ICMP/ICMPv6 carries echo, unreachable, and TTL-expired messages.


    **deny tcp only**: The implicit ACL tail is **deny any** (all protocols), not
