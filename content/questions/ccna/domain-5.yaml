- id: ccna-5-015
  type: single_choice
  topic_code: '5.8'
  difficulty: 2
  cert_tags: *id001
  stem: RADIUS typically uses which ports?
  choices:
  - id: a
    text: UDP 1812/1813 (or legacy 1645/1646)
  - id: b
    text: TCP 22
  - id: c
    text: UDP 53
  - id: d
    text: TCP 443 only
  correct:
    answer: a
  explanation: '**UDP 1812/1813 (or legacy 1645/1646)**: **UDP** provides connectionless datagram delivery
    without TCP’s reliability or ordering guarantees. This is the correct answer for the stem.


    **TCP 22**: **TCP** provides reliable, ordered, connection-oriented delivery using sequence and acknowledgment
    numbers, among other mechanisms. This does not satisfy the condition required by the stem.


    **UDP 53**: **UDP** provides connectionless datagram delivery without TCP’s reliability or ordering
    guarantees. This does not satisfy the condition required by the stem.


    **TCP 443 only**: **TCP** provides reliable, ordered, connection-oriented delivery using sequence
    and acknowledgment numbers, among other mechanisms. This does not satisfy the condition required by
    the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — Security Fundamentals
  - CCNA exam topic 5.8
  provider: openboson
  license: MIT
  provenance: original
