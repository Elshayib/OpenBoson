- id: ccna-4-017
  type: single_choice
  topic_code: '4.1'
  difficulty: 4
  cert_tags: *id001
  stem: PAT (NAT overload) conserves public IPs by?
  choices:
  - id: a
    text: Translating many insides to one/few globals with ports
  - id: b
    text: Only 1:1 static always
  - id: c
    text: Only disabling TCP
  - id: d
    text: Only using IPv6 exclusively
  correct:
    answer: a
  explanation: '**Translating many insides to one/few globals with ports**: **PAT** (NAT overload) maps
    many inside addresses to one outside address using unique transport port numbers. This is the correct
    answer for the stem. Configuration uses `ip nat inside source list <acl> interface <if> overload`.


    **Only 1:1 static always** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **Only disabling TCP**: **TCP** provides reliable, ordered, connection-oriented delivery using sequence
    and acknowledgment numbers, among other mechanisms. This does not satisfy the condition required by
    the stem.


    **Only using IPv6 exclusively** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
