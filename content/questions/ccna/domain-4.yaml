- id: ccna-4-017
  type: single_choice
  topic_code: '4.1'
  difficulty: 4
  cert_tags: *id001
  stem: PAT (NAT overload) conserves public IPs by?
  choices:
  - id: a
    text: Translating many insides to one/few globals with ports
  - id: b
    text: Only 1:1 static always
  - id: c
    text: Only disabling TCP
  - id: d
    text: Only using IPv6 exclusively
  correct:
    answer: a
  explanation: 'Overload NAT uses port multiplexing.


    **Translating many insides to one/few globals with ports**: Overload NAT uses
    port multiplexing.


    **Only 1:1 static always**: Static NAT is 1:1. PAT/overload maps many inside-local
    hosts to one global using source ports.


    **Only disabling TCP**: PAT still uses TCP/UDP ports; it does not disable TCP.
    It multiplexes many inside hosts onto one global IP.


    **Only using IPv6 exclusively**: PAT is an IPv4 conservation tool. NPTv6/NAT66
    is a different discussion; PAT does not mean “IPv6 only.”.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
