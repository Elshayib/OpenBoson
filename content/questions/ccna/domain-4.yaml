  stem: 'Scenario 353 (4.9): DNS record for IPv6?'
  choices:
  - id: b
    text: A
  - id: c
    text: MX
  - id: d
    text: PTR only
  - id: a
    text: AAAA
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    **AAAA**: An **AAAA** record maps a name to an IPv6 address (four A’s = 128 bits
    vs A = 32 bits).


    An **A** record maps a name to an **IPv4** address, not IPv6.


    MX records name mail exchangers. They do not carry IPv6 host addresses.


    **PTR only**: PTR is reverse DNS (IP → name) under `ip6.arpa` or `in-addr.arpa`.
    The forward IPv6 record is AAAA.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.9
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-v05-41-0053-43e63e
  type: single_choice
  topic_code: '4.1'
  difficulty: 4
  cert_tags: &id003
  - ccna
  stem: Which option correctly describes a key idea under 4.1?
  choices:
  - id: b
    text: Treat 4.1 as optional when the blueprint lists it
  - id: c
    text: Ignore verification and assume 4.1 always works
  - id: d
    text: Confuse 4.1 with an unrelated Layer mismatch
  - id: a
    text: Validate with show/verify steps before relying on 4.1 changes
  correct:
    answer: a
  explanation: 'For objective 4.1 (Configure and verify NAT), keep a baseline of `show
    ip nat translations` and a written rollback. Skipping logs or treating 4.1 as
    optional leaves you unable to prove Configure and verify NAT still works.


    **Treat 4.1 as optional when the blueprint lists it**: 4.1 (Configure and verify
    NAT) is on the blueprint; it is not skippable.


    **Ignore verification and assume 4.1 always works**: Do not assume Configure and
    verify NAT works; check `show ip nat translations`.


    **Confuse 4.1 with an unrelated Layer mismatch**: Apply Configure and verify NAT,
    not an unrelated OSI-layer look-alike (for example STP when the objective is routing).


    **Validate with show/verify steps before relying on 4.1 changes**: Confirm Configure
    and verify NAT with `show ip nat translations` before you rely on the new config.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
