  explanation: 'NTP clients sync to configured servers.


    **An NTP server / higher stratum source**: Client mode.


    **Only STP root**: L2.


    **Only DHCP option 150 exclusive**: TFTP for phones.


    **Only RADIUS**: AAA.'
