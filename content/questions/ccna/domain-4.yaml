  - id: c
    text: Only VRF
  - id: d
    text: Only SPAN source
  correct:
    answer: a
  explanation: 'Inside interfaces face the private/translated inside network.


    **Inside NAT interface**: Inside interfaces face the private/translated inside
    network.


    **Only outside global**: `ip nat inside` marks the **inside** interface (local
    realm). Outside-global is the translated public address, configured on the outside
    interface / pool.


    **Only VRF**: A VRF is a separate routing table/FIB instance on one device, used
    to isolate tenants or VPNs.


    **Only SPAN source**: SPAN/RSPAN/ERSPAN copies frames to a sniffer or GRE destination.'
