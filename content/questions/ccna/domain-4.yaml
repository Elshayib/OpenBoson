- id: ccna-gen-0027-161363
  type: single_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: &id002
  - ccna
  stem: 'Scenario 27 (4.1): Many-to-one NAT using ports?'
  choices:
  - id: d
    text: NPTv6 only
  - id: a
    text: PAT/overload
  - id: b
    text: Static NAT
  - id: c
    text: One-to-one dynamic only
  correct:
    answer: a
  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    **PAT/overload**: PAT / NAT overload maps many inside-local addresses onto one
    (or a few) inside-global address by translating **source ports** (`ip nat inside
    source list ... interface ... overload`).


    **NPTv6 only**: NPTv6 is IPv6 prefix translation (RFC 6296). It is not IPv4 PAT.


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only**: Dynamic NAT without overload still uses a pool 1:1.
    When the pool is exhausted, new flows fail — that is not many-to-one PAT.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0028-cbb178
  type: single_choice
  topic_code: '4.2'
  difficulty: 4
  cert_tags: *id002
  stem: 'Scenario 28 (4.2): DHCP client broadcast to find servers?'
  choices:
  - id: a
    text: DHCPDISCOVER
  - id: b
    text: DHCPACK
  - id: c
    text: Only DHCPREQUEST
  - id: d
    text: DHCPOFFER
  correct:
    answer: a
  explanation: 'A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68, destination
    255.255.255.255) to find servers — the first message in DORA.


    **DHCPDISCOVER**: A client with no lease broadcasts **DHCPDISCOVER** (UDP 67/68,
    destination 255.255.255.255) to find servers — the first message in DORA.


    DHCPACK is the **server’s** final confirmation of the lease, not the client’s
    discovery broadcast.


    **Only DHCPREQUEST**: DHCPREQUEST is the client’s **third** DORA step (accepting
    an offer, or renewing). Discovery comes first.


    DHCPOFFER is the **server** offering an address after DISCOVER. The client does
    not send it.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0029-9b6b69
