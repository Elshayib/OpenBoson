- id: ccna-4-004
  type: single_choice
  topic_code: '4.5'
  difficulty: 3
  cert_tags: *id001
  stem: Syslog severity 0 is?
  choices:
  - id: a
    text: Emergency
  - id: b
    text: Debug
  - id: c
    text: Informational
  - id: d
    text: Notice
  correct:
    answer: a
  explanation: 'Syslog severity is 0–7 (the `logging trap` / `logging buffered` level).
    **0 Emergency** is the most severe (system unusable), then 1 Alert, 2 Critical,
    3 Error, 4 Warning, 5 Notice, 6 Informational, **7 Debug**.


    **Emergency** is severity 0.


    **Debug** is severity **7**, the noisiest level (`debug ip ospf adj` and friends).
    It is the opposite end of the scale.


    **Informational** is severity **6** (normal `logging trap informational` on many
    boxes).


    **Notice** is severity **5**, used for significant-but-normal events (for example
    interface up/down at notice on some platforms).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-005
  type: single_choice
  topic_code: '4.7'
  difficulty: 3
  cert_tags: *id001
  stem: DSCP EF is commonly associated with?
  choices:
  - id: a
    text: Voice / expedited forwarding
  - id: b
    text: Bulk scavenger only
  - id: c
    text: Only STP
  - id: d
    text: Only NAT
  correct:
    answer: a
  explanation: '**DSCP EF** (Expedited Forwarding, decimal **46**, binary 101110)
    is the PHB used for **low-loss, low-latency voice RTP**. Class-maps match `dscp
    ef`; LLQ typically polices then priority-queues that traffic.


    **Voice / expedited forwarding** is the EF association.


    **Bulk scavenger only** is CS1/scavenger (often DSCP 8) for junk bandwidth, the
    opposite of EF.


    **Only STP** is a Layer 2 loop-prevention protocol. STP BPDUs are not DSCP EF
    marked as a QoS PHB definition.


    **Only NAT** translates IP addresses; it is not a DSCP codepoint.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.7
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-006
  type: single_choice
  topic_code: '4.6'
  difficulty: 2
  cert_tags: *id001
  stem: A DHCP relay agent sets which field to help the server?
  choices:
  - id: a
    text: GIADDR (gateway address)
  - id: b
    text: Only CHADDR to zero
  - id: c
    text: Only UDP sport 179
  - id: d
    text: Only DSCP EF
  correct:
    answer: a
  explanation: 'GIADDR identifies the client subnet to the DHCP server.


    **GIADDR (gateway address)**: GIADDR identifies the client subnet to the DHCP
    server.


    **Only CHADDR to zero**: A relay leaves the client MAC (chaddr) intact and sets
    **giaddr** to its own interface IP so the server knows the subnet.


    **Only UDP sport 179**: UDP 179 is not a DHCP field. A relay sets **giaddr** (and
    uses UDP 67) so the server can scope the pool.


    **Only DSCP EF**: DSCP is the 6-bit IP marking (EF=46 for voice).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-4-007
  type: single_choice
  topic_code: '4.2'
  difficulty: 3
  cert_tags: *id001
  stem: Stratum 0 in NTP refers to?
  choices:
  - id: a
    text: Reference clocks (not network NTP servers themselves)
  - id: b
    text: Only leaf clients
  - id: c
    text: Only stratum 16 sync success
  - id: d
    text: Only GPS denied sources
  correct:
    answer: a
  explanation: 'NTP **stratum** is distance from a reference clock. **Stratum 0**
    devices are the clocks themselves (GPS, atomic) — they are **not** NTP servers
    on the network. A GPS-synced router is typically **stratum 1** (one hop from stratum
    0).


    **Reference clocks (not network NTP servers themselves)** is the definition of
    stratum 0.


    **Only leaf clients** are high-stratum hosts (often 3–4) that query servers; they
    are not stratum 0.


    **Only stratum 16 sync success** is inverted: stratum **16** means **unsynchronized**
    on Cisco IOS (`show ntp status`).


    **Only GPS denied sources** would be a clock that cannot see GPS — that is not
    what stratum 0 means. Stratum 0 **is** the GPS/atomic reference, when it is working.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.2
  provider: openboson
  license: MIT
  provenance: original
