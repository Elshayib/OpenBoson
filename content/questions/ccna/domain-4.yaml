- id: ccna-1-017
  type: single_choice
  topic_code: '4.3'
  difficulty: 4
  cert_tags: &id001
  - ccna
  stem: DNS primarily maps which of the following?
  choices:
  - id: a
    text: Names to IP addresses
    rationale: DNS resolves names to addresses (and reverse lookups).
  - id: b
    text: MAC to VLAN
    rationale: Not correct for this scenario.
  - id: c
    text: AS numbers to communities
    rationale: Not correct for this scenario.
  - id: d
    text: SPIDs to DLCI
    rationale: Not correct for this scenario.
  correct:
    answer: a
  explanation: DNS resolves names to addresses (and reverse lookups).
  references:
  - CCNA 4.3
- id: ccna-4-001
  type: single_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: *id001
  stem: Inside source NAT typically translates which addresses?
  choices:
  - id: a
    text: Internal private sources to public/global
    rationale: Inside local → inside global.
  - id: b
    text: Only destination ports
    rationale: PAT can include ports but NAT maps addresses.
  - id: c
    text: Only MAC addresses
    rationale: L2.
  - id: d
    text: Only VLAN tags
    rationale: L2.
  correct:
    answer: a
  explanation: Inside source NAT changes inside local source addresses for outside
    reachability.
  references:
  - CCNA 4.1 — NAT
- id: ccna-4-002
  type: single_choice
  topic_code: '4.2'
  difficulty: 2
  cert_tags: *id001
  stem: An NTP client synchronizes its clock to?
  choices:
  - id: a
    text: An NTP server / higher stratum source
    rationale: Client mode.
  - id: b
    text: Only STP root
    rationale: L2.
  - id: c
    text: Only DHCP option 150 exclusive
    rationale: TFTP for phones.
  - id: d
    text: Only RADIUS
    rationale: AAA.
  correct:
    answer: a
  explanation: NTP clients sync to configured servers.
  references:
  - CCNA 4.2 — NTP
- id: ccna-4-003
  type: single_choice
  topic_code: '4.3'
  difficulty: 2
  cert_tags: *id001
  stem: DHCP's primary role in a network is to?
  choices:
  - id: a
    text: Dynamically assign IP addressing parameters
    rationale: DHCP.
  - id: b
    text: Encrypt all trunks
    rationale: No.
  - id: c
    text: Elect OSPF DR
    rationale: OSPF.
  - id: d
    text: Hash EtherChannels
    rationale: L2.
  correct:
    answer: a
  explanation: DHCP assigns addresses, mask, gateway, DNS, and related options.
  references:
  - CCNA 4.3 — DHCP/DNS
