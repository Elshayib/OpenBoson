- id: ccna-gen-0027-161363
  type: single_choice
  topic_code: '4.1'
  difficulty: 3
  cert_tags: &id002
  - ccna
  stem: 'Scenario 27 (4.1): Many-to-one NAT using ports?'
  choices:
  - id: d
    text: NPTv6 only
  - id: a
    text: PAT/overload
  - id: b
    text: Static NAT
  - id: c
    text: One-to-one dynamic only
  correct:
    answer: a
  explanation: 'PAT / NAT overload maps many inside-local addresses onto one (or a
    few) inside-global address by translating **source ports** (`ip nat inside source
    list ... interface ... overload`).


    **NPTv6 only** is not the right selection: NPTv6 is IPv6 prefix translation (RFC
    6296). It is not IPv4 PAT.


    Static NAT is a 1:1 inside-local ↔ inside-global mapping, no port multiplexing.


    **One-to-one dynamic only** is not the right selection: Dynamic NAT without overload
    still uses a pool 1:1. When the pool is exhausted, new flows fail — that is not
    many-to-one PAT.'
