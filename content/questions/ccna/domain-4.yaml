  type: single_choice
  topic_code: '4.5'
  difficulty: 3
  cert_tags: *id001
  stem: Syslog facilities help?
  choices:
  - id: a
    text: Classify message sources/categories
  - id: b
    text: Encrypt EtherChannels
  - id: c
    text: Assign BGP MED
  - id: d
    text: Elect DR
  correct:
    answer: a
  explanation: 'Facilities categorize log origins.


    **Classify message sources/categories**: Facilities categorize log origins.


    **Encrypt EtherChannels**: EtherChannel bundles physical links into one logical
    interface; members must match speed, duplex, and mode.


    **Assign BGP MED**: MED is a BGP attribute to influence inbound traffic from a
    neighbor AS.


    **Elect DR**: DR/BDR election is OSPF on multiaccess links. Syslog **facilities**
    classify messages (local0–7, kern, …) for filtering.'
