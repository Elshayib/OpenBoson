    **Encrypt STP BPDUs**: BPDUs are STP control frames used to elect a root and assign
    port roles.


    **Assign VLANs**: Access/trunk VLAN assignment is switchport configuration, not
    a VTY ACL.


    **Form OSPF adjacencies**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 2 — IP Services
  - CCNA exam topic 4.4
  provider: openboson
  license: MIT
  provenance: original
