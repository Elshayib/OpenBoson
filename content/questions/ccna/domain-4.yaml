- id: ccna-4-015
  type: single_choice
  topic_code: '4.4'
  difficulty: 2
  cert_tags: *id001
  stem: SNMP informs differ from traps primarily by?
  choices:
  - id: a
    text: Acknowledged delivery
  - id: b
    text: Using only Telnet
  - id: c
    text: Requiring OSPF
  - id: d
    text: Disabling MIBs
  correct:
    answer: a
  explanation: 'Informs expect acknowledgment; traps are unacknowledged.


    **Acknowledged delivery**: Informs expect acknowledgment; traps are unacknowledged.


    **Using only Telnet**: Telnet (TCP 23) is cleartext remote CLI.


    **Requiring OSPF**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).


    **Disabling MIBs**: SNMP informs wait for an ACK from the NMS; traps are unacknowledged.
    Neither behavior is “turning MIBs off.”.'
