- id: ccna-v05-42-0055-02c4e6
  type: multiple_choice
  topic_code: '4.2'
  difficulty: 3
  cert_tags: *id003
  stem: '[CCNA 4.2] Select ALL actions that support a correct implementation or verification
    for this objective.'
  choices:
  - id: a
