- id: ccna-gen-0029-9b6b69
  type: single_choice
  topic_code: '4.3'
  difficulty: 5
  cert_tags: *id002
  stem: 'Scenario 29 (4.3): DNS record for IPv6?'
  choices:
  - id: b
    text: A
  - id: c
    text: MX
  - id: d
    text: PTR only
  - id: a
    text: AAAA
  correct:
    answer: a
  explanation: 'An **AAAA** record maps a name to an IPv6 address (four A’s = 128
    bits vs A = 32 bits).


    **AAAA**: An **AAAA** record maps a name to an IPv6 address (four A’s = 128 bits
    vs A = 32 bits).


