- id: ccna-gen-0001-7fed52
  type: single_choice
  topic_code: '1.10'
  difficulty: 2
  cert_tags: *id003
  stem: 'Scenario 1 (1.10): IPv6 address type on every link?'
  choices:
  - id: b
    text: Global unicast
  - id: c
    text: Unique local
  - id: d
    text: Anycast only
  - id: a
    text: Link-local
  correct:
    answer: a
  explanation: '**Link-local** IPv6 addresses (`fe80::/10`) are required on every IPv6-enabled interface
    and are not routed beyond the local link. This is the correct answer for the stem.


    **Global unicast** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **Unique local** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **Anycast only**: **Anycast** assigns the same address to multiple nodes; routers forward to the topologically
    nearest member. IPv6 does not use broadcast. This does not satisfy the condition required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0002-b51349
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id003
  stem: 'Scenario 2 (1.11): Prefix length for mask 255.255.255.192?'
  choices:
  - id: c
    text: /25
  - id: d
    text: /30
  - id: a
    text: /26
  - id: b
    text: /24
  correct:
    answer: a
  explanation: 'A **/26** prefix provides 64 addresses; subtracting network and broadcast leaves **62**
    usable host addresses. This is the correct answer for the stem.


    **/24** is incorrect. It describes a different behavior and does not meet the requirement stated in
    the stem.


    **/25** is incorrect. It describes a different behavior and does not meet the requirement stated in
    the stem.


    A **/30** prefix provides four addresses and **two** usable hosts, commonly used on point-to-point
    links. This does not satisfy the condition required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.11
  provider: openboson
  license: MIT
  provenance: original
