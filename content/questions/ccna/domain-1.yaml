  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id001
  stem: Which frequency band do most enterprise 5 GHz Wi-Fi networks use?
  choices:
  - id: a
    text: UNII 5 GHz bands
  - id: b
    text: Only 900 MHz ISM
  - id: c
    text: 60 GHz only
  - id: d
    text: HF shortwave
  correct:
    answer: a
  explanation: 'Enterprise Wi-Fi commonly uses UNII 5 GHz bands.


    **UNII 5 GHz bands**: Enterprise Wi-Fi commonly uses UNII 5 GHz bands.


    **Only 900 MHz ISM**: 900 MHz is a separate ISM/IoT band (802.11ah-ish). Enterprise
    WLANs use 5 GHz UNII (and 2.4/6 GHz), not 900 MHz.


    **60 GHz only**: 60 GHz is 802.11ad/ay WiGig, not the common 2.4/5 GHz campus
    bands.


    HF shortwave is a long-haul radio band, not the 5 GHz UNII bands used by enterprise
    802.11a/n/ac/ax.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.11
