  explanation: 'RFC 1918 private IPv4: **10.0.0.0/8** (Class A), **172.16.0.0/12**
    (Class B), **192.168.0.0/16** (Class C).


    **10.0.0.0/8** is the Class A private block (10.0.0.0–10.255.255.255).


    **172.32.0.0/12** is not RFC 1918. The private Class B block is **172.16.0.0/12**
    (172.16.0.0–172.31.255.255). 172.32.0.0 is public.


    **192.169.0.0/16** is public. The Class C private block is **192.168.0.0/16**.


    **198.51.100.0/24** is TEST-NET-2 (RFC 5737 documentation), not a private range.

