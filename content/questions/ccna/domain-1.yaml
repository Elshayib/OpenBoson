- id: ccna-1-008
  type: multiple_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: Which two characteristics apply to UDP? (Choose two.)
  choices:
  - id: a
    text: Connectionless
  - id: b
    text: Guaranteed delivery
  - id: c
    text: Lower overhead than TCP
  - id: d
    text: Always encrypts payloads
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '**UDP** is a connectionless Layer 4 protocol: no three-way handshake,
    no sequence/ack numbers, and no retransmission. That yields a smaller header (8
    bytes vs TCP’s 20+) and lower overhead, which is why DNS, DHCP, and RTP typically
    use it.


    **Connectionless** is correct: UDP sends datagrams without establishing a session.


    **Lower overhead than TCP** is correct: no handshake, no acks, no windowing in
    the UDP header.


    **Guaranteed delivery** is a **TCP** property (acks, retransmission, ordered byte
    stream). UDP leaves reliability to the application.


    **Always encrypts payloads** is false. Encryption is TLS/DTLS/IPsec or the application;
    UDP itself is cleartext.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.5
  provider: openboson
  license: MIT
  provenance: original
