- id: ccna-gen-0000-91c572
  type: multiple_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: &id003
  - ccna
  stem: '[CCNA 1.1] Select ALL that correctly relate to: OSI layer for end-to-end
    reliable delivery.'
  choices:
  - id: a
    text: Transport
  - id: b
    text: Network
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: Data link
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Transport**: OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Document verification steps before changes.**: Write the show/ping checks and
    rollback **before** the change window so you can prove the objective worked and
    back out if it did not.


    **Network**: Layer 3 (IP) forwards packets hop-by-hop using the routing table.
    It does not guarantee ordered or reliable end-to-end delivery.


    **Data link**: Layer 2 delivers frames on a single link or VLAN using MAC addresses
    (Ethernet/PPP). Reliability and sessions are not its job.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0001-7fed52
  type: single_choice
  topic_code: '1.10'
  difficulty: 2
  cert_tags: *id003
  stem: 'Scenario 1 (1.10): IPv6 address type on every link?'
  choices:
  - id: b
    text: Global unicast
  - id: c
    text: Unique local
  - id: d
    text: Anycast only
  - id: a
    text: Link-local
  correct:
    answer: a
  explanation: 'Every IPv6-enabled interface must have a link-local address in `fe80::/10`
    (often auto-derived from EUI-64 or stable privacy). NDP, RS/RA, and routing hellos
    use it; it is never forwarded off-link.


    **Link-local**: Every IPv6-enabled interface must have a link-local address in
    `fe80::/10` (often auto-derived from EUI-64 or stable privacy). NDP, RS/RA, and
    routing hellos use it; it is never forwarded off-link.


    Global unicast (`2000::/3`) is the routable public address, assigned only when
    the interface needs site/Internet reachability — not automatically on every link.


    Unique local (`fc00::/7`, typically `fd00::/8`) is optional private unicast, analogous
    to RFC 1918. Interfaces do not require it.


    **Anycast only**: Anycast is a unicast address assigned to multiple nodes so routers
    deliver to the nearest. It is a service pattern, not the required per-interface
    address type.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0002-b51349
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id003
  stem: 'Scenario 2 (1.11): Prefix length for mask 255.255.255.192?'
  choices:
  - id: c
    text: /25
  - id: d
    text: /30
  - id: a
    text: /26
  - id: b
    text: /24
  correct:
    answer: a
  explanation: '`255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus
    192 = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable
    hosts 62.


    **/26**: `255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus 192
    = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable hosts
    62.


    **/25**: `255.255.255.128` is /25 (128-address block).


    **/30**: `255.255.255.252` is /30 (4-address block) used on point-to-point links.


    **/24**: `255.255.255.0` is /24 (256-address block), not 255.255.255.192.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.11
