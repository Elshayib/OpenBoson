questions:
- id: ccna-1-001
  type: single_choice
  topic_code: '1.6'
  difficulty: 2
  cert_tags: &id001
  - ccna
  stem: How many usable host addresses does 192.168.10.0/26 provide?
  choices:
  - id: a
    text: '62'
  - id: b
    text: '64'
  - id: c
    text: '30'
  - id: d
    text: '126'
  correct:
    answer: a
  explanation: 'A /26 prefix has 2^(32−26)=64 addresses; subtract network and broadcast.


    **62**: /26 = 64 addresses − 2 = 62 usable.


    64 is the total size including network/broadcast.


    **30**: That is /27.


    **126**: That is /25.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-002
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: Which device operates primarily at OSI Layer 2 and forwards based on MAC addresses?
  choices:
  - id: a
    text: Router
  - id: b
    text: Switch
  - id: c
    text: Firewall
  - id: d
    text: Wireless controller
  correct:
    answer: b
  explanation: 'Ethernet switches learn MAC addresses and forward frames within a
    VLAN/broadcast domain.


    **Switch**: LAN switches forward frames using MAC tables.


    Routers make Layer 3 forwarding decisions.


    Firewalls typically inspect Layer 3/4+.


    **Wireless controller**: Manages APs; not the classic L2 forwarder.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
