- id: ccna-1-026
  type: single_choice
  topic_code: '1.12'
  difficulty: 4
  cert_tags: *id001
  stem: A VRF on a router primarily provides?
  choices:
  - id: a
    text: Separate routing tables/instances
  - id: b
    text: Only STP instances
  - id: c
    text: Only PoE budgets
  - id: d
    text: Only DNS views
  correct:
    answer: a
  explanation: 'VRFs isolate routing contexts on one device.


    **Separate routing tables/instances**: VRFs isolate routing contexts on one device.


    **Only STP instances**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only PoE budgets**: PoE delivers DC power on Ethernet (802.3af/at/bt).


    **Only DNS views**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on
    UDP/TCP 53.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.12
  provider: openboson
  license: MIT
  provenance: original
