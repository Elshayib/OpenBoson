- id: ccna-gen-0329-e90110
  type: single_choice
  topic_code: '1.8'
  difficulty: 5
  cert_tags: *id003
  stem: 'Scenario 329 (1.8): Prefix length for mask 255.255.255.192?'
  choices:
  - id: b
    text: /24
  - id: c
    text: /25
  - id: d
    text: /30
  - id: a
    text: /26
  correct:
    answer: a
  explanation: '`255.255.255.192` has 26 bits of ones (255.255.255 = 24 bits, plus
    192 = `11000000` two more). Block size is 64 addresses (256 − 192 = 64), usable
    hosts 62.


    **/24** is not the right selection: `255.255.255.0` is /24 (256-address block),
    not 255.255.255.192.


    **/25** is not the right selection: `255.255.255.128` is /25 (128-address block).


    **/30** is not the right selection: `255.255.255.252` is /30 (4-address block)
    used on point-to-point links.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.8
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0330-a5c636
  type: multiple_choice
  topic_code: '1.9'
  difficulty: 2
  cert_tags: *id003
  stem: '[CCNA 1.9] Select ALL that correctly relate to: OSI layer for end-to-end
    reliable delivery.'
  choices:
  - id: a
    text: Transport
  - id: b
    text: Network
  - id: c
    text: Document verification steps before changes.
  - id: d
    text: Data link
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'OSI Layer 4 (TCP) provides end-to-end delivery. TCP adds a handshake,
    sequence/ack numbers, and retransmission so the application sees an ordered reliable
    stream.


    **Document verification steps before changes.** is correct: Write the show/ping
    checks and rollback **before** the change window so you can prove the objective
    worked and back out if it did not. This matters for 1.9 (Describe IPv6 address
    types).


    **Network** is not the right selection: Layer 3 (IP) forwards packets hop-by-hop
    using the routing table. It does not guarantee ordered or reliable end-to-end
    delivery.


    **Data link** is not the right selection: Layer 2 delivers frames on a single
    link or VLAN using MAC addresses (Ethernet/PPP). Reliability and sessions are
    not its job.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.9
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-nsc-0000
  type: multiple_choice
  topic_code: '1.1'
  difficulty: 3
  cert_tags: &id004
  - ccna
  stem: 'Multiple-select check for 1.1: which items are operationally sound?'
  choices:
  - id: a
    text: Verify before change windows
  - id: b
    text: Skip documentation
  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For 1.1 (Role and function of network components), the keyed answer
    is **Verify before change windows; Capture show/verify outputs**. Stem: Multiple-select
    check for 1.1: which items are operationally sound?.


    **Verify before change windows** is correct: Capture a known-good baseline (`show`,
    ping, traceroute) before the window so you can compare after the change. This
    matters for 1.1 (Role and function of network components).


    **Capture show/verify outputs** is correct: Save `show running-config`, `show
    ip route`, `show vlan`, and similar evidence with the ticket — that is how you
    prove the objective. This matters for 1.1 (Role and function of network components).


    **Skip documentation** is not the right selection: Skipping documentation leaves
    no rollback and no audit trail. Production changes for this objective still need
    a written record. This matters for 1.1 (Role and function of network components).


    **Disable logging permanently** is not the right selection: Disabling logging
    permanently hides faults and is a finding on any security review. Keep syslog/buffered
    logging enabled. This matters for 1.1 (Role and function of network components).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
