  explanation: 'The SSID is the wireless network name clients associate to.


    **Wireless network name**: The SSID is the wireless network name clients associate
    to.


    **AP serial number**: An AP serial number identifies hardware inventory. An SSID
    is the broadcast network name clients select.


    **WLC HA VIP only**: A WLC terminates CAPWAP and pushes WLAN policy to lightweight
    APs.


    **RADIUS shared secret**: RADIUS (UDP 1812/1813) is a common 802.1X/AAA protocol.'
