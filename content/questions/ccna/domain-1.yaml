  difficulty: 5
  cert_tags: *id006
  stem: Regarding CCNA topic 1.7. Which reply is accurate?
  choices:
  - id: d
    text: Use clear-text shared secrets as the only control for 1.7
  - id: a
    text: Prefer the documented 1.7 approach used in enterprise designs
  - id: b
    text: Confuse 1.7 with an unrelated Layer mismatch
  - id: c
    text: Disable logging permanently while testing 1.7
  correct:
    answer: a
  explanation: 'For 1.7 (Describe private IPv4 addressing), the keyed answer is **Prefer
    the documented 1.7 approach used in enterprise designs**. Stem: Regarding CCNA
    topic 1.7. Which reply is accurate?.


    **Prefer the documented 1.7 approach used in enterprise designs** is correct:
    Use the documented enterprise design for this objective (Cisco validated design
    / local standard) rather than an ad-hoc look-alike. This matters for 1.7 (Describe
    private IPv4 addressing).


    **Use clear-text shared secrets as the only control for 1.7** is not the right
    selection: Clear-text shared secrets (type 7, Telnet, open SNMP) are not an acceptable
    sole control. Use SSH, type 8/9 secrets, and SNMPv3. This matters for 1.7 (Describe
    private IPv4 addressing).


    **Confuse 1.7 with an unrelated Layer mismatch** is not the right selection: Confusing
    this objective with an unrelated OSI layer is how you apply the wrong feature
    (for example STP for a routing problem). This matters for 1.7 (Describe private
    IPv4 addressing).


    **Disable logging permanently while testing 1.7** is not the right selection:
    Disabling logging permanently hides faults and is a finding on any security review.
    Keep syslog/buffered logging enabled. This matters for 1.7 (Describe private IPv4
    addressing).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.7
  provider: openboson
