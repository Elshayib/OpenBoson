- id: ccna-1-016
  type: single_choice
  topic_code: '1.13'
  difficulty: 3
  cert_tags: *id001
  stem: What happens when a switch has no MAC entry for a frame's destination?
  choices:
  - id: a
    text: Floods the frame out other ports in the VLAN
  - id: b
    text: Drops silently always
  - id: c
    text: Sends ICMP redirect
  - id: d
    text: ARPs for the MAC
  correct:
    answer: a
  explanation: 'A LAN switch forwards on the **MAC address table** (CAM) within a
    VLAN. If the **destination MAC is unknown**, the switch **floods** the frame out
    every other port in that VLAN — the same behavior as an unknown unicast, not a
    drop.


    **Floods the frame out other ports in the VLAN** is that unknown-unicast behavior
    (the source MAC is still learned on the ingress port).


    **Drops silently always** would black-hole traffic to new stations. Switches flood
    unknown unicasts; they drop only when a security feature (for example port security)
    explicitly forbids the frame.


    **Sends ICMP redirect** is a **router** message (ICMP type 5) telling a host to
    use a better next hop. Switches do not originate ICMP redirects for unknown MACs.


    **ARPs for the MAC** is what an **IPv4 host or router** does when it needs a next-hop
    MAC. The switch is not the ARP client here; it just floods the Ethernet frame
    it already has.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.13
  provider: openboson
  license: MIT
  provenance: original
