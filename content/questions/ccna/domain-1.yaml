- id: ccna-1-020
  type: single_choice
  topic_code: '1.1'
  difficulty: 4
  cert_tags: *id001
  stem: PoE delivers power over which pairs historically for 802.3af Mode A?
  choices:
  - id: a
    text: Data pairs (1-2 and 3-6)
  - id: b
    text: Only fiber strands
  - id: c
    text: USB only
  - id: d
    text: Coax center conductor
  correct:
    answer: a
  explanation: '802.3af Alternative A injects power on the data pairs.


    **Data pairs (1-2 and 3-6)**: 802.3af Alternative A injects power on the data
    pairs.


    **Only fiber strands**: Fiber is a Layer-1 medium (SMF/MMF). It does not by itself
    create VLANs or overlays.


    **USB only**: USB is a host peripheral bus, not an Ethernet access medium.


    **Coax center conductor**: RG-59/RG-6 coax is not 802.3af. Alternative A puts
    DC on the 10/100 data pairs (1-2 and 3-6).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
