  explanation: '802.11ax (Wi-Fi 6) added OFDMA and other efficiency features.


    802.11ac (Wi-Fi 5) is 5 GHz OFDM/MU-MIMO; it did not introduce OFDMA.


    802.11n (Wi-Fi 4) added MIMO/HT; not OFDMA.


    802.11g is 2.4 GHz OFDM up to 54 Mbps, no OFDMA.'
