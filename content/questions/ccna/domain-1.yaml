  license: MIT
  provenance: original
- id: ccna-1-013
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id001
  stem: Which wireless standard introduced OFDMA in Wi-Fi 6?
  choices:
  - id: a
    text: 802.11ax
  - id: b
    text: 802.11ac
  - id: c
    text: 802.11n
  - id: d
    text: 802.11g
  correct:
