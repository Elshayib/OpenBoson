questions:
- id: ccna-1-001
  type: single_choice
  topic_code: '1.6'
  difficulty: 2
  cert_tags: &id001
  - ccna
  stem: How many usable host addresses does 192.168.10.0/26 provide?
  choices:
  - id: a
    text: '62'
  - id: b
    text: '64'
  - id: c
    text: '30'
  - id: d
    text: '126'
  correct:
    answer: a
  explanation: 'A /26 prefix has 2^(32−26)=64 addresses; subtract network and broadcast.


    **62** is correct: /26 = 64 addresses − 2 = 62 usable.


    64 is the total size including network/broadcast.


    **30** is not the right selection: That is /27.


    **126** is not the right selection: That is /25.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-002
  type: single_choice
  topic_code: '1.1'
  difficulty: 2
  cert_tags: *id001
  stem: Which device operates primarily at OSI Layer 2 and forwards based on MAC addresses?
  choices:
  - id: a
    text: Router
  - id: b
    text: Switch
  - id: c
    text: Firewall
  - id: d
    text: Wireless controller
  correct:
    answer: b
  explanation: 'Ethernet switches learn MAC addresses and forward frames within a
    VLAN/broadcast domain.


    **Switch** is correct: LAN switches forward frames using MAC tables.


    Routers make Layer 3 forwarding decisions.


    Firewalls typically inspect Layer 3/4+.


    **Wireless controller** is not the right selection: Manages APs; not the classic
    L2 forwarder.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-003
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: What is the binary equivalent of dotted decimal 10.1.1.0 with a /30 mask's
    host portion size?
  choices:
  - id: a
    text: 2 usable hosts
  - id: b
    text: 6 usable hosts
  - id: c
    text: 14 usable hosts
  - id: d
    text: 30 usable hosts
  correct:
    answer: a
  explanation: 'A **/30** prefix leaves **2 host bits**, so the subnet has 2^2 = **4**
    addresses: network, two usable hosts, and broadcast. Point-to-point Ethernet and
    serial links commonly use /30 (or /31) for that two-host topology. `10.1.1.0/30`
    covers `10.1.1.0`–`10.1.1.3` with usable hosts `10.1.1.1` and `10.1.1.2`.


    **2 usable hosts** is 4 − 2, the usable count of a /30.


    **6 usable hosts** is 8 − 2, which is a **/29** (3 host bits), not /30.


    **14 usable hosts** is 16 − 2, a **/28** (4 host bits).


    **30 usable hosts** is 32 − 2, a **/27** (5 host bits).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-004
  type: single_choice
  topic_code: '1.3'
  difficulty: 2
  cert_tags: *id001
  stem: Which cable type is typically used between a switch access port and a PC NIC?
  choices:
  - id: a
    text: Straight-through UTP
  - id: b
    text: Crossover UTP
  - id: c
    text: Rollover console
  - id: d
    text: Coaxial RG-59
  correct:
    answer: a
  explanation: 'Modern Auto-MDIX often corrects cabling, but the classic answer is
    straight-through.


    **Straight-through UTP** is correct: Like devices historically needed crossover;
    PC↔switch uses straight-through.


    **Crossover UTP** is not the right selection: Used between like devices (switch↔switch)
    without Auto-MDIX.


    **Rollover console** is not the right selection: Used for console access to a
    router/switch.


    **Coaxial RG-59** is not the right selection: Not used for modern Ethernet access.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-005
  type: single_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: In TCP, which field helps ensure ordered delivery of segments?
  choices:
  - id: a
    text: Sequence number
  - id: b
    text: Window size alone
  - id: c
    text: TTL
  - id: d
    text: TOS/DSCP
  correct:
    answer: a
  explanation: 'TCP treats the payload as a **byte stream**. Each segment carries
    a 32-bit **sequence number** that identifies the first byte in that segment, so
    the receiver can reorder segments and detect gaps.


    **Sequence number** is the TCP header field that provides that ordering.


    **Window size alone** is the receive window used for **flow control** (how many
    unacked bytes may be in flight). It does not order bytes.


    **TTL** is IPv4 Time To Live (IPv6 Hop Limit) in the **IP** header, decremented
    by each router to kill loops — not a TCP ordering field.


    **TOS/DSCP** marks IP packets for QoS (for example DSCP EF for voice). It does
    not sequence TCP segments.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-006
  type: single_choice
  topic_code: '1.9'
  difficulty: 2
  cert_tags: *id001
  stem: Which IPv6 address type is typically used for one-to-nearest routing within
    a group?
  choices:
  - id: a
    text: Anycast
  - id: b
    text: Multicast
  - id: c
    text: Broadcast
  - id: d
    text: Link-local only
  correct:
    answer: a
  explanation: 'IPv6 anycast shares an address among nodes; routers deliver to the
    nearest.


    Anycast is one-to-nearest of a group.


    **Multicast** is not the right selection: One-to-many.


    **Broadcast** is not the right selection: IPv6 has no broadcast.


    **Link-local only** is not the right selection: Link-local is a scope, not anycast
    semantics.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.9
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-007
  type: single_choice
  topic_code: '1.13'
  difficulty: 3
  cert_tags: *id001
  stem: What does ARP resolve?
  choices:
  - id: a
    text: IPv4 address to MAC address
  - id: b
    text: MAC to IPv6
  - id: c
    text: URL to IP
  - id: d
    text: Port to process
  correct:
    answer: a
  explanation: 'ARP requests broadcast who-has; replies provide the MAC for an IPv4
    address.


    **IPv4 address to MAC address** is correct: ARP maps L3→L2 on Ethernet.


    **MAC to IPv6** is not the right selection: That is not ARP (NDP does neighbor
    discovery).


    **URL to IP** is not the right selection: DNS.


    **Port to process** is not the right selection: Sockets/OS, not ARP.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.13
