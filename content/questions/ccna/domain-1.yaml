    or `show vrf` output is the check, not a VLAN ID alone.


    **Apply the verified behavior required by objective 1.12** is applying that behavior,
    then confirming it. **Skip documentation for 1.12 changes in production** hides
    the very output you would use for the check in the previous sentence. **Treat
    1.12 as optional when the blueprint lists it** is wrong: this exam topic is on
    the blueprint.'
