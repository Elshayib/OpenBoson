  - id: c
    text: Capture show/verify outputs
  - id: d
    text: Disable logging permanently
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For objective 1.1 (Role and function of network components), keep
    a baseline of `show ip interface brief` / `show cdp neighbors` and a written rollback.
    Skipping logs or treating 1.1 as optional leaves you unable to prove Role and
    function of network components still works.


    **Verify before change windows**: Confirm Role and function of network components
    with `show ip interface brief` / `show cdp neighbors` before you rely on the new
    config.


    **Skip documentation**: Role and function of network components still needs a
    change record and logs; skipping them removes rollback for 1.1.


    **Capture show/verify outputs**: Confirm Role and function of network components
    with `show ip interface brief` / `show cdp neighbors` before you rely on the new
    config.


    **Disable logging permanently**: You need logging/monitoring to see whether Role
    and function of network components actually converged after the window.'
