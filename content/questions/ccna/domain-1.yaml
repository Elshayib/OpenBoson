- id: ccna-1-029
  type: single_choice
  topic_code: '1.3'
  difficulty: 4
  cert_tags: *id001
  stem: Single-mode fiber vs multimode primarily differs in?
  choices:
  - id: a
    text: Core size / distance capability
  - id: b
    text: Only connector color mandatory
  - id: c
    text: Only PoE support
  - id: d
    text: Only VLAN tagging
  correct:
    answer: a
  explanation: '**Single-mode fiber (SMF)** has a ~9 µm core and carries one mode
    for long reach (km). **Multimode (MMF)** has a 50/62.5 µm core for shorter building/campus
    runs.


    **Core size / distance capability** is the primary physical difference.


    **Only connector color mandatory** (blue UPC vs green APC, beige vs aqua) is a
    convention, not what makes SMF go farther.


    **Only PoE support** is a copper Ethernet feature (802.3af/at/bt). Fiber does
    not carry PoE.


    **Only VLAN tagging** is 802.1Q on frames. Both SMF and MMF carry tagged Ethernet;
    tagging is not an optical-mode property.

    '
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-030
  type: single_choice
  topic_code: '1.13'
  difficulty: 2
  cert_tags: *id001
  stem: MAC address aging on a switch does what?
  choices:
  - id: a
    text: Removes unused CAM entries after a timer
  - id: b
    text: Encrypts the MAC table
  - id: c
    text: Converts MAC to IPv6
  - id: d
    text: Disables flooding forever
  correct:
    answer: a
  explanation: 'Aging clears stale MAC entries so topology changes relearn cleanly.


    **Removes unused CAM entries after a timer**: Aging clears stale MAC entries so
    topology changes relearn cleanly.


    **Encrypts the MAC table**: The CAM/MAC table is not encrypted. Aging simply times
    out unused source MACs.


    **Converts MAC to IPv6**: NDP/SLAAC may derive an IPv6 IID from a MAC (EUI-64).
    MAC aging only deletes stale CAM entries after the aging timer.


    **Disables flooding forever**: MAC aging deletes stale CAM rows so unknown unicasts
    can flood again and relearn. It does not permanently disable flooding.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.13
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-013
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id001
  stem: Which frequency band do most enterprise 5 GHz Wi-Fi networks use?
  choices:
  - id: a
    text: UNII 5 GHz bands
  - id: b
    text: Only 900 MHz ISM
  - id: c
    text: 60 GHz only
  - id: d
    text: HF shortwave
  correct:
    answer: a
  explanation: 'Enterprise Wi-Fi commonly uses UNII 5 GHz bands.


    **UNII 5 GHz bands**: Enterprise Wi-Fi commonly uses UNII 5 GHz bands.


    **Only 900 MHz ISM**: 900 MHz is a separate ISM/IoT band (802.11ah-ish). Enterprise
    WLANs use 5 GHz UNII (and 2.4/6 GHz), not 900 MHz.


    **60 GHz only**: 60 GHz is 802.11ad/ay WiGig, not the common 2.4/5 GHz campus
    bands.


    HF shortwave is a long-haul radio band, not the 5 GHz UNII bands used by enterprise
    802.11a/n/ac/ax.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.11
  provider: openboson
  license: MIT
