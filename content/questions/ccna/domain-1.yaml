- id: ccna-1-010
  type: ordered_list
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: Order the steps to design a VLSM plan for a site.
  ordered_items:
  - Assign largest subnets first
  - List required host counts
  - Document remaining address space
  - Sort requirements descending
  correct:
    order:
    - List required host counts
    - Sort requirements descending
    - Assign largest subnets first
    - Document remaining address space
  explanation: 'VLSM allocates the **largest** blocks first so leftover space stays
    contiguous. Order: list each subnet’s host requirement, sort those counts descending,
    assign the biggest prefixes first, then document what address space remains.


    Listing hosts first tells you the required prefix lengths. Sorting descending
    is what makes “largest first” well-defined. Documenting leftover space last is
    how the next VLAN or site gets a free block.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-011
  type: single_choice
  topic_code: '1.2'
  difficulty: 4
  cert_tags: *id001
  stem: Which cloud deployment model keeps infrastructure exclusively for one organization?
  choices:
  - id: a
    text: Private cloud
  - id: b
    text: Public cloud
  - id: c
    text: Community only
  - id: d
    text: Hybrid CDN
  correct:
    answer: a
  explanation: 'Private cloud keeps compute, storage, and network for **one organization**
    (on-prem or a dedicated hosted tenancy). That is the exclusive-use model.


    **Private cloud** is single-tenant: the org controls who shares the infrastructure.


    **Public cloud** (AWS/Azure/GCP) is multi-tenant. Many customers share the provider’s
    fabric, so it is not exclusive to one org.


    **Community only** is shared by several organizations with a common mission (for
    example a set of agencies). More than one tenant.


    **Hybrid CDN** mixes on-prem with a content-delivery overlay. A CDN caches content;
    it is not a single-tenant private cloud.

    '
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-012
  type: single_choice
  topic_code: '1.6'
  difficulty: 2
  cert_tags: *id001
  stem: What is the network address of 172.16.5.33/28?
  choices:
  - id: a
    text: 172.16.5.32
  - id: b
    text: 172.16.5.33
  - id: c
    text: 172.16.5.0
  - id: d
    text: 172.16.5.48
  correct:
    answer: a
  explanation: '/28 block size is 16; 33 falls in 32–47.


    **172.16.5.32**: /28 block size is 16; 33 falls in 32–47.


    172.16.5.33 is a usable host in 172.16.5.32/28, not the subnet identifier itself.


    172.16.5.0 is the /24 network. For 172.16.5.33/28 the block size is 16, so the
    network is 172.16.5.32 (range 32–47).


    172.16.5.48 is the next /28 (48–63). 172.16.5.33 falls in 32–47, so the network
    is .32.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
