  - id: d
    text: Disable all monitoring related to 1.10
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 'For 1.10 (Verify IP parameters for Client OS), the keyed answer is
    **Verify expected state for 1.10 with show/ping evidence; Document the 1.10 design
    intent and rollback plan**. Stem: [CCNA 1.10] Select ALL actions that support
    a correct implementation or verification for this objective..


    **Verify expected state for 1.10 with show/ping evidence** is correct: Use show/ping
    evidence to confirm the objective actually converged — not just that the command
    was typed. This matters for 1.10 (Verify IP parameters for Client OS).


    **Document the 1.10 design intent and rollback plan** is correct: Document design
    intent and the rollback commands. The next engineer (or you at 03:00) needs that,
    not tribal memory. This matters for 1.10 (Verify IP parameters for Client OS).


    **Skip change control because 1.10 is low risk** is not the right selection: Skipping
    change control because a topic ‘looks low risk’ is how untracked outages happen.
    This objective still goes through the window. This matters for 1.10 (Verify IP
    parameters for Client OS).


    **Disable all monitoring related to 1.10** is not the right selection: Disabling
    monitoring removes the only proof the objective still works after you leave. Leave
    SNMP/telemetry/syslog up. This matters for 1.10 (Verify IP parameters for Client
    OS).'
