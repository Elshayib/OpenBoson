- id: ccna-1-021
  type: single_choice
  topic_code: '1.5'
  difficulty: 2
  cert_tags: *id001
  stem: Which protocol is connection-oriented at Layer 4?
  choices:
  - id: a
    text: TCP
  - id: b
    text: UDP
  - id: c
    text: ICMP
  - id: d
    text: ARP
  correct:
    answer: a
  explanation: 'TCP establishes a connection before data transfer.


    UDP is the connectionless Layer 4 datagram protocol (8-byte header, no handshake
    or retransmission).


    ICMP (IPv4) / ICMPv6 carries control messages such as echo, unreachable, and TTL
    expired — not a transport for application byte streams.


    ARP maps an IPv4 address to a MAC on the local Ethernet segment (broadcast request,
    unicast reply). IPv6 uses NDP instead.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.5
