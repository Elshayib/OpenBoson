- id: ccna-1-025
  type: single_choice
  topic_code: '1.4'
  difficulty: 3
  cert_tags: *id001
  stem: A duplex mismatch typically causes?
  choices:
  - id: a
    text: Late collisions / poor performance
  - id: b
    text: Instant OSPF adjacency
  - id: c
    text: Automatic trunking
  - id: d
    text: Mandatory encryption
  correct:
    answer: a
  explanation: 'One side full / other half-duplex leads to collisions and errors.


    **Late collisions / poor performance**: One side full / other half-duplex leads
    to collisions and errors.


    **Instant OSPF adjacency**: OSPF is a link-state IGP (RID, areas, LSAs, cost,
    default AD 110, multicast 224.0.0.5/6).


    **Automatic trunking**: DTP may form a trunk, but a duplex mismatch causes late
    collisions and CRC errors on the half-duplex side, not DTP.


    **Mandatory encryption**: A duplex mismatch does not enable encryption. You get
    collisions, CRC errors, and terrible throughput.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-026
  type: single_choice
  topic_code: '1.12'
  difficulty: 4
  cert_tags: *id001
  stem: A VRF on a router primarily provides?
  choices:
  - id: a
    text: Separate routing tables/instances
  - id: b
    text: Only STP instances
  - id: c
    text: Only PoE budgets
  - id: d
    text: Only DNS views
  correct:
    answer: a
  explanation: 'VRFs isolate routing contexts on one device.


    **Separate routing tables/instances**: VRFs isolate routing contexts on one device.


    **Only STP instances**: Spanning Tree elects a root bridge and blocks redundant
    Ethernet paths so the LAN does not loop.


    **Only PoE budgets**: PoE delivers DC power on Ethernet (802.3af/at/bt).


    **Only DNS views**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on
    UDP/TCP 53.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.12
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-027
  type: single_choice
  topic_code: '1.10'
  difficulty: 2
  cert_tags: *id001
  stem: On Windows, which command shows IP configuration?
  choices:
  - id: a
    text: ipconfig
  - id: b
    text: ifconfig only (Windows default)
  - id: c
    text: show ip route
  - id: d
    text: route print only without IP
  correct:
    answer: a
  explanation: 'On Windows, **`ipconfig`** (and `ipconfig /all`) prints IPv4/IPv6,
    mask, and default gateway per adapter.


    **ipconfig** is the Windows client command for that output.


    **ifconfig only (Windows default)** is a Unix/Linux command. Current Windows does
    not ship `ifconfig` as the default IP display tool.


    **show ip route** is Cisco IOS — it dumps the router RIB, not a Windows NIC.


    **route print only without IP** shows the Windows routing table. It does not list
    the adapter address and mask the way `ipconfig` does.

    '
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.10
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-028
  type: single_choice
  topic_code: '1.11'
  difficulty: 3
  cert_tags: *id001
  stem: Nonoverlapping 2.4 GHz Wi-Fi channels in the US commonly include?
  choices:
  - id: a
    text: 1, 6, and 11
  - id: b
    text: 1, 2, and 3 only
  - id: c
    text: Only channel 14 everywhere
  - id: d
    text: Channels 36 and 40 only
  correct:
    answer: a
  explanation: '1/6/11 are the classic nonoverlapping 2.4 GHz set.


    **1, 6, and 11**: 1/6/11 are the classic nonoverlapping 2.4 GHz set.


    **1, 2, and 3 only**: Channels 1, 2, and 3 overlap in 2.4 GHz (22 MHz DSSS). The
    non-overlapping US set is 1, 6, 11.


    **Only channel 14 everywhere**: Channel 14 is Japan-only 2.4 GHz. US indoor non-overlapping
    channels are 1, 6, 11.


    **Channels 36 and 40 only**: 36 and 40 are 5 GHz UNII-1 channels, not the 2.4
    GHz non-overlapping set (1, 6, 11).'
