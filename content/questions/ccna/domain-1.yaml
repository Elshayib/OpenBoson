- id: ccna-1-003
  type: single_choice
  topic_code: '1.6'
  difficulty: 3
  cert_tags: *id001
  stem: What is the binary equivalent of dotted decimal 10.1.1.0 with a /30 mask's
    host portion size?
  choices:
  - id: a
    text: 2 usable hosts
  - id: b
    text: 6 usable hosts
  - id: c
    text: 14 usable hosts
  - id: d
    text: 30 usable hosts
  correct:
    answer: a
  explanation: 'A **/30** prefix leaves **2 host bits**, so the subnet has 2^2 = **4**
    addresses: network, two usable hosts, and broadcast. Point-to-point Ethernet and
    serial links commonly use /30 (or /31) for that two-host topology. `10.1.1.0/30`
    covers `10.1.1.0`–`10.1.1.3` with usable hosts `10.1.1.1` and `10.1.1.2`.


    **2 usable hosts** is 4 − 2, the usable count of a /30.


    **6 usable hosts** is 8 − 2, which is a **/29** (3 host bits), not /30.


    **14 usable hosts** is 16 − 2, a **/28** (4 host bits).


    **30 usable hosts** is 32 − 2, a **/27** (5 host bits).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-004
  type: single_choice
  topic_code: '1.3'
  difficulty: 2
  cert_tags: *id001
  stem: Which cable type is typically used between a switch access port and a PC NIC?
  choices:
  - id: a
    text: Straight-through UTP
  - id: b
    text: Crossover UTP
  - id: c
    text: Rollover console
  - id: d
    text: Coaxial RG-59
  correct:
    answer: a
  explanation: 'Modern Auto-MDIX often corrects cabling, but the classic answer is
    straight-through.


    **Straight-through UTP**: Like devices historically needed crossover; PC↔switch
    uses straight-through.


    **Crossover UTP**: Used between like devices (switch↔switch) without Auto-MDIX.


    **Rollover console**: Used for console access to a router/switch.


    **Coaxial RG-59**: Not used for modern Ethernet access.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-005
  type: single_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: In TCP, which field helps ensure ordered delivery of segments?
  choices:
  - id: a
    text: Sequence number
  - id: b
    text: Window size alone
  - id: c
    text: TTL
  - id: d
    text: TOS/DSCP
  correct:
    answer: a
  explanation: 'TCP treats the payload as a **byte stream**. Each segment carries
    a 32-bit **sequence number** that identifies the first byte in that segment, so
    the receiver can reorder segments and detect gaps.


    **Sequence number** is the TCP header field that provides that ordering.


    **Window size alone** is the receive window used for **flow control** (how many
    unacked bytes may be in flight). It does not order bytes.


    **TTL** is IPv4 Time To Live (IPv6 Hop Limit) in the **IP** header, decremented
    by each router to kill loops — not a TCP ordering field.


    **TOS/DSCP** marks IP packets for QoS (for example DSCP EF for voice). It does
    not sequence TCP segments.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-006
  type: single_choice
  topic_code: '1.9'
  difficulty: 2
  cert_tags: *id001
  stem: Which IPv6 address type is typically used for one-to-nearest routing within
    a group?
  choices:
  - id: a
    text: Anycast
  - id: b
    text: Multicast
  - id: c
    text: Broadcast
  - id: d
    text: Link-local only
  correct:
    answer: a
  explanation: 'IPv6 anycast shares an address among nodes; routers deliver to the
    nearest.


    Anycast is one-to-nearest of a group.


    **Multicast**: One-to-many.


    **Broadcast**: IPv6 has no broadcast.


    **Link-local only**: Link-local is a scope, not anycast semantics.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.9
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-007
  type: single_choice
  topic_code: '1.13'
  difficulty: 3
  cert_tags: *id001
  stem: What does ARP resolve?
  choices:
  - id: a
    text: IPv4 address to MAC address
  - id: b
    text: MAC to IPv6
  - id: c
    text: URL to IP
  - id: d
    text: Port to process
  correct:
    answer: a
  explanation: 'ARP requests broadcast who-has; replies provide the MAC for an IPv4
    address.


    **IPv4 address to MAC address**: ARP maps L3→L2 on Ethernet.


    **MAC to IPv6**: That is not ARP (NDP does neighbor discovery).


    **URL to IP**: DNS.


    **Port to process**: Sockets/OS, not ARP.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.13
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-1-008
  type: multiple_choice
  topic_code: '1.5'
  difficulty: 3
  cert_tags: *id001
  stem: Which two characteristics apply to UDP? (Choose two.)
  choices:
  - id: a
    text: Connectionless
  - id: b
    text: Guaranteed delivery
  - id: c
    text: Lower overhead than TCP
  - id: d
    text: Always encrypts payloads
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '**UDP** is a connectionless Layer 4 protocol: no three-way handshake,
    no sequence/ack numbers, and no retransmission. That yields a smaller header (8
    bytes vs TCP’s 20+) and lower overhead, which is why DNS, DHCP, and RTP typically
    use it.


    **Connectionless** is correct: UDP sends datagrams without establishing a session.


    **Lower overhead than TCP** is correct: no handshake, no acks, no windowing in
    the UDP header.


    **Guaranteed delivery** is a **TCP** property (acks, retransmission, ordered byte
    stream). UDP leaves reliability to the application.


    **Always encrypts payloads** is false. Encryption is TLS/DTLS/IPsec or the application;
    UDP itself is cleartext.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Fundamentals
  - CCNA exam topic 1.5
  provider: openboson
  license: MIT
  provenance: original
