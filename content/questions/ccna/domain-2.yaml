  license: MIT
  provenance: original
- id: ccna-2-024
  type: single_choice
  topic_code: '2.7'
  difficulty: 2
  cert_tags: *id001
  stem: LAG between WLC and switch primarily provides?
  choices:
  - id: a
    text: Bundled uplink capacity/redundancy
  - id: b
    text: Only SSID encryption
  - id: c
    text: Only RF channel planning
  - id: d
    text: Only CAPWAP DTLS keys
  correct:
    answer: a
  explanation: 'LAG aggregates WLC-to-switch connections.


    **Bundled uplink capacity/redundancy**: LAG aggregates WLC-to-switch connections.


    **Only SSID encryption**: LAG is a wired bundle. WLAN encryption (WPA2/WPA3) is
