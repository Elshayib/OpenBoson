  license: MIT
  provenance: original
- id: ccna-2-023
  type: single_choice
  topic_code: '2.3'
  difficulty: 4
  cert_tags: *id001
  stem: LLDP is best described as?
  choices:
  - id: a
    text: IEEE neighbor discovery protocol
  - id: b
    text: Cisco-only proprietary CDP replacement mandatory
  - id: c
    text: A routing protocol
  - id: d
    text: A wireless encryption cipher
  correct:
    answer: a
  explanation: 'LLDP is the standards-based Layer 2 discovery protocol.


    **IEEE neighbor discovery protocol**: LLDP is the standards-based Layer 2 discovery
    protocol.


    **Cisco-only proprietary CDP replacement mandatory**: CDP is Cisco’s L2 neighbor
    discovery (`show cdp neighbors`).


    A routing protocol (OSPF/EIGRP/BGP) exchanges Layer-3 reachability. LLDP only
    advertises Layer-2 neighbor identity.


    **A wireless encryption cipher**: A wireless cipher (TKIP/CCMP/GCMP) encrypts
    802.11 frames; it is not AAA or an overlay identifier.'
