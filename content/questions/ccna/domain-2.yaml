  stem: Creating a WLAN with WPA2-PSK in a WLC GUI is primarily which task?
  choices:
  - id: a
    text: Wireless LAN client connectivity configuration
  - id: b
    text: Only underlay BFD
  - id: c
    text: Only BGP peering
  - id: d
    text: Only VTP domain name
  correct:
    answer: a
  explanation: 'WLAN GUI workflows cover SSID, security, and QoS profiles.


    **Wireless LAN client connectivity configuration**: WLAN GUI workflows cover SSID,
    security, and QoS profiles.


    **Only underlay BFD**: BFD detects forwarding-path failures in milliseconds.


    **Only BGP peering**: BGP is the Internet path-vector protocol (TCP 179; eBGP
    AD 20, iBGP AD 200).


    **Only VTP domain name**: VTP floods VLAN advertisements among switches using
    a revision number; it does not route, NAT, or identify an overlay.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.9
