- id: ccna-2-010
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: PortFast is intended for which ports?
  choices:
  - id: a
    text: Edge ports to end hosts
  - id: b
    text: All trunks always
  - id: c
    text: Routed ports only
  - id: d
    text: Blocked alternate only
  correct:
    answer: a
  explanation: '**Edge ports to end hosts**: **PortFast** places an edge port into the forwarding state
    immediately, bypassing the listening and learning states and thereby reducing STP convergence time
    for end stations. This is the correct answer for the stem. Configuration uses `spanning-tree portfast`.
    **Note:** PortFast must not be combined with loop guard on the same interface.


    **All trunks always** is incorrect. It does not describe the intended use or behavior required by
    the stem.


    **Routed ports only** is incorrect. It does not describe the intended use or behavior required by
    the stem.


    **Blocked alternate only** is incorrect. It does not describe the intended use or behavior required
    by the stem.'
  references:
