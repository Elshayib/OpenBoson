  topic_code: '2.3'
  difficulty: 2
  cert_tags: *id003
  stem: 'Scenario 121 (2.3): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  - id: a
    text: PAgP
  correct:
    answer: a
  explanation: '**PAgP** is Cisco’s proprietary EtherChannel negotiation protocol used to form Port-Channels
    between capable peers. This is the correct answer for the stem. Configuration uses `channel-group
    <id> mode desirable|auto`.


    **LACP** (IEEE 802.3ad) negotiates EtherChannel bundles and is the standards-based alternative to
    PAgP. This does not satisfy the condition required by the stem. Configuration uses `channel-group
    <id> mode active|passive`.


    **Static on only** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **PAgP+LACP hybrid mandatory**: **PAgP** is Cisco’s proprietary EtherChannel negotiation protocol
    used to form Port-Channels between capable peers. This does not satisfy the condition required by
    the stem. Configuration uses `channel-group <id> mode desirable|auto`.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0122-ed2153
  type: single_choice
  topic_code: '2.4'
  difficulty: 3
  cert_tags: *id003
  stem: 'Scenario 122 (2.4): VLAN carrying untagged trunk frames?'
  choices:
  - id: c
    text: Voice VLAN
  - id: d
    text: Private VLAN always
  - id: a
    text: Native VLAN
  - id: b
    text: VLAN 1002
  correct:
    answer: a
  explanation: 'The **native VLAN** carries untagged frames on an 802.1Q trunk. Tagged frames belong to
    other VLANs carried on the same trunk. This is the correct answer for the stem. Configuration uses
    `switchport trunk native vlan <id>`.


    **VLAN 1002** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.


    **Voice VLAN** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.


    **Private VLAN always** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.4
  provider: openboson
  license: MIT
  provenance: original
