    **Only RF channel planning**: LAG (EtherChannel) between WLC and switch **bundles**
    CAPWAP uplinks for bandwidth/redundancy. It does not pick RF channels.


    **Only CAPWAP DTLS keys**: CAPWAP tunnels AP control/data to a WLC in centralized
    mode.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.7
