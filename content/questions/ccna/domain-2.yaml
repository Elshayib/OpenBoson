- id: ccna-2-026
  type: single_choice
  topic_code: '2.9'
  difficulty: 4
  cert_tags: *id001
  stem: Creating a WLAN with WPA2-PSK in a WLC GUI is primarily which task?
  choices:
  - id: a
    text: Wireless LAN client connectivity configuration
  - id: b
    text: Only underlay BFD
  - id: c
    text: Only BGP peering
  - id: d
    text: Only VTP domain name
  correct:
    answer: a
  explanation: '**Wireless LAN client connectivity configuration** is correct. It is the selection that
    meets the requirement stated in the stem.


    **Only underlay BFD** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **Only BGP peering**: **BGP** exchanges reachability among autonomous systems and selects paths using
    an ordered attribute policy (weight, local preference, AS-path, MED, and others). This does not satisfy
    the condition required by the stem. Configuration uses `router bgp <asn>`.


    **Only VTP domain name** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.9
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0013-c25d4f
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: &id003
  - ccna
  stem: 'Scenario 13 (2.1): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  - id: a
    text: PAgP
  correct:
    answer: a
  explanation: '**PAgP** is Cisco’s proprietary EtherChannel negotiation protocol used to form Port-Channels
    between capable peers. This is the correct answer for the stem. Configuration uses `channel-group
    <id> mode desirable|auto`.


    **LACP** (IEEE 802.3ad) negotiates EtherChannel bundles and is the standards-based alternative to
    PAgP. This does not satisfy the condition required by the stem. Configuration uses `channel-group
    <id> mode active|passive`.


    **Static on only** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.


    **PAgP+LACP hybrid mandatory**: **PAgP** is Cisco’s proprietary EtherChannel negotiation protocol
    used to form Port-Channels between capable peers. This does not satisfy the condition required by
    the stem. Configuration uses `channel-group <id> mode desirable|auto`.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0014-76e0c6
  type: single_choice
  topic_code: '2.2'
  difficulty: 5
  cert_tags: *id003
  stem: 'Scenario 14 (2.2): VLAN carrying untagged trunk frames?'
  choices:
  - id: c
    text: Voice VLAN
  - id: d
    text: Private VLAN always
  - id: a
    text: Native VLAN
  - id: b
    text: VLAN 1002
  correct:
    answer: a
  explanation: 'The **native VLAN** carries untagged frames on an 802.1Q trunk. Tagged frames belong to
    other VLANs carried on the same trunk. This is the correct answer for the stem. Configuration uses
    `switchport trunk native vlan <id>`.


    **VLAN 1002** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.


    **Voice VLAN** is incorrect. It describes a different behavior and does not meet the requirement stated
    in the stem.


    **Private VLAN always** is incorrect. It describes a different behavior and does not meet the requirement
    stated in the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
