- id: ccna-gen-0013-c25d4f
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: &id003
  - ccna
  stem: 'Scenario 13 (2.1): Cisco proprietary EtherChannel negotiation?'
  choices:
  - id: b
    text: LACP
  - id: c
    text: Static on only
  - id: d
    text: PAgP+LACP hybrid mandatory
  - id: a
    text: PAgP
  correct:
    answer: a
  explanation: 'Port Aggregation Protocol is Cisco-proprietary EtherChannel negotiation
    (`channel-group N mode desirable|auto`).


    **PAgP**: Port Aggregation Protocol is Cisco-proprietary EtherChannel negotiation
    (`channel-group N mode desirable|auto`).


    LACP (IEEE 802.3ad/802.1AX) is the **standards-based** negotiator (`mode active|passive`),
    not Cisco-proprietary.


    **Static on only**: `channel-group N mode on` bundles with **no** negotiation.
    It is neither PAgP nor LACP.


    **PAgP+LACP hybrid mandatory**: PAgP and LACP cannot form a channel with each
    other. You pick one protocol (or static `on`); there is no hybrid mandatory mode.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0014-76e0c6
  type: single_choice
  topic_code: '2.2'
  difficulty: 5
  cert_tags: *id003
  stem: 'Scenario 14 (2.2): VLAN carrying untagged trunk frames?'
  choices:
  - id: c
    text: Voice VLAN
  - id: d
    text: Private VLAN always
  - id: a
    text: Native VLAN
  - id: b
    text: VLAN 1002
  correct:
    answer: a
  explanation: 'The 802.1Q native VLAN (default VLAN 1) is the VLAN whose frames are
    sent **untagged** on a trunk. Mismatched natives leak traffic.


    **Native VLAN**: The 802.1Q native VLAN (default VLAN 1) is the VLAN whose frames
    are sent **untagged** on a trunk. Mismatched natives leak traffic.


    **Voice VLAN**: A voice VLAN (`switchport voice vlan`) tags IP-phone frames with
    a separate VLAN ID. Those frames are tagged, not native/untagged.


    **Private VLAN always**: Private VLANs (primary/isolated/community) restrict L2
    among hosts. They are not ‘the untagged VLAN on a trunk’.


    VLAN 1002–1005 are Cisco FDDI/Token Ring defaults, not the untagged native VLAN
    on an Ethernet trunk.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-gen-0015-77467b
  type: single_choice
  topic_code: '2.3'
  difficulty: 1
  cert_tags: *id003
  stem: 'Scenario 15 (2.3): STP role that does not forward user frames?'
  choices:
  - id: d
    text: Edge forwarding
  - id: a
    text: Alternate/blocking
  - id: b
    text: Designated
  - id: c
    text: Root
  correct:
    answer: a
  explanation: 'An alternate (RSTP) / blocking (802.1D) port is a backup path to the
    root. It does **not** forward user frames; it only processes BPDUs until the root
    port fails.


    **Alternate/blocking**: An alternate (RSTP) / blocking (802.1D) port is a backup
    path to the root. It does **not** forward user frames; it only processes BPDUs
    until the root port fails.


    **Edge forwarding**: An edge/PortFast port is already forwarding to a host. That
    is the opposite of a blocked backup port.


    **Designated**: The designated port is the forwarding port toward a segment. It
    **does** forward user frames.


    **Root**: The root port is the forwarding uplink to the root bridge. It forwards
    user frames toward the root.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.3
  provider: openboson
  license: MIT
  provenance: original
