questions:
- id: ccna-2-001
  type: multiple_choice
  topic_code: '2.2'
  difficulty: 3
  cert_tags: &id001
  - ccna
  stem: Which two statements about 802.1Q trunks are correct? (Choose two.)
  choices:
  - id: a
    text: A trunk can carry multiple VLANs with tags
  - id: b
    text: VLAN 1 can never be native
  - id: c
    text: Native VLAN frames are untagged
  - id: d
    text: ISL is required on modern Catalyst
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: '**A trunk can carry multiple VLANs with tags**: **802.1Q** trunks tag frames so a single
    physical link can carry multiple VLANs. The native VLAN remains untagged by default. This is the correct
    answer for the stem.


    **Native VLAN frames are untagged**: The **native VLAN** carries untagged frames on an 802.1Q trunk.
    Tagged frames belong to other VLANs carried on the same trunk. This is the correct answer for the
    stem. Configuration uses `switchport trunk native vlan <id>`.


    **VLAN 1 can never be native** is incorrect. It does not describe the intended use or behavior required
    by the stem.


    **ISL is required on modern Catalyst** is incorrect. It does not describe the intended use or behavior
    required by the stem.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
