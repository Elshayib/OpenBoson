  - id: c
    text: Disable logging permanently while testing 2.2
  correct:
    answer: a
  explanation: '2.2 (Interswitch connectivity) is implemented by verifying with show/ping
    evidence and keeping a rollback plan. Use the documented enterprise design for
    this objective (Cisco validated design / local standard) rather than an ad-hoc
    look-alike.


    **Prefer the documented 2.2 approach used in enterprise designs**: Use the documented
    enterprise design for this objective (Cisco validated design / local standard)
    rather than an ad-hoc look-alike.


    **Use clear-text shared secrets as the only control for 2.2**: Clear-text shared
    secrets (type 7, Telnet, open SNMP) are not an acceptable sole control. Use SSH,
