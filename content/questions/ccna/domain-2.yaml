questions:
- id: ccna-2-001
  type: multiple_choice
  topic_code: '2.2'
  difficulty: 3
  cert_tags: &id001
  - ccna
  stem: Which two statements about 802.1Q trunks are correct? (Choose two.)
  choices:
  - id: a
    text: A trunk can carry multiple VLANs with tags
    rationale: Core trunk purpose.
  - id: b
    text: VLAN 1 can never be native
    rationale: It can, though discouraged.
  - id: c
    text: Native VLAN frames are untagged
    rationale: 802.1Q native VLAN.
  - id: d
    text: ISL is required on modern Catalyst
    rationale: ISL is legacy.
  correct:
    answers:
    - a
    - c
    partial_credit: false
  explanation: 802.1Q tags non-native VLANs; native VLAN is untagged.
  references:
  - CCNA 2.2 — interswitch connectivity
- id: ccna-2-002
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: Which Rapid PVST+ port role forwards traffic toward the root?
  choices:
  - id: a
    text: Root port
    rationale: Best path to root.
  - id: b
    text: Designated port on a blocked segment
    rationale: Designated forwards onto a segment.
  - id: c
    text: Alternate port
    rationale: Backup to root; discarding.
  - id: d
    text: Disabled
    rationale: Administratively down.
  correct:
    answer: a
  explanation: Each non-root bridge selects one root port closest to the root bridge.
  references:
  - CCNA 2.5 — Rapid PVST+
- id: ccna-2-003
  type: single_choice
  topic_code: '2.4'
  difficulty: 2
  cert_tags: *id001
  stem: EtherChannel bundles multiple physical links into what logical interface type
    on Cisco IOS?
  choices:
  - id: a
    text: Port-channel
    rationale: Logical Po interface.
  - id: b
    text: Loopback
    rationale: Virtual IP interface.
  - id: c
    text: Tunnel
    rationale: Overlay.
  - id: d
    text: Null0
    rationale: Bit bucket.
  correct:
    answer: a
  explanation: Port-channel (Po) is the logical EtherChannel interface.
  references:
  - CCNA 2.4 — EtherChannel (LACP)
- id: ccna-2-004
  type: single_choice
  topic_code: '2.6'
  difficulty: 3
  cert_tags: *id001
  stem: In CAPWAP, which tunnel carries client data between AP and WLC in a centralized
    design?
  choices:
  - id: a
    text: CAPWAP data tunnel
    rationale: Encrypted/optional DTLS data path.
  - id: b
    text: Only GRE without CAPWAP
    rationale: CAPWAP is the Cisco LWAPP successor.
  - id: c
    text: IPsec VTI only
    rationale: Not the standard AP-WLC control plane.
  - id: d
    text: PPPoE
    rationale: WAN access method.
  correct:
    answer: a
  explanation: Lightweight APs use CAPWAP control and data tunnels to the WLC.
  references:
  - CCNA 2.6 — wireless architectures / AP modes
- id: ccna-2-005
  type: drag_match
  topic_code: '2.1'
  difficulty: 2
  cert_tags: *id001
  stem: Match VLAN concepts.
  drag_pairs: &id002
  - left: Access port
    right: Carries a single untagged VLAN for end hosts
  - left: Trunk port
    right: Carries multiple VLANs with 802.1Q tags
  - left: Native VLAN
    right: Untagged on an 802.1Q trunk
  - left: Voice VLAN
    right: Auxiliary VLAN for IP phones
  correct:
    pairs: *id002
  explanation: Access vs trunk and native/voice VLAN roles are core switching topics.
  references:
  - CCNA 2.1
- id: ccna-2-006
  type: ordered_list
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: Order classic STP port states from blocking toward forwarding (802.1D teaching
    order).
  ordered_items:
  - Learning
  - Listening
  - Forwarding
  - Blocking
  correct:
    order:
    - Blocking
    - Listening
    - Learning
    - Forwarding
  explanation: 802.1D progresses Blocking → Listening → Learning → Forwarding.
  references:
  - CCNA 2.5 — STP states
