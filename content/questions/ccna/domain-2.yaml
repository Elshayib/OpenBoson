- id: ccna-2-006
  type: ordered_list
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: Order classic STP port states from blocking toward forwarding (802.1D teaching
    order).
  ordered_items:
  - Learning
  - Listening
  - Forwarding
  - Blocking
  correct:
    order:
    - Blocking
    - Listening
    - Learning
    - Forwarding
  explanation: 'Classic 802.1D port states in order: **Blocking** (no user frames,
    BPDUs listened) → **Listening** (BPDUs, still no learning/forwarding) → **Learning**
    (source MACs learned, still no forwarding) → **Forwarding** (user frames). RSTP
    collapses blocking/listening into discarding, but this item is the 802.1D teaching
    sequence.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-007
  type: single_choice
  topic_code: '2.1'
  difficulty: 3
  cert_tags: *id001
  stem: What command creates VLAN 20 on a Cisco switch?
  choices:
  - id: a
    text: vlan 20
  - id: b
    text: interface vlan 20 only
  - id: c
    text: switchport access vlan 20 alone
  - id: d
    text: encapsulation dot1q 20
  correct:
    answer: a
  explanation: 'Global VLAN configuration creates the VLAN.


    **vlan 20**: Global VLAN configuration creates the VLAN.


    **interface vlan 20 only**: `interface vlan 20` creates an SVI for inter-VLAN
    routing; it does not create VLAN 20 in the VLAN database (`vlan 20`).


    **switchport access vlan 20 alone**: `switchport access vlan 20` assigns an existing
    VLAN to an access port. The VLAN must already exist (`vlan 20` / VTP).


    **encapsulation dot1q 20**: `encapsulation dot1Q 20` tags a router subinterface
    (ROAS). It does not create the L2 VLAN on a switch.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-008
  type: single_choice
  topic_code: '2.2'
  difficulty: 4
  cert_tags: *id001
  stem: DTP dynamic desirable will actively try to form what?
  choices:
  - id: a
    text: A trunk
  - id: b
    text: An EtherChannel
  - id: c
    text: An OSPF adjacency
  - id: d
    text: A VPN
  correct:
    answer: a
  explanation: 'Dynamic desirable initiates trunking.


    **A trunk**: Dynamic desirable initiates trunking.


    **An EtherChannel**: EtherChannel bundles physical links into one logical interface;
    members must match speed, duplex, and mode.


    **An OSPF adjacency**: OSPF is a link-state IGP (RID, areas, LSAs, cost, default
    AD 110, multicast 224.0.0.5/6).


    A VPN is an overlay (IPsec/GRE/SSL). DTP negotiates 802.1Q trunks, not VPNs.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-009
  type: single_choice
  topic_code: '2.5'
  difficulty: 2
  cert_tags: *id001
  stem: Which bridge ID component is preferred lower to win root election?
  choices:
  - id: a
    text: Priority then MAC
  - id: b
    text: Highest MAC always
  - id: c
    text: Highest priority
  - id: d
    text: Serial number only
  correct:
    answer: a
  explanation: 'Lowest bridge ID wins the root election.


    **Priority then MAC**: Lowest bridge ID wins the root election.


    **Highest MAC always**: STP root election uses **lowest** Bridge ID (priority
    then MAC). Highest MAC loses unless priority is lower.


    **Highest priority**: Lower priority wins (default 32768; 0 is best). Highest
    priority is the worst BID component.


    **Serial number only**: STP Bridge ID is **priority + MAC** (plus extended system
    ID). A chassis serial is inventory, not the BID.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-010
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: PortFast is intended for which ports?
  choices:
  - id: a
    text: Edge ports to end hosts
  - id: b
    text: All trunks always
  - id: c
    text: Routed ports only
  - id: d
    text: Blocked alternate only
  correct:
    answer: a
  explanation: '**PortFast** (`spanning-tree portfast` or `spanning-tree portfast
    edge`) moves an **edge** access port from blocking/listening/learning straight
    to **forwarding** so a PC/phone gets DHCP immediately. It is for **host** ports,
    not for links that might form a loop.


    **Edge ports to end hosts** is the intended use (often with BPDU Guard).


    **All trunks always** is dangerous: a trunk to another switch can loop. Cisco
    even warns against PortFast on non-edge trunks.


    **Routed ports only** (`no switchport`) have no STP state machine to skip; PortFast
    is a **switching** edge feature.


    **Blocked alternate only** are the ports STP is already holding down. PortFast
    would not apply there — those are redundant switch-to-switch paths, not host edges.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-011
  type: single_choice
  topic_code: '2.4'
  difficulty: 4
  cert_tags: *id001
  stem: LACP uses which IEEE standard?
  choices:
  - id: a
    text: 802.3ad / 802.1AX
  - id: b
    text: 802.1Q
  - id: c
    text: 802.1X
  - id: d
    text: 802.11i
  correct:
    answer: a
  explanation: '**LACP** is the IEEE standard for EtherChannel negotiation, originally
    **802.3ad** and later moved to **802.1AX**. On IOS it is `channel-group N mode
    active|passive`.


    **802.3ad / 802.1AX** is LACP.


    **802.1Q** is VLAN tagging on trunks, not bundling.


    **802.1X** is port-based network access control (EAPoL / RADIUS), not EtherChannel.


    **802.11i** is the Wi-Fi security amendment behind WPA2 (CCMP/AES), unrelated
    to wired link aggregation.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-012
  type: single_choice
  topic_code: '2.4'
  difficulty: 2
  cert_tags: *id001
  stem: PAgP is associated with which vendor historically?
  choices:
  - id: a
    text: Cisco proprietary
  - id: b
    text: IETF standard only
  - id: c
    text: ITU SS7
  - id: d
    text: Bluetooth SIG
  correct:
    answer: a
  explanation: 'PAgP is Cisco proprietary; LACP is standards-based.


    **Cisco proprietary**: PAgP is Cisco proprietary; LACP is standards-based.


    **IETF standard only**: PAgP is **Cisco-proprietary**. The IETF/IEEE EtherChannel
    protocol is LACP (802.3ad/802.1AX).


    **ITU SS7**: SS7 is the telephony signaling system. PAgP is Cisco LAN EtherChannel,
    unrelated to SS7.


    **Bluetooth SIG**: Bluetooth is a WPAN radio, not CAPWAP or 802.11 infrastructure.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-014
  type: single_choice
  topic_code: '2.6'
  difficulty: 4
  cert_tags: *id001
  stem: A WLC typically terminates which AP mode tunnels?
  choices:
  - id: a
    text: Local mode CAPWAP
  - id: b
    text: Only autonomous IOS AP
  - id: c
    text: Only mesh satellite RF
  - id: d
    text: Only Bluetooth beacons
  correct:
    answer: a
  explanation: 'Local-mode APs tunnel client traffic to the WLC via CAPWAP.


    **Local mode CAPWAP**: Local-mode APs tunnel client traffic to the WLC via CAPWAP.


    **Only autonomous IOS AP**: Autonomous APs do not build CAPWAP to a WLC. Local-mode
    lightweight APs do.


    **Only mesh satellite RF**: Mesh APs have a RAP/MAP radio backhaul. A WLC in local
    mode terminates **CAPWAP** from local-mode APs, not satellite mesh RF.


    **Only Bluetooth beacons**: Bluetooth is a WPAN radio, not CAPWAP or 802.11 infrastructure.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.6
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-016
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: BPDU Guard shuts a PortFast port when it receives what?
  choices:
  - id: a
    text: A BPDU
  - id: b
    text: An ARP reply
  - id: c
    text: A DHCP offer
  - id: d
    text: A DNS query
  correct:
    answer: a
  explanation: 'BPDU Guard err-disables edge ports that receive BPDUs.


    **A BPDU**: BPDU Guard err-disables edge ports that receive BPDUs.


    **An ARP reply**: ARP maps IPv4 addresses to MACs on the local Ethernet; IPv6
    uses NDP.


    **A DHCP offer**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA, UDP
    67/68).


    **A DNS query**: DNS maps names to addresses (A/AAAA) and reverse (PTR) on UDP/TCP
    53.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-017
  type: single_choice
  topic_code: '2.1'
  difficulty: 4
  cert_tags: *id001
  stem: VTP transparent switches do what with VTP advertisements?
  choices:
  - id: a
    text: Forward them but do not sync VLAN DB from them
  - id: b
    text: Always overwrite clients
  - id: c
    text: Drop all BPDUs
  - id: d
    text: Disable all trunks
  correct:
    answer: a
  explanation: 'Transparent mode forwards VTP without syncing the VLAN database.


    **Forward them but do not sync VLAN DB from them**: Transparent mode forwards
    VTP without syncing the VLAN database.


    **Always overwrite clients**: Forward them but do not sync VLAN DB from them is
    required here (A VLAN is an 802.1Q broadcast domain (IDs 1–4094)); Always overwrite
    clients is not.


    **Drop all BPDUs**: BPDUs are STP control frames used to elect a root and assign
    port roles.


    **Disable all trunks**: Forward them but do not sync VLAN DB from them is required
    here (A VLAN is an 802.1Q broadcast domain (IDs 1–4094)); Disable all trunks is
    not.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.1
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-018
  type: single_choice
  topic_code: '2.5'
  difficulty: 2
  cert_tags: *id001
  stem: RSTP discarding state roughly replaces which 802.1D states?
  choices:
  - id: a
    text: Blocking and listening
  - id: b
    text: Only forwarding
  - id: c
    text: Only disabled
  - id: d
    text: Learning only
  correct:
    answer: a
  explanation: 'RSTP collapses blocking/listening into discarding.


    **Blocking and listening**: RSTP collapses blocking/listening into discarding.


    **Only forwarding**: 802.1D forwarding is the final state. RSTP discarding replaced
    blocking/listening.


    **Only disabled**: Disabled is administratively down. RSTP discarding is the state
    that replaced 802.1D blocking/listening on a live port.


    **Learning only**: 802.1D Learning still does not forward user frames. RSTP **discarding**
    replaces blocking **and** listening, not learning alone.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.5
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-019
  type: single_choice
  topic_code: '2.4'
  difficulty: 3
  cert_tags: *id001
  stem: On EtherChannel, member ports must match which attribute?
  choices:
  - id: a
    text: Speed/duplex and compatible configs
  - id: b
    text: Unique VLANs only
  - id: c
    text: Different native VLANs
  - id: d
    text: Random MTUs
  correct:
    answer: a
  explanation: 'Inconsistent member settings suspend the channel.


    **Speed/duplex and compatible configs**: Inconsistent member settings suspend
    the channel.


    **Unique VLANs only**: A VLAN is an 802.1Q broadcast domain (IDs 1–4094).


    **Different native VLANs**: A VLAN is an 802.1Q broadcast domain (IDs 1–4094).


    **Random MTUs**: EtherChannel members must match speed, duplex, and mode. Random
    MTUs would break the bundle or cause PMTUD pain; they are not a requirement.'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.4
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-021
  type: single_choice
  topic_code: '2.2'
  difficulty: 2
  cert_tags: *id001
  stem: A native VLAN mismatch on a trunk typically causes what?
  choices:
  - id: a
    text: CDP warnings and possible connectivity issues
  - id: b
    text: Automatic OSPF adjacency
  - id: c
    text: Mandatory encryption
  - id: d
    text: DHCP snooping disable
  correct:
    answer: a
  explanation: 'Untagged frames disagree when native VLANs differ.


    **CDP warnings and possible connectivity issues**: Untagged frames disagree when
    native VLANs differ.


    **Automatic OSPF adjacency**: OSPF is a link-state IGP (RID, areas, LSAs, cost,
    default AD 110, multicast 224.0.0.5/6).


    **Mandatory encryption**: CDP warnings and possible connectivity issues is required
    here (CDP is Cisco’s L2 neighbor discovery (`show cdp neighbors`)); Mandatory
    encryption is not.


    **DHCP snooping disable**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA,
    UDP 67/68).'
  references:
  - CCNA 200-301 Official Cert Guide, Volume 1 — Network Access / STP / VLANs
  - CCNA exam topic 2.2
  provider: openboson
  license: MIT
  provenance: original
- id: ccna-2-022
  type: single_choice
  topic_code: '2.5'
  difficulty: 3
  cert_tags: *id001
  stem: Which Rapid PVST+ enhancement blocks superior BPDUs on a port?
  choices:
  - id: a
    text: Root guard
  - id: b
    text: Port security sticky
  - id: c
    text: DHCP snooping
  - id: d
    text: UDLD only
  correct:
    answer: a
  explanation: 'Root guard protects the root role from unexpected superior BPDUs.


    **Port security sticky**: Sticky MAC learns allowed addresses on a port. **Root
    Guard** blocks superior BPDUs so a downstream switch cannot become root.


    **DHCP snooping**: DHCP assigns IPv4 address, mask, gateway, and DNS (DORA, UDP
    67/68).


    **UDLD only**: UDLD detects unidirectional links, typically on fiber, and err-disables
    them.'
  references:
