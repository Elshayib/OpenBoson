name: Bug report
description: Something is broken in OpenBoson
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include secrets, passwords, or private keys.
        For security-sensitive issues, use private reporting — see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: OpenBoson version
      placeholder: "0.4.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste relevant snippets from ~/.openboson/logs/openboson.log. Redact personal paths if needed.
